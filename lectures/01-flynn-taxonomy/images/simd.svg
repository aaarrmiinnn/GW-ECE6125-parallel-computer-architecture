<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#004065"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#2e7d32">SIMD Architecture</text>

  <!-- Instruction Stream -->
  <rect x="30" y="80" width="60" height="35" rx="5" fill="#81c784"/>
  <text x="60" y="102" text-anchor="middle" font-family="Arial" font-size="10" fill="white">IS</text>

  <!-- Control Unit -->
  <rect x="120" y="70" width="80" height="55" rx="5" fill="#004065"/>
  <text x="160" y="102" text-anchor="middle" font-family="Arial" font-size="12" fill="white">CU</text>

  <!-- Arrow IS to CU -->
  <line x1="90" y1="97" x2="120" y2="97" stroke="#004065" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Broadcast arrows from CU -->
  <line x1="200" y1="97" x2="230" y2="97" stroke="#004065" stroke-width="2"/>
  <line x1="230" y1="97" x2="230" y2="160" stroke="#004065" stroke-width="2"/>
  <line x1="230" y1="97" x2="230" y2="240" stroke="#004065" stroke-width="2"/>
  <line x1="230" y1="97" x2="230" y2="320" stroke="#004065" stroke-width="2"/>

  <!-- uIS labels -->
  <text x="215" y="85" font-family="Arial" font-size="8" fill="#666">uIS</text>

  <!-- PE 1 -->
  <rect x="250" y="140" width="100" height="50" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <rect x="260" y="150" width="35" height="30" rx="3" fill="#FFD200"/>
  <text x="277" y="170" text-anchor="middle" font-family="Arial" font-size="10" fill="#004065">PE1</text>
  <rect x="305" y="150" width="35" height="30" rx="3" fill="#64b5f6"/>
  <text x="322" y="170" text-anchor="middle" font-family="Arial" font-size="10" fill="white">LM1</text>

  <!-- Arrow to PE1 -->
  <line x1="230" y1="165" x2="250" y2="165" stroke="#004065" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- PE 2 -->
  <rect x="250" y="220" width="100" height="50" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <rect x="260" y="230" width="35" height="30" rx="3" fill="#FFD200"/>
  <text x="277" y="250" text-anchor="middle" font-family="Arial" font-size="10" fill="#004065">PE2</text>
  <rect x="305" y="230" width="35" height="30" rx="3" fill="#64b5f6"/>
  <text x="322" y="250" text-anchor="middle" font-family="Arial" font-size="10" fill="white">LM2</text>

  <!-- Arrow to PE2 -->
  <line x1="230" y1="245" x2="250" y2="245" stroke="#004065" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- PE N -->
  <rect x="250" y="300" width="100" height="50" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <rect x="260" y="310" width="35" height="30" rx="3" fill="#FFD200"/>
  <text x="277" y="330" text-anchor="middle" font-family="Arial" font-size="10" fill="#004065">PEN</text>
  <rect x="305" y="310" width="35" height="30" rx="3" fill="#64b5f6"/>
  <text x="322" y="330" text-anchor="middle" font-family="Arial" font-size="10" fill="white">LMN</text>

  <!-- Arrow to PEN -->
  <line x1="230" y1="325" x2="250" y2="325" stroke="#004065" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Dots between PE2 and PEN -->
  <text x="300" y="290" text-anchor="middle" font-family="Arial" font-size="20" fill="#666">...</text>

  <!-- Data Streams -->
  <rect x="380" y="155" width="50" height="30" rx="5" fill="#ef9a9a"/>
  <text x="405" y="175" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">DS1</text>
  <line x1="350" y1="165" x2="380" y2="170" stroke="#004065" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="380" y="235" width="50" height="30" rx="5" fill="#ef9a9a"/>
  <text x="405" y="255" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">DS2</text>
  <line x1="350" y1="245" x2="380" y2="250" stroke="#004065" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="380" y="315" width="50" height="30" rx="5" fill="#ef9a9a"/>
  <text x="405" y="335" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">DSN</text>
  <line x1="350" y1="325" x2="380" y2="330" stroke="#004065" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Key point -->
  <rect x="450" y="140" width="140" height="80" rx="5" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="520" y="165" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#004065">Key Point:</text>
  <text x="520" y="180" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">Single instruction</text>
  <text x="520" y="193" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">broadcast to ALL</text>
  <text x="520" y="206" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">processing elements</text>

  <!-- Legend -->
  <text x="520" y="260" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">PE = Processing Element</text>
  <text x="520" y="275" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">LM = Local Memory</text>
  <text x="520" y="290" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">DS = Data Stream</text>
</svg>
