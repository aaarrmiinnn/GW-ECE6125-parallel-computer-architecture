<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400">
  <!-- Background -->
  <rect width="650" height="400" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="325" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#004065">Instruction-Level Parallelism (ILP)</text>
  <text x="325" y="50" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">One Processor with Multiple Execution Units</text>

  <!-- Code example -->
  <rect x="30" y="70" width="200" height="130" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="130" y="90" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#004065">Source Code:</text>
  <text x="45" y="115" font-family="monospace" font-size="10" fill="#333">1. a = x + y</text>
  <text x="45" y="135" font-family="monospace" font-size="10" fill="#333">2. b = z * 2</text>
  <text x="45" y="155" font-family="monospace" font-size="10" fill="#333">3. c = a + b</text>
  <text x="45" y="175" font-family="monospace" font-size="10" fill="#333">4. d = m - n</text>

  <!-- Dependency analysis -->
  <rect x="30" y="210" width="200" height="80" rx="5" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
  <text x="130" y="230" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#ef6c00">Dependencies:</text>
  <text x="45" y="250" font-family="Arial" font-size="9" fill="#333">- 1 &amp; 2: Independent ✓</text>
  <text x="45" y="265" font-family="Arial" font-size="9" fill="#333">- 3: Depends on 1 &amp; 2</text>
  <text x="45" y="280" font-family="Arial" font-size="9" fill="#333">- 4: Independent ✓</text>

  <!-- Superscalar Processor -->
  <rect x="270" y="70" width="350" height="220" rx="10" fill="#e3f2fd" stroke="#004065" stroke-width="2"/>
  <text x="445" y="95" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#004065">Superscalar Processor</text>

  <!-- Instruction Fetch/Decode -->
  <rect x="290" y="110" width="140" height="40" rx="5" fill="#004065"/>
  <text x="360" y="135" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Fetch &amp; Decode (4-wide)</text>

  <!-- Issue Queue -->
  <rect x="290" y="160" width="140" height="30" rx="3" fill="#7986cb"/>
  <text x="360" y="180" text-anchor="middle" font-family="Arial" font-size="9" fill="white">Issue Queue / Scheduler</text>

  <!-- Multiple Execution Units -->
  <rect x="290" y="200" width="60" height="70" rx="5" fill="#FFD200" stroke="#f9a825" stroke-width="1"/>
  <text x="320" y="225" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#004065">ALU 1</text>
  <text x="320" y="240" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">1: a=x+y</text>
  <text x="320" y="255" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">4: d=m-n</text>

  <rect x="360" y="200" width="60" height="70" rx="5" fill="#FFD200" stroke="#f9a825" stroke-width="1"/>
  <text x="390" y="225" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#004065">ALU 2</text>
  <text x="390" y="240" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">2: b=z*2</text>

  <rect x="430" y="200" width="60" height="70" rx="5" fill="#81c784" stroke="#2e7d32" stroke-width="1"/>
  <text x="460" y="225" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="white">MUL</text>
  <text x="460" y="245" text-anchor="middle" font-family="Arial" font-size="8" fill="white">multiplier</text>

  <rect x="500" y="200" width="60" height="70" rx="5" fill="#64b5f6" stroke="#1976d2" stroke-width="1"/>
  <text x="530" y="225" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="white">LSU</text>
  <text x="530" y="245" text-anchor="middle" font-family="Arial" font-size="8" fill="white">Load/Store</text>

  <!-- Arrows showing parallel dispatch -->
  <line x1="330" y1="190" x2="320" y2="200" stroke="#004065" stroke-width="1"/>
  <line x1="360" y1="190" x2="390" y2="200" stroke="#004065" stroke-width="1"/>
  <line x1="390" y1="190" x2="460" y2="200" stroke="#004065" stroke-width="1"/>

  <!-- Timeline comparison -->
  <rect x="30" y="310" width="590" height="80" rx="5" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="325" y="335" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#004065">Execution Timeline</text>

  <!-- Sequential -->
  <text x="50" y="355" font-family="Arial" font-size="10" fill="#333">Sequential:</text>
  <rect x="120" y="345" width="40" height="20" fill="#ef9a9a" stroke="#c62828" stroke-width="1"/>
  <text x="140" y="360" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">1</text>
  <rect x="160" y="345" width="40" height="20" fill="#ef9a9a" stroke="#c62828" stroke-width="1"/>
  <text x="180" y="360" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">2</text>
  <rect x="200" y="345" width="40" height="20" fill="#ef9a9a" stroke="#c62828" stroke-width="1"/>
  <text x="220" y="360" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">3</text>
  <rect x="240" y="345" width="40" height="20" fill="#ef9a9a" stroke="#c62828" stroke-width="1"/>
  <text x="260" y="360" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">4</text>
  <text x="300" y="360" font-family="Arial" font-size="9" fill="#c62828">4 cycles</text>

  <!-- Parallel -->
  <text x="50" y="380" font-family="Arial" font-size="10" fill="#333">ILP:</text>
  <rect x="120" y="368" width="40" height="20" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="140" y="383" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">1</text>
  <rect x="120" y="368" width="40" height="20" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" transform="translate(0,-22)"/>
  <text x="140" y="361" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">2</text>
  <rect x="120" y="368" width="40" height="20" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" transform="translate(0,-44)"/>
  <text x="140" y="339" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">4</text>
  <rect x="160" y="370" width="40" height="18" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="180" y="383" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">3</text>
  <text x="220" y="383" font-family="Arial" font-size="9" fill="#2e7d32">2 cycles!</text>

  <!-- Speedup -->
  <rect x="510" y="340" width="100" height="40" rx="5" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="560" y="360" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2e7d32">2x Speedup</text>
  <text x="560" y="375" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">via ILP</text>
</svg>
