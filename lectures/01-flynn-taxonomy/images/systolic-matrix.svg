<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <!-- Background -->
  <rect width="600" height="350" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#004065">Systolic Array Matrix Multiplication: C = A × B</text>

  <!-- Matrix A -->
  <text x="80" y="70" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2e7d32">Matrix A</text>
  <rect x="30" y="80" width="100" height="90" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <line x1="63" y1="80" x2="63" y2="170" stroke="#2e7d32" stroke-width="1"/>
  <line x1="96" y1="80" x2="96" y2="170" stroke="#2e7d32" stroke-width="1"/>
  <line x1="30" y1="110" x2="130" y2="110" stroke="#2e7d32" stroke-width="1"/>
  <line x1="30" y1="140" x2="130" y2="140" stroke="#2e7d32" stroke-width="1"/>
  <text x="46" y="100" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">a11</text>
  <text x="79" y="100" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">a12</text>
  <text x="113" y="100" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">a13</text>
  <text x="46" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">a21</text>
  <text x="79" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">a22</text>
  <text x="113" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">a23</text>
  <text x="46" y="160" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">a31</text>
  <text x="79" y="160" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">a32</text>
  <text x="113" y="160" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">a33</text>

  <!-- Multiplication sign -->
  <text x="160" y="130" text-anchor="middle" font-family="Arial" font-size="24" fill="#004065">×</text>

  <!-- Matrix B -->
  <text x="240" y="70" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#c2185b">Matrix B</text>
  <rect x="190" y="80" width="100" height="90" fill="none" stroke="#c2185b" stroke-width="2"/>
  <line x1="223" y1="80" x2="223" y2="170" stroke="#c2185b" stroke-width="1"/>
  <line x1="256" y1="80" x2="256" y2="170" stroke="#c2185b" stroke-width="1"/>
  <line x1="190" y1="110" x2="290" y2="110" stroke="#c2185b" stroke-width="1"/>
  <line x1="190" y1="140" x2="290" y2="140" stroke="#c2185b" stroke-width="1"/>
  <text x="206" y="100" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">b11</text>
  <text x="239" y="100" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">b12</text>
  <text x="273" y="100" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">b13</text>
  <text x="206" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">b21</text>
  <text x="239" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">b22</text>
  <text x="273" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">b23</text>
  <text x="206" y="160" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">b31</text>
  <text x="239" y="160" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">b32</text>
  <text x="273" y="160" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">b33</text>

  <!-- Equals sign -->
  <text x="320" y="130" text-anchor="middle" font-family="Arial" font-size="24" fill="#004065">=</text>

  <!-- Matrix C -->
  <text x="400" y="70" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">Matrix C</text>
  <rect x="350" y="80" width="100" height="90" fill="none" stroke="#1976d2" stroke-width="2"/>
  <line x1="383" y1="80" x2="383" y2="170" stroke="#1976d2" stroke-width="1"/>
  <line x1="416" y1="80" x2="416" y2="170" stroke="#1976d2" stroke-width="1"/>
  <line x1="350" y1="110" x2="450" y2="110" stroke="#1976d2" stroke-width="1"/>
  <line x1="350" y1="140" x2="450" y2="140" stroke="#1976d2" stroke-width="1"/>
  <text x="366" y="100" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">c11</text>
  <text x="399" y="100" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">c12</text>
  <text x="433" y="100" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">c13</text>
  <text x="366" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">c21</text>
  <text x="399" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">c22</text>
  <text x="433" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">c23</text>
  <text x="366" y="160" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">c31</text>
  <text x="399" y="160" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">c32</text>
  <text x="433" y="160" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">c33</text>

  <!-- Systolic array representation -->
  <text x="300" y="210" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#004065">Systolic Array: Each PE accumulates one cij</text>

  <!-- 3x3 PE grid -->
  <rect x="200" y="230" width="40" height="35" rx="3" fill="#e3f2fd" stroke="#004065" stroke-width="2"/>
  <text x="220" y="252" text-anchor="middle" font-family="Arial" font-size="9" fill="#004065">c11</text>

  <rect x="250" y="230" width="40" height="35" rx="3" fill="#e3f2fd" stroke="#004065" stroke-width="2"/>
  <text x="270" y="252" text-anchor="middle" font-family="Arial" font-size="9" fill="#004065">c12</text>

  <rect x="300" y="230" width="40" height="35" rx="3" fill="#e3f2fd" stroke="#004065" stroke-width="2"/>
  <text x="320" y="252" text-anchor="middle" font-family="Arial" font-size="9" fill="#004065">c13</text>

  <rect x="200" y="275" width="40" height="35" rx="3" fill="#e3f2fd" stroke="#004065" stroke-width="2"/>
  <text x="220" y="297" text-anchor="middle" font-family="Arial" font-size="9" fill="#004065">c21</text>

  <rect x="250" y="275" width="40" height="35" rx="3" fill="#e3f2fd" stroke="#004065" stroke-width="2"/>
  <text x="270" y="297" text-anchor="middle" font-family="Arial" font-size="9" fill="#004065">c22</text>

  <rect x="300" y="275" width="40" height="35" rx="3" fill="#e3f2fd" stroke="#004065" stroke-width="2"/>
  <text x="320" y="297" text-anchor="middle" font-family="Arial" font-size="9" fill="#004065">c23</text>

  <rect x="200" y="320" width="40" height="35" rx="3" fill="#e3f2fd" stroke="#004065" stroke-width="2"/>
  <text x="220" y="342" text-anchor="middle" font-family="Arial" font-size="9" fill="#004065">c31</text>

  <rect x="250" y="320" width="40" height="35" rx="3" fill="#e3f2fd" stroke="#004065" stroke-width="2"/>
  <text x="270" y="342" text-anchor="middle" font-family="Arial" font-size="9" fill="#004065">c32</text>

  <rect x="300" y="320" width="40" height="35" rx="3" fill="#e3f2fd" stroke="#004065" stroke-width="2"/>
  <text x="320" y="342" text-anchor="middle" font-family="Arial" font-size="9" fill="#004065">c33</text>

  <!-- Row inputs -->
  <text x="175" y="252" text-anchor="end" font-family="Arial" font-size="9" fill="#2e7d32">Row 1 →</text>
  <text x="175" y="297" text-anchor="end" font-family="Arial" font-size="9" fill="#2e7d32">Row 2 →</text>
  <text x="175" y="342" text-anchor="end" font-family="Arial" font-size="9" fill="#2e7d32">Row 3 →</text>

  <!-- Column inputs -->
  <text x="220" y="222" text-anchor="middle" font-family="Arial" font-size="9" fill="#c2185b">↓Col 1</text>
  <text x="270" y="222" text-anchor="middle" font-family="Arial" font-size="9" fill="#c2185b">↓Col 2</text>
  <text x="320" y="222" text-anchor="middle" font-family="Arial" font-size="9" fill="#c2185b">↓Col 3</text>

  <!-- Explanation -->
  <rect x="380" y="230" width="190" height="90" rx="5" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="475" y="255" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#004065">Each PE computes:</text>
  <text x="475" y="275" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">cij = Σ aik × bkj</text>
  <text x="475" y="295" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Data flows in, partial</text>
  <text x="475" y="310" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">sums accumulate</text>
</svg>
