<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow6" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#004065"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#2e7d32">SIMD Operational Model</text>

  <!-- Instruction Stream -->
  <rect x="30" y="80" width="60" height="40" rx="5" fill="#81c784"/>
  <text x="60" y="105" text-anchor="middle" font-family="Arial" font-size="11" fill="white">IS</text>
  <line x1="90" y1="100" x2="120" y2="100" stroke="#004065" stroke-width="2" marker-end="url(#arrow6)"/>

  <!-- Control Unit Box -->
  <rect x="120" y="60" width="140" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>

  <!-- CU -->
  <rect x="135" y="75" width="50" height="35" rx="3" fill="#004065"/>
  <text x="160" y="98" text-anchor="middle" font-family="Arial" font-size="10" fill="white">CU</text>

  <!-- CM -->
  <rect x="195" y="75" width="50" height="35" rx="3" fill="#64b5f6"/>
  <text x="220" y="98" text-anchor="middle" font-family="Arial" font-size="10" fill="white">CM</text>

  <!-- uIS label -->
  <text x="190" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">μIS broadcast</text>

  <!-- Broadcast line -->
  <line x1="190" y1="160" x2="190" y2="200" stroke="#004065" stroke-width="2"/>
  <line x1="190" y1="200" x2="100" y2="200" stroke="#004065" stroke-width="2"/>
  <line x1="190" y1="200" x2="280" y2="200" stroke="#004065" stroke-width="2"/>

  <!-- PE Array -->
  <!-- PE 1 -->
  <rect x="60" y="220" width="80" height="100" rx="5" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <rect x="70" y="235" width="60" height="30" rx="3" fill="#FFD200"/>
  <text x="100" y="255" text-anchor="middle" font-family="Arial" font-size="10" fill="#004065">PE</text>
  <rect x="70" y="275" width="60" height="30" rx="3" fill="#90caf9"/>
  <text x="100" y="295" text-anchor="middle" font-family="Arial" font-size="10" fill="#004065">PEM</text>
  <line x1="100" y1="200" x2="100" y2="220" stroke="#004065" stroke-width="2" marker-end="url(#arrow6)"/>

  <!-- PE 2 -->
  <rect x="150" y="220" width="80" height="100" rx="5" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <rect x="160" y="235" width="60" height="30" rx="3" fill="#FFD200"/>
  <text x="190" y="255" text-anchor="middle" font-family="Arial" font-size="10" fill="#004065">PE</text>
  <rect x="160" y="275" width="60" height="30" rx="3" fill="#90caf9"/>
  <text x="190" y="295" text-anchor="middle" font-family="Arial" font-size="10" fill="#004065">PEM</text>
  <line x1="190" y1="200" x2="190" y2="220" stroke="#004065" stroke-width="2" marker-end="url(#arrow6)"/>

  <!-- PE 3 -->
  <rect x="240" y="220" width="80" height="100" rx="5" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <rect x="250" y="235" width="60" height="30" rx="3" fill="#FFD200"/>
  <text x="280" y="255" text-anchor="middle" font-family="Arial" font-size="10" fill="#004065">PE</text>
  <rect x="250" y="275" width="60" height="30" rx="3" fill="#90caf9"/>
  <text x="280" y="295" text-anchor="middle" font-family="Arial" font-size="10" fill="#004065">PEM</text>
  <line x1="280" y1="200" x2="280" y2="220" stroke="#004065" stroke-width="2" marker-end="url(#arrow6)"/>

  <!-- Data Streams -->
  <rect x="60" y="335" width="80" height="30" rx="3" fill="#ef9a9a"/>
  <text x="100" y="355" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">DS1</text>

  <rect x="150" y="335" width="80" height="30" rx="3" fill="#ef9a9a"/>
  <text x="190" y="355" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">DS2</text>

  <rect x="240" y="335" width="80" height="30" rx="3" fill="#ef9a9a"/>
  <text x="280" y="355" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">DS3</text>

  <!-- DS Connections -->
  <line x1="140" y1="270" x2="150" y2="270" stroke="#c2185b" stroke-width="2"/>
  <line x1="230" y1="270" x2="240" y2="270" stroke="#c2185b" stroke-width="2"/>

  <!-- To F.E. and I/O -->
  <line x1="320" y1="270" x2="370" y2="270" stroke="#004065" stroke-width="2" marker-end="url(#arrow6)"/>
  <text x="380" y="275" font-family="Arial" font-size="10" fill="#666">To F.E. &amp; I/O</text>

  <!-- Legend Box -->
  <rect x="400" y="80" width="180" height="200" rx="5" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="490" y="105" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#004065">Components:</text>

  <rect x="415" y="120" width="20" height="15" fill="#004065"/>
  <text x="445" y="132" font-family="Arial" font-size="9" fill="#333">CU: Control Unit</text>

  <rect x="415" y="145" width="20" height="15" fill="#64b5f6"/>
  <text x="445" y="157" font-family="Arial" font-size="9" fill="#333">CM: Control Memory</text>

  <rect x="415" y="170" width="20" height="15" fill="#FFD200"/>
  <text x="445" y="182" font-family="Arial" font-size="9" fill="#333">PE: Processing Element</text>

  <rect x="415" y="195" width="20" height="15" fill="#90caf9"/>
  <text x="445" y="207" font-family="Arial" font-size="9" fill="#333">PEM: PE Memory</text>

  <rect x="415" y="220" width="20" height="15" fill="#ef9a9a"/>
  <text x="445" y="232" font-family="Arial" font-size="9" fill="#333">DS: Data Stream</text>

  <text x="490" y="260" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">All PEs execute same</text>
  <text x="490" y="275" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">instruction in lockstep</text>
</svg>
