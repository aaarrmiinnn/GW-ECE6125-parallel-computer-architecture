<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 380">
  <!-- Background -->
  <rect width="650" height="380" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="325" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#004065">Cache and Data Locality</text>

  <!-- Temporal Locality Section -->
  <rect x="30" y="60" width="280" height="150" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="170" y="85" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2e7d32">Temporal Locality</text>
  <text x="170" y="105" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">"Recently accessed data will be used again"</text>

  <!-- Temporal example -->
  <rect x="50" y="120" width="240" height="75" rx="5" fill="white" stroke="#2e7d32" stroke-width="1"/>
  <text x="60" y="140" font-family="monospace" font-size="10" fill="#333">int sum = 0;</text>
  <text x="60" y="155" font-family="monospace" font-size="10" fill="#333">for (int i = 0; i &lt; 1000; i++)</text>
  <text x="60" y="170" font-family="monospace" font-size="10" fill="#333">    sum += array[i];</text>
  <text x="170" y="190" text-anchor="middle" font-family="Arial" font-size="9" fill="#2e7d32">↑ 'sum' accessed 1000 times</text>

  <!-- Spatial Locality Section -->
  <rect x="340" y="60" width="280" height="150" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="480" y="85" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">Spatial Locality</text>
  <text x="480" y="105" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">"Nearby data will be accessed soon"</text>

  <!-- Spatial example -->
  <rect x="360" y="120" width="240" height="75" rx="5" fill="white" stroke="#1976d2" stroke-width="1"/>
  <text x="370" y="140" font-family="monospace" font-size="10" fill="#333">for (int i = 0; i &lt; 1000; i++)</text>
  <text x="370" y="155" font-family="monospace" font-size="10" fill="#333">    process(array[i]);</text>
  <text x="480" y="180" text-anchor="middle" font-family="Arial" font-size="9" fill="#1976d2">↑ Sequential array access</text>

  <!-- Memory/Cache Hierarchy -->
  <text x="325" y="240" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#004065">Memory Hierarchy</text>

  <!-- CPU -->
  <rect x="275" y="255" width="100" height="30" rx="5" fill="#004065"/>
  <text x="325" y="275" text-anchor="middle" font-family="Arial" font-size="11" fill="white">CPU</text>

  <!-- L1 Cache -->
  <rect x="240" y="295" width="170" height="25" rx="3" fill="#FFD200"/>
  <text x="325" y="312" text-anchor="middle" font-family="Arial" font-size="10" fill="#004065">L1 Cache (1-3ns)</text>

  <!-- L2 Cache -->
  <rect x="200" y="330" width="250" height="25" rx="3" fill="#81c784"/>
  <text x="325" y="347" text-anchor="middle" font-family="Arial" font-size="10" fill="white">L2 Cache (3-10ns)</text>

  <!-- Main Memory -->
  <rect x="150" y="365" width="350" height="25" rx="3" fill="#64b5f6"/>
  <text x="325" y="382" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Main Memory (100-300ns)</text>

  <!-- Speed/Size indicators -->
  <text x="520" y="280" font-family="Arial" font-size="9" fill="#666">← Faster, Smaller</text>
  <text x="520" y="375" font-family="Arial" font-size="9" fill="#666">← Slower, Larger</text>

  <!-- Arrow indicating hierarchy -->
  <line x1="560" y1="285" x2="560" y2="370" stroke="#666" stroke-width="2"/>
  <polygon points="555,370 560,380 565,370" fill="#666"/>

  <!-- Cache line illustration -->
  <rect x="30" y="255" width="180" height="90" rx="5" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="120" y="275" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#004065">Cache Line (64 bytes)</text>

  <!-- Cache line blocks -->
  <rect x="45" y="285" width="25" height="20" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <rect x="70" y="285" width="25" height="20" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <rect x="95" y="285" width="25" height="20" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <rect x="120" y="285" width="25" height="20" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <rect x="145" y="285" width="25" height="20" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <rect x="170" y="285" width="25" height="20" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>

  <text x="57" y="300" text-anchor="middle" font-family="Arial" font-size="7" fill="#1976d2">a[0]</text>
  <text x="82" y="300" text-anchor="middle" font-family="Arial" font-size="7" fill="#1976d2">a[1]</text>
  <text x="107" y="300" text-anchor="middle" font-family="Arial" font-size="7" fill="#1976d2">a[2]</text>
  <text x="132" y="300" text-anchor="middle" font-family="Arial" font-size="7" fill="#1976d2">a[3]</text>
  <text x="157" y="300" text-anchor="middle" font-family="Arial" font-size="7" fill="#1976d2">a[4]</text>
  <text x="182" y="300" text-anchor="middle" font-family="Arial" font-size="7" fill="#1976d2">a[5]</text>

  <text x="120" y="330" text-anchor="middle" font-family="Arial" font-size="8" fill="#666">Access a[0] → get a[0-5] free!</text>
</svg>
