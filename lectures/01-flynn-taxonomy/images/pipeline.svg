<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 350">
  <!-- Background -->
  <rect width="650" height="350" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="325" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#004065">3-Stage Pipeline: Floating Point Addition</text>

  <!-- Pipeline stages -->
  <rect x="50" y="60" width="100" height="50" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="100" y="90" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2e7d32">S0: Align</text>

  <rect x="180" y="60" width="100" height="50" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="230" y="90" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1976d2">S1: Add</text>

  <rect x="310" y="60" width="100" height="50" rx="5" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="360" y="90" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ef6c00">S2: Normalize</text>

  <!-- Arrows between stages -->
  <text x="25" y="85" font-family="Arial" font-size="11" fill="#666">In →</text>
  <line x1="150" y1="85" x2="180" y2="85" stroke="#004065" stroke-width="2"/>
  <polygon points="175,80 180,85 175,90" fill="#004065"/>
  <line x1="280" y1="85" x2="310" y2="85" stroke="#004065" stroke-width="2"/>
  <polygon points="305,80 310,85 305,90" fill="#004065"/>
  <text x="420" y="85" font-family="Arial" font-size="11" fill="#666">→ Out</text>

  <!-- Timeline header -->
  <text x="50" y="140" font-family="Arial" font-size="12" font-weight="bold" fill="#004065">Clock Cycles:</text>
  <text x="160" y="140" font-family="Arial" font-size="11" fill="#333">1</text>
  <text x="220" y="140" font-family="Arial" font-size="11" fill="#333">2</text>
  <text x="280" y="140" font-family="Arial" font-size="11" fill="#333">3</text>
  <text x="340" y="140" font-family="Arial" font-size="11" fill="#333">4</text>
  <text x="400" y="140" font-family="Arial" font-size="11" fill="#333">5</text>
  <text x="460" y="140" font-family="Arial" font-size="11" fill="#333">6</text>

  <!-- Grid lines -->
  <line x1="145" y1="150" x2="145" y2="310" stroke="#ddd" stroke-width="1"/>
  <line x1="205" y1="150" x2="205" y2="310" stroke="#ddd" stroke-width="1"/>
  <line x1="265" y1="150" x2="265" y2="310" stroke="#ddd" stroke-width="1"/>
  <line x1="325" y1="150" x2="325" y2="310" stroke="#ddd" stroke-width="1"/>
  <line x1="385" y1="150" x2="385" y2="310" stroke="#ddd" stroke-width="1"/>
  <line x1="445" y1="150" x2="445" y2="310" stroke="#ddd" stroke-width="1"/>
  <line x1="505" y1="150" x2="505" y2="310" stroke="#ddd" stroke-width="1"/>

  <!-- Task labels -->
  <text x="50" y="175" font-family="Arial" font-size="11" fill="#333">Task 0:</text>
  <text x="50" y="210" font-family="Arial" font-size="11" fill="#333">Task 1:</text>
  <text x="50" y="245" font-family="Arial" font-size="11" fill="#333">Task 2:</text>
  <text x="50" y="280" font-family="Arial" font-size="11" fill="#333">Task 3:</text>

  <!-- Task 0 -->
  <rect x="145" y="160" width="55" height="25" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="172" y="177" text-anchor="middle" font-family="Arial" font-size="9" fill="#2e7d32">S0</text>
  <rect x="205" y="160" width="55" height="25" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <text x="232" y="177" text-anchor="middle" font-family="Arial" font-size="9" fill="#1976d2">S1</text>
  <rect x="265" y="160" width="55" height="25" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
  <text x="292" y="177" text-anchor="middle" font-family="Arial" font-size="9" fill="#ef6c00">S2</text>

  <!-- Task 1 -->
  <rect x="205" y="195" width="55" height="25" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="232" y="212" text-anchor="middle" font-family="Arial" font-size="9" fill="#2e7d32">S0</text>
  <rect x="265" y="195" width="55" height="25" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <text x="292" y="212" text-anchor="middle" font-family="Arial" font-size="9" fill="#1976d2">S1</text>
  <rect x="325" y="195" width="55" height="25" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
  <text x="352" y="212" text-anchor="middle" font-family="Arial" font-size="9" fill="#ef6c00">S2</text>

  <!-- Task 2 -->
  <rect x="265" y="230" width="55" height="25" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="292" y="247" text-anchor="middle" font-family="Arial" font-size="9" fill="#2e7d32">S0</text>
  <rect x="325" y="230" width="55" height="25" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <text x="352" y="247" text-anchor="middle" font-family="Arial" font-size="9" fill="#1976d2">S1</text>
  <rect x="385" y="230" width="55" height="25" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
  <text x="412" y="247" text-anchor="middle" font-family="Arial" font-size="9" fill="#ef6c00">S2</text>

  <!-- Task 3 -->
  <rect x="325" y="265" width="55" height="25" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="352" y="282" text-anchor="middle" font-family="Arial" font-size="9" fill="#2e7d32">S0</text>
  <rect x="385" y="265" width="55" height="25" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <text x="412" y="282" text-anchor="middle" font-family="Arial" font-size="9" fill="#1976d2">S1</text>
  <rect x="445" y="265" width="55" height="25" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
  <text x="472" y="282" text-anchor="middle" font-family="Arial" font-size="9" fill="#ef6c00">S2</text>

  <!-- Performance comparison -->
  <rect x="520" y="150" width="120" height="110" rx="5" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="580" y="175" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#004065">Performance:</text>
  <text x="580" y="195" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Sequential: 12 cycles</text>
  <text x="580" y="215" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Pipelined: 6 cycles</text>
  <text x="580" y="240" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2e7d32">2x Speedup!</text>

  <!-- Legend -->
  <text x="325" y="340" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Each clock cycle, one task completes after pipeline is full (steady state)</text>
</svg>
