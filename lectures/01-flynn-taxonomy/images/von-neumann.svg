<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#004065"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#f8f9fa"/>

  <!-- Processor Box -->
  <rect x="50" y="80" width="250" height="200" rx="10" fill="#e3f2fd" stroke="#004065" stroke-width="2"/>
  <text x="175" y="105" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#004065">Processor</text>

  <!-- Control Unit -->
  <rect x="70" y="120" width="100" height="70" rx="5" fill="#004065"/>
  <text x="120" y="150" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Control</text>
  <text x="120" y="168" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Unit (CU)</text>

  <!-- ALU -->
  <rect x="180" y="120" width="100" height="70" rx="5" fill="#004065"/>
  <text x="230" y="155" text-anchor="middle" font-family="Arial" font-size="12" fill="white">ALU</text>

  <!-- Registers -->
  <rect x="70" y="200" width="210" height="60" rx="5" fill="#FFD200"/>
  <text x="175" y="235" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#004065">Registers</text>

  <!-- Memory Box -->
  <rect x="380" y="80" width="170" height="200" rx="10" fill="#fff3e0" stroke="#004065" stroke-width="2"/>
  <text x="465" y="105" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#004065">Memory</text>

  <!-- Program Section -->
  <rect x="400" y="120" width="130" height="60" rx="5" fill="#81c784"/>
  <text x="465" y="155" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Program</text>

  <!-- Data Section -->
  <rect x="400" y="200" width="130" height="60" rx="5" fill="#64b5f6"/>
  <text x="465" y="235" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Data</text>

  <!-- Arrows -->
  <!-- Data/Instructions arrow -->
  <line x1="300" y1="170" x2="380" y2="170" stroke="#004065" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="380" y1="190" x2="300" y2="190" stroke="#004065" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="340" y="160" text-anchor="middle" font-family="Arial" font-size="10" fill="#004065">Instructions</text>
  <text x="340" y="210" text-anchor="middle" font-family="Arial" font-size="10" fill="#004065">Data</text>

  <!-- Address arrow -->
  <line x1="300" y1="230" x2="380" y2="230" stroke="#004065" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="340" y="248" text-anchor="middle" font-family="Arial" font-size="10" fill="#004065">Address</text>

  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#004065">Von Neumann Architecture</text>

  <!-- Bottleneck indicator -->
  <text x="340" y="320" text-anchor="middle" font-family="Arial" font-size="11" fill="#d32f2f">Von Neumann Bottleneck</text>
  <line x1="300" y1="305" x2="380" y2="305" stroke="#d32f2f" stroke-width="3" stroke-dasharray="5,3"/>
</svg>
