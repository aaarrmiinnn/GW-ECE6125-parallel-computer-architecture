<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="300" y="35" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#004065">Flynn's Taxonomy</text>

  <!-- Axis labels -->
  <text x="300" y="70" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Data Streams</text>
  <text x="180" y="90" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">Single (SD)</text>
  <text x="420" y="90" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">Multiple (MD)</text>

  <text x="40" y="200" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" transform="rotate(-90, 40, 200)">Instruction Streams</text>
  <text x="70" y="165" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">Single (SI)</text>
  <text x="70" y="295" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">Multiple (MI)</text>

  <!-- Grid lines -->
  <line x1="100" y1="100" x2="100" y2="370" stroke="#ccc" stroke-width="1"/>
  <line x1="300" y1="100" x2="300" y2="370" stroke="#ccc" stroke-width="1"/>
  <line x1="500" y1="100" x2="500" y2="370" stroke="#ccc" stroke-width="1"/>
  <line x1="100" y1="100" x2="500" y2="100" stroke="#ccc" stroke-width="1"/>
  <line x1="100" y1="235" x2="500" y2="235" stroke="#ccc" stroke-width="1"/>
  <line x1="100" y1="370" x2="500" y2="370" stroke="#ccc" stroke-width="1"/>

  <!-- SISD Box -->
  <rect x="105" y="105" width="190" height="125" fill="#e3f2fd" stroke="#004065" stroke-width="2"/>
  <text x="200" y="145" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#004065">SISD</text>
  <text x="200" y="170" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Single Instruction</text>
  <text x="200" y="185" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Single Data</text>
  <text x="200" y="210" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Traditional CPUs</text>

  <!-- SIMD Box -->
  <rect x="305" y="105" width="190" height="125" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="400" y="145" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#2e7d32">SIMD</text>
  <text x="400" y="170" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Single Instruction</text>
  <text x="400" y="185" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Multiple Data</text>
  <text x="400" y="210" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">GPUs, Vector Processors</text>

  <!-- MISD Box -->
  <rect x="105" y="240" width="190" height="125" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="200" y="280" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#ef6c00">MISD</text>
  <text x="200" y="305" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Multiple Instructions</text>
  <text x="200" y="320" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Single Data</text>
  <text x="200" y="345" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Fault-tolerant Systems</text>

  <!-- MIMD Box -->
  <rect x="305" y="240" width="190" height="125" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="400" y="280" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#c2185b">MIMD</text>
  <text x="400" y="305" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Multiple Instructions</text>
  <text x="400" y="320" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Multiple Data</text>
  <text x="400" y="345" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Multi-core, Clusters</text>
</svg>
