<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #222; }
    .title { font-size: 15px; font-weight: bold; fill: #004065; }
    .decision { font-size: 10px; fill: white; font-weight: bold; }
    .answer { font-size: 11px; font-weight: bold; }
    .edge { font-size: 10px; font-weight: bold; }
  </style>

  <text x="350" y="22" class="title" text-anchor="middle">Choosing the Right Hardware: Decision Tree</text>

  <!-- Decision 1: Is GPU good enough? -->
  <polygon points="200,45 350,75 200,105 50,75" fill="#004065" stroke="#004065" stroke-width="2"/>
  <text x="200" y="72" class="decision" text-anchor="middle">Is GPU good enough</text>
  <text x="200" y="84" class="decision" text-anchor="middle">for your workload?</text>

  <!-- Yes -> Use GPU -->
  <line x1="350" y1="75" x2="440" y2="75" stroke="#004065" stroke-width="2"/>
  <text x="390" y="68" class="edge" fill="#2e7d32">Yes</text>
  <rect x="440" y="58" width="100" height="34" rx="6" fill="#3a7ca5" stroke="#004065" stroke-width="2"/>
  <text x="490" y="80" class="answer" text-anchor="middle" fill="white">Use GPU</text>

  <!-- No -> Decision 2 -->
  <line x1="200" y1="105" x2="200" y2="130" stroke="#004065" stroke-width="2"/>
  <text x="210" y="122" class="edge" fill="#c05000">No</text>

  <!-- Decision 2: Is workload stable? -->
  <polygon points="200,130 350,160 200,190 50,160" fill="#004065" stroke="#004065" stroke-width="2"/>
  <text x="200" y="157" class="decision" text-anchor="middle">Is the workload / algorithm</text>
  <text x="200" y="169" class="decision" text-anchor="middle">stable and well-defined?</text>

  <!-- No -> FPGA -->
  <line x1="50" y1="160" x2="10" y2="160" stroke="#004065" stroke-width="1.5"/>
  <line x1="10" y1="160" x2="10" y2="220" stroke="#004065" stroke-width="1.5"/>
  <line x1="10" y1="220" x2="50" y2="220" stroke="#004065" stroke-width="1.5"/>
  <text x="28" y="192" class="edge" fill="#c05000">No</text>
  <rect x="50" y="203" width="100" height="34" rx="6" fill="#FFD200" stroke="#004065" stroke-width="2"/>
  <text x="100" y="224" class="answer" text-anchor="middle" fill="#222">FPGA</text>
  <text x="100" y="252" font-size="9" fill="#666" text-anchor="middle">Reconfigure as</text>
  <text x="100" y="263" font-size="9" fill="#666" text-anchor="middle">algorithm evolves</text>

  <!-- Yes -> Decision 3 -->
  <line x1="350" y1="160" x2="480" y2="160" stroke="#004065" stroke-width="2"/>
  <text x="405" y="153" class="edge" fill="#2e7d32">Yes</text>

  <!-- Decision 3: Volume > 100K? -->
  <polygon points="480,130 610,160 480,190 360,160" fill="#004065" stroke="#004065" stroke-width="2"/>
  <text x="485" y="157" class="decision" text-anchor="middle">Volume > 100K</text>
  <text x="485" y="169" class="decision" text-anchor="middle">units/year?</text>

  <!-- No -> FPGA or DSA -->
  <line x1="480" y1="190" x2="480" y2="220" stroke="#004065" stroke-width="2"/>
  <text x="492" y="210" class="edge" fill="#c05000">No</text>
  <rect x="420" y="223" width="120" height="34" rx="6" fill="#c05000" stroke="#004065" stroke-width="2" opacity="0.85"/>
  <text x="480" y="244" class="answer" text-anchor="middle" fill="white">FPGA or DSA</text>
  <text x="480" y="272" font-size="9" fill="#666" text-anchor="middle">NRE cost too high for ASIC</text>

  <!-- Yes -> ASIC -->
  <line x1="610" y1="160" x2="660" y2="160" stroke="#004065" stroke-width="1.5"/>
  <line x1="660" y1="160" x2="660" y2="220" stroke="#004065" stroke-width="1.5"/>
  <line x1="660" y1="220" x2="620" y2="220" stroke="#004065" stroke-width="1.5"/>
  <text x="645" y="192" class="edge" fill="#2e7d32">Yes</text>
  <rect x="570" y="203" width="100" height="34" rx="6" fill="#3a2010" stroke="#004065" stroke-width="2"/>
  <text x="620" y="224" class="answer" text-anchor="middle" fill="white">ASIC</text>
  <text x="620" y="252" font-size="9" fill="#666" text-anchor="middle">Max perf/watt;</text>
  <text x="620" y="263" font-size="9" fill="#666" text-anchor="middle">volume amortizes NRE</text>
</svg>