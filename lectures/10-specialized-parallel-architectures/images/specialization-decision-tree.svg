<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #222; }
    .title { font-size: 14px; font-weight: bold; fill: #004065; }
    .q { font-size: 9px; fill: #004065; font-weight: bold; }
    .result-label { font-size: 11px; font-weight: bold; }
    .yn { font-size: 10px; font-weight: bold; }
    .note { font-size: 8px; fill: #666; }
  </style>

  <defs>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#004065"/>
    </marker>
  </defs>

  <text x="350" y="18" class="title" text-anchor="middle">Choosing the Right Hardware: Decision Tree</text>

  <!-- ═══ Decision 1: Is GPU good enough? ═══ -->
  <rect x="90" y="35" width="220" height="40" rx="6" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="200" y="52" class="q" text-anchor="middle">Is GPU good enough</text>
  <text x="200" y="63" class="q" text-anchor="middle">for your workload?</text>

  <!-- Yes → Use GPU -->
  <line x1="310" y1="55" x2="380" y2="55" stroke="#004065" stroke-width="1.5" marker-end="url(#arrd)"/>
  <text x="345" y="48" class="yn" fill="#2e7d32">Yes</text>
  <rect x="385" y="40" width="100" height="30" rx="6" fill="#cfe2f3" stroke="#004065" stroke-width="2"/>
  <text x="435" y="60" class="result-label" text-anchor="middle" fill="#004065">Use GPU</text>

  <!-- No ↓ -->
  <line x1="200" y1="75" x2="200" y2="110" stroke="#004065" stroke-width="1.5" marker-end="url(#arrd)"/>
  <text x="212" y="96" class="yn" fill="#c05000">No</text>

  <!-- ═══ Decision 2: Is workload stable? ═══ -->
  <rect x="90" y="115" width="220" height="40" rx="6" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="200" y="132" class="q" text-anchor="middle">Is the workload / algorithm</text>
  <text x="200" y="143" class="q" text-anchor="middle">stable and well-defined?</text>

  <!-- No → FPGA -->
  <line x1="90" y1="135" x2="30" y2="135" stroke="#004065" stroke-width="1.5"/>
  <line x1="30" y1="135" x2="30" y2="220" stroke="#004065" stroke-width="1.5" marker-end="url(#arrd)"/>
  <text x="55" y="128" class="yn" fill="#c05000">No</text>
  <rect x="5" y="225" width="110" height="30" rx="6" fill="#FFD200" stroke="#004065" stroke-width="2"/>
  <text x="60" y="245" class="result-label" text-anchor="middle" fill="#004065">FPGA</text>
  <text x="60" y="268" class="note" text-anchor="middle">Reconfigure as</text>
  <text x="60" y="278" class="note" text-anchor="middle">algorithm evolves</text>

  <!-- Yes → Decision 3 -->
  <line x1="310" y1="135" x2="380" y2="135" stroke="#004065" stroke-width="1.5" marker-end="url(#arrd)"/>
  <text x="345" y="128" class="yn" fill="#2e7d32">Yes</text>

  <!-- ═══ Decision 3: Is latency critical? ═══ -->
  <rect x="385" y="115" width="220" height="40" rx="6" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="495" y="132" class="q" text-anchor="middle">Is volume > 100K</text>
  <text x="495" y="143" class="q" text-anchor="middle">units/year?</text>

  <!-- No → DSA -->
  <line x1="495" y1="155" x2="495" y2="190" stroke="#004065" stroke-width="1.5"/>
  <line x1="495" y1="190" x2="350" y2="190" stroke="#004065" stroke-width="1.5"/>
  <line x1="350" y1="190" x2="350" y2="220" stroke="#004065" stroke-width="1.5" marker-end="url(#arrd)"/>
  <text x="507" y="178" class="yn" fill="#c05000">No</text>
  <rect x="295" y="225" width="110" height="30" rx="6" fill="#c05000" stroke="#004065" stroke-width="2"/>
  <text x="350" y="245" class="result-label" text-anchor="middle" fill="white">FPGA or DSA</text>
  <text x="350" y="268" class="note" text-anchor="middle">NRE cost too high</text>
  <text x="350" y="278" class="note" text-anchor="middle">for full ASIC</text>

  <!-- Yes → ASIC -->
  <line x1="605" y1="135" x2="660" y2="135" stroke="#004065" stroke-width="1.5"/>
  <line x1="660" y1="135" x2="660" y2="220" stroke="#004065" stroke-width="1.5" marker-end="url(#arrd)"/>
  <text x="635" y="128" class="yn" fill="#2e7d32">Yes</text>
  <rect x="605" y="225" width="110" height="30" rx="6" fill="#004065" stroke="#004065" stroke-width="2"/>
  <text x="660" y="245" class="result-label" text-anchor="middle" fill="white">ASIC</text>
  <text x="660" y="268" class="note" text-anchor="middle">Max perf/watt;</text>
  <text x="660" y="278" class="note" text-anchor="middle">volume amortizes NRE</text>

  <!-- Bottom note -->
  <text x="350" y="310" font-size="10" fill="#004065" font-weight="bold" text-anchor="middle">Default: start with GPU. Specialize only when GPU hits a wall.</text>
</svg>
