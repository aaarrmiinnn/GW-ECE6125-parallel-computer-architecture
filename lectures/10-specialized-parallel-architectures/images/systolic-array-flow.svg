<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300">
  <defs>
    <marker id="sarr" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#004065"/>
    </marker>
    <marker id="sarrO" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#c05000"/>
    </marker>
    <marker id="sarrG" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#3a7ca5"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #222; }
    .title { font-size: 15px; font-weight: bold; fill: #004065; }
    .pe { font-size: 10px; font-weight: bold; fill: white; }
    .val { font-size: 10px; font-weight: bold; }
    .note { font-size: 10px; fill: #666; font-style: italic; }
  </style>

  <text x="350" y="20" class="title" text-anchor="middle">Systolic Array: A x B Matrix Multiplication</text>

  <!-- Grid center at roughly (320, 160) -->
  <!-- PE positions: 3x3 grid, spacing 90px -->
  <!-- (230,80) (320,80) (410,80) -->
  <!-- (230,160) (320,160) (410,160) -->
  <!-- (230,240) (320,240) (410,240) -->

  <!-- A matrix values flowing left-to-right (staggered) -->
  <text x="115" y="56" class="val" fill="#c05000" text-anchor="end">Matrix A (rows)</text>
  <!-- Row 0: a00, a01, a02 -->
  <rect x="155" y="70" width="36" height="22" rx="4" fill="#c05000" opacity="0.15" stroke="#c05000" stroke-width="1"/>
  <text x="173" y="85" font-size="9" fill="#c05000" font-weight="bold" text-anchor="middle">a00</text>
  <line x1="191" y1="81" x2="218" y2="81" stroke="#c05000" stroke-width="1.5" marker-end="url(#sarrO)"/>

  <rect x="120" y="70" width="30" height="22" rx="4" fill="#c05000" opacity="0.10" stroke="#c05000" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="135" y="85" font-size="9" fill="#c05000" text-anchor="middle">a01</text>

  <!-- Row 1 (staggered): a10 arrives 1 cycle later -->
  <rect x="120" y="150" width="36" height="22" rx="4" fill="#c05000" opacity="0.15" stroke="#c05000" stroke-width="1"/>
  <text x="138" y="165" font-size="9" fill="#c05000" font-weight="bold" text-anchor="middle">a10</text>
  <line x1="156" y1="161" x2="218" y2="161" stroke="#c05000" stroke-width="1.5" marker-end="url(#sarrO)"/>

  <!-- Row 2 (staggered further): a20 -->
  <rect x="85" y="230" width="36" height="22" rx="4" fill="#c05000" opacity="0.15" stroke="#c05000" stroke-width="1"/>
  <text x="103" y="245" font-size="9" fill="#c05000" font-weight="bold" text-anchor="middle">a20</text>
  <line x1="121" y1="241" x2="218" y2="241" stroke="#c05000" stroke-width="1.5" marker-end="url(#sarrO)"/>

  <!-- B matrix values flowing top-to-bottom (staggered) -->
  <text x="280" y="40" class="val" fill="#3a7ca5" text-anchor="middle">Matrix B (columns)</text>

  <!-- Col 0: b00 -->
  <rect x="214" y="44" width="32" height="20" rx="4" fill="#3a7ca5" opacity="0.15" stroke="#3a7ca5" stroke-width="1"/>
  <text x="230" y="58" font-size="9" fill="#3a7ca5" font-weight="bold" text-anchor="middle">b00</text>
  <line x1="230" y1="64" x2="230" y2="68" stroke="#3a7ca5" stroke-width="1.5" marker-end="url(#sarrG)"/>

  <!-- Col 1: b10 (staggered) -->
  <rect x="304" y="37" width="32" height="20" rx="4" fill="#3a7ca5" opacity="0.15" stroke="#3a7ca5" stroke-width="1"/>
  <text x="320" y="51" font-size="9" fill="#3a7ca5" font-weight="bold" text-anchor="middle">b10</text>
  <line x1="320" y1="57" x2="320" y2="68" stroke="#3a7ca5" stroke-width="1.5" marker-end="url(#sarrG)"/>

  <!-- Col 2: b20 (staggered further) -->
  <rect x="394" y="30" width="32" height="20" rx="4" fill="#3a7ca5" opacity="0.15" stroke="#3a7ca5" stroke-width="1"/>
  <text x="410" y="44" font-size="9" fill="#3a7ca5" font-weight="bold" text-anchor="middle">b20</text>
  <line x1="410" y1="50" x2="410" y2="68" stroke="#3a7ca5" stroke-width="1.5" marker-end="url(#sarrG)"/>

  <!-- PE Circles: 3x3 -->
  <g>
    <!-- Row 0 -->
    <circle cx="230" cy="81" r="22" fill="#004065" stroke="#004065" stroke-width="2"/>
    <text x="230" y="78" class="pe" text-anchor="middle">MAC</text>
    <text x="230" y="89" font-size="7" fill="#cfe2f3" text-anchor="middle">c00</text>

    <circle cx="320" cy="81" r="22" fill="#004065" stroke="#004065" stroke-width="2"/>
    <text x="320" y="78" class="pe" text-anchor="middle">MAC</text>
    <text x="320" y="89" font-size="7" fill="#cfe2f3" text-anchor="middle">c01</text>

    <circle cx="410" cy="81" r="22" fill="#004065" stroke="#004065" stroke-width="2"/>
    <text x="410" y="78" class="pe" text-anchor="middle">MAC</text>
    <text x="410" y="89" font-size="7" fill="#cfe2f3" text-anchor="middle">c02</text>

    <!-- Row 1 -->
    <circle cx="230" cy="161" r="22" fill="#004065" stroke="#004065" stroke-width="2"/>
    <text x="230" y="158" class="pe" text-anchor="middle">MAC</text>
    <text x="230" y="169" font-size="7" fill="#cfe2f3" text-anchor="middle">c10</text>

    <circle cx="320" cy="161" r="22" fill="#004065" stroke="#004065" stroke-width="2"/>
    <text x="320" y="158" class="pe" text-anchor="middle">MAC</text>
    <text x="320" y="169" font-size="7" fill="#cfe2f3" text-anchor="middle">c11</text>

    <circle cx="410" cy="161" r="22" fill="#004065" stroke="#004065" stroke-width="2"/>
    <text x="410" y="158" class="pe" text-anchor="middle">MAC</text>
    <text x="410" y="169" font-size="7" fill="#cfe2f3" text-anchor="middle">c12</text>

    <!-- Row 2 -->
    <circle cx="230" cy="241" r="22" fill="#004065" stroke="#004065" stroke-width="2"/>
    <text x="230" y="238" class="pe" text-anchor="middle">MAC</text>
    <text x="230" y="249" font-size="7" fill="#cfe2f3" text-anchor="middle">c20</text>

    <circle cx="320" cy="241" r="22" fill="#004065" stroke="#004065" stroke-width="2"/>
    <text x="320" y="238" class="pe" text-anchor="middle">MAC</text>
    <text x="320" y="249" font-size="7" fill="#cfe2f3" text-anchor="middle">c21</text>

    <circle cx="410" cy="241" r="22" fill="#004065" stroke="#004065" stroke-width="2"/>
    <text x="410" y="238" class="pe" text-anchor="middle">MAC</text>
    <text x="410" y="249" font-size="7" fill="#cfe2f3" text-anchor="middle">c22</text>
  </g>

  <!-- Horizontal arrows between PEs (A flows right) -->
  <g stroke="#c05000" stroke-width="1.5">
    <line x1="252" y1="81" x2="296" y2="81" marker-end="url(#sarrO)"/>
    <line x1="342" y1="81" x2="386" y2="81" marker-end="url(#sarrO)"/>
    <line x1="252" y1="161" x2="296" y2="161" marker-end="url(#sarrO)"/>
    <line x1="342" y1="161" x2="386" y2="161" marker-end="url(#sarrO)"/>
    <line x1="252" y1="241" x2="296" y2="241" marker-end="url(#sarrO)"/>
    <line x1="342" y1="241" x2="386" y2="241" marker-end="url(#sarrO)"/>
  </g>

  <!-- Vertical arrows between PEs (B flows down) -->
  <g stroke="#3a7ca5" stroke-width="1.5">
    <line x1="230" y1="103" x2="230" y2="137" marker-end="url(#sarrG)"/>
    <line x1="230" y1="183" x2="230" y2="217" marker-end="url(#sarrG)"/>
    <line x1="320" y1="103" x2="320" y2="137" marker-end="url(#sarrG)"/>
    <line x1="320" y1="183" x2="320" y2="217" marker-end="url(#sarrG)"/>
    <line x1="410" y1="103" x2="410" y2="137" marker-end="url(#sarrG)"/>
    <line x1="410" y1="183" x2="410" y2="217" marker-end="url(#sarrG)"/>
  </g>

  <!-- Right side annotations -->
  <rect x="470" y="70" width="220" height="100" rx="6" fill="#fff4cc" stroke="#004065" stroke-width="1.5"/>
  <text x="580" y="88" font-size="11" fill="#004065" font-weight="bold" text-anchor="middle">How It Works</text>
  <text x="580" y="104" font-size="9" fill="#222" text-anchor="middle">Each PE: c += a * b</text>
  <text x="580" y="118" font-size="9" fill="#c05000" text-anchor="middle">A values flow left-to-right</text>
  <text x="580" y="132" font-size="9" fill="#3a7ca5" text-anchor="middle">B values flow top-to-bottom</text>
  <text x="580" y="146" font-size="9" fill="#222" text-anchor="middle">Results (C) accumulate in-place</text>
  <text x="580" y="162" font-size="9" fill="#666" text-anchor="middle">Data is staggered to arrive on time</text>

  <text x="350" y="290" class="note" text-anchor="middle">Each value is read once from memory and reused N times across PEs -- O(N^2) reuse from O(N) reads.</text>
</svg>