<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #222; }
    .title { font-size: 16px; font-weight: bold; fill: #004065; }
    .label { font-size: 13px; font-weight: bold; fill: #004065; }
    .op { font-size: 28px; font-weight: bold; fill: #004065; }
    .dtype { font-size: 11px; font-weight: bold; }
    .stat { font-size: 11px; fill: #666; font-style: italic; }
  </style>

  <text x="350" y="24" class="title" text-anchor="middle">Tensor Core: Matrix Multiply-Accumulate (MMA)</text>
  <text x="350" y="42" font-size="11" fill="#666" text-anchor="middle">One Tensor Core operation: D = A x B + C</text>

  <!-- Matrix A (4x4, FP16) -->
  <text x="80" y="68" class="dtype" fill="#004065" text-anchor="middle">A (FP16)</text>
  <g fill="#cfe2f3" stroke="#004065" stroke-width="1">
    <rect x="40" y="76" width="20" height="20" rx="2"/><rect x="62" y="76" width="20" height="20" rx="2"/>
    <rect x="84" y="76" width="20" height="20" rx="2"/><rect x="106" y="76" width="20" height="20" rx="2"/>
    <rect x="40" y="98" width="20" height="20" rx="2"/><rect x="62" y="98" width="20" height="20" rx="2"/>
    <rect x="84" y="98" width="20" height="20" rx="2"/><rect x="106" y="98" width="20" height="20" rx="2"/>
    <rect x="40" y="120" width="20" height="20" rx="2"/><rect x="62" y="120" width="20" height="20" rx="2"/>
    <rect x="84" y="120" width="20" height="20" rx="2"/><rect x="106" y="120" width="20" height="20" rx="2"/>
    <rect x="40" y="142" width="20" height="20" rx="2"/><rect x="62" y="142" width="20" height="20" rx="2"/>
    <rect x="84" y="142" width="20" height="20" rx="2"/><rect x="106" y="142" width="20" height="20" rx="2"/>
  </g>
  <text x="80" y="180" font-size="10" fill="#666" text-anchor="middle">4 x 4</text>

  <!-- Multiply symbol -->
  <text x="152" y="130" class="op" text-anchor="middle">x</text>

  <!-- Matrix B (4x4, FP16) -->
  <text x="228" y="68" class="dtype" fill="#004065" text-anchor="middle">B (FP16)</text>
  <g fill="#cfe2f3" stroke="#004065" stroke-width="1">
    <rect x="188" y="76" width="20" height="20" rx="2"/><rect x="210" y="76" width="20" height="20" rx="2"/>
    <rect x="232" y="76" width="20" height="20" rx="2"/><rect x="254" y="76" width="20" height="20" rx="2"/>
    <rect x="188" y="98" width="20" height="20" rx="2"/><rect x="210" y="98" width="20" height="20" rx="2"/>
    <rect x="232" y="98" width="20" height="20" rx="2"/><rect x="254" y="98" width="20" height="20" rx="2"/>
    <rect x="188" y="120" width="20" height="20" rx="2"/><rect x="210" y="120" width="20" height="20" rx="2"/>
    <rect x="232" y="120" width="20" height="20" rx="2"/><rect x="254" y="120" width="20" height="20" rx="2"/>
    <rect x="188" y="142" width="20" height="20" rx="2"/><rect x="210" y="142" width="20" height="20" rx="2"/>
    <rect x="232" y="142" width="20" height="20" rx="2"/><rect x="254" y="142" width="20" height="20" rx="2"/>
  </g>
  <text x="228" y="180" font-size="10" fill="#666" text-anchor="middle">4 x 4</text>

  <!-- Plus symbol -->
  <text x="300" y="130" class="op" text-anchor="middle">+</text>

  <!-- Matrix C (4x4, FP32) -->
  <text x="376" y="68" class="dtype" fill="#004065" text-anchor="middle">C (FP32)</text>
  <g fill="#fff4cc" stroke="#004065" stroke-width="1">
    <rect x="336" y="76" width="20" height="20" rx="2"/><rect x="358" y="76" width="20" height="20" rx="2"/>
    <rect x="380" y="76" width="20" height="20" rx="2"/><rect x="402" y="76" width="20" height="20" rx="2"/>
    <rect x="336" y="98" width="20" height="20" rx="2"/><rect x="358" y="98" width="20" height="20" rx="2"/>
    <rect x="380" y="98" width="20" height="20" rx="2"/><rect x="402" y="98" width="20" height="20" rx="2"/>
    <rect x="336" y="120" width="20" height="20" rx="2"/><rect x="358" y="120" width="20" height="20" rx="2"/>
    <rect x="380" y="120" width="20" height="20" rx="2"/><rect x="402" y="120" width="20" height="20" rx="2"/>
    <rect x="336" y="142" width="20" height="20" rx="2"/><rect x="358" y="142" width="20" height="20" rx="2"/>
    <rect x="380" y="142" width="20" height="20" rx="2"/><rect x="402" y="142" width="20" height="20" rx="2"/>
  </g>
  <text x="376" y="180" font-size="10" fill="#666" text-anchor="middle">4 x 4 (accum)</text>

  <!-- Equals symbol -->
  <text x="448" y="130" class="op" text-anchor="middle">=</text>

  <!-- Matrix D (4x4, FP32, result) -->
  <text x="524" y="68" class="dtype" fill="#004065" text-anchor="middle">D (FP32)</text>
  <g fill="#FFD200" stroke="#004065" stroke-width="1.5">
    <rect x="484" y="76" width="20" height="20" rx="2"/><rect x="506" y="76" width="20" height="20" rx="2"/>
    <rect x="528" y="76" width="20" height="20" rx="2"/><rect x="550" y="76" width="20" height="20" rx="2"/>
    <rect x="484" y="98" width="20" height="20" rx="2"/><rect x="506" y="98" width="20" height="20" rx="2"/>
    <rect x="528" y="98" width="20" height="20" rx="2"/><rect x="550" y="98" width="20" height="20" rx="2"/>
    <rect x="484" y="120" width="20" height="20" rx="2"/><rect x="506" y="120" width="20" height="20" rx="2"/>
    <rect x="528" y="120" width="20" height="20" rx="2"/><rect x="550" y="120" width="20" height="20" rx="2"/>
    <rect x="484" y="142" width="20" height="20" rx="2"/><rect x="506" y="142" width="20" height="20" rx="2"/>
    <rect x="528" y="142" width="20" height="20" rx="2"/><rect x="550" y="142" width="20" height="20" rx="2"/>
  </g>
  <text x="524" y="180" font-size="10" fill="#666" text-anchor="middle">4 x 4 (result)</text>

  <!-- Stats box -->
  <rect x="590" y="80" width="100" height="80" rx="6" fill="#cfe2f3" stroke="#004065" stroke-width="1.5"/>
  <text x="640" y="102" font-size="11" fill="#004065" font-weight="bold" text-anchor="middle">128 FMA</text>
  <text x="640" y="118" font-size="10" fill="#004065" text-anchor="middle">ops per</text>
  <text x="640" y="134" font-size="10" fill="#004065" text-anchor="middle">clock cycle</text>
  <text x="640" y="152" font-size="9" fill="#666" text-anchor="middle">(per core)</text>

  <!-- Bottom annotations -->
  <rect x="40" y="196" width="620" height="44" rx="6" fill="#fff4cc" stroke="#004065" stroke-width="1"/>
  <text x="350" y="212" font-size="11" fill="#004065" font-weight="bold" text-anchor="middle">H100: 4th-gen Tensor Cores -- FP16/BF16/TF32/FP8/INT8 inputs supported</text>
  <text x="350" y="228" font-size="10" fill="#666" text-anchor="middle">Warp-level operation: all 32 threads cooperate to feed one MMA. Up to 989 TFLOPS (FP8) on H100.</text>
</svg>