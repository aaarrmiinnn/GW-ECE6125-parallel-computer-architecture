  <rect x="606" y="100" width="46" height="24" rx="4" fill="#c05000"/><text x="629" y="116" class="warp" text-anchor="middle">W1</text>

  <!-- Row 2: Scheduler 2 -->
  <rect x="106" y="136" width="46" height="24" rx="4" fill="#2e7d32"/><text x="129" y="152" class="warp" text-anchor="middle">W2</text>
  <rect x="156" y="136" width="46" height="24" rx="4" fill="#6a1b9a"/><text x="179" y="152" class="warp" text-anchor="middle">W6</text>
  <rect x="206" y="136" width="46" height="24" rx="4" fill="#2e7d32"/><text x="229" y="152" class="warp" text-anchor="middle">W2</text>
