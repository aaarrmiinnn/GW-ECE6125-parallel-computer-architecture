  <rect x="156" y="64" width="46" height="24" rx="4" fill="#6a1b9a"/><text x="179" y="80" class="warp" text-anchor="middle">W4</text>
  <rect x="206" y="64" width="46" height="24" rx="4" fill="#004065"/><text x="229" y="80" class="warp" text-anchor="middle">W0</text>
  <rect x="256" y="64" width="46" height="24" rx="4" fill="#0277bd"/><text x="279" y="80" class="warp" text-anchor="middle">W8</text>
