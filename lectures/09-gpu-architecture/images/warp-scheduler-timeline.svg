<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #222; }
    .title { font-size: 16px; font-weight: bold; fill: #004065; }
    .label { font-size: 11px; font-weight: bold; fill: #004065; }
    .hdr { font-size: 11px; font-weight: bold; fill: #004065; }
    .warp { font-size: 9px; fill: white; font-weight: bold; }
    .stat { font-size: 11px; fill: #666; font-style: italic; }
  </style>

  <text x="350" y="22" class="title" text-anchor="middle">Warp Scheduler Timeline: 4 Schedulers, Multiple Warps</text>

  <!-- Column headers (cycles) -->
  <text x="130" y="50" class="hdr" text-anchor="middle">Cycle 1</text>
  <text x="180" y="50" class="hdr" text-anchor="middle">Cycle 2</text>
  <text x="230" y="50" class="hdr" text-anchor="middle">Cycle 3</text>
  <text x="280" y="50" class="hdr" text-anchor="middle">Cycle 4</text>
  <text x="330" y="50" class="hdr" text-anchor="middle">Cycle 5</text>
  <text x="380" y="50" class="hdr" text-anchor="middle">Cycle 6</text>
  <text x="430" y="50" class="hdr" text-anchor="middle">Cycle 7</text>
  <text x="480" y="50" class="hdr" text-anchor="middle">Cycle 8</text>
  <text x="530" y="50" class="hdr" text-anchor="middle">Cycle 9</text>
  <text x="580" y="50" class="hdr" text-anchor="middle">Cycle 10</text>
