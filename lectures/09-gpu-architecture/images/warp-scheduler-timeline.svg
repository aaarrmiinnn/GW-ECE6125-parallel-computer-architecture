  <rect x="556" y="172" width="46" height="24" rx="4" fill="#0277bd"/><text x="579" y="188" class="warp" text-anchor="middle">W7</text>
  <rect x="606" y="172" width="46" height="24" rx="4" fill="#6a1b9a"/><text x="629" y="188" class="warp" text-anchor="middle">W3</text>

  <!-- Cycle arrow -->
  <line x1="106" y1="210" x2="650" y2="210" stroke="#004065" stroke-width="1.5" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#004065"/></marker></defs>
  <text x="380" y="224" font-size="11" fill="#004065" text-anchor="middle">Clock Cycles</text>

  <!-- Legend -->
  <text x="350" y="248" class="stat" text-anchor="middle">Each scheduler independently selects a ready warp every cycle (zero-overhead context switch)</text>

  <!-- Warp legend -->
  <rect x="120" y="256" width="16" height="12" rx="2" fill="#004065"/>
  <text x="140" y="266" font-size="9" fill="#666">W0/W8</text>
  <rect x="190" y="256" width="16" height="12" rx="2" fill="#c05000"/>
  <text x="210" y="266" font-size="9" fill="#666">W1</text>
  <rect x="245" y="256" width="16" height="12" rx="2" fill="#2e7d32"/>
  <text x="265" y="266" font-size="9" fill="#666">W2/W5</text>
  <rect x="315" y="256" width="16" height="12" rx="2" fill="#6a1b9a"/>
  <text x="335" y="266" font-size="9" fill="#666">W3/W4/W6</text>
  <rect x="405" y="256" width="16" height="12" rx="2" fill="#0277bd"/>
  <text x="425" y="266" font-size="9" fill="#666">W7/W8</text>
