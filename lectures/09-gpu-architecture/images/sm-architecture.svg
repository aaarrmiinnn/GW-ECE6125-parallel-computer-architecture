<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #222; }
    .title { font-size: 16px; font-weight: bold; fill: #004065; }
    .label { font-size: 11px; font-weight: bold; fill: #004065; }
    .wht { font-size: 10px; fill: white; font-weight: bold; }
    .tiny { font-size: 9px; fill: white; }
    .stat { font-size: 10px; fill: #666; font-style: italic; }
  </style>

  <text x="350" y="20" class="title" text-anchor="middle">Streaming Multiprocessor (SM) Architecture (H100)</text>

  <!-- Register File bar across top -->
  <rect x="20" y="30" width="660" height="26" rx="6" fill="#FFD200" stroke="#004065" stroke-width="2"/>
  <text x="350" y="48" font-size="12" fill="#004065" font-weight="bold" text-anchor="middle">Register File (256 KB) -- 65,536 x 32-bit registers</text>

  <!-- Partition 0 -->
  <rect x="20" y="62" width="155" height="268" rx="6" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="97" y="78" class="label" text-anchor="middle">Partition 0</text>
  <!-- Warp Scheduler -->
  <rect x="28" y="84" width="140" height="22" rx="4" fill="#c05000"/>
  <text x="98" y="99" class="wht" text-anchor="middle">Warp Scheduler</text>
  <rect x="28" y="108" width="140" height="22" rx="4" fill="#c05000" opacity="0.75"/>
  <text x="98" y="123" class="wht" text-anchor="middle">Dispatch Unit</text>
  <!-- FP32 grid -->
  <rect x="28" y="134" width="90" height="72" rx="4" fill="#004065"/>
  <text x="73" y="152" class="wht" text-anchor="middle">32 FP32</text>
  <text x="73" y="164" class="tiny" text-anchor="middle">Cores</text>
  <!-- Draw mini grid 8x4 -->
  <g fill="#cfe2f3" opacity="0.5">
    <rect x="32" y="168" width="9" height="7" rx="1"/><rect x="43" y="168" width="9" height="7" rx="1"/>
    <rect x="54" y="168" width="9" height="7" rx="1"/><rect x="65" y="168" width="9" height="7" rx="1"/>
    <rect x="76" y="168" width="9" height="7" rx="1"/><rect x="87" y="168" width="9" height="7" rx="1"/>
    <rect x="98" y="168" width="9" height="7" rx="1"/><rect x="109" y="168" width="9" height="7" rx="1"/>
    <rect x="32" y="177" width="9" height="7" rx="1"/><rect x="43" y="177" width="9" height="7" rx="1"/>
    <rect x="54" y="177" width="9" height="7" rx="1"/><rect x="65" y="177" width="9" height="7" rx="1"/>
    <rect x="76" y="177" width="9" height="7" rx="1"/><rect x="87" y="177" width="9" height="7" rx="1"/>
    <rect x="98" y="177" width="9" height="7" rx="1"/><rect x="109" y="177" width="9" height="7" rx="1"/>
    <rect x="32" y="186" width="9" height="7" rx="1"/><rect x="43" y="186" width="9" height="7" rx="1"/>
    <rect x="54" y="186" width="9" height="7" rx="1"/><rect x="65" y="186" width="9" height="7" rx="1"/>
    <rect x="76" y="186" width="9" height="7" rx="1"/><rect x="87" y="186" width="9" height="7" rx="1"/>
    <rect x="98" y="186" width="9" height="7" rx="1"/><rect x="109" y="186" width="9" height="7" rx="1"/>
    <rect x="32" y="195" width="9" height="7" rx="1"/><rect x="43" y="195" width="9" height="7" rx="1"/>
    <rect x="54" y="195" width="9" height="7" rx="1"/><rect x="65" y="195" width="9" height="7" rx="1"/>
    <rect x="76" y="195" width="9" height="7" rx="1"/><rect x="87" y="195" width="9" height="7" rx="1"/>
    <rect x="98" y="195" width="9" height="7" rx="1"/><rect x="109" y="195" width="9" height="7" rx="1"/>
  </g>
  <!-- FP64 -->
  <rect x="122" y="134" width="45" height="36" rx="4" fill="#004065" opacity="0.7"/>
  <text x="144" y="152" font-size="8" fill="white" font-weight="bold" text-anchor="middle">16</text>
  <text x="144" y="162" font-size="8" fill="white" text-anchor="middle">FP64</text>
  <!-- Tensor Core -->
  <rect x="122" y="174" width="45" height="32" rx="4" fill="#FFD200" stroke="#004065" stroke-width="1"/>
  <text x="144" y="190" font-size="8" fill="#004065" font-weight="bold" text-anchor="middle">Tensor</text>
  <text x="144" y="200" font-size="8" fill="#004065" text-anchor="middle">Core</text>
  <!-- LD/ST + SFU -->
  <rect x="28" y="210" width="66" height="22" rx="4" fill="#cfe2f3" stroke="#004065" stroke-width="1"/>
  <text x="61" y="225" font-size="9" fill="#004065" font-weight="bold" text-anchor="middle">LD/ST x16</text>
  <rect x="98" y="210" width="66" height="22" rx="4" fill="#cfe2f3" stroke="#004065" stroke-width="1"/>
  <text x="131" y="225" font-size="9" fill="#004065" font-weight="bold" text-anchor="middle">SFU x4</text>
  <!-- L0 I-Cache -->
  <rect x="28" y="238" width="140" height="18" rx="3" fill="#fff4cc" stroke="#004065" stroke-width="1"/>
  <text x="98" y="251" font-size="9" fill="#004065" font-weight="bold" text-anchor="middle">L0 Instruction Cache</text>

  <!-- Partition 1 (abbreviated) -->
  <rect x="185" y="62" width="155" height="268" rx="6" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="262" y="78" class="label" text-anchor="middle">Partition 1</text>
  <rect x="193" y="84" width="140" height="22" rx="4" fill="#c05000"/>
  <text x="263" y="99" class="wht" text-anchor="middle">Warp Scheduler</text>
  <rect x="193" y="108" width="140" height="22" rx="4" fill="#c05000" opacity="0.75"/>
  <text x="263" y="123" class="wht" text-anchor="middle">Dispatch Unit</text>
  <rect x="193" y="134" width="90" height="72" rx="4" fill="#004065"/>
  <text x="238" y="170" class="wht" text-anchor="middle">32 FP32</text>
  <rect x="287" y="134" width="45" height="36" rx="4" fill="#004065" opacity="0.7"/>
  <text x="309" y="156" font-size="8" fill="white" font-weight="bold" text-anchor="middle">16 FP64</text>
  <rect x="287" y="174" width="45" height="32" rx="4" fill="#FFD200" stroke="#004065" stroke-width="1"/>
  <text x="309" y="194" font-size="8" fill="#004065" font-weight="bold" text-anchor="middle">Tensor</text>
  <rect x="193" y="210" width="66" height="22" rx="4" fill="#cfe2f3" stroke="#004065" stroke-width="1"/>
  <text x="226" y="225" font-size="9" fill="#004065" font-weight="bold" text-anchor="middle">LD/ST x16</text>
  <rect x="263" y="210" width="66" height="22" rx="4" fill="#cfe2f3" stroke="#004065" stroke-width="1"/>
  <text x="296" y="225" font-size="9" fill="#004065" font-weight="bold" text-anchor="middle">SFU x4</text>
  <rect x="193" y="238" width="140" height="18" rx="3" fill="#fff4cc" stroke="#004065" stroke-width="1"/>
  <text x="263" y="251" font-size="9" fill="#004065" font-weight="bold" text-anchor="middle">L0 Instruction Cache</text>

  <!-- Partition 2 -->
  <rect x="350" y="62" width="155" height="268" rx="6" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="427" y="78" class="label" text-anchor="middle">Partition 2</text>
  <rect x="358" y="84" width="140" height="22" rx="4" fill="#c05000"/>
  <text x="428" y="99" class="wht" text-anchor="middle">Warp Scheduler</text>
  <rect x="358" y="108" width="140" height="22" rx="4" fill="#c05000" opacity="0.75"/>
  <text x="428" y="123" class="wht" text-anchor="middle">Dispatch Unit</text>
  <rect x="358" y="134" width="90" height="72" rx="4" fill="#004065"/>
  <text x="403" y="170" class="wht" text-anchor="middle">32 FP32</text>
  <rect x="452" y="134" width="45" height="36" rx="4" fill="#004065" opacity="0.7"/>
  <text x="474" y="156" font-size="8" fill="white" font-weight="bold" text-anchor="middle">16 FP64</text>
  <rect x="452" y="174" width="45" height="32" rx="4" fill="#FFD200" stroke="#004065" stroke-width="1"/>
  <text x="474" y="194" font-size="8" fill="#004065" font-weight="bold" text-anchor="middle">Tensor</text>
  <rect x="358" y="210" width="66" height="22" rx="4" fill="#cfe2f3" stroke="#004065" stroke-width="1"/>
  <text x="391" y="225" font-size="9" fill="#004065" font-weight="bold" text-anchor="middle">LD/ST x16</text>
  <rect x="428" y="210" width="66" height="22" rx="4" fill="#cfe2f3" stroke="#004065" stroke-width="1"/>
  <text x="461" y="225" font-size="9" fill="#004065" font-weight="bold" text-anchor="middle">SFU x4</text>
  <rect x="358" y="238" width="140" height="18" rx="3" fill="#fff4cc" stroke="#004065" stroke-width="1"/>
  <text x="428" y="251" font-size="9" fill="#004065" font-weight="bold" text-anchor="middle">L0 Instruction Cache</text>

  <!-- Partition 3 -->
  <rect x="515" y="62" width="155" height="268" rx="6" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="592" y="78" class="label" text-anchor="middle">Partition 3</text>
  <rect x="523" y="84" width="140" height="22" rx="4" fill="#c05000"/>
  <text x="593" y="99" class="wht" text-anchor="middle">Warp Scheduler</text>
  <rect x="523" y="108" width="140" height="22" rx="4" fill="#c05000" opacity="0.75"/>
  <text x="593" y="123" class="wht" text-anchor="middle">Dispatch Unit</text>
  <rect x="523" y="134" width="90" height="72" rx="4" fill="#004065"/>
  <text x="568" y="170" class="wht" text-anchor="middle">32 FP32</text>
  <rect x="617" y="134" width="45" height="36" rx="4" fill="#004065" opacity="0.7"/>
  <text x="639" y="156" font-size="8" fill="white" font-weight="bold" text-anchor="middle">16 FP64</text>
  <rect x="617" y="174" width="45" height="32" rx="4" fill="#FFD200" stroke="#004065" stroke-width="1"/>
  <text x="639" y="194" font-size="8" fill="#004065" font-weight="bold" text-anchor="middle">Tensor</text>
  <rect x="523" y="210" width="66" height="22" rx="4" fill="#cfe2f3" stroke="#004065" stroke-width="1"/>
  <text x="556" y="225" font-size="9" fill="#004065" font-weight="bold" text-anchor="middle">LD/ST x16</text>
  <rect x="593" y="210" width="66" height="22" rx="4" fill="#cfe2f3" stroke="#004065" stroke-width="1"/>
  <text x="626" y="225" font-size="9" fill="#004065" font-weight="bold" text-anchor="middle">SFU x4</text>
  <rect x="523" y="238" width="140" height="18" rx="3" fill="#fff4cc" stroke="#004065" stroke-width="1"/>
  <text x="593" y="251" font-size="9" fill="#004065" font-weight="bold" text-anchor="middle">L0 Instruction Cache</text>

  <!-- Shared Memory / L1 bar at bottom -->
  <rect x="20" y="340" width="660" height="28" rx="6" fill="#FFD200" stroke="#004065" stroke-width="2"/>
  <text x="350" y="359" font-size="12" fill="#004065" font-weight="bold" text-anchor="middle">Shared Memory / L1 Data Cache (228 KB configurable)</text>

  <!-- L1 Instruction Cache between partitions and shared mem -->
  <rect x="20" y="268" width="660" height="22" rx="4" fill="#fff4cc" stroke="#004065" stroke-width="1.5"/>
  <text x="350" y="283" font-size="11" fill="#004065" font-weight="bold" text-anchor="middle">L1 Instruction Cache</text>

  <!-- Tex / Constant Cache -->
  <rect x="20" y="296" width="660" height="22" rx="4" fill="#cfe2f3" stroke="#004065" stroke-width="1.5"/>
  <text x="350" y="311" font-size="11" fill="#004065" font-weight="bold" text-anchor="middle">Texture Cache / Constant Cache</text>

  <!-- Legend -->
  <rect x="20" y="376" width="14" height="10" rx="2" fill="#004065"/>
  <text x="38" y="385" font-size="9" fill="#666">Compute</text>
  <rect x="90" y="376" width="14" height="10" rx="2" fill="#FFD200" stroke="#004065" stroke-width="0.5"/>
  <text x="108" y="385" font-size="9" fill="#666">Memory</text>
  <rect x="160" y="376" width="14" height="10" rx="2" fill="#c05000"/>
  <text x="178" y="385" font-size="9" fill="#666">Scheduler</text>
  <text x="350" y="396" class="stat" text-anchor="middle">Each SM: 128 FP32 + 64 FP64 + 4 Tensor Cores + 64 LD/ST + 16 SFU</text>
</svg>