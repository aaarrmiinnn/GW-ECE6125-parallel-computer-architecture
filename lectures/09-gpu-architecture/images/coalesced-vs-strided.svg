<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280">
  <defs>
    <marker id="arrg" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#c05000"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #222; }
    .title { font-size: 16px; font-weight: bold; fill: #004065; }
    .label { font-size: 12px; font-weight: bold; fill: #004065; }
    .stat { font-size: 10px; fill: #666; font-style: italic; }
  </style>

  <text x="350" y="20" class="title" text-anchor="middle">Memory Coalescing: Coalesced vs Strided Access</text>

  <!-- === Coalesced Section === -->
  <text x="20" y="46" class="label">Coalesced Access (stride-1) -- all threads access consecutive addresses</text>

  <!-- 16 thread squares (representing warp, abbreviated) -->
  <g>
    <rect x="60" y="54" width="16" height="16" rx="2" fill="#004065"/><text x="68" y="66" font-size="7" fill="white" text-anchor="middle">T0</text>
    <rect x="78" y="54" width="16" height="16" rx="2" fill="#004065"/><text x="86" y="66" font-size="7" fill="white" text-anchor="middle">T1</text>
    <rect x="96" y="54" width="16" height="16" rx="2" fill="#004065"/><text x="104" y="66" font-size="7" fill="white" text-anchor="middle">T2</text>
    <rect x="114" y="54" width="16" height="16" rx="2" fill="#004065"/><text x="122" y="66" font-size="7" fill="white" text-anchor="middle">T3</text>
    <rect x="132" y="54" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="150" y="54" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="168" y="54" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="186" y="54" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="204" y="54" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="222" y="54" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="240" y="54" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="258" y="54" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="276" y="54" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="294" y="54" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="312" y="54" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="330" y="54" width="16" height="16" rx="2" fill="#004065"/><text x="338" y="66" font-size="7" fill="white" text-anchor="middle">T31</text>
  </g>
  <text x="38" y="66" font-size="9" fill="#004065" font-weight="bold">Threads:</text>

  <!-- Arrows down to memory block -->
  <g stroke="#2e7d32" stroke-width="1" fill="none">
    <line x1="68" y1="72" x2="68" y2="94" marker-end="url(#arrg)"/>
    <line x1="86" y1="72" x2="86" y2="94" marker-end="url(#arrg)"/>
    <line x1="104" y1="72" x2="104" y2="94" marker-end="url(#arrg)"/>
    <line x1="122" y1="72" x2="122" y2="94" marker-end="url(#arrg)"/>
    <line x1="140" y1="72" x2="140" y2="94" marker-end="url(#arrg)"/>
    <line x1="158" y1="72" x2="158" y2="94" marker-end="url(#arrg)"/>
    <line x1="176" y1="72" x2="176" y2="94" marker-end="url(#arrg)"/>
    <line x1="194" y1="72" x2="194" y2="94" marker-end="url(#arrg)"/>
    <line x1="212" y1="72" x2="212" y2="94" marker-end="url(#arrg)"/>
    <line x1="230" y1="72" x2="230" y2="94" marker-end="url(#arrg)"/>
    <line x1="248" y1="72" x2="248" y2="94" marker-end="url(#arrg)"/>
    <line x1="266" y1="72" x2="266" y2="94" marker-end="url(#arrg)"/>
    <line x1="284" y1="72" x2="284" y2="94" marker-end="url(#arrg)"/>
    <line x1="302" y1="72" x2="302" y2="94" marker-end="url(#arrg)"/>
    <line x1="320" y1="72" x2="320" y2="94" marker-end="url(#arrg)"/>
    <line x1="338" y1="72" x2="338" y2="94" marker-end="url(#arrg)"/>
  </g>

  <!-- Contiguous memory block -->
  <rect x="56" y="98" width="296" height="22" rx="4" fill="#2e7d32" opacity="0.2" stroke="#2e7d32" stroke-width="2"/>
  <text x="204" y="113" font-size="10" fill="#2e7d32" font-weight="bold" text-anchor="middle">128 bytes (contiguous)</text>
  <text x="204" y="132" font-size="11" fill="#2e7d32" font-weight="bold" text-anchor="middle">Global Memory</text>

  <rect x="420" y="70" width="260" height="46" rx="6" fill="#cfe2f3" stroke="#004065" stroke-width="1.5"/>
  <text x="550" y="88" font-size="11" fill="#004065" font-weight="bold" text-anchor="middle">1 memory transaction (128 B)</text>
  <text x="550" y="104" font-size="10" fill="#2e7d32" font-weight="bold" text-anchor="middle">Maximum bandwidth utilization</text>

  <!-- Divider -->
  <line x1="20" y1="145" x2="680" y2="145" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- === Strided Section === -->
  <text x="20" y="166" class="label">Strided Access (stride-32) -- threads access scattered addresses</text>

  <!-- Thread squares -->
  <g>
    <rect x="60" y="174" width="16" height="16" rx="2" fill="#004065"/><text x="68" y="186" font-size="7" fill="white" text-anchor="middle">T0</text>
    <rect x="78" y="174" width="16" height="16" rx="2" fill="#004065"/><text x="86" y="186" font-size="7" fill="white" text-anchor="middle">T1</text>
    <rect x="96" y="174" width="16" height="16" rx="2" fill="#004065"/><text x="104" y="186" font-size="7" fill="white" text-anchor="middle">T2</text>
    <rect x="114" y="174" width="16" height="16" rx="2" fill="#004065"/><text x="122" y="186" font-size="7" fill="white" text-anchor="middle">T3</text>
    <rect x="132" y="174" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="150" y="174" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="168" y="174" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="186" y="174" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="204" y="174" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="222" y="174" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="240" y="174" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="258" y="174" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="276" y="174" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="294" y="174" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="312" y="174" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="330" y="174" width="16" height="16" rx="2" fill="#004065"/><text x="338" y="186" font-size="7" fill="white" text-anchor="middle">T31</text>
  </g>
  <text x="38" y="186" font-size="9" fill="#004065" font-weight="bold">Threads:</text>

  <!-- Scattered arrows to different memory locations -->
  <g stroke="#c05000" stroke-width="1" fill="none">
    <line x1="68" y1="192" x2="42" y2="218" marker-end="url(#arrr)"/>
    <line x1="86" y1="192" x2="120" y2="218" marker-end="url(#arrr)"/>
    <line x1="104" y1="192" x2="198" y2="218" marker-end="url(#arrr)"/>
    <line x1="122" y1="192" x2="276" y2="218" marker-end="url(#arrr)"/>
    <line x1="176" y1="192" x2="354" y2="218" marker-end="url(#arrr)"/>
    <line x1="248" y1="192" x2="432" y2="218" marker-end="url(#arrr)"/>
    <line x1="320" y1="192" x2="510" y2="218" marker-end="url(#arrr)"/>
    <line x1="338" y1="192" x2="588" y2="218" marker-end="url(#arrr)"/>
  </g>

  <!-- Scattered memory blocks -->
  <rect x="30" y="222" width="40" height="18" rx="3" fill="#c05000" opacity="0.25" stroke="#c05000" stroke-width="1.5"/>
  <rect x="108" y="222" width="40" height="18" rx="3" fill="#c05000" opacity="0.25" stroke="#c05000" stroke-width="1.5"/>
  <rect x="186" y="222" width="40" height="18" rx="3" fill="#c05000" opacity="0.25" stroke="#c05000" stroke-width="1.5"/>
  <rect x="264" y="222" width="40" height="18" rx="3" fill="#c05000" opacity="0.25" stroke="#c05000" stroke-width="1.5"/>
  <rect x="342" y="222" width="40" height="18" rx="3" fill="#c05000" opacity="0.25" stroke="#c05000" stroke-width="1.5"/>
  <rect x="420" y="222" width="40" height="18" rx="3" fill="#c05000" opacity="0.25" stroke="#c05000" stroke-width="1.5"/>
  <rect x="498" y="222" width="40" height="18" rx="3" fill="#c05000" opacity="0.25" stroke="#c05000" stroke-width="1.5"/>
  <rect x="576" y="222" width="40" height="18" rx="3" fill="#c05000" opacity="0.25" stroke="#c05000" stroke-width="1.5"/>
  <text x="320" y="254" font-size="10" fill="#c05000" font-weight="bold" text-anchor="middle">Global Memory (scattered across cache lines)</text>

  <rect x="420" y="190" width="260" height="46" rx="6" fill="#fff4cc" stroke="#c05000" stroke-width="1.5"/>
  <text x="550" y="208" font-size="11" fill="#c05000" font-weight="bold" text-anchor="middle">Up to 32 transactions!</text>
  <text x="550" y="224" font-size="10" fill="#c05000" text-anchor="middle">32x bandwidth waste</text>

  <text x="350" y="276" class="stat" text-anchor="middle">Always use stride-1 access patterns: thread i accesses element i for coalesced loads.</text>
</svg>