<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#004065"/>
    </marker>
    <marker id="arr-gold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c8a000"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#004065">MESI Protocol — The Exclusive State Optimization</text>

  <!-- ── Four state circles in diamond layout ── -->
  <!-- M — top center, gold -->
  <circle cx="450" cy="130" r="58" fill="#FFD200" stroke="#004065" stroke-width="3"/>
  <text x="450" y="123" text-anchor="middle" font-size="26" font-weight="bold" fill="#004065">M</text>
  <text x="450" y="146" text-anchor="middle" font-size="12" fill="#004065">Modified</text>

  <!-- E — right, green -->
  <circle cx="730" cy="280" r="58" fill="#2e7d32" stroke="#1b5e20" stroke-width="3"/>
  <text x="730" y="273" text-anchor="middle" font-size="26" font-weight="bold" fill="white">E</text>
  <text x="730" y="296" text-anchor="middle" font-size="12" fill="#ccffcc">Exclusive</text>

  <!-- S — bottom center, blue -->
  <circle cx="450" cy="420" r="58" fill="#004065" stroke="#002a42" stroke-width="3"/>
  <text x="450" y="413" text-anchor="middle" font-size="26" font-weight="bold" fill="white">S</text>
  <text x="450" y="436" text-anchor="middle" font-size="12" fill="white">Shared</text>

  <!-- I — left, light gray -->
  <circle cx="170" cy="280" r="58" fill="#d0d8e0" stroke="#004065" stroke-width="3"/>
  <text x="170" y="273" text-anchor="middle" font-size="26" font-weight="bold" fill="#004065">I</text>
  <text x="170" y="296" text-anchor="middle" font-size="12" fill="#555">Invalid</text>

  <!-- ═══ Transitions ═══ -->

  <!-- I → E (left → right, top arc): CPU Read, only copy -->
  <path d="M 222 248 Q 450 130 676 254" stroke="#004065" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="340" y="132" width="172" height="32" rx="5" fill="white" stroke="#004065" stroke-width="1"/>
  <text x="426" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">I → E</text>
  <text x="426" y="158" text-anchor="middle" font-size="10" fill="#555">CPU Read / only copy in system</text>

  <!-- I → S (left → bottom): CPU Read, others have copy -->
  <path d="M 194 334 Q 300 430 392 430" stroke="#004065" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="200" y="388" width="150" height="30" rx="5" fill="white" stroke="#004065" stroke-width="1"/>
  <text x="275" y="401" text-anchor="middle" font-size="11" font-weight="bold" fill="#004065">I → S</text>
  <text x="275" y="414" text-anchor="middle" font-size="10" fill="#555">CPU Read / BusRd (shared)</text>

  <!-- I → M (left → top, bottom-left arc): CPU Write -->
  <path d="M 172 222 Q 220 80 394 117" stroke="#004065" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="60" y="98" width="148" height="30" rx="5" fill="white" stroke="#004065" stroke-width="1"/>
  <text x="134" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#004065">I → M</text>
  <text x="134" y="124" text-anchor="middle" font-size="10" fill="#555">CPU Write / BusRdX</text>

  <!-- E → M  (right → top): CPU Write — GOLD thick, silent -->
  <path d="M 696 236 Q 620 140 506 136" stroke="#c8a000" stroke-width="3.5" fill="none" marker-end="url(#arr-gold)"/>
  <rect x="596" y="138" width="164" height="32" rx="5" fill="#FFF8D0" stroke="#c8a000" stroke-width="2"/>
  <text x="678" y="151" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b6a00">E → M  (SILENT)</text>
  <text x="678" y="164" text-anchor="middle" font-size="10" fill="#555">CPU Write — no bus transaction!</text>

  <!-- E → S (right → bottom): Snoop BusRd -->
  <path d="M 704 330 Q 630 440 508 432" stroke="#004065" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="618" y="388" width="150" height="30" rx="5" fill="white" stroke="#004065" stroke-width="1"/>
  <text x="693" y="401" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc2200">E → S</text>
  <text x="693" y="414" text-anchor="middle" font-size="10" fill="#555">Snoop BusRd (share)</text>

  <!-- E → I (right self-or back arc): Snoop BusRdX -->
  <path d="M 778 252 Q 860 200 782 314" stroke="#004065" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="800" y="250" width="88" height="42" rx="5" fill="white" stroke="#004065" stroke-width="1"/>
  <text x="844" y="264" text-anchor="middle" font-size="10" font-weight="bold" fill="#cc2200">E → I</text>
  <text x="844" y="278" text-anchor="middle" font-size="10" fill="#555">Snoop</text>
  <text x="844" y="290" text-anchor="middle" font-size="10" fill="#555">BusRdX</text>

  <!-- S → M (bottom → top, left): CPU Write / BusUpgr -->
  <path d="M 420 364 Q 340 250 400 186" stroke="#004065" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="262" y="252" width="148" height="30" rx="5" fill="white" stroke="#004065" stroke-width="1"/>
  <text x="336" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#004065">S → M</text>
  <text x="336" y="278" text-anchor="middle" font-size="10" fill="#555">CPU Write / BusUpgr</text>

  <!-- S → I (bottom left): Snoop BusRdX -->
  <path d="M 394 434 Q 260 460 222 330" stroke="#004065" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="184" y="444" width="148" height="30" rx="5" fill="white" stroke="#004065" stroke-width="1"/>
  <text x="258" y="457" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc2200">S → I</text>
  <text x="258" y="470" text-anchor="middle" font-size="10" fill="#555">Snoop BusRdX/Upgr</text>

  <!-- M → S (top → bottom, right): Snoop BusRd -->
  <path d="M 492 184 Q 550 300 500 364" stroke="#004065" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="530" y="252" width="148" height="30" rx="5" fill="white" stroke="#004065" stroke-width="1"/>
  <text x="604" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc2200">M → S</text>
  <text x="604" y="278" text-anchor="middle" font-size="10" fill="#555">Snoop BusRd / supply</text>

  <!-- M → I (top left arc): Snoop BusRdX -->
  <path d="M 400 172 Q 280 210 220 246" stroke="#004065" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="256" y="178" width="148" height="30" rx="5" fill="white" stroke="#004065" stroke-width="1"/>
  <text x="330" y="191" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc2200">M → I</text>
  <text x="330" y="204" text-anchor="middle" font-size="10" fill="#555">Snoop BusRdX / supply</text>

  <!-- E state callout box -->
  <rect x="690" y="40" width="196" height="58" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="788" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">E = Exclusive</text>
  <text x="788" y="74" text-anchor="middle" font-size="10" fill="#2e7d32">Only copy in system, clean</text>
  <text x="788" y="87" text-anchor="middle" font-size="10" fill="#2e7d32">→ write silently (no bus msg)</text>
</svg>
