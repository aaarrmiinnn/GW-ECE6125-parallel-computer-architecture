<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <rect width="900" height="500" fill="#f8f9fa"/>

  <defs>
    <marker id="bArr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#004065">8-Node Butterfly Network</text>

  <!-- Stage labels -->
  <text x="270" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#004065">Stage 1</text>
  <text x="440" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#004065">Stage 2</text>
  <text x="610" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#004065">Stage 3</text>
  <text x="88" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Inputs</text>
  <text x="800" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Outputs</text>

  <!-- Y positions: 0=95, 1=140, 2=185, 3=230, 4=275, 5=320, 6=365, 7=410 -->

  <!-- Input nodes -->
  <circle cx="88" cy="95" r="16" fill="#004065"/>
  <text x="88" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">000</text>
  <circle cx="88" cy="140" r="16" fill="#004065"/>
  <text x="88" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">001</text>
  <circle cx="88" cy="185" r="16" fill="#004065"/>
  <text x="88" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">010</text>
  <circle cx="88" cy="230" r="16" fill="#004065"/>
  <text x="88" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">011</text>
  <circle cx="88" cy="275" r="16" fill="#004065"/>
  <text x="88" y="279" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">100</text>
  <circle cx="88" cy="320" r="16" fill="#004065"/>
  <text x="88" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">101</text>
  <circle cx="88" cy="365" r="16" fill="#004065"/>
  <text x="88" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">110</text>
  <circle cx="88" cy="410" r="16" fill="#004065"/>
  <text x="88" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">111</text>

  <!-- Output nodes -->
  <circle cx="800" cy="95" r="16" fill="#004065"/>
  <text x="800" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">000</text>
  <circle cx="800" cy="140" r="16" fill="#004065"/>
  <text x="800" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">001</text>
  <circle cx="800" cy="185" r="16" fill="#004065"/>
  <text x="800" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">010</text>
  <circle cx="800" cy="230" r="16" fill="#004065"/>
  <text x="800" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">011</text>
  <circle cx="800" cy="275" r="16" fill="#004065"/>
  <text x="800" y="279" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">100</text>
  <circle cx="800" cy="320" r="16" fill="#004065"/>
  <text x="800" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">101</text>
  <circle cx="800" cy="365" r="16" fill="#004065"/>
  <text x="800" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">110</text>
  <circle cx="800" cy="410" r="16" fill="#004065"/>
  <text x="800" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">111</text>

  <!-- Stage 1 switches: pairs differ in MSB (bit 2) -->
  <!-- SW pairs: (0,4),(1,5),(2,6),(3,7) -->
  <!-- SW0: inputs 0(y=95) and 4(y=275) -->
  <rect x="245" y="82" width="50" height="207" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="270" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW0</text>
  <text x="270" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">(0,4)</text>
  <!-- connection dots -->
  <circle cx="245" cy="95" r="3" fill="#004065"/>
  <circle cx="295" cy="95" r="3" fill="#004065"/>
  <circle cx="245" cy="275" r="3" fill="#004065"/>
  <circle cx="295" cy="275" r="3" fill="#004065"/>

  <!-- SW1: inputs 1(y=140) and 5(y=320) -->
  <rect x="245" y="127" width="50" height="207" rx="4" fill="white" stroke="#004065" stroke-width="2" opacity="0.5"/>
  <!-- Just draw as connection points for clarity -->

  <!-- Actually let's draw the switches more cleanly as small boxes at each pair -->
  <!-- Stage 1: Butterfly wiring - pairs (0,4),(1,5),(2,6),(3,7) -->
  <!-- Draw all wires first, then switches on top -->

  <!-- ===== BUTTERFLY WIRES ===== -->
  <!-- Input → Stage 1 -->
  <line x1="104" y1="95" x2="245" y2="95" stroke="#aaa" stroke-width="1.5"/>
  <line x1="104" y1="140" x2="245" y2="140" stroke="#aaa" stroke-width="1.5"/>
  <line x1="104" y1="185" x2="245" y2="185" stroke="#aaa" stroke-width="1.5"/>
  <line x1="104" y1="230" x2="245" y2="230" stroke="#aaa" stroke-width="1.5"/>
  <line x1="104" y1="275" x2="245" y2="275" stroke="#aaa" stroke-width="1.5"/>
  <line x1="104" y1="320" x2="245" y2="320" stroke="#aaa" stroke-width="1.5"/>
  <line x1="104" y1="365" x2="245" y2="365" stroke="#aaa" stroke-width="1.5"/>
  <line x1="104" y1="410" x2="245" y2="410" stroke="#aaa" stroke-width="1.5"/>

  <!-- Stage 1 switches (redrawn clean) -->
  <!-- Each switch connects 2 inputs differing in MSB -->
  <!-- S1 SW(0,4): y=95 and y=275 -->
  <rect x="245" y="89" width="40" height="16" rx="3" fill="#004065"/>
  <text x="265" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S1-a</text>
  <rect x="245" y="269" width="40" height="16" rx="3" fill="#004065"/>
  <text x="265" y="281" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S1-a</text>

  <!-- S1 SW(1,5): y=140 and y=320 -->
  <rect x="245" y="134" width="40" height="16" rx="3" fill="#004065"/>
  <text x="265" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S1-b</text>
  <rect x="245" y="314" width="40" height="16" rx="3" fill="#004065"/>
  <text x="265" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S1-b</text>

  <!-- S1 SW(2,6): y=185 and y=365 -->
  <rect x="245" y="179" width="40" height="16" rx="3" fill="#004065"/>
  <text x="265" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S1-c</text>
  <rect x="245" y="359" width="40" height="16" rx="3" fill="#004065"/>
  <text x="265" y="371" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S1-c</text>

  <!-- S1 SW(3,7): y=230 and y=410 -->
  <rect x="245" y="224" width="40" height="16" rx="3" fill="#004065"/>
  <text x="265" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S1-d</text>
  <rect x="245" y="404" width="40" height="16" rx="3" fill="#004065"/>
  <text x="265" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S1-d</text>

  <!-- Stage 1 → Stage 2 wires: pairs differ in bit 1 (0,2),(1,3),(4,6),(5,7) -->
  <!-- Straight connections and cross connections -->
  <!-- Pair (0,2): y=95 straight, cross 95↔185 -->
  <line x1="285" y1="95" x2="415" y2="95" stroke="#aaa" stroke-width="1.5"/>
  <line x1="285" y1="185" x2="415" y2="185" stroke="#aaa" stroke-width="1.5"/>
  <line x1="285" y1="95" x2="415" y2="185" stroke="#888" stroke-width="1.5"/>
  <line x1="285" y1="185" x2="415" y2="95" stroke="#888" stroke-width="1.5"/>

  <!-- Pair (1,3): y=140 and y=230 -->
  <line x1="285" y1="140" x2="415" y2="140" stroke="#aaa" stroke-width="1.5"/>
  <line x1="285" y1="230" x2="415" y2="230" stroke="#aaa" stroke-width="1.5"/>
  <line x1="285" y1="140" x2="415" y2="230" stroke="#888" stroke-width="1.5"/>
  <line x1="285" y1="230" x2="415" y2="140" stroke="#888" stroke-width="1.5"/>

  <!-- Pair (4,6): y=275 and y=365 -->
  <line x1="285" y1="275" x2="415" y2="275" stroke="#aaa" stroke-width="1.5"/>
  <line x1="285" y1="365" x2="415" y2="365" stroke="#aaa" stroke-width="1.5"/>
  <line x1="285" y1="275" x2="415" y2="365" stroke="#888" stroke-width="1.5"/>
  <line x1="285" y1="365" x2="415" y2="275" stroke="#888" stroke-width="1.5"/>

  <!-- Pair (5,7): y=320 and y=410 -->
  <line x1="285" y1="320" x2="415" y2="320" stroke="#aaa" stroke-width="1.5"/>
  <line x1="285" y1="410" x2="415" y2="410" stroke="#aaa" stroke-width="1.5"/>
  <line x1="285" y1="320" x2="415" y2="410" stroke="#888" stroke-width="1.5"/>
  <line x1="285" y1="410" x2="415" y2="320" stroke="#888" stroke-width="1.5"/>

  <!-- Stage 2 switches -->
  <rect x="415" y="89" width="40" height="16" rx="3" fill="#004065"/>
  <text x="435" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S2-a</text>
  <rect x="415" y="179" width="40" height="16" rx="3" fill="#004065"/>
  <text x="435" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S2-c</text>
  <rect x="415" y="134" width="40" height="16" rx="3" fill="#004065"/>
  <text x="435" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S2-b</text>
  <rect x="415" y="224" width="40" height="16" rx="3" fill="#004065"/>
  <text x="435" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S2-d</text>
  <rect x="415" y="269" width="40" height="16" rx="3" fill="#004065"/>
  <text x="435" y="281" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S2-e</text>
  <rect x="415" y="314" width="40" height="16" rx="3" fill="#004065"/>
  <text x="435" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S2-f</text>
  <rect x="415" y="359" width="40" height="16" rx="3" fill="#004065"/>
  <text x="435" y="371" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S2-g</text>
  <rect x="415" y="404" width="40" height="16" rx="3" fill="#004065"/>
  <text x="435" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S2-h</text>

  <!-- Stage 2 → Stage 3 wires: pairs differ in bit 0, adjacent pairs (0,1),(2,3),(4,5),(6,7) -->
  <!-- Pair (0,1): y=95 and y=140 -->
  <line x1="455" y1="95" x2="585" y2="95" stroke="#aaa" stroke-width="1.5"/>
  <line x1="455" y1="140" x2="585" y2="140" stroke="#aaa" stroke-width="1.5"/>
  <line x1="455" y1="95" x2="585" y2="140" stroke="#888" stroke-width="1.5"/>
  <line x1="455" y1="140" x2="585" y2="95" stroke="#888" stroke-width="1.5"/>

  <!-- Pair (2,3): y=185 and y=230 -->
  <line x1="455" y1="185" x2="585" y2="185" stroke="#aaa" stroke-width="1.5"/>
  <line x1="455" y1="230" x2="585" y2="230" stroke="#aaa" stroke-width="1.5"/>
  <line x1="455" y1="185" x2="585" y2="230" stroke="#888" stroke-width="1.5"/>
  <line x1="455" y1="230" x2="585" y2="185" stroke="#888" stroke-width="1.5"/>

  <!-- Pair (4,5): y=275 and y=320 -->
  <line x1="455" y1="275" x2="585" y2="275" stroke="#aaa" stroke-width="1.5"/>
  <line x1="455" y1="320" x2="585" y2="320" stroke="#aaa" stroke-width="1.5"/>
  <line x1="455" y1="275" x2="585" y2="320" stroke="#888" stroke-width="1.5"/>
  <line x1="455" y1="320" x2="585" y2="275" stroke="#888" stroke-width="1.5"/>

  <!-- Pair (6,7): y=365 and y=410 -->
  <line x1="455" y1="365" x2="585" y2="365" stroke="#aaa" stroke-width="1.5"/>
  <line x1="455" y1="410" x2="585" y2="410" stroke="#aaa" stroke-width="1.5"/>
  <line x1="455" y1="365" x2="585" y2="410" stroke="#888" stroke-width="1.5"/>
  <line x1="455" y1="410" x2="585" y2="365" stroke="#888" stroke-width="1.5"/>

  <!-- Stage 3 switches -->
  <rect x="585" y="89" width="40" height="16" rx="3" fill="#004065"/>
  <text x="605" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S3-a</text>
  <rect x="585" y="134" width="40" height="16" rx="3" fill="#004065"/>
  <text x="605" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S3-b</text>
  <rect x="585" y="179" width="40" height="16" rx="3" fill="#004065"/>
  <text x="605" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S3-c</text>
  <rect x="585" y="224" width="40" height="16" rx="3" fill="#004065"/>
  <text x="605" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S3-d</text>
  <rect x="585" y="269" width="40" height="16" rx="3" fill="#004065"/>
  <text x="605" y="281" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S3-e</text>
  <rect x="585" y="314" width="40" height="16" rx="3" fill="#004065"/>
  <text x="605" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S3-f</text>
  <rect x="585" y="359" width="40" height="16" rx="3" fill="#004065"/>
  <text x="605" y="371" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S3-g</text>
  <rect x="585" y="404" width="40" height="16" rx="3" fill="#004065"/>
  <text x="605" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S3-h</text>

  <!-- Stage 3 → Outputs -->
  <line x1="625" y1="95" x2="784" y2="95" stroke="#aaa" stroke-width="1.5"/>
  <line x1="625" y1="140" x2="784" y2="140" stroke="#aaa" stroke-width="1.5"/>
  <line x1="625" y1="185" x2="784" y2="185" stroke="#aaa" stroke-width="1.5"/>
  <line x1="625" y1="230" x2="784" y2="230" stroke="#aaa" stroke-width="1.5"/>
  <line x1="625" y1="275" x2="784" y2="275" stroke="#aaa" stroke-width="1.5"/>
  <line x1="625" y1="320" x2="784" y2="320" stroke="#aaa" stroke-width="1.5"/>
  <line x1="625" y1="365" x2="784" y2="365" stroke="#aaa" stroke-width="1.5"/>
  <line x1="625" y1="410" x2="784" y2="410" stroke="#aaa" stroke-width="1.5"/>

  <!-- Tree saturation warning: top switches handle ALL traffic -->
  <!-- Arrow pointing to S1-a switch -->
  <rect x="30" y="78" width="195" height="32" rx="4" fill="#FFF3CD" stroke="#FF8800" stroke-width="1.5"/>
  <text x="127" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#CC4400" font-weight="bold">Warning: Tree Saturation</text>
  <text x="127" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#CC4400">Top switches carry ALL traffic</text>
  <line x1="225" y1="94" x2="244" y2="97" stroke="#FF8800" stroke-width="1.5" marker-end="url(#bArr)"/>

  <!-- Annotations -->
  <text x="450" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#004065" font-weight="bold">Same O(N log N) cost as Omega</text>
  <text x="450" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1A8C1A">Rearrangeably non-blocking (with re-routing)</text>
</svg>
