<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <rect width="900" height="400" fill="#f8f9fa"/>

  <defs>
    <marker id="pdArr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#555"/>
    </marker>
    <marker id="pdArrB" markerWidth="7" markerHeight="7" refX="1.5" refY="3.5" orient="auto">
      <path d="M7,0 L7,7 L0,3.5 z" fill="#555"/>
    </marker>
    <marker id="pdP1" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#CC2222"/>
    </marker>
    <marker id="pdP2" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#1A8C1A"/>
    </marker>
    <marker id="pdGold" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#CC8800"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#004065">Path Diversity in Ring Topologies</text>

  <!-- Panel divider -->
  <line x1="450" y1="45" x2="450" y2="375" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ===== LEFT: SIMPLE RING ===== -->
  <text x="225" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#004065">Single Ring (No Hierarchy)</text>

  <!-- 8-node ring, center=(225, 215), r=120 -->
  <!-- Positions: 8 nodes at 45° intervals, starting from top -->
  <!-- 0:(225,95), 1:(310,130), 2:(345,215), 3:(310,300), 4:(225,335), 5:(140,300), 6:(105,215), 7:(140,130) -->
  <line x1="225" y1="108" x2="303" y2="139" stroke="#555" stroke-width="1.5" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <line x1="318" y1="148" x2="344" y2="207" stroke="#555" stroke-width="1.5" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <line x1="344" y1="225" x2="318" y2="285" stroke="#555" stroke-width="1.5" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <line x1="305" y1="296" x2="235" y2="326" stroke="#555" stroke-width="1.5" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <line x1="213" y1="333" x2="145" y2="303" stroke="#555" stroke-width="1.5" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <line x1="130" y1="292" x2="106" y2="232" stroke="#555" stroke-width="1.5" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <line x1="106" y1="215" x2="130" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <line x1="145" y1="140" x2="213" y2="108" stroke="#555" stroke-width="1.5" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>

  <!-- Highlight path (clockwise) from node 0 to node 5 in red -->
  <!-- CW path: 0→1→2→3→4→5 -->
  <line x1="225" y1="108" x2="303" y2="139" stroke="#CC2222" stroke-width="3" marker-end="url(#pdP1)"/>
  <line x1="318" y1="148" x2="344" y2="207" stroke="#CC2222" stroke-width="3" marker-end="url(#pdP1)"/>
  <line x1="344" y1="225" x2="318" y2="285" stroke="#CC2222" stroke-width="3" marker-end="url(#pdP1)"/>
  <line x1="305" y1="296" x2="235" y2="326" stroke="#CC2222" stroke-width="3" marker-end="url(#pdP1)"/>
  <line x1="213" y1="333" x2="145" y2="303" stroke="#CC2222" stroke-width="3" marker-end="url(#pdP1)"/>

  <!-- Nodes -->
  <circle cx="225" cy="95" r="18" fill="#FF6B00" stroke="#CC4400" stroke-width="2"/>
  <text x="225" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">S</text>
  <circle cx="320" cy="130" r="16" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="320" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">1</text>
  <circle cx="345" cy="215" r="16" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="345" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">2</text>
  <circle cx="320" cy="295" r="16" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="320" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">3</text>
  <circle cx="225" cy="335" r="16" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="225" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">4</text>
  <circle cx="130" cy="295" r="18" fill="#1A8C1A" stroke="#115511" stroke-width="2"/>
  <text x="130" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">D</text>
  <circle cx="105" cy="215" r="16" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="105" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">6</text>
  <circle cx="130" cy="130" r="16" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="130" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">7</text>

  <text x="225" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#CC2222" font-weight="bold">1 path option (or reverse = same links)</text>

  <!-- ===== RIGHT: HIERARCHICAL RING ===== -->
  <text x="675" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#004065">Hierarchical Ring</text>

  <!-- 4 small local rings, with global ring -->
  <!-- LR1 top-left: center=(555, 140) nodes A0(bridge),A1,A2,A3 -->
  <!-- LR2 top-right: center=(795,140) nodes B0(bridge),B1,B2 -->
  <!-- LR3 bot-left: center=(555,300) nodes C0(bridge),C1 — Source here -->
  <!-- LR4 bot-right: center=(795,300) nodes D0(bridge),D1 — Dest here -->

  <!-- Local ring 1 (small) -->
  <circle cx="555" cy="110" r="14" fill="#004065" stroke="#FFD200" stroke-width="2.5"/>
  <text x="555" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">B0</text>
  <circle cx="590" cy="145" r="13" fill="#004065"/>
  <text x="590" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">B1</text>
  <circle cx="555" cy="178" r="13" fill="#004065"/>
  <text x="555" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">B2</text>
  <circle cx="520" cy="145" r="13" fill="#004065"/>
  <text x="520" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">B3</text>
  <line x1="555" y1="124" x2="580" y2="136" stroke="#555" stroke-width="1" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <line x1="590" y1="158" x2="565" y2="169" stroke="#555" stroke-width="1" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <line x1="543" y1="175" x2="524" y2="158" stroke="#555" stroke-width="1" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <line x1="520" y1="132" x2="543" y2="120" stroke="#555" stroke-width="1" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <text x="555" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Ring B</text>

  <!-- Local ring 2 (small) top-right -->
  <circle cx="770" cy="110" r="14" fill="#004065" stroke="#FFD200" stroke-width="2.5"/>
  <text x="770" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">C0</text>
  <circle cx="805" cy="145" r="13" fill="#004065"/>
  <text x="805" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">C1</text>
  <circle cx="770" cy="178" r="13" fill="#004065"/>
  <text x="770" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">C2</text>
  <circle cx="735" cy="145" r="13" fill="#004065"/>
  <text x="735" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">C3</text>
  <line x1="770" y1="124" x2="795" y2="136" stroke="#555" stroke-width="1" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <line x1="805" y1="158" x2="780" y2="169" stroke="#555" stroke-width="1" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <line x1="758" y1="175" x2="739" y2="158" stroke="#555" stroke-width="1" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <line x1="735" y1="132" x2="758" y2="120" stroke="#555" stroke-width="1" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <text x="770" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Ring C</text>

  <!-- Local ring 3 (bottom-left) — Source node here -->
  <circle cx="555" cy="280" r="14" fill="#004065" stroke="#FFD200" stroke-width="2.5"/>
  <text x="555" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">A0</text>
  <circle cx="590" cy="315" r="13" fill="#004065"/>
  <text x="590" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">A1</text>
  <circle cx="555" cy="350" r="14" fill="#FF6B00" stroke="#CC4400" stroke-width="2.5"/>
  <text x="555" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">SRC</text>
  <circle cx="520" cy="315" r="13" fill="#004065"/>
  <text x="520" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">A3</text>
  <line x1="555" y1="294" x2="580" y2="306" stroke="#555" stroke-width="1" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <line x1="590" y1="328" x2="565" y2="340" stroke="#555" stroke-width="1" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <line x1="543" y1="348" x2="524" y2="328" stroke="#555" stroke-width="1" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <line x1="520" y1="302" x2="543" y2="290" stroke="#555" stroke-width="1" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <text x="555" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Ring A</text>

  <!-- Local ring 4 (bottom-right) — Destination here -->
  <circle cx="770" cy="280" r="14" fill="#004065" stroke="#FFD200" stroke-width="2.5"/>
  <text x="770" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">D0</text>
  <circle cx="805" cy="315" r="13" fill="#004065"/>
  <text x="805" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">D1</text>
  <circle cx="770" cy="350" r="14" fill="#1A8C1A" stroke="#115511" stroke-width="2.5"/>
  <text x="770" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">DST</text>
  <circle cx="735" cy="315" r="13" fill="#004065"/>
  <text x="735" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">D3</text>
  <line x1="770" y1="294" x2="795" y2="306" stroke="#555" stroke-width="1" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <line x1="805" y1="328" x2="780" y2="340" stroke="#555" stroke-width="1" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <line x1="758" y1="348" x2="739" y2="328" stroke="#555" stroke-width="1" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <line x1="735" y1="302" x2="758" y2="290" stroke="#555" stroke-width="1" marker-end="url(#pdArr)" marker-start="url(#pdArrB)"/>
  <text x="770" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Ring D</text>

  <!-- Global ring connections: A0(555,280) - B0(555,110) - C0(770,110) - D0(770,280) - back to A0 -->
  <line x1="555" y1="266" x2="555" y2="124" stroke="#CC8800" stroke-width="2" stroke-dasharray="8,4"/>
  <line x1="569" y1="110" x2="756" y2="110" stroke="#CC8800" stroke-width="2" stroke-dasharray="8,4"/>
  <line x1="770" y1="124" x2="770" y2="266" stroke="#CC8800" stroke-width="2" stroke-dasharray="8,4"/>
  <line x1="756" y1="280" x2="569" y2="280" stroke="#CC8800" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Path 1 (RED): SRC → A0 → via global ring directly → D0 → DST -->
  <line x1="555" y1="336" x2="555" y2="294" stroke="#CC2222" stroke-width="2.5" marker-end="url(#pdP1)"/>
  <line x1="555" y1="266" x2="555" y2="124" stroke="#CC2222" stroke-width="2.5" marker-end="url(#pdP1)"/>
  <!-- straight along top global ring to D0 -->
  <line x1="569" y1="110" x2="756" y2="110" stroke="#CC2222" stroke-width="2.5" marker-end="url(#pdP1)"/>
  <line x1="770" y1="124" x2="770" y2="266" stroke="#CC2222" stroke-width="2.5" marker-end="url(#pdP1)"/>
  <line x1="770" y1="294" x2="770" y2="336" stroke="#CC2222" stroke-width="2.5" marker-end="url(#pdP1)"/>

  <!-- Path 2 (GREEN): SRC → A0 → global ring via bottom → D0 → DST -->
  <!-- goes A0→(bottom ring)->D0 directly -->
  <line x1="541" y1="280" x2="527" y2="280" stroke="#1A8C1A" stroke-width="2.5"/>
  <!-- Curve down and around — approximate with a short path -->
  <path d="M 527,280 Q 480,340 527,360 Q 540,370 556,364" stroke="#1A8C1A" stroke-width="2.5" fill="none" marker-end="url(#pdP2)"/>
  <path d="M 572,355 Q 600,380 660,380 Q 730,380 762,358" stroke="#1A8C1A" stroke-width="2.5" fill="none" marker-end="url(#pdP2)"/>

  <!-- Labels -->
  <text x="490" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#CC2222">Path 1</text>
  <text x="590" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1A8C1A">Path 2</text>

  <text x="675" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1A8C1A" font-weight="bold">Multiple paths → load balance + fault tolerance</text>
</svg>
