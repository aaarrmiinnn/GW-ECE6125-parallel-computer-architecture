<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <rect width="900" height="500" fill="#f8f9fa"/>

  <defs>
    <marker id="arrowRed" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#CC2222"/>
    </marker>
    <marker id="arrowOrg" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#FF8800"/>
    </marker>
    <marker id="arrowGry" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#aaa"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#004065">Omega Network: Blocking Permutation</text>

  <!-- Stage labels -->
  <text x="290" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#004065">Stage 1</text>
  <text x="490" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#004065">Stage 2</text>
  <text x="690" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#004065">Stage 3</text>

  <!-- Y positions for 8 wires: 100,150,200,250,300,350,400,450 -->

  <!-- Input nodes -->
  <circle cx="75" cy="100" r="18" fill="#CC2222" stroke="#990000" stroke-width="2"/>
  <text x="75" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">000</text>

  <circle cx="75" cy="150" r="18" fill="#FF8800" stroke="#CC5500" stroke-width="2"/>
  <text x="75" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">001</text>

  <circle cx="75" cy="200" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="75" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">010</text>
  <circle cx="75" cy="250" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="75" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">011</text>
  <circle cx="75" cy="300" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="75" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">100</text>
  <circle cx="75" cy="350" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="75" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">101</text>
  <circle cx="75" cy="400" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="75" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">110</text>
  <circle cx="75" cy="450" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="75" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">111</text>

  <!-- Output nodes -->
  <circle cx="825" cy="100" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="825" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">000</text>
  <circle cx="825" cy="150" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="825" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">001</text>
  <circle cx="825" cy="200" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="825" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">010</text>
  <circle cx="825" cy="250" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="825" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">011</text>
  <circle cx="825" cy="300" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="825" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">100</text>
  <circle cx="825" cy="350" r="18" fill="#CC2222" stroke="#990000" stroke-width="2"/>
  <text x="825" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">101</text>
  <circle cx="825" cy="400" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="825" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">110</text>
  <circle cx="825" cy="450" r="18" fill="#FF8800" stroke="#CC5500" stroke-width="2"/>
  <text x="825" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">111</text>

  <!-- ===== STAGE 1 SWITCHES ===== -->
  <!-- SW0: positions 0,1 (y=100,150) — CONFLICT HERE -->
  <rect x="265" y="90" width="50" height="75" rx="4" fill="#FFEEEE" stroke="#CC2222" stroke-width="2.5"/>
  <text x="290" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#CC2222" font-weight="bold">SW0</text>
  <text x="290" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#CC2222">CONFLICT</text>

  <rect x="265" y="190" width="50" height="75" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="290" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW1</text>
  <rect x="265" y="290" width="50" height="75" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="290" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW2</text>
  <rect x="265" y="390" width="50" height="75" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="290" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW3</text>

  <!-- ===== STAGE 2 SWITCHES ===== -->
  <rect x="465" y="90" width="50" height="75" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="490" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW0</text>
  <rect x="465" y="190" width="50" height="75" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="490" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW1</text>
  <rect x="465" y="290" width="50" height="75" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="490" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW2</text>
  <rect x="465" y="390" width="50" height="75" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="490" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW3</text>

  <!-- ===== STAGE 3 SWITCHES ===== -->
  <rect x="665" y="90" width="50" height="75" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="690" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW0</text>
  <rect x="665" y="190" width="50" height="75" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="690" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW1</text>
  <rect x="665" y="290" width="50" height="75" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="690" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW2</text>
  <rect x="665" y="390" width="50" height="75" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="690" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW3</text>

  <!-- Gray background wires (non-highlighted) -->
  <!-- Inputs → Stage 1 (gray) -->
  <line x1="93" y1="200" x2="265" y2="200" stroke="#ccc" stroke-width="1.5"/>
  <line x1="93" y1="250" x2="265" y2="250" stroke="#ccc" stroke-width="1.5"/>
  <line x1="93" y1="300" x2="265" y2="300" stroke="#ccc" stroke-width="1.5"/>
  <line x1="93" y1="350" x2="265" y2="350" stroke="#ccc" stroke-width="1.5"/>
  <line x1="93" y1="400" x2="265" y2="400" stroke="#ccc" stroke-width="1.5"/>
  <line x1="93" y1="450" x2="265" y2="450" stroke="#ccc" stroke-width="1.5"/>

  <!-- Stage 1 → Stage 2 shuffle (gray) -->
  <line x1="315" y1="200" x2="465" y2="200" stroke="#ccc" stroke-width="1.5"/>
  <line x1="315" y1="250" x2="465" y2="300" stroke="#ccc" stroke-width="1.5"/>
  <line x1="315" y1="300" x2="465" y2="100" stroke="#ccc" stroke-width="1.5"/>
  <line x1="315" y1="350" x2="465" y2="200" stroke="#ccc" stroke-width="1.5"/>
  <line x1="315" y1="400" x2="465" y2="300" stroke="#ccc" stroke-width="1.5"/>
  <line x1="315" y1="450" x2="465" y2="400" stroke="#ccc" stroke-width="1.5"/>

  <!-- Stage 2 → Stage 3 shuffle (gray) -->
  <line x1="515" y1="100" x2="665" y2="100" stroke="#ccc" stroke-width="1.5"/>
  <line x1="515" y1="200" x2="665" y2="300" stroke="#ccc" stroke-width="1.5"/>
  <line x1="515" y1="250" x2="665" y2="400" stroke="#ccc" stroke-width="1.5"/>
  <line x1="515" y1="300" x2="665" y2="200" stroke="#ccc" stroke-width="1.5"/>
  <line x1="515" y1="350" x2="665" y2="300" stroke="#ccc" stroke-width="1.5"/>
  <line x1="515" y1="400" x2="665" y2="400" stroke="#ccc" stroke-width="1.5"/>
  <line x1="515" y1="450" x2="665" y2="450" stroke="#ccc" stroke-width="1.5"/>

  <!-- Stage 3 → Outputs (gray) -->
  <line x1="715" y1="100" x2="807" y2="100" stroke="#ccc" stroke-width="1.5"/>
  <line x1="715" y1="200" x2="807" y2="300" stroke="#ccc" stroke-width="1.5"/>
  <line x1="715" y1="250" x2="807" y2="400" stroke="#ccc" stroke-width="1.5"/>
  <line x1="715" y1="300" x2="807" y2="200" stroke="#ccc" stroke-width="1.5"/>
  <line x1="715" y1="400" x2="807" y2="400" stroke="#ccc" stroke-width="1.5"/>
  <line x1="715" y1="450" x2="807" y2="450" stroke="#ccc" stroke-width="1.5"/>

  <!-- ===== PATH 1: 000 → 101 (RED) ===== -->
  <!-- In 000 (y=100) → SW0 top -->
  <line x1="93" y1="100" x2="265" y2="100" stroke="#CC2222" stroke-width="3"/>
  <!-- SW0: MSB of 101=1 → cross → exits bottom (y=150) — BUT CONFLICT! Show both going to bottom -->
  <line x1="265" y1="100" x2="315" y2="150" stroke="#CC2222" stroke-width="3" marker-end="url(#arrowRed)"/>

  <!-- ===== PATH 2: 001 → 111 (ORANGE) ===== -->
  <!-- In 001 (y=150) → SW0 bottom -->
  <line x1="93" y1="150" x2="265" y2="150" stroke="#FF8800" stroke-width="3"/>
  <!-- SW0: MSB of 111=1 → cross → wants to exit bottom (y=150) TOO -->
  <line x1="265" y1="150" x2="315" y2="150" stroke="#FF8800" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowOrg)"/>

  <!-- Conflict starburst at (315, 150) -->
  <!-- Starburst polygon -->
  <polygon points="315,130 320,143 335,138 323,150 335,162 320,157 315,170 310,157 295,162 307,150 295,138 310,143" fill="#FF0000" stroke="#880000" stroke-width="1"/>
  <text x="315" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="white">X</text>

  <!-- CONFLICT label -->
  <text x="315" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#CC0000">CONFLICT!</text>

  <!-- Annotation box -->
  <rect x="340" y="185" width="360" height="55" rx="5" fill="#FFF3F3" stroke="#CC2222" stroke-width="1.5"/>
  <text x="520" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#CC2222" font-weight="bold">Why it's blocked:</text>
  <text x="520" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Both 000→101 and 001→111 have MSB=1</text>
  <text x="520" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">→ both need lower output port of SW0 → BLOCKED</text>

  <!-- Legend -->
  <rect x="30" y="465" width="15" height="4" rx="2" fill="#CC2222"/>
  <text x="50" y="470" font-family="Arial, sans-serif" font-size="11" fill="#CC2222">Path 1: 000 → 101</text>
  <rect x="200" y="465" width="15" height="4" rx="2" fill="#FF8800"/>
  <text x="220" y="470" font-family="Arial, sans-serif" font-size="11" fill="#FF8800">Path 2: 001 → 111 (blocked)</text>
  <text x="450" y="470" font-family="Arial, sans-serif" font-size="11" fill="#666">Gray = other (inactive) wires</text>
</svg>
