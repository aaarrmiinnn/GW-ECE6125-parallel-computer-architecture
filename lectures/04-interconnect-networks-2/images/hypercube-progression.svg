<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <rect width="900" height="400" fill="#f8f9fa"/>

  <defs>
    <marker id="hpArr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#FF6B00"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#004065">Hypercube Progression: 0D to 3D</text>

  <!-- Rule at top -->
  <rect x="220" y="35" width="460" height="22" rx="4" fill="#E8F4FF" stroke="#004065" stroke-width="1"/>
  <text x="450" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#004065">Neighbors differ by exactly 1 bit (Hamming distance = 1)</text>

  <!-- Panel labels at top -->
  <text x="65" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#004065">0D</text>
  <text x="65" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">N=1, d=0</text>

  <text x="220" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#004065">1D</text>
  <text x="220" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">N=2, d=1</text>

  <text x="420" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#004065">2D</text>
  <text x="420" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">N=4, d=2</text>

  <text x="680" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#004065">3D</text>
  <text x="680" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">N=8, d=3</text>

  <!-- Panel dividers -->
  <line x1="140" y1="70" x2="140" y2="370" stroke="#ddd" stroke-width="1.5"/>
  <line x1="310" y1="70" x2="310" y2="370" stroke="#ddd" stroke-width="1.5"/>
  <line x1="545" y1="70" x2="545" y2="370" stroke="#ddd" stroke-width="1.5"/>

  <!-- ===== 0D: single node ===== -->
  <circle cx="65" cy="220" r="26" fill="#6699CC" stroke="#004065" stroke-width="2.5"/>
  <text x="65" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">0</text>

  <!-- copy+connect arrow 0D→1D -->
  <text x="180" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FF6B00" font-weight="bold">copy +</text>
  <text x="180" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FF6B00" font-weight="bold">connect</text>
  <line x1="95" y1="220" x2="155" y2="220" stroke="#FF6B00" stroke-width="2" marker-end="url(#hpArr)"/>
  <line x1="160" y1="220" x2="175" y2="220" stroke="#FF6B00" stroke-width="2"/>

  <!-- ===== 1D: two nodes connected ===== -->
  <!-- Node 0: (185, 200), Node 1: (255, 200) -->
  <line x1="211" y1="200" x2="229" y2="200" stroke="#333" stroke-width="2.5"/>
  <circle cx="185" cy="200" r="24" fill="#6699CC" stroke="#004065" stroke-width="2.5"/>
  <text x="185" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">0</text>
  <circle cx="255" cy="200" r="24" fill="#6699CC" stroke="#004065" stroke-width="2.5"/>
  <text x="255" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">1</text>

  <!-- copy+connect arrow 1D→2D -->
  <text x="360" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FF6B00" font-weight="bold">copy +</text>
  <text x="360" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FF6B00" font-weight="bold">connect</text>
  <line x1="282" y1="200" x2="340" y2="210" stroke="#FF6B00" stroke-width="2" marker-end="url(#hpArr)"/>

  <!-- ===== 2D: 4-node square ===== -->
  <!-- 00:(355,140), 01:(455,140), 10:(355,290), 11:(455,290) -->
  <line x1="380" y1="140" x2="430" y2="140" stroke="#333" stroke-width="2"/>
  <line x1="380" y1="290" x2="430" y2="290" stroke="#333" stroke-width="2"/>
  <line x1="355" y1="165" x2="355" y2="265" stroke="#333" stroke-width="2"/>
  <line x1="455" y1="165" x2="455" y2="265" stroke="#333" stroke-width="2"/>

  <circle cx="355" cy="140" r="24" fill="#6699CC" stroke="#004065" stroke-width="2.5"/>
  <text x="355" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">00</text>
  <circle cx="455" cy="140" r="24" fill="#6699CC" stroke="#004065" stroke-width="2.5"/>
  <text x="455" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">01</text>
  <circle cx="355" cy="290" r="24" fill="#6699CC" stroke="#004065" stroke-width="2.5"/>
  <text x="355" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">10</text>
  <circle cx="455" cy="290" r="24" fill="#6699CC" stroke="#004065" stroke-width="2.5"/>
  <text x="455" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">11</text>

  <!-- copy+connect arrow 2D→3D -->
  <text x="595" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FF6B00" font-weight="bold">copy +</text>
  <text x="595" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FF6B00" font-weight="bold">connect</text>
  <line x1="480" y1="215" x2="565" y2="215" stroke="#FF6B00" stroke-width="2" marker-end="url(#hpArr)"/>

  <!-- ===== 3D: 8-node cube (isometric) ===== -->
  <!-- Front face: 000,001,010,011 at front plane -->
  <!-- Back face: 100,101,110,111 shifted up-right -->
  <!-- Front face positions: 000:(625,290), 001:(720,290), 010:(625,195), 011:(720,195) -->
  <!-- Back face positions (shift -40x, -60y): 100:(660,220), 101:(745,220), 110:(660,125), 111:(745,125) -->
  <!-- Wait, let me use a proper isometric cube layout -->
  <!-- Front face: bottom-left=000, bottom-right=001, top-right=011, top-left=010 -->
  <!-- fr=(625,285), 001=(720,285), 011=(720,195), 010=(625,195) -->
  <!-- Back shifted by (+35,-40): 100=(660,245), 101=(755,245), 111=(755,155), 110=(660,155) -->

  <!-- Back face edges -->
  <line x1="660" y1="245" x2="755" y2="245" stroke="#aaa" stroke-width="1.5"/>
  <line x1="755" y1="245" x2="755" y2="155" stroke="#aaa" stroke-width="1.5"/>
  <line x1="755" y1="155" x2="660" y2="155" stroke="#aaa" stroke-width="1.5"/>
  <line x1="660" y1="155" x2="660" y2="245" stroke="#aaa" stroke-width="1.5"/>

  <!-- Depth edges (connecting front to back) -->
  <line x1="625" y1="285" x2="660" y2="245" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="720" y1="285" x2="755" y2="245" stroke="#888" stroke-width="1.5"/>
  <line x1="720" y1="195" x2="755" y2="155" stroke="#888" stroke-width="1.5"/>
  <line x1="625" y1="195" x2="660" y2="155" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Front face edges -->
  <line x1="625" y1="285" x2="720" y2="285" stroke="#333" stroke-width="2"/>
  <line x1="720" y1="285" x2="720" y2="195" stroke="#333" stroke-width="2"/>
  <line x1="720" y1="195" x2="625" y2="195" stroke="#333" stroke-width="2"/>
  <line x1="625" y1="195" x2="625" y2="285" stroke="#333" stroke-width="2"/>

  <!-- Back face nodes -->
  <circle cx="660" cy="245" r="22" fill="#6699CC" stroke="#004065" stroke-width="2"/>
  <text x="660" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">100</text>
  <circle cx="755" cy="245" r="22" fill="#6699CC" stroke="#004065" stroke-width="2"/>
  <text x="755" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">101</text>
  <circle cx="755" cy="155" r="22" fill="#6699CC" stroke="#004065" stroke-width="2"/>
  <text x="755" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">111</text>
  <circle cx="660" cy="155" r="22" fill="#6699CC" stroke="#004065" stroke-width="2"/>
  <text x="660" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">110</text>

  <!-- Front face nodes (draw on top) -->
  <circle cx="625" cy="285" r="22" fill="#6699CC" stroke="#004065" stroke-width="2.5"/>
  <text x="625" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">000</text>
  <circle cx="720" cy="285" r="22" fill="#6699CC" stroke="#004065" stroke-width="2.5"/>
  <text x="720" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">001</text>
  <circle cx="720" cy="195" r="22" fill="#6699CC" stroke="#004065" stroke-width="2.5"/>
  <text x="720" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">011</text>
  <circle cx="625" cy="195" r="22" fill="#6699CC" stroke="#004065" stroke-width="2.5"/>
  <text x="625" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">010</text>

  <!-- Bottom note -->
  <rect x="60" y="340" width="780" height="40" rx="5" fill="#E8F4FF" stroke="#004065" stroke-width="1"/>
  <text x="450" y="357" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#004065">Construction rule: copy the (d-1)-cube, then connect corresponding nodes with new dimension edges</text>
  <text x="450" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Each new dimension doubles the number of nodes. N=2^d nodes, diameter=d, degree=d, O(N log N) edges</text>
</svg>
