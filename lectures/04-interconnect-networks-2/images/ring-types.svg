<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <rect width="900" height="380" fill="#f8f9fa"/>

  <defs>
    <marker id="arrowCW" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#555"/>
    </marker>
    <marker id="arrowBi1" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#555"/>
    </marker>
    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#CC8800"/>
    </marker>
    <marker id="arrowBi2" markerWidth="8" markerHeight="8" refX="1.5" refY="3.5" orient="auto">
      <path d="M8,0 L8,7 L0,3.5 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#004065">Ring Topologies</text>

  <!-- Divider -->
  <line x1="450" y1="45" x2="450" y2="360" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ===== LEFT: UNIDIRECTIONAL RING ===== -->
  <text x="225" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#004065">Unidirectional Ring</text>

  <!-- Center: 225, 195. Radius: 110 -->
  <!-- 6 nodes at 60° intervals: 0°=top, 60°,120°,...300° -->
  <!-- Node 0: (225, 85) -->
  <!-- Node 1: (225+110*sin60°, 195-110*cos60°) = (225+95, 195-55) = (320, 140) -->
  <!-- Node 2: (225+95, 195+55) = (320, 250) -->
  <!-- Node 3: (225, 305) -->
  <!-- Node 4: (225-95, 250) = (130, 250) -->
  <!-- Node 5: (130, 140) -->

  <!-- Ring arrows (clockwise): draw arcs between consecutive nodes -->
  <!-- Using lines with markers for simplicity -->
  <!-- 0→1 -->
  <line x1="225" y1="98" x2="308" y2="147" stroke="#555" stroke-width="2" marker-end="url(#arrowCW)"/>
  <!-- 1→2 -->
  <line x1="320" y1="155" x2="320" y2="238" stroke="#555" stroke-width="2" marker-end="url(#arrowCW)"/>
  <!-- 2→3 -->
  <line x1="308" y1="254" x2="237" y2="295" stroke="#555" stroke-width="2" marker-end="url(#arrowCW)"/>
  <!-- 3→4 -->
  <line x1="213" y1="295" x2="144" y2="254" stroke="#555" stroke-width="2" marker-end="url(#arrowCW)"/>
  <!-- 4→5 -->
  <line x1="130" y1="238" x2="130" y2="155" stroke="#555" stroke-width="2" marker-end="url(#arrowCW)"/>
  <!-- 5→0 -->
  <line x1="142" y1="147" x2="213" y2="98" stroke="#555" stroke-width="2" marker-end="url(#arrowCW)"/>

  <!-- Nodes -->
  <circle cx="225" cy="85" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="225" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">0</text>
  <circle cx="320" cy="140" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="320" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">1</text>
  <circle cx="320" cy="250" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="320" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">2</text>
  <circle cx="225" cy="305" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="225" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">3</text>
  <circle cx="130" cy="250" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="130" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">4</text>
  <circle cx="130" cy="140" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="130" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">5</text>

  <!-- CW label -->
  <text x="225" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">clockwise</text>
  <text x="225" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">only</text>

  <!-- Stats -->
  <text x="225" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Avg: N/4 hops</text>
  <text x="225" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#CC2222">Worst case: N/2 hops</text>

  <!-- ===== RIGHT: BIDIRECTIONAL RING ===== -->
  <text x="675" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#004065">Bidirectional Ring</text>

  <!-- Center: 675, 195. Same radius: 110 -->
  <!-- Node 0: (675, 85), 1:(770,140), 2:(770,250), 3:(675,305), 4:(580,250), 5:(580,140) -->

  <!-- Bidirectional links (both arrows) -->
  <!-- 0-1 -->
  <line x1="675" y1="98" x2="758" y2="147" stroke="#555" stroke-width="2" marker-end="url(#arrowBi1)" marker-start="url(#arrowBi2)"/>
  <!-- 1-2 -->
  <line x1="770" y1="155" x2="770" y2="238" stroke="#555" stroke-width="2" marker-end="url(#arrowBi1)" marker-start="url(#arrowBi2)"/>
  <!-- 2-3 -->
  <line x1="758" y1="254" x2="687" y2="295" stroke="#555" stroke-width="2" marker-end="url(#arrowBi1)" marker-start="url(#arrowBi2)"/>
  <!-- 3-4 -->
  <line x1="663" y1="295" x2="594" y2="254" stroke="#555" stroke-width="2" marker-end="url(#arrowBi1)" marker-start="url(#arrowBi2)"/>
  <!-- 4-5 -->
  <line x1="580" y1="238" x2="580" y2="155" stroke="#555" stroke-width="2" marker-end="url(#arrowBi1)" marker-start="url(#arrowBi2)"/>
  <!-- 5-0 -->
  <line x1="592" y1="147" x2="663" y2="98" stroke="#555" stroke-width="2" marker-end="url(#arrowBi1)" marker-start="url(#arrowBi2)"/>

  <!-- Highlighted shortest path: 0→4 counterclockwise (2 hops: 0→5→4) -->
  <!-- Draw gold highlighted path 0→5→4 -->
  <line x1="663" y1="98" x2="592" y2="147" stroke="#CC8800" stroke-width="3.5" marker-end="url(#arrowGold)"/>
  <line x1="580" y1="155" x2="580" y2="238" stroke="#CC8800" stroke-width="3.5" marker-end="url(#arrowGold)"/>
  <text x="540" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#CC8800" font-weight="bold">2 hops</text>
  <text x="540" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#CC8800">(CCW)</text>

  <!-- Nodes -->
  <circle cx="675" cy="85" r="20" fill="#004065" stroke="#CC8800" stroke-width="2.5"/>
  <text x="675" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">0</text>
  <circle cx="770" cy="140" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="770" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">1</text>
  <circle cx="770" cy="250" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="770" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">2</text>
  <circle cx="675" cy="305" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="675" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">3</text>
  <circle cx="580" cy="250" r="20" fill="#FF8C00" stroke="#CC5500" stroke-width="2.5"/>
  <text x="580" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">4</text>
  <circle cx="580" cy="140" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="580" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">5</text>

  <!-- Clockwise worst case note -->
  <text x="720" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">CW: 4 hops</text>
  <text x="720" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">(avoided)</text>

  <!-- Stats -->
  <text x="675" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Avg: N/4 hops</text>
  <text x="675" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1A8C1A">Worst case: N/4 hops</text>

  <!-- Bottom note -->
  <text x="450" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#004065" font-style="italic">Bidirectional halves worst-case latency by always taking the shorter direction</text>
</svg>
