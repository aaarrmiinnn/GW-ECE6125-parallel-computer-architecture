<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <rect width="900" height="400" fill="#f8f9fa"/>

  <defs>
    <marker id="ftArr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#555"/>
    </marker>
    <marker id="ftArrB" markerWidth="7" markerHeight="7" refX="1.5" refY="3.5" orient="auto">
      <path d="M7,0 L7,7 L0,3.5 z" fill="#555"/>
    </marker>
    <marker id="ftArrR" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#CC2222"/>
    </marker>
    <marker id="ftArrG" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#1A8C1A"/>
    </marker>
    <marker id="ftArrGB" markerWidth="8" markerHeight="8" refX="1.5" refY="3.5" orient="auto">
      <path d="M8,0 L8,7 L0,3.5 z" fill="#1A8C1A"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#004065">Folded Torus: Physical Layout Optimization</text>

  <!-- Subtitle -->
  <text x="450" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Same logical topology — better physical wire layout</text>

  <!-- Panel divider -->
  <line x1="450" y1="58" x2="450" y2="375" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ===== LEFT: REGULAR TORUS ===== -->
  <text x="225" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#004065">Regular (Unfolded) Torus</text>

  <!-- 4x1 grid for illustration: col 0-3, y=170 -->
  <!-- Col positions: 60,140,220,300 -->
  <!-- Show only one row for simplicity, wraparound at ends -->
  <!-- Multi-row for better illustration: 4x4, space=70, start(55,105) -->

  <!-- Nodes: 4x4 grid -->
  <!-- Row 0: y=105, Row 1: y=170, Row 2: y=235, Row 3: y=300 -->
  <!-- Col 0: x=55, Col 1: x=130, Col 2: x=205, Col 3: x=280 -->

  <!-- Internal horizontal links -->
  <line x1="72" y1="105" x2="113" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="147" y1="105" x2="188" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="222" y1="105" x2="263" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>

  <line x1="72" y1="170" x2="113" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="147" y1="170" x2="188" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="222" y1="170" x2="263" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>

  <line x1="72" y1="235" x2="113" y2="235" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="147" y1="235" x2="188" y2="235" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="222" y1="235" x2="263" y2="235" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>

  <line x1="72" y1="300" x2="113" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="147" y1="300" x2="188" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="222" y1="300" x2="263" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>

  <!-- Internal vertical links -->
  <line x1="55" y1="122" x2="55" y2="153" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="55" y1="187" x2="55" y2="218" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="55" y1="252" x2="55" y2="283" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>

  <line x1="130" y1="122" x2="130" y2="153" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="130" y1="187" x2="130" y2="218" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="130" y1="252" x2="130" y2="283" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>

  <line x1="205" y1="122" x2="205" y2="153" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="205" y1="187" x2="205" y2="218" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="205" y1="252" x2="205" y2="283" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>

  <line x1="280" y1="122" x2="280" y2="153" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="280" y1="187" x2="280" y2="218" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="280" y1="252" x2="280" y2="283" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>

  <!-- LONG wraparound wires (RED = bad) -->
  <!-- Horizontal row 0: col0(55,105) ↔ col3(280,105) -->
  <path d="M 55,88 Q 167,65 280,88" stroke="#CC2222" stroke-width="2.5" fill="none" marker-end="url(#ftArrR)" marker-start="url(#ftArrR)"/>
  <text x="167" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#CC2222">LONG wire!</text>
  <!-- Horizontal row 3: col0(55,300) ↔ col3(280,300) -->
  <path d="M 55,317 Q 167,342 280,317" stroke="#CC2222" stroke-width="2.5" fill="none" marker-end="url(#ftArrR)" marker-start="url(#ftArrR)"/>
  <!-- Vertical col0: row0(55,105) ↔ row3(55,300) -->
  <path d="M 38,105 Q 15,202 38,300" stroke="#CC2222" stroke-width="2.5" fill="none" marker-end="url(#ftArrR)" marker-start="url(#ftArrR)"/>
  <text x="-5" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#CC2222" transform="rotate(-90,-5,205)">LONG wire</text>
  <!-- Vertical col3: row0(280,105) ↔ row3(280,300) -->
  <path d="M 297,105 Q 325,202 297,300" stroke="#CC2222" stroke-width="2.5" fill="none" marker-end="url(#ftArrR)" marker-start="url(#ftArrR)"/>

  <!-- Torus nodes -->
  <!-- Row 0: labels 0,1,2,3 -->
  <circle cx="55" cy="105" r="16" fill="#004065"/>
  <text x="55" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">0</text>
  <circle cx="130" cy="105" r="16" fill="#004065"/>
  <text x="130" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">1</text>
  <circle cx="205" cy="105" r="16" fill="#004065"/>
  <text x="205" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">2</text>
  <circle cx="280" cy="105" r="16" fill="#004065"/>
  <text x="280" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">3</text>
  <!-- Row 1 -->
  <circle cx="55" cy="170" r="16" fill="#004065"/>
  <text x="55" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">4</text>
  <circle cx="130" cy="170" r="16" fill="#004065"/>
  <text x="130" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">5</text>
  <circle cx="205" cy="170" r="16" fill="#004065"/>
  <text x="205" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">6</text>
  <circle cx="280" cy="170" r="16" fill="#004065"/>
  <text x="280" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">7</text>
  <!-- Row 2 -->
  <circle cx="55" cy="235" r="16" fill="#004065"/>
  <text x="55" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">8</text>
  <circle cx="130" cy="235" r="16" fill="#004065"/>
  <text x="130" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">9</text>
  <circle cx="205" cy="235" r="16" fill="#004065"/>
  <text x="205" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">10</text>
  <circle cx="280" cy="235" r="16" fill="#004065"/>
  <text x="280" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">11</text>
  <!-- Row 3 -->
  <circle cx="55" cy="300" r="16" fill="#004065"/>
  <text x="55" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">12</text>
  <circle cx="130" cy="300" r="16" fill="#004065"/>
  <text x="130" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">13</text>
  <circle cx="205" cy="300" r="16" fill="#004065"/>
  <text x="205" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">14</text>
  <circle cx="280" cy="300" r="16" fill="#004065"/>
  <text x="280" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">15</text>

  <text x="167" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#CC2222">Long wires = high capacitance, slow</text>
  <text x="167" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">Nodes 0,3,12,15 span full width</text>

  <!-- ===== RIGHT: FOLDED TORUS ===== -->
  <text x="675" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#004065">Folded Torus</text>
  <text x="675" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">(Physical column order: 0, 2, 1, 3)</text>

  <!-- Folded layout: physical col order 0,2,1,3 → interleave even/odd -->
  <!-- Physical positions: col 0→x=505, col 2→x=580, col 1→x=655, col 3→x=730 -->
  <!-- But logical row order unchanged: 0,4,8,12 in col 0; 2,6,10,14 in col 1; etc -->

  <!-- Internal horizontal links (physical neighbors) -->
  <!-- phys col 0(x=505) ↔ phys col 1(x=580): logical 0↔2 (skip 1) — but in folded they're adjacent -->
  <line x1="522" y1="105" x2="563" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="597" y1="105" x2="638" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="672" y1="105" x2="713" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>

  <line x1="522" y1="170" x2="563" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="597" y1="170" x2="638" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="672" y1="170" x2="713" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>

  <line x1="522" y1="235" x2="563" y2="235" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="597" y1="235" x2="638" y2="235" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="672" y1="235" x2="713" y2="235" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>

  <line x1="522" y1="300" x2="563" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="597" y1="300" x2="638" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="672" y1="300" x2="713" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>

  <!-- Internal vertical links -->
  <line x1="505" y1="122" x2="505" y2="153" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="505" y1="187" x2="505" y2="218" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="505" y1="252" x2="505" y2="283" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="580" y1="122" x2="580" y2="153" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="580" y1="187" x2="580" y2="218" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="580" y1="252" x2="580" y2="283" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="655" y1="122" x2="655" y2="153" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="655" y1="187" x2="655" y2="218" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="655" y1="252" x2="655" y2="283" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="730" y1="122" x2="730" y2="153" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="730" y1="187" x2="730" y2="218" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>
  <line x1="730" y1="252" x2="730" y2="283" stroke="#555" stroke-width="1.5" marker-end="url(#ftArr)" marker-start="url(#ftArrB)"/>

  <!-- SHORT wraparound wires (GREEN = good) -->
  <!-- In folded torus, logical node 0 (phys col 0) and logical node 3 (phys col 3) are at opposite ends -->
  <!-- But nodes 0,2 are phys adjacent, 1,3 are phys adjacent — so wrap is between phys col0↔col1, col2↔col3 -->
  <!-- Horizontal wraparound: phys col0 ↔ phys col1 (logical 0↔1, 4↔5, etc) → SHORT! -->
  <line x1="505" y1="92" x2="580" y2="92" stroke="#1A8C1A" stroke-width="2.5" marker-end="url(#ftArrG)" marker-start="url(#ftArrGB)"/>
  <text x="542" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1A8C1A">Short!</text>
  <line x1="505" y1="315" x2="580" y2="315" stroke="#1A8C1A" stroke-width="2.5" marker-end="url(#ftArrG)" marker-start="url(#ftArrGB)"/>
  <!-- phys col2 ↔ col3 short wrap -->
  <line x1="655" y1="92" x2="730" y2="92" stroke="#1A8C1A" stroke-width="2.5" marker-end="url(#ftArrG)" marker-start="url(#ftArrGB)"/>
  <line x1="655" y1="315" x2="730" y2="315" stroke="#1A8C1A" stroke-width="2.5" marker-end="url(#ftArrG)" marker-start="url(#ftArrGB)"/>
  <!-- Vertical short wraps: top row ↔ bottom row within same column -->
  <line x1="490" y1="105" x2="490" y2="300" stroke="#1A8C1A" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#ftArrG)" marker-start="url(#ftArrGB)"/>
  <text x="475" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1A8C1A" transform="rotate(-90,475,205)">Short!</text>
  <line x1="744" y1="105" x2="744" y2="300" stroke="#1A8C1A" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#ftArrG)" marker-start="url(#ftArrGB)"/>

  <!-- Folded torus nodes -->
  <!-- Physical col order: 0,2,1,3 → x: 505,580,655,730 -->
  <!-- Row 0: logical 0,2,1,3 -->
  <circle cx="505" cy="105" r="16" fill="#004065"/>
  <text x="505" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">0</text>
  <circle cx="580" cy="105" r="16" fill="#004065"/>
  <text x="580" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">2</text>
  <circle cx="655" cy="105" r="16" fill="#004065"/>
  <text x="655" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">1</text>
  <circle cx="730" cy="105" r="16" fill="#004065"/>
  <text x="730" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">3</text>
  <!-- Row 1 -->
  <circle cx="505" cy="170" r="16" fill="#004065"/>
  <text x="505" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">4</text>
  <circle cx="580" cy="170" r="16" fill="#004065"/>
  <text x="580" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">6</text>
  <circle cx="655" cy="170" r="16" fill="#004065"/>
  <text x="655" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">5</text>
  <circle cx="730" cy="170" r="16" fill="#004065"/>
  <text x="730" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">7</text>
  <!-- Row 2 -->
  <circle cx="505" cy="235" r="16" fill="#004065"/>
  <text x="505" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">8</text>
  <circle cx="580" cy="235" r="16" fill="#004065"/>
  <text x="580" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">10</text>
  <circle cx="655" cy="235" r="16" fill="#004065"/>
  <text x="655" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">9</text>
  <circle cx="730" cy="235" r="16" fill="#004065"/>
  <text x="730" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">11</text>
  <!-- Row 3 -->
  <circle cx="505" cy="300" r="16" fill="#004065"/>
  <text x="505" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">12</text>
  <circle cx="580" cy="300" r="16" fill="#004065"/>
  <text x="580" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">14</text>
  <circle cx="655" cy="300" r="16" fill="#004065"/>
  <text x="655" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">13</text>
  <circle cx="730" cy="300" r="16" fill="#004065"/>
  <text x="730" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">15</text>

  <text x="617" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1A8C1A">Short wires only — efficient PCB layout!</text>
  <text x="617" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">Logical 0/3 torus neighbors placed physically adjacent</text>
</svg>
