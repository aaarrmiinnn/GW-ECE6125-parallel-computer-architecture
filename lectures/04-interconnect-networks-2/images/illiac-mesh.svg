<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 550" width="750" height="550">
  <rect width="750" height="550" fill="#f8f9fa"/>

  <defs>
    <marker id="imArr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#555"/>
    </marker>
    <marker id="imArrB" markerWidth="7" markerHeight="7" refX="1.5" refY="3.5" orient="auto">
      <path d="M7,0 L7,7 L0,3.5 z" fill="#555"/>
    </marker>
    <marker id="imArrO" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#FF6B00"/>
    </marker>
    <marker id="imArrOB" markerWidth="8" markerHeight="8" refX="1.5" refY="3.5" orient="auto">
      <path d="M8,0 L8,7 L0,3.5 z" fill="#FF6B00"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="375" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#004065">Illiac Mesh (Illiac IV, 1966)</text>
  <text x="375" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">4×4 illustration (actual was 8×8) — Used in first massively parallel computer</text>

  <!-- Grid: 4x4, spacing=100, start (100,80) -->
  <!-- Row 0: y=80, Row 1: y=180, Row 2: y=280, Row 3: y=380 -->
  <!-- Col 0: x=100, Col 1: x=200, Col 2: x=300, Col 3: x=400 -->

  <!-- Internal horizontal links (bidirectional) -->
  <line x1="118" y1="80" x2="182" y2="80" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>
  <line x1="218" y1="80" x2="282" y2="80" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>
  <line x1="318" y1="80" x2="382" y2="80" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>

  <line x1="118" y1="180" x2="182" y2="180" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>
  <line x1="218" y1="180" x2="282" y2="180" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>
  <line x1="318" y1="180" x2="382" y2="180" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>

  <line x1="118" y1="280" x2="182" y2="280" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>
  <line x1="218" y1="280" x2="282" y2="280" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>
  <line x1="318" y1="280" x2="382" y2="280" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>

  <line x1="118" y1="380" x2="182" y2="380" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>
  <line x1="218" y1="380" x2="282" y2="380" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>
  <line x1="318" y1="380" x2="382" y2="380" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>

  <!-- Internal vertical links (bidirectional) -->
  <line x1="100" y1="98" x2="100" y2="162" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>
  <line x1="100" y1="198" x2="100" y2="262" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>
  <line x1="100" y1="298" x2="100" y2="362" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>

  <line x1="200" y1="98" x2="200" y2="162" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>
  <line x1="200" y1="198" x2="200" y2="262" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>
  <line x1="200" y1="298" x2="200" y2="362" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>

  <line x1="300" y1="98" x2="300" y2="162" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>
  <line x1="300" y1="198" x2="300" y2="262" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>
  <line x1="300" y1="298" x2="300" y2="362" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>

  <line x1="400" y1="98" x2="400" y2="162" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>
  <line x1="400" y1="198" x2="400" y2="262" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>
  <line x1="400" y1="298" x2="400" y2="362" stroke="#555" stroke-width="2" marker-end="url(#imArr)" marker-start="url(#imArrB)"/>

  <!-- DIAGONAL WRAPAROUND (orange dashed) -->
  <!-- Illiac rule: left edge of row i → right edge of row (i+1) mod 4 -->
  <!-- Row 0, left edge (100,80) → Row 1, right edge (400,180): DIAGONAL -->
  <path d="M 83,80 Q 30,130 83,180 Q 83,180 83,180" stroke="#FF6B00" stroke-width="2" fill="none" stroke-dasharray="1,1"/>
  <!-- Curved path from left of row 0 to right of row 1 going outside grid -->
  <path d="M 83,80 C 40,80 40,200 83,180" stroke="#FF6B00" stroke-width="2.5" fill="none" stroke-dasharray="8,4"/>
  <!-- arrow from this end point to right side of row 1 -->
  <path d="M 83,180 Q 200,220 380,180" stroke="#FF6B00" stroke-width="2.5" fill="none" stroke-dasharray="8,4" marker-end="url(#imArrO)"/>

  <!-- Row 1, left edge (100,180) → Row 2, right edge (400,280) -->
  <path d="M 83,180 C 40,180 40,300 83,280" stroke="#FF6B00" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.6"/>
  <path d="M 83,280 Q 200,310 380,280" stroke="#FF6B00" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.6" marker-end="url(#imArrO)"/>

  <!-- Row 2, left edge (100,280) → Row 3, right edge (400,380) -->
  <path d="M 83,280 C 40,280 40,400 83,380" stroke="#FF6B00" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.6"/>
  <path d="M 83,380 Q 200,405 380,380" stroke="#FF6B00" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.6" marker-end="url(#imArrO)"/>

  <!-- Row 3, left edge (100,380) → Row 0, right edge (400,80) — wrap around -->
  <path d="M 83,380 C 35,380 35,450 200,460 Q 420,470 470,380 C 480,300 470,80 418,80" stroke="#FF6B00" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.5" marker-end="url(#imArrO)"/>

  <!-- Annotation for the highlighted diagonal wrap (row 0 → row 1) -->
  <rect x="470" y="85" width="260" height="50" rx="5" fill="#FFF3CD" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="600" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#CC4400">Diagonal Wrap (orange):</text>
  <text x="600" y="119" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Row 0 left → Row 1 right</text>
  <text x="600" y="131" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">(NOT same row like regular torus)</text>
  <!-- Arrow from annotation to path -->
  <line x1="470" y1="110" x2="400" y2="128" stroke="#FF6B00" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#imArrO)"/>

  <!-- Nodes (draw over wires) -->
  <!-- Node labels: (row, col) -->
  <circle cx="100" cy="80" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="100" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">0,0</text>
  <circle cx="200" cy="80" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="200" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">0,1</text>
  <circle cx="300" cy="80" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="300" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">0,2</text>
  <circle cx="400" cy="80" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="400" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">0,3</text>

  <circle cx="100" cy="180" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">1,0</text>
  <circle cx="200" cy="180" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="200" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">1,1</text>
  <circle cx="300" cy="180" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="300" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">1,2</text>
  <circle cx="400" cy="180" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="400" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">1,3</text>

  <circle cx="100" cy="280" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="100" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">2,0</text>
  <circle cx="200" cy="280" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="200" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">2,1</text>
  <circle cx="300" cy="280" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="300" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">2,2</text>
  <circle cx="400" cy="280" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="400" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">2,3</text>

  <circle cx="100" cy="380" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="100" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">3,0</text>
  <circle cx="200" cy="380" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="200" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">3,1</text>
  <circle cx="300" cy="380" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="300" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">3,2</text>
  <circle cx="400" cy="380" r="20" fill="#004065" stroke="#002a40" stroke-width="2"/>
  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">3,3</text>

  <!-- Legend -->
  <line x1="460" y1="160" x2="490" y2="160" stroke="#555" stroke-width="2"/>
  <text x="498" y="164" font-family="Arial, sans-serif" font-size="11" fill="#555">N/S/E/W links (standard mesh)</text>
  <line x1="460" y1="182" x2="490" y2="182" stroke="#FF6B00" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="498" y="186" font-family="Arial, sans-serif" font-size="11" fill="#FF6B00">Diagonal wraparound links</text>

  <!-- Bottom note -->
  <rect x="50" y="430" width="640" height="48" rx="5" fill="#E8F4FF" stroke="#004065" stroke-width="1"/>
  <text x="370" y="449" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#004065">Key difference from regular torus:</text>
  <text x="370" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Left edge of row i wraps to the RIGHT edge of row (i+1) mod N</text>
  <text x="370" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">NOT to the left edge of the same row (as in standard torus)</text>

  <!-- Historical note -->
  <text x="375" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666" font-style="italic">Illiac IV (1966-1976): First large-scale parallel computer — 64 PEs (8×8 Illiac mesh)</text>
</svg>
