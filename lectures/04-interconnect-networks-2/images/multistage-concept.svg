<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <rect width="900" height="380" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#004065">Network Cost vs. Latency Trade-offs</text>

  <!-- Panel dividers -->
  <line x1="295" y1="50" x2="295" y2="360" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="600" y1="50" x2="600" y2="360" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- ===== LEFT: BUS ===== -->
  <text x="147" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#004065">Bus</text>

  <!-- Bus bar -->
  <rect x="110" y="195" width="75" height="12" rx="3" fill="#004065"/>

  <!-- 8 nodes connected to bus -->
  <!-- nodes on left side -->
  <circle cx="65" cy="100" r="13" fill="#004065" stroke="#003050" stroke-width="1.5"/>
  <text x="65" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">N0</text>
  <circle cx="65" cy="135" r="13" fill="#004065" stroke="#003050" stroke-width="1.5"/>
  <text x="65" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">N1</text>
  <circle cx="65" cy="170" r="13" fill="#004065" stroke="#003050" stroke-width="1.5"/>
  <text x="65" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">N2</text>
  <circle cx="65" cy="205" r="13" fill="#004065" stroke="#003050" stroke-width="1.5"/>
  <text x="65" y="209" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">N3</text>

  <!-- nodes on right side -->
  <circle cx="225" cy="100" r="13" fill="#004065" stroke="#003050" stroke-width="1.5"/>
  <text x="225" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">N4</text>
  <circle cx="225" cy="135" r="13" fill="#004065" stroke="#003050" stroke-width="1.5"/>
  <text x="225" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">N5</text>
  <circle cx="225" cy="170" r="13" fill="#004065" stroke="#003050" stroke-width="1.5"/>
  <text x="225" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">N6</text>
  <circle cx="225" cy="205" r="13" fill="#004065" stroke="#003050" stroke-width="1.5"/>
  <text x="225" y="209" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">N7</text>

  <!-- Lines from left nodes to bus -->
  <line x1="78" y1="100" x2="110" y2="201" stroke="#555" stroke-width="1.5"/>
  <line x1="78" y1="135" x2="110" y2="201" stroke="#555" stroke-width="1.5"/>
  <line x1="78" y1="170" x2="110" y2="201" stroke="#555" stroke-width="1.5"/>
  <line x1="78" y1="205" x2="110" y2="201" stroke="#555" stroke-width="1.5"/>

  <!-- Lines from right nodes to bus -->
  <line x1="212" y1="100" x2="185" y2="201" stroke="#555" stroke-width="1.5"/>
  <line x1="212" y1="135" x2="185" y2="201" stroke="#555" stroke-width="1.5"/>
  <line x1="212" y1="170" x2="185" y2="201" stroke="#555" stroke-width="1.5"/>
  <line x1="212" y1="205" x2="185" y2="201" stroke="#555" stroke-width="1.5"/>

  <text x="147" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">O(N) cost</text>
  <text x="147" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">O(N) latency</text>
  <text x="147" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">1 wire shared</text>
  <text x="147" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">by all nodes</text>

  <!-- ===== MIDDLE: MULTISTAGE ===== -->
  <text x="447" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#004065">Multistage</text>

  <!-- Inputs (8 nodes) -->
  <circle cx="315" cy="90" r="10" fill="#004065"/>
  <circle cx="315" cy="125" r="10" fill="#004065"/>
  <circle cx="315" cy="160" r="10" fill="#004065"/>
  <circle cx="315" cy="195" r="10" fill="#004065"/>
  <circle cx="315" cy="230" r="10" fill="#004065"/>
  <circle cx="315" cy="265" r="10" fill="#004065"/>
  <circle cx="315" cy="300" r="10" fill="#004065"/>
  <circle cx="315" cy="335" r="10" fill="#004065"/>

  <!-- Outputs (8 nodes) -->
  <circle cx="585" cy="90" r="10" fill="#004065"/>
  <circle cx="585" cy="125" r="10" fill="#004065"/>
  <circle cx="585" cy="160" r="10" fill="#004065"/>
  <circle cx="585" cy="195" r="10" fill="#004065"/>
  <circle cx="585" cy="230" r="10" fill="#004065"/>
  <circle cx="585" cy="265" r="10" fill="#004065"/>
  <circle cx="585" cy="300" r="10" fill="#004065"/>
  <circle cx="585" cy="335" r="10" fill="#004065"/>

  <!-- Stage 1 switches (4 switches) -->
  <rect x="360" y="82" width="28" height="50" rx="3" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="374" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#004065">S</text>
  <rect x="360" y="147" width="28" height="50" rx="3" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="374" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#004065">S</text>
  <rect x="360" y="212" width="28" height="50" rx="3" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="374" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#004065">S</text>
  <rect x="360" y="277" width="28" height="50" rx="3" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="374" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#004065">S</text>

  <!-- Stage 2 switches -->
  <rect x="425" y="82" width="28" height="50" rx="3" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="439" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#004065">S</text>
  <rect x="425" y="147" width="28" height="50" rx="3" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="439" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#004065">S</text>
  <rect x="425" y="212" width="28" height="50" rx="3" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="439" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#004065">S</text>
  <rect x="425" y="277" width="28" height="50" rx="3" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="439" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#004065">S</text>

  <!-- Stage 3 switches -->
  <rect x="490" y="82" width="28" height="50" rx="3" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="504" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#004065">S</text>
  <rect x="490" y="147" width="28" height="50" rx="3" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="504" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#004065">S</text>
  <rect x="490" y="212" width="28" height="50" rx="3" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="504" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#004065">S</text>
  <rect x="490" y="277" width="28" height="50" rx="3" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="504" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#004065">S</text>

  <!-- Input to Stage 1 lines -->
  <line x1="325" y1="90" x2="360" y2="97" stroke="#555" stroke-width="1"/>
  <line x1="325" y1="125" x2="360" y2="117" stroke="#555" stroke-width="1"/>
  <line x1="325" y1="160" x2="360" y2="162" stroke="#555" stroke-width="1"/>
  <line x1="325" y1="195" x2="360" y2="182" stroke="#555" stroke-width="1"/>
  <line x1="325" y1="230" x2="360" y2="227" stroke="#555" stroke-width="1"/>
  <line x1="325" y1="265" x2="360" y2="247" stroke="#555" stroke-width="1"/>
  <line x1="325" y1="300" x2="360" y2="292" stroke="#555" stroke-width="1"/>
  <line x1="325" y1="335" x2="360" y2="312" stroke="#555" stroke-width="1"/>

  <!-- Stage 3 to output lines -->
  <line x1="518" y1="97" x2="575" y2="90" stroke="#555" stroke-width="1"/>
  <line x1="518" y1="117" x2="575" y2="125" stroke="#555" stroke-width="1"/>
  <line x1="518" y1="162" x2="575" y2="160" stroke="#555" stroke-width="1"/>
  <line x1="518" y1="182" x2="575" y2="195" stroke="#555" stroke-width="1"/>
  <line x1="518" y1="227" x2="575" y2="230" stroke="#555" stroke-width="1"/>
  <line x1="518" y1="247" x2="575" y2="265" stroke="#555" stroke-width="1"/>
  <line x1="518" y1="292" x2="575" y2="300" stroke="#555" stroke-width="1"/>
  <line x1="518" y1="312" x2="575" y2="335" stroke="#555" stroke-width="1"/>

  <!-- Stage labels -->
  <text x="374" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">S1</text>
  <text x="439" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">S2</text>
  <text x="504" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">S3</text>

  <!-- Sweet spot arrow -->
  <defs>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M2,2 L4,6 L6,2" fill="none" stroke="#FF6B00" stroke-width="1.5"/>
    </marker>
  </defs>
  <line x1="447" y1="353" x2="447" y2="370" stroke="#FF6B00" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="447" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FF6B00">Sweet Spot!</text>

  <!-- Cost/latency labels -->
  <text x="447" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666" transform="rotate(-90 447 210)">O(N log N) cost</text>

  <!-- ===== RIGHT: CROSSBAR ===== -->
  <text x="747" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#004065">Crossbar</text>

  <!-- 4x4 crossbar grid -->
  <!-- Input lines -->
  <line x1="625" y1="120" x2="870" y2="120" stroke="#004065" stroke-width="1.5"/>
  <line x1="625" y1="165" x2="870" y2="165" stroke="#004065" stroke-width="1.5"/>
  <line x1="625" y1="210" x2="870" y2="210" stroke="#004065" stroke-width="1.5"/>
  <line x1="625" y1="255" x2="870" y2="255" stroke="#004065" stroke-width="1.5"/>

  <!-- Output lines (vertical) -->
  <line x1="680" y1="90" x2="680" y2="290" stroke="#004065" stroke-width="1.5"/>
  <line x1="730" y1="90" x2="730" y2="290" stroke="#004065" stroke-width="1.5"/>
  <line x1="780" y1="90" x2="780" y2="290" stroke="#004065" stroke-width="1.5"/>
  <line x1="830" y1="90" x2="830" y2="290" stroke="#004065" stroke-width="1.5"/>

  <!-- Switch points (16 dots) -->
  <circle cx="680" cy="120" r="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <circle cx="730" cy="120" r="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <circle cx="780" cy="120" r="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <circle cx="830" cy="120" r="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>

  <circle cx="680" cy="165" r="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <circle cx="730" cy="165" r="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <circle cx="780" cy="165" r="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <circle cx="830" cy="165" r="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>

  <circle cx="680" cy="210" r="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <circle cx="730" cy="210" r="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <circle cx="780" cy="210" r="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <circle cx="830" cy="210" r="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>

  <circle cx="680" cy="255" r="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <circle cx="730" cy="255" r="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <circle cx="780" cy="255" r="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <circle cx="830" cy="255" r="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>

  <!-- Input labels -->
  <text x="622" y="124" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">In0</text>
  <text x="622" y="169" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">In1</text>
  <text x="622" y="214" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">In2</text>
  <text x="622" y="259" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">In3</text>

  <!-- Output labels -->
  <text x="680" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Out0</text>
  <text x="730" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Out1</text>
  <text x="780" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Out2</text>
  <text x="830" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Out3</text>

  <text x="747" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">O(N²) cost</text>
  <text x="747" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">O(1) latency</text>
  <text x="747" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">N² crosspoints</text>

  <!-- Cost/latency for left panel -->
  <text x="147" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">(shared medium)</text>

  <!-- Multistage cost label -->
  <text x="447" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">O(N log N) cost</text>
  <text x="447" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">O(log N) latency</text>
</svg>
