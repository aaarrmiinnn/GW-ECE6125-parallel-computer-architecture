<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <rect width="800" height="420" fill="#f8f9fa"/>

  <defs>
    <marker id="pkArr" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#004065"/>
    </marker>
    <marker id="pkArrOrg" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#FF6B00"/>
    </marker>
    <marker id="pkArrGrn" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#1A8C1A"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#004065">Packet-Switched Omega Network</text>

  <!-- Stage labels -->
  <text x="270" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#004065">Stage 1</text>
  <text x="440" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#004065">Stage 2</text>
  <text x="610" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#004065">Stage 3</text>

  <!-- Input nodes (simplified 6 for clarity) -->
  <circle cx="75" cy="105" r="14" fill="#004065"/>
  <text x="75" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">000</text>
  <circle cx="75" cy="150" r="14" fill="#004065"/>
  <text x="75" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">001</text>
  <circle cx="75" cy="195" r="14" fill="#004065"/>
  <text x="75" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">010</text>
  <circle cx="75" cy="240" r="14" fill="#004065"/>
  <text x="75" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">011</text>
  <circle cx="75" cy="285" r="14" fill="#004065"/>
  <text x="75" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">100</text>
  <circle cx="75" cy="330" r="14" fill="#004065"/>
  <text x="75" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">101</text>
  <circle cx="75" cy="375" r="14" fill="#004065"/>
  <text x="75" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">110</text>

  <!-- Output nodes -->
  <circle cx="725" cy="105" r="14" fill="#004065"/>
  <text x="725" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">000</text>
  <circle cx="725" cy="150" r="14" fill="#004065"/>
  <text x="725" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">001</text>
  <circle cx="725" cy="195" r="14" fill="#004065"/>
  <text x="725" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">010</text>
  <circle cx="725" cy="240" r="14" fill="#004065"/>
  <text x="725" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">011</text>
  <circle cx="725" cy="285" r="14" fill="#004065"/>
  <text x="725" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">100</text>
  <circle cx="725" cy="330" r="14" fill="#004065"/>
  <text x="725" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">101</text>
  <circle cx="725" cy="375" r="14" fill="#004065"/>
  <text x="725" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">110</text>

  <!-- Stage 1 switches with buffer queues -->
  <!-- SW0 with buffer -->
  <rect x="245" y="92" width="50" height="67" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="270" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW0</text>
  <!-- Buffer queue at SW0 output -->
  <rect x="298" y="97" width="10" height="10" rx="1" fill="#FF6B00"/>
  <rect x="298" y="110" width="10" height="10" rx="1" fill="#FF6B00" opacity="0.7"/>
  <rect x="298" y="123" width="10" height="10" rx="1" fill="#ccc"/>

  <!-- SW1 -->
  <rect x="245" y="182" width="50" height="67" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="270" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW1</text>
  <!-- Buffer with waiting packet -->
  <rect x="298" y="187" width="10" height="10" rx="1" fill="#1A8C1A"/>
  <rect x="298" y="200" width="10" height="10" rx="1" fill="#ccc"/>
  <rect x="298" y="213" width="10" height="10" rx="1" fill="#ccc"/>
  <!-- Waiting label -->
  <text x="318" y="200" font-family="Arial, sans-serif" font-size="10" fill="#CC2222">⏳</text>

  <!-- SW2 -->
  <rect x="245" y="272" width="50" height="67" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="270" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW2</text>
  <rect x="298" y="277" width="10" height="10" rx="1" fill="#ccc"/>
  <rect x="298" y="290" width="10" height="10" rx="1" fill="#ccc"/>
  <rect x="298" y="303" width="10" height="10" rx="1" fill="#ccc"/>

  <!-- SW3 -->
  <rect x="245" y="362" width="50" height="28" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="270" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW3</text>

  <!-- Stage 2 switches -->
  <rect x="415" y="92" width="50" height="67" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="440" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW0</text>
  <rect x="468" y="97" width="10" height="10" rx="1" fill="#004065" opacity="0.6"/>
  <rect x="468" y="110" width="10" height="10" rx="1" fill="#ccc"/>

  <rect x="415" y="182" width="50" height="67" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="440" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW1</text>
  <rect x="468" y="187" width="10" height="10" rx="1" fill="#1A8C1A"/>
  <rect x="468" y="200" width="10" height="10" rx="1" fill="#ccc"/>

  <rect x="415" y="272" width="50" height="67" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="440" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW2</text>
  <rect x="415" y="362" width="50" height="28" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="440" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW3</text>

  <!-- Stage 3 switches -->
  <rect x="585" y="92" width="50" height="67" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="610" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW0</text>
  <rect x="585" y="182" width="50" height="67" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="610" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW1</text>
  <rect x="585" y="272" width="50" height="67" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="610" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW2</text>
  <rect x="585" y="362" width="50" height="28" rx="4" fill="white" stroke="#004065" stroke-width="2"/>
  <text x="610" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">SW3</text>

  <!-- Gray background wires -->
  <line x1="89" y1="105" x2="245" y2="105" stroke="#ccc" stroke-width="1.5"/>
  <line x1="89" y1="150" x2="245" y2="150" stroke="#ccc" stroke-width="1.5"/>
  <line x1="89" y1="195" x2="245" y2="195" stroke="#ccc" stroke-width="1.5"/>
  <line x1="89" y1="240" x2="245" y2="240" stroke="#ccc" stroke-width="1.5"/>
  <line x1="89" y1="285" x2="245" y2="285" stroke="#ccc" stroke-width="1.5"/>
  <line x1="89" y1="330" x2="245" y2="330" stroke="#ccc" stroke-width="1.5"/>
  <line x1="89" y1="375" x2="245" y2="375" stroke="#ccc" stroke-width="1.5"/>

  <!-- Inter-stage wires (shuffle) simplified -->
  <line x1="315" y1="105" x2="415" y2="105" stroke="#ccc" stroke-width="1.5"/>
  <line x1="315" y1="150" x2="415" y2="195" stroke="#ccc" stroke-width="1.5"/>
  <line x1="315" y1="195" x2="415" y2="285" stroke="#ccc" stroke-width="1.5"/>
  <line x1="315" y1="240" x2="415" y2="375" stroke="#ccc" stroke-width="1.5"/>
  <line x1="315" y1="285" x2="415" y2="150" stroke="#ccc" stroke-width="1.5"/>
  <line x1="315" y1="330" x2="415" y2="240" stroke="#ccc" stroke-width="1.5"/>
  <line x1="315" y1="375" x2="415" y2="330" stroke="#ccc" stroke-width="1.5"/>

  <line x1="485" y1="105" x2="585" y2="105" stroke="#ccc" stroke-width="1.5"/>
  <line x1="485" y1="150" x2="585" y2="195" stroke="#ccc" stroke-width="1.5"/>
  <line x1="485" y1="195" x2="585" y2="285" stroke="#ccc" stroke-width="1.5"/>
  <line x1="485" y1="240" x2="585" y2="375" stroke="#ccc" stroke-width="1.5"/>
  <line x1="485" y1="285" x2="585" y2="150" stroke="#ccc" stroke-width="1.5"/>
  <line x1="485" y1="330" x2="585" y2="240" stroke="#ccc" stroke-width="1.5"/>
  <line x1="485" y1="375" x2="585" y2="330" stroke="#ccc" stroke-width="1.5"/>

  <line x1="635" y1="105" x2="711" y2="105" stroke="#ccc" stroke-width="1.5"/>
  <line x1="635" y1="150" x2="711" y2="195" stroke="#ccc" stroke-width="1.5"/>
  <line x1="635" y1="195" x2="711" y2="285" stroke="#ccc" stroke-width="1.5"/>
  <line x1="635" y1="240" x2="711" y2="375" stroke="#ccc" stroke-width="1.5"/>
  <line x1="635" y1="285" x2="711" y2="150" stroke="#ccc" stroke-width="1.5"/>
  <line x1="635" y1="330" x2="711" y2="240" stroke="#ccc" stroke-width="1.5"/>
  <line x1="635" y1="375" x2="711" y2="330" stroke="#ccc" stroke-width="1.5"/>

  <!-- Packet A (orange) — flowing freely at Stage 2 -->
  <!-- Packet representation as colored square moving along wire -->
  <rect x="380" y="97" width="18" height="12" rx="2" fill="#FF6B00" stroke="#CC4400" stroke-width="1"/>
  <text x="389" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">PKT</text>
  <!-- Arrow showing it's moving -->
  <line x1="398" y1="103" x2="414" y2="103" stroke="#FF6B00" stroke-width="2" marker-end="url(#pkArrOrg)"/>

  <!-- Packet B (green) — mid-Stage 3 flowing freely -->
  <rect x="550" y="278" width="18" height="12" rx="2" fill="#1A8C1A" stroke="#115511" stroke-width="1"/>
  <text x="559" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">PKT</text>
  <line x1="568" y1="284" x2="584" y2="284" stroke="#1A8C1A" stroke-width="2" marker-end="url(#pkArrGrn)"/>

  <!-- Waiting packet (blue) with buffer label -->
  <rect x="310" y="178" width="18" height="12" rx="2" fill="#004065" stroke="#002a40" stroke-width="1"/>
  <text x="319" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">PKT</text>
  <text x="355" y="183" font-family="Arial, sans-serif" font-size="10" fill="#CC2222">⏳ waiting</text>

  <!-- Header annotation -->
  <rect x="82" y="98" width="30" height="10" rx="2" fill="#FFD200" stroke="#CC8800" stroke-width="1"/>
  <text x="97" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#004065">HDR</text>
  <text x="97" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#004065">dest</text>
  <line x1="97" y1="116" x2="97" y2="112" stroke="#004065" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Labels -->
  <text x="400" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#004065" font-weight="bold">Each packet self-routes using its header</text>
  <text x="400" y="413" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Buffers absorb contention — packets queue at congested switches</text>

  <!-- Legend -->
  <rect x="30" y="40" width="12" height="8" rx="1" fill="#FF6B00"/>
  <text x="47" y="49" font-family="Arial, sans-serif" font-size="10" fill="#FF6B00">Flowing packet</text>
  <rect x="150" y="40" width="12" height="8" rx="1" fill="#004065"/>
  <text x="167" y="49" font-family="Arial, sans-serif" font-size="10" fill="#004065">Waiting packet</text>
  <rect x="270" y="40" width="12" height="8" rx="1" fill="#ccc"/>
  <text x="287" y="49" font-family="Arial, sans-serif" font-size="10" fill="#888">Empty buffer slot</text>
</svg>
