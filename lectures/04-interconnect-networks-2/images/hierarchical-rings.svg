<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#f8f9fa"/>

  <defs>
    <marker id="hrArr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#555"/>
    </marker>
    <marker id="hrArrG" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#CC8800"/>
    </marker>
    <marker id="hrArrB" markerWidth="7" markerHeight="7" refX="1.5" refY="3.5" orient="auto">
      <path d="M7,0 L7,7 L0,3.5 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#004065">Hierarchical Ring Topology (16 Nodes)</text>

  <!-- Global ring label -->
  <text x="400" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#CC8800" font-weight="bold">--- Global Ring (dashed gold) ---</text>

  <!-- ===== LOCAL RING 1 (top-left): nodes 0,1,2,3 center=(190, 180) r=65 ===== -->
  <!-- Nodes at angles: 0=top(190,115), 1=right(255,180), 2=bottom(190,245), 3=left(125,180) -->
  <!-- Local ring connections (bidirectional) -->
  <line x1="190" y1="128" x2="243" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#hrArr)" marker-start="url(#hrArrB)"/>
  <line x1="255" y1="188" x2="200" y2="238" stroke="#555" stroke-width="1.5" marker-end="url(#hrArr)" marker-start="url(#hrArrB)"/>
  <line x1="180" y1="245" x2="127" y2="192" stroke="#555" stroke-width="1.5" marker-end="url(#hrArr)" marker-start="url(#hrArrB)"/>
  <line x1="125" y1="172" x2="178" y2="125" stroke="#555" stroke-width="1.5" marker-end="url(#hrArr)" marker-start="url(#hrArrB)"/>

  <!-- Nodes: Node 0 is bridge (gold outline) -->
  <circle cx="190" cy="115" r="20" fill="#004065" stroke="#FFD200" stroke-width="3"/>
  <text x="190" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">0</text>
  <circle cx="255" cy="180" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="255" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">1</text>
  <circle cx="190" cy="245" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="190" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">2</text>
  <circle cx="125" cy="180" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="125" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">3</text>
  <text x="190" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Local Ring 1</text>

  <!-- ===== LOCAL RING 2 (top-right): nodes 4,5,6,7 center=(610, 180) ===== -->
  <line x1="610" y1="128" x2="663" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#hrArr)" marker-start="url(#hrArrB)"/>
  <line x1="675" y1="188" x2="620" y2="238" stroke="#555" stroke-width="1.5" marker-end="url(#hrArr)" marker-start="url(#hrArrB)"/>
  <line x1="600" y1="245" x2="547" y2="192" stroke="#555" stroke-width="1.5" marker-end="url(#hrArr)" marker-start="url(#hrArrB)"/>
  <line x1="545" y1="172" x2="598" y2="125" stroke="#555" stroke-width="1.5" marker-end="url(#hrArr)" marker-start="url(#hrArrB)"/>

  <circle cx="610" cy="115" r="20" fill="#004065" stroke="#FFD200" stroke-width="3"/>
  <text x="610" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">4</text>
  <circle cx="675" cy="180" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="675" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">5</text>
  <circle cx="610" cy="245" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="610" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">6</text>
  <circle cx="545" cy="180" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="545" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">7</text>
  <text x="610" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Local Ring 2</text>

  <!-- ===== LOCAL RING 3 (bottom-left): nodes 8,9,10,11 center=(190, 440) ===== -->
  <line x1="190" y1="388" x2="243" y2="430" stroke="#555" stroke-width="1.5" marker-end="url(#hrArr)" marker-start="url(#hrArrB)"/>
  <line x1="255" y1="448" x2="200" y2="498" stroke="#555" stroke-width="1.5" marker-end="url(#hrArr)" marker-start="url(#hrArrB)"/>
  <line x1="180" y1="505" x2="127" y2="452" stroke="#555" stroke-width="1.5" marker-end="url(#hrArr)" marker-start="url(#hrArrB)"/>
  <line x1="125" y1="432" x2="178" y2="385" stroke="#555" stroke-width="1.5" marker-end="url(#hrArr)" marker-start="url(#hrArrB)"/>

  <circle cx="190" cy="375" r="20" fill="#004065" stroke="#FFD200" stroke-width="3"/>
  <text x="190" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">8</text>
  <circle cx="255" cy="440" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="255" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">9</text>
  <circle cx="190" cy="505" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="190" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">10</text>
  <circle cx="125" cy="440" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="125" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">11</text>
  <text x="190" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Local Ring 3</text>

  <!-- ===== LOCAL RING 4 (bottom-right): nodes 12,13,14,15 center=(610, 440) ===== -->
  <line x1="610" y1="388" x2="663" y2="430" stroke="#555" stroke-width="1.5" marker-end="url(#hrArr)" marker-start="url(#hrArrB)"/>
  <line x1="675" y1="448" x2="620" y2="498" stroke="#555" stroke-width="1.5" marker-end="url(#hrArr)" marker-start="url(#hrArrB)"/>
  <line x1="600" y1="505" x2="547" y2="452" stroke="#555" stroke-width="1.5" marker-end="url(#hrArr)" marker-start="url(#hrArrB)"/>
  <line x1="545" y1="432" x2="598" y2="385" stroke="#555" stroke-width="1.5" marker-end="url(#hrArr)" marker-start="url(#hrArrB)"/>

  <circle cx="610" cy="375" r="20" fill="#004065" stroke="#FFD200" stroke-width="3"/>
  <text x="610" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">12</text>
  <circle cx="675" cy="440" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="675" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">13</text>
  <circle cx="610" cy="505" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="610" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">14</text>
  <circle cx="545" cy="440" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="545" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">15</text>
  <text x="610" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Local Ring 4</text>

  <!-- ===== GLOBAL RING: connects bridge nodes 0(190,115), 4(610,115), 12(610,375), 8(190,375) ===== -->
  <!-- Global ring as dashed gold lines -->
  <!-- 0→4: top horizontal -->
  <line x1="210" y1="108" x2="590" y2="108" stroke="#CC8800" stroke-width="2.5" stroke-dasharray="10,5" marker-end="url(#hrArrG)"/>
  <!-- 4→12: right vertical -->
  <line x1="620" y1="130" x2="620" y2="358" stroke="#CC8800" stroke-width="2.5" stroke-dasharray="10,5" marker-end="url(#hrArrG)"/>
  <!-- 12→8: bottom horizontal -->
  <line x1="590" y1="382" x2="210" y2="382" stroke="#CC8800" stroke-width="2.5" stroke-dasharray="10,5" marker-end="url(#hrArrG)"/>
  <!-- 8→0: left vertical -->
  <line x1="180" y1="358" x2="180" y2="130" stroke="#CC8800" stroke-width="2.5" stroke-dasharray="10,5" marker-end="url(#hrArrG)"/>

  <!-- Global Ring label -->
  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#CC8800">Global Ring</text>

  <!-- Bridge node legend -->
  <circle cx="40" cy="565" r="10" fill="#004065" stroke="#FFD200" stroke-width="2.5"/>
  <text x="57" y="569" font-family="Arial, sans-serif" font-size="11" fill="#333">Bridge node (larger, gold outline)</text>
  <line x1="250" y1="565" x2="275" y2="565" stroke="#CC8800" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="285" y="569" font-family="Arial, sans-serif" font-size="11" fill="#CC8800">Global ring connection</text>

  <!-- Annotation -->
  <rect x="120" y="548" width="560" height="20" rx="4" fill="none"/>
  <text x="400" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#004065">Latency: O(√N) instead of O(N) for long-distance paths</text>
</svg>
