  <text x="185" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S1a</text>

  <rect x="160" y="139" width="50" height="16" rx="3" fill="#004065"/>
  <text x="185" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">S1b</text>
