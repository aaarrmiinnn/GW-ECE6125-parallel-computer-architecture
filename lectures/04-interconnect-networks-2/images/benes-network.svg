  <line x1="610" y1="345" x2="690" y2="345" stroke="#aaa" stroke-width="1.5"/>
  <line x1="610" y1="185" x2="690" y2="345" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="610" y1="345" x2="690" y2="185" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3"/>

  <line x1="610" y1="225" x2="690" y2="225" stroke="#aaa" stroke-width="1.5"/>
