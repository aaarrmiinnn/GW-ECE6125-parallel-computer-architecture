  <line x1="70" y1="185" x2="160" y2="185" stroke="#aaa" stroke-width="1.5"/>
  <line x1="70" y1="225" x2="160" y2="225" stroke="#aaa" stroke-width="1.5"/>
  <line x1="70" y1="265" x2="160" y2="265" stroke="#aaa" stroke-width="1.5"/>
  <line x1="70" y1="305" x2="160" y2="305" stroke="#aaa" stroke-width="1.5"/>
  <line x1="70" y1="345" x2="160" y2="345" stroke="#aaa" stroke-width="1.5"/>
  <line x1="70" y1="385" x2="160" y2="385" stroke="#aaa" stroke-width="1.5"/>

