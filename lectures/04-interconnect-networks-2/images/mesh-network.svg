<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 600" width="650" height="600">
  <rect width="650" height="600" fill="#f8f9fa"/>

  <defs>
    <marker id="mArr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#555"/>
    </marker>
    <marker id="mArrB" markerWidth="7" markerHeight="7" refX="1.5" refY="3.5" orient="auto">
      <path d="M7,0 L7,7 L0,3.5 z" fill="#555"/>
    </marker>
    <marker id="mArrG" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#CC8800"/>
    </marker>
    <marker id="mArrGB" markerWidth="8" markerHeight="8" refX="1.5" refY="3.5" orient="auto">
      <path d="M8,0 L8,7 L0,3.5 z" fill="#CC8800"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="325" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#004065">4×4 Mesh Network</text>

  <!-- Grid: 4x4, spacing=110px, start at (80, 65) -->
  <!-- Row 0: y=65, Row 1: y=175, Row 2: y=285, Row 3: y=395 -->
  <!-- Col 0: x=80, Col 1: x=200, Col 2: x=320, Col 3: x=440 -->

  <!-- Horizontal links -->
  <!-- Row 0 -->
  <line x1="100" y1="65" x2="178" y2="65" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <line x1="220" y1="65" x2="298" y2="65" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <line x1="340" y1="65" x2="418" y2="65" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <!-- Row 1 -->
  <line x1="100" y1="175" x2="178" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <line x1="220" y1="175" x2="298" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <line x1="340" y1="175" x2="418" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <!-- Row 2 -->
  <line x1="100" y1="285" x2="178" y2="285" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <line x1="220" y1="285" x2="298" y2="285" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <line x1="340" y1="285" x2="418" y2="285" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <!-- Row 3 -->
  <line x1="100" y1="395" x2="178" y2="395" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <line x1="220" y1="395" x2="298" y2="395" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <line x1="340" y1="395" x2="418" y2="395" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>

  <!-- Vertical links -->
  <!-- Col 0 -->
  <line x1="80" y1="85" x2="80" y2="153" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <line x1="80" y1="195" x2="80" y2="263" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <line x1="80" y1="305" x2="80" y2="373" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <!-- Col 1 -->
  <line x1="200" y1="85" x2="200" y2="153" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <line x1="200" y1="195" x2="200" y2="263" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <line x1="200" y1="305" x2="200" y2="373" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <!-- Col 2 -->
  <line x1="320" y1="85" x2="320" y2="153" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <line x1="320" y1="195" x2="320" y2="263" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <line x1="320" y1="305" x2="320" y2="373" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <!-- Col 3 -->
  <line x1="440" y1="85" x2="440" y2="153" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <line x1="440" y1="195" x2="440" y2="263" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>
  <line x1="440" y1="305" x2="440" y2="373" stroke="#555" stroke-width="1.5" marker-end="url(#mArr)" marker-start="url(#mArrB)"/>

  <!-- ===== HIGHLIGHTED XY ROUTING PATH: 0→1→2→6→10→14 ===== -->
  <!-- 0=(80,65), 1=(200,65), 2=(320,65), 6=(320,175), 10=(320,285), 14=(440,395)? Wait: -->
  <!-- Node numbering: row-major: 0=(80,65),1=(200,65),2=(320,65),3=(440,65) -->
  <!--                            4=(80,175),5=(200,175),6=(320,175),7=(440,175) -->
  <!--                            8=(80,285),9=(200,285),10=(320,285),11=(440,285) -->
  <!--                           12=(80,395),13=(200,395),14=(320,395),15=(440,395) -->
  <!-- Path 0→1→2→6→10→14: go East to col 2, then South to row 3, then East to col 3? -->
  <!-- Actually for node 14=(320,395) we need: 0(80,65)→1(200,65)→2(320,65)→6(320,175)→10(320,285)→14(320,395) -->
  <!-- That goes East twice then South three times to reach node 14 -->
  <!-- Actually 14 is at (320,395), not (440,395). Node 15=(440,395). Let me use 0→1→2→6→10→14 which ends at col2 row3 -->

  <!-- Highlight path: 0→1 (East) -->
  <line x1="100" y1="65" x2="178" y2="65" stroke="#CC8800" stroke-width="4" marker-end="url(#mArrG)"/>
  <!-- 1→2 (East) -->
  <line x1="220" y1="65" x2="298" y2="65" stroke="#CC8800" stroke-width="4" marker-end="url(#mArrG)"/>
  <!-- 2→6 (South) -->
  <line x1="320" y1="85" x2="320" y2="153" stroke="#CC8800" stroke-width="4" marker-end="url(#mArrG)"/>
  <!-- 6→10 (South) -->
  <line x1="320" y1="195" x2="320" y2="263" stroke="#CC8800" stroke-width="4" marker-end="url(#mArrG)"/>
  <!-- 10→14 (South) -->
  <line x1="320" y1="305" x2="320" y2="373" stroke="#CC8800" stroke-width="4" marker-end="url(#mArrG)"/>

  <!-- Nodes (draw on top of wires) -->
  <!-- Row 0 -->
  <circle cx="80" cy="65" r="20" fill="#FF8C00" stroke="#CC5500" stroke-width="2.5"/>
  <text x="80" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">0</text>
  <circle cx="200" cy="65" r="18" fill="#FFD200" stroke="#CC8800" stroke-width="2"/>
  <text x="200" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#004065">1</text>
  <circle cx="320" cy="65" r="18" fill="#FFD200" stroke="#CC8800" stroke-width="2"/>
  <text x="320" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#004065">2</text>
  <circle cx="440" cy="65" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="440" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">3</text>
  <!-- Row 1 -->
  <circle cx="80" cy="175" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="80" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">4</text>
  <circle cx="200" cy="175" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="200" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">5</text>
  <circle cx="320" cy="175" r="18" fill="#FFD200" stroke="#CC8800" stroke-width="2"/>
  <text x="320" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#004065">6</text>
  <circle cx="440" cy="175" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="440" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">7</text>
  <!-- Row 2 -->
  <circle cx="80" cy="285" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="80" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">8</text>
  <circle cx="200" cy="285" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="200" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">9</text>
  <circle cx="320" cy="285" r="18" fill="#FFD200" stroke="#CC8800" stroke-width="2"/>
  <text x="320" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#004065">10</text>
  <circle cx="440" cy="285" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="440" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">11</text>
  <!-- Row 3 -->
  <circle cx="80" cy="395" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="80" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">12</text>
  <circle cx="200" cy="395" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="200" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">13</text>
  <circle cx="320" cy="395" r="20" fill="#1A8C1A" stroke="#115511" stroke-width="2.5"/>
  <text x="320" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">14</text>
  <circle cx="440" cy="395" r="18" fill="#004065" stroke="#002a40" stroke-width="1.5"/>
  <text x="440" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">15</text>

  <!-- Degree annotations -->
  <!-- Corner node 0: degree 2 -->
  <text x="45" y="48" font-family="Arial, sans-serif" font-size="10" fill="#CC2222">deg=2</text>
  <line x1="60" y1="50" x2="72" y2="57" stroke="#CC2222" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Center node 5: degree 4 -->
  <text x="158" y="175" font-family="Arial, sans-serif" font-size="9" fill="#666">deg=4</text>

  <!-- Path label -->
  <text x="325" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#CC8800">XY Routing: East first (0→1→2), then South (2→6→10→14)</text>
  <text x="325" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Source: Node 0, Destination: Node 14</text>

  <!-- Warning annotation -->
  <rect x="50" y="480" width="550" height="40" rx="5" fill="#FFF0CC" stroke="#CC8800" stroke-width="1.5"/>
  <text x="325" y="497" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#CC4400">Non-uniform connectivity:</text>
  <text x="325" y="514" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Edge nodes: degree 2 — Corner nodes: degree 2 — Interior nodes: degree 4</text>

  <!-- Legend -->
  <circle cx="65" cy="550" r="10" fill="#FF8C00"/>
  <text x="82" y="554" font-family="Arial, sans-serif" font-size="11" fill="#333">Source</text>
  <circle cx="150" cy="550" r="10" fill="#1A8C1A"/>
  <text x="167" y="554" font-family="Arial, sans-serif" font-size="11" fill="#333">Destination</text>
  <circle cx="260" cy="550" r="10" fill="#FFD200" stroke="#CC8800" stroke-width="1.5"/>
  <text x="277" y="554" font-family="Arial, sans-serif" font-size="11" fill="#333">On XY path</text>
  <circle cx="370" cy="550" r="10" fill="#004065"/>
  <text x="387" y="554" font-family="Arial, sans-serif" font-size="11" fill="#333">Other nodes</text>
</svg>
