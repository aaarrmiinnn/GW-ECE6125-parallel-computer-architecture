<svg width="680" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family: sans-serif;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- CPU 0 (holds M state) -->
<rect x="60" y="40" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#712B13" x="140" y="65" text-anchor="middle">CPU 0</text>
<text font-size="12" fill="#993C1D" x="140" y="83" text-anchor="middle">holds X in M state</text>

<!-- CPU 1 (wants to read) -->
<rect x="460" y="40" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#085041" x="540" y="65" text-anchor="middle">CPU 1</text>
<text font-size="12" fill="#0F6E56" x="540" y="83" text-anchor="middle">wants to read X</text>

<!-- Main memory -->
<rect x="240" y="380" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#2C2C2A" x="340" y="403" text-anchor="middle">Main memory</text>
<text font-size="12" fill="#5F5E5A" x="340" y="421" text-anchor="middle">stale copy of X</text>

<!-- Transaction 1: CPU0 writeback to memory -->
<path d="M 140 96 L 140 300 L 280 300 L 280 379" fill="none" stroke="#D85A30" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Transaction 1 label -->
<rect x="60" y="180" width="160" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#712B13" x="140" y="198" text-anchor="middle">Transaction 1</text>
<text font-size="12" fill="#993C1D" x="140" y="216" text-anchor="middle">writeback X to memory</text>

<!-- Transaction 2: CPU1 fetch from memory -->
<path d="M 400 379 L 400 300 L 540 300 L 540 97" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Transaction 2 label -->
<rect x="460" y="180" width="160" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#085041" x="540" y="198" text-anchor="middle">Transaction 2</text>
<text font-size="12" fill="#0F6E56" x="540" y="216" text-anchor="middle">fetch X from memory</text>

<!-- Unnecessary middleman annotation -->
<rect x="240" y="290" width="200" height="28" rx="6" fill="none" stroke="#E24B4A" stroke-width="1" stroke-dasharray="4 3"/>
<text font-size="12" fill="#A32D2D" x="340" y="309" text-anchor="middle">unnecessary middleman</text>

<!-- "Data could go directly" dashed line -->
<line x1="222" y1="68" x2="458" y2="68" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<text font-size="12" fill="#888780" x="340" y="62" text-anchor="middle">data could go directly here</text>

<!-- Cost callout -->
<rect x="240" y="136" width="200" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#791F1F" x="340" y="158" text-anchor="middle">2 memory transactions</text>
<text font-size="12" fill="#A32D2D" x="340" y="178" text-anchor="middle">200–400 ns each on multi-socket</text>

</svg>
