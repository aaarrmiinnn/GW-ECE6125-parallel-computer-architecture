<svg width="680" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family: sans-serif;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- subtitle -->
<text font-size="12" fill="#888780" x="40" y="36">data flows forward in time — F always follows the data</text>

<!-- T1: memory → Cache A (F) -->
<text font-size="12" fill="#888780" x="80" y="74" text-anchor="middle">t=1</text>
<rect x="40" y="82" width="80" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#2C2C2A" x="80" y="104" text-anchor="middle" dominant-baseline="central">memory</text>
<path d="M 120 104 L 176 104" fill="none" stroke="#EF9F27" stroke-width="2" marker-end="url(#arrow)"/>
<text font-size="12" fill="#854F0B" x="148" y="96" text-anchor="middle">data</text>
<rect x="178" y="82" width="100" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text font-size="14" font-weight="500" fill="#633806" x="228" y="100" text-anchor="middle" dominant-baseline="central">Cache A</text>
<text font-size="12" fill="#854F0B" x="228" y="116" text-anchor="middle" dominant-baseline="central">reads X → F</text>

<!-- F=A annotation -->
<rect x="610" y="82" width="60" height="44" rx="6" fill="none" stroke="#EF9F27" stroke-width="1" opacity="0.6"/>
<text font-size="12" fill="#854F0B" x="640" y="108" text-anchor="middle" dominant-baseline="central">F = A</text>

<!-- Dotted drop from A(F) to A(S) -->
<line x1="228" y1="126" x2="228" y2="170" stroke="#EF9F27" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

<!-- T2: Cache A (F→S) → Cache B (F) -->
<text font-size="12" fill="#888780" x="228" y="162" text-anchor="middle">t=2</text>
<rect x="178" y="170" width="100" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#0C447C" x="228" y="188" text-anchor="middle" dominant-baseline="central">Cache A</text>
<text font-size="12" fill="#185FA5" x="228" y="204" text-anchor="middle" dominant-baseline="central">F → S</text>
<path d="M 278 192 L 334 192" fill="none" stroke="#EF9F27" stroke-width="2" marker-end="url(#arrow)"/>
<text font-size="12" fill="#854F0B" x="306" y="184" text-anchor="middle">data</text>
<rect x="336" y="170" width="100" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text font-size="14" font-weight="500" fill="#633806" x="386" y="188" text-anchor="middle" dominant-baseline="central">Cache B</text>
<text font-size="12" fill="#854F0B" x="386" y="204" text-anchor="middle" dominant-baseline="central">reads X → F</text>

<!-- F=B annotation -->
<rect x="610" y="170" width="60" height="44" rx="6" fill="none" stroke="#EF9F27" stroke-width="1" opacity="0.6"/>
<text font-size="12" fill="#854F0B" x="640" y="196" text-anchor="middle" dominant-baseline="central">F = B</text>

<!-- Dotted drop from B(F) to B(S) -->
<line x1="386" y1="214" x2="386" y2="258" stroke="#EF9F27" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

<!-- T3: Cache B (F→S) → Cache C (F) -->
<text font-size="12" fill="#888780" x="386" y="250" text-anchor="middle">t=3</text>
<rect x="336" y="258" width="100" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#0C447C" x="386" y="276" text-anchor="middle" dominant-baseline="central">Cache B</text>
<text font-size="12" fill="#185FA5" x="386" y="292" text-anchor="middle" dominant-baseline="central">F → S</text>
<path d="M 436 280 L 492 280" fill="none" stroke="#EF9F27" stroke-width="2" marker-end="url(#arrow)"/>
<text font-size="12" fill="#854F0B" x="464" y="272" text-anchor="middle">data</text>
<rect x="494" y="258" width="100" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text font-size="14" font-weight="500" fill="#633806" x="544" y="276" text-anchor="middle" dominant-baseline="central">Cache C</text>
<text font-size="12" fill="#854F0B" x="544" y="292" text-anchor="middle" dominant-baseline="central">reads X → F</text>

<!-- F=C annotation -->
<rect x="610" y="258" width="60" height="44" rx="6" fill="none" stroke="#EF9F27" stroke-width="1" opacity="0.6"/>
<text font-size="12" fill="#854F0B" x="640" y="284" text-anchor="middle" dominant-baseline="central">F = C</text>

<!-- Summary bar -->
<rect x="40" y="322" width="630" height="28" rx="6" fill="none" stroke="#888780" stroke-width="0.5" opacity="0.3"/>
<text font-size="12" fill="#444441" x="340" y="340" text-anchor="middle" dominant-baseline="central">F is not assigned by a controller — it transfers automatically as data moves</text>

</svg>
