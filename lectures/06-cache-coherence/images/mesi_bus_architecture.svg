<svg width="680" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family: sans-serif;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- CPU core 0 -->
<rect x="40" y="40" width="120" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#085041" x="100" y="67" text-anchor="middle">CPU core 0</text>

<!-- L1 cache 0 -->
<rect x="40" y="96" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#085041" x="100" y="118" text-anchor="middle">L1 cache 0</text>
<text font-size="12" fill="#0F6E56" x="100" y="136" text-anchor="middle">state bits: M E S I</text>

<!-- CPU core 1 -->
<rect x="190" y="40" width="120" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#085041" x="250" y="67" text-anchor="middle">CPU core 1</text>

<!-- L1 cache 1 -->
<rect x="190" y="96" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#085041" x="250" y="118" text-anchor="middle">L1 cache 1</text>
<text font-size="12" fill="#0F6E56" x="250" y="136" text-anchor="middle">state bits: M E S I</text>

<!-- CPU core 2 -->
<rect x="340" y="40" width="120" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#085041" x="400" y="67" text-anchor="middle">CPU core 2</text>

<!-- L1 cache 2 -->
<rect x="340" y="96" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#085041" x="400" y="118" text-anchor="middle">L1 cache 2</text>
<text font-size="12" fill="#0F6E56" x="400" y="136" text-anchor="middle">state bits: M E S I</text>

<!-- Memory controller -->
<rect x="500" y="40" width="140" height="112" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#3C3489" x="570" y="84" text-anchor="middle">Memory</text>
<text font-size="14" font-weight="500" fill="#3C3489" x="570" y="104" text-anchor="middle">controller</text>

<!-- Vertical drops to bus -->
<line x1="100" y1="152" x2="100" y2="210" stroke="#888780" stroke-width="1" opacity="0.4"/>
<line x1="250" y1="152" x2="250" y2="210" stroke="#888780" stroke-width="1" opacity="0.4"/>
<line x1="400" y1="152" x2="400" y2="210" stroke="#888780" stroke-width="1" opacity="0.4"/>
<line x1="570" y1="152" x2="570" y2="210" stroke="#888780" stroke-width="1" opacity="0.4"/>

<!-- Bus bundle outline -->
<rect x="40" y="207" width="590" height="86" rx="6" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.3"/>
<text font-size="12" fill="#888780" x="340" y="204" text-anchor="middle">system bus</text>

<!-- Address bus -->
<rect x="40" y="212" width="590" height="14" rx="3" fill="none" stroke="#378ADD" stroke-width="1.5" opacity="0.8"/>
<text font-size="12" fill="#185FA5" x="26" y="222" text-anchor="end">addr</text>

<!-- Data bus -->
<rect x="40" y="234" width="590" height="14" rx="3" fill="none" stroke="#1D9E75" stroke-width="1.5" opacity="0.8"/>
<text font-size="12" fill="#0F6E56" x="26" y="244" text-anchor="end">data</text>

<!-- Control bus -->
<rect x="40" y="256" width="590" height="14" rx="3" fill="none" stroke="#888780" stroke-width="1.5" opacity="0.8"/>
<text font-size="12" fill="#5F5E5A" x="26" y="266" text-anchor="end">ctrl</text>

<!-- Shared line -->
<rect x="40" y="278" width="590" height="10" rx="3" fill="none" stroke="#EF9F27" stroke-width="2" stroke-dasharray="8 4"/>
<text font-size="12" fill="#BA7517" x="26" y="285" text-anchor="end">shared</text>

<!-- Vertical drops to memory -->
<line x1="100" y1="293" x2="100" y2="350" stroke="#888780" stroke-width="1" opacity="0.3"/>
<line x1="250" y1="293" x2="250" y2="350" stroke="#888780" stroke-width="1" opacity="0.3"/>
<line x1="400" y1="293" x2="400" y2="350" stroke="#888780" stroke-width="1" opacity="0.3"/>
<line x1="570" y1="293" x2="570" y2="350" stroke="#888780" stroke-width="1" opacity="0.3"/>

<!-- Main memory -->
<rect x="40" y="352" width="590" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-size="14" font-weight="500" fill="#2C2C2A" x="335" y="374" text-anchor="middle">Main memory</text>
<text font-size="12" fill="#5F5E5A" x="335" y="394" text-anchor="middle">source of truth when no cache holds M state</text>

<!-- Legend -->
<rect x="40" y="430" width="590" height="70" rx="8" fill="none" stroke="#888780" stroke-width="0.5" opacity="0.3"/>

<rect x="60" y="447" width="40" height="8" rx="2" fill="none" stroke="#378ADD" stroke-width="1.5" opacity="0.8"/>
<text font-size="12" fill="#444441" x="108" y="455">address bus — carries the memory address being requested</text>

<rect x="60" y="464" width="40" height="8" rx="2" fill="none" stroke="#1D9E75" stroke-width="1.5" opacity="0.8"/>
<text font-size="12" fill="#444441" x="108" y="472">data bus — carries the actual cache line data</text>

<rect x="60" y="481" width="40" height="8" rx="2" fill="none" stroke="#888780" stroke-width="1.5" opacity="0.8"/>
<text font-size="12" fill="#444441" x="108" y="489">control bus — carries read/write/invalidate signals</text>

<line x1="60" y1="502" x2="100" y2="502" stroke="#EF9F27" stroke-width="2" stroke-dasharray="8 4"/>
<text font-size="12" fill="#BA7517" x="108" y="506">shared line — binary HIGH/LOW; MESI's only added wire</text>

</svg>
