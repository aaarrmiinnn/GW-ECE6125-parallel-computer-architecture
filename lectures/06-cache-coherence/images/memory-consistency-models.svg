<svg width="680" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family: sans-serif;">

<!-- Title -->
<text font-size="14" font-weight="600" fill="#004065" x="340" y="28" text-anchor="middle">Can the CPU reorder these operations?</text>

<!-- Column headers -->
<rect x="40" y="44" width="600" height="40" rx="8" fill="#004065"/>
<text font-size="13" font-weight="500" fill="#ffffff" x="168" y="68" text-anchor="middle">Operation Pair</text>
<line x1="296" y1="44" x2="296" y2="84" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
<text font-size="13" font-weight="600" fill="#FFD200" x="370" y="62" text-anchor="middle">SC</text>
<text font-size="10" fill="#ffffff" x="370" y="76" text-anchor="middle" opacity="0.8">Sequential</text>
<line x1="444" y1="44" x2="444" y2="84" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
<text font-size="13" font-weight="600" fill="#FFD200" x="492" y="62" text-anchor="middle">TSO</text>
<text font-size="10" fill="#ffffff" x="492" y="76" text-anchor="middle" opacity="0.8">x86</text>
<line x1="540" y1="44" x2="540" y2="84" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
<text font-size="13" font-weight="600" fill="#FFD200" x="592" y="62" text-anchor="middle">WO</text>
<text font-size="10" fill="#ffffff" x="592" y="76" text-anchor="middle" opacity="0.8">ARM / RISC-V</text>

<!-- Row 1: Load → Load -->
<rect x="40" y="84" width="600" height="44" fill="#F8F7F4"/>
<text font-size="12" font-weight="500" fill="#2C2C2A" x="168" y="110" text-anchor="middle">Load → Load</text>
<rect x="343" y="96" width="54" height="22" rx="4" fill="#1a7a1a"/>
<text font-size="12" font-weight="600" fill="#ffffff" x="370" y="111" text-anchor="middle">✓</text>
<rect x="465" y="96" width="54" height="22" rx="4" fill="#1a7a1a"/>
<text font-size="12" font-weight="600" fill="#ffffff" x="492" y="111" text-anchor="middle">✓</text>
<rect x="565" y="96" width="54" height="22" rx="4" fill="#cc2200"/>
<text font-size="12" font-weight="600" fill="#ffffff" x="592" y="111" text-anchor="middle">✗</text>

<!-- Row 2: Load → Store -->
<rect x="40" y="128" width="600" height="44" fill="#ffffff"/>
<text font-size="12" font-weight="500" fill="#2C2C2A" x="168" y="154" text-anchor="middle">Load → Store</text>
<rect x="343" y="140" width="54" height="22" rx="4" fill="#1a7a1a"/>
<text font-size="12" font-weight="600" fill="#ffffff" x="370" y="155" text-anchor="middle">✓</text>
<rect x="465" y="140" width="54" height="22" rx="4" fill="#1a7a1a"/>
<text font-size="12" font-weight="600" fill="#ffffff" x="492" y="155" text-anchor="middle">✓</text>
<rect x="565" y="140" width="54" height="22" rx="4" fill="#cc2200"/>
<text font-size="12" font-weight="600" fill="#ffffff" x="592" y="155" text-anchor="middle">✗</text>

<!-- Row 3: Store → Load (TSO's one relaxation) -->
<rect x="40" y="172" width="600" height="44" fill="#F8F7F4"/>
<text font-size="12" font-weight="500" fill="#2C2C2A" x="168" y="198" text-anchor="middle">Store → Load</text>
<rect x="343" y="184" width="54" height="22" rx="4" fill="#1a7a1a"/>
<text font-size="12" font-weight="600" fill="#ffffff" x="370" y="199" text-anchor="middle">✓</text>
<rect x="465" y="184" width="54" height="22" rx="4" fill="#cc2200"/>
<text font-size="12" font-weight="600" fill="#ffffff" x="492" y="199" text-anchor="middle">✗</text>
<rect x="565" y="184" width="54" height="22" rx="4" fill="#cc2200"/>
<text font-size="12" font-weight="600" fill="#ffffff" x="592" y="199" text-anchor="middle">✗</text>
<!-- Highlight TSO's one relaxation -->
<rect x="462" y="181" width="60" height="28" rx="6" fill="none" stroke="#EF9F27" stroke-width="1.5"/>

<!-- Row 4: Store → Store -->
<rect x="40" y="216" width="600" height="44" fill="#ffffff"/>
<text font-size="12" font-weight="500" fill="#2C2C2A" x="168" y="242" text-anchor="middle">Store → Store</text>
<rect x="343" y="228" width="54" height="22" rx="4" fill="#1a7a1a"/>
<text font-size="12" font-weight="600" fill="#ffffff" x="370" y="243" text-anchor="middle">✓</text>
<rect x="465" y="228" width="54" height="22" rx="4" fill="#1a7a1a"/>
<text font-size="12" font-weight="600" fill="#ffffff" x="492" y="243" text-anchor="middle">✓</text>
<rect x="565" y="228" width="54" height="22" rx="4" fill="#cc2200"/>
<text font-size="12" font-weight="600" fill="#ffffff" x="592" y="243" text-anchor="middle">✗</text>

<!-- Table border -->
<rect x="40" y="44" width="600" height="216" rx="8" fill="none" stroke="#004065" stroke-width="1.5"/>

<!-- Legend -->
<rect x="100" y="278" width="16" height="16" rx="3" fill="#1a7a1a"/>
<text font-size="11" fill="#444441" x="122" y="291">✓ = ordering preserved (no reorder)</text>
<rect x="380" y="278" width="16" height="16" rx="3" fill="#cc2200"/>
<text font-size="11" fill="#444441" x="402" y="291">✗ = CPU may reorder</text>

<!-- Annotation: TSO's single relaxation -->
<rect x="410" y="308" width="226" height="28" rx="6" fill="none" stroke="#EF9F27" stroke-width="1" opacity="0.6"/>
<text font-size="11" fill="#854F0B" x="523" y="326" text-anchor="middle">TSO's only relaxation: store buffer</text>

<!-- Bottom takeaway -->
<rect x="40" y="348" width="600" height="24" rx="6" fill="none" stroke="#888780" stroke-width="0.5" opacity="0.3"/>
<text font-size="11" fill="#444441" x="340" y="365" text-anchor="middle">← stronger (simpler to program)          weaker (faster hardware) →</text>

</svg>
