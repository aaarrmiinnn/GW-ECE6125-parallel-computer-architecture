<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#004065"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc2200"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a7a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#004065">Write-Invalidate vs. Write-Update</text>

  <!-- ═══ LEFT PANEL: Write-Invalidate ═══ -->
  <rect x="20" y="52" width="415" height="360" rx="8" fill="white" stroke="#004065" stroke-width="2"/>
  <rect x="20" y="52" width="415" height="44" rx="8" fill="#004065"/>
  <rect x="20" y="80" width="415" height="16" fill="#004065"/>
  <text x="228" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Write-Invalidate</text>

  <!-- CPU 0 left panel -->
  <rect x="40" y="110" width="100" height="52" rx="6" fill="#004065"/>
  <text x="90" y="131" text-anchor="middle" font-size="13" font-weight="bold" fill="white">CPU 0</text>
  <rect x="48" y="138" width="84" height="20" rx="4" fill="#FFD200"/>
  <text x="90" y="152" text-anchor="middle" font-size="11" fill="#004065">X = 5 (M)</text>

  <!-- Write label -->
  <text x="90" y="180" text-anchor="middle" font-size="11" fill="#004065" font-weight="bold">writes X=5</text>

  <!-- Broadcast INVALIDATE arrow to CPU1 -->
  <path d="M 145 134 L 220 134" stroke="#cc2200" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <text x="182" y="126" text-anchor="middle" font-size="10" fill="#cc2200" font-weight="bold">INVALIDATE</text>

  <!-- CPU1 left panel — invalid -->
  <rect x="220" y="110" width="100" height="52" rx="6" fill="#ccc"/>
  <text x="270" y="131" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">CPU 1</text>
  <rect x="228" y="138" width="84" height="20" rx="4" fill="#ffaaaa"/>
  <text x="270" y="152" text-anchor="middle" font-size="11" fill="#8b0000">X — (I)</text>
  <!-- red X over cache -->
  <line x1="232" y1="140" x2="308" y2="156" stroke="#cc2200" stroke-width="2.5"/>
  <line x1="308" y1="140" x2="232" y2="156" stroke="#cc2200" stroke-width="2.5"/>

  <!-- Broadcast INVALIDATE arrow to CPU2 -->
  <path d="M 145 148 L 330 148" stroke="#cc2200" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>

  <!-- CPU2 left panel — invalid -->
  <rect x="330" y="122" width="90" height="52" rx="6" fill="#ccc"/>
  <text x="375" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">CPU 2</text>
  <rect x="338" y="150" width="74" height="20" rx="4" fill="#ffaaaa"/>
  <text x="375" y="164" text-anchor="middle" font-size="11" fill="#8b0000">X — (I)</text>
  <line x1="342" y1="152" x2="408" y2="168" stroke="#cc2200" stroke-width="2.5"/>
  <line x1="408" y1="152" x2="342" y2="168" stroke="#cc2200" stroke-width="2.5"/>

  <!-- Explanation box left -->
  <rect x="40" y="210" width="375" height="60" rx="6" fill="#ffe8e8" stroke="#cc2200" stroke-width="1.5"/>
  <text x="228" y="232" text-anchor="middle" font-size="12" fill="#8b0000" font-weight="bold">Other caches: discard stale copy</text>
  <text x="228" y="252" text-anchor="middle" font-size="11" fill="#555">Next read triggers a cache miss — fetches fresh data</text>
  <text x="228" y="265" text-anchor="middle" font-size="11" fill="#555">from owner or memory</text>

  <!-- Benefits / Cost left -->
  <rect x="40" y="284" width="375" height="114" rx="6" fill="#f0f4f8" stroke="#aaa" stroke-width="1"/>
  <text x="228" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#004065">Characteristics</text>
  <text x="55" y="322" font-size="11" fill="#333">+ Low bandwidth: only one message per write</text>
  <text x="55" y="340" font-size="11" fill="#333">+ Scales well under write-heavy workloads</text>
  <text x="55" y="358" font-size="11" fill="#333">− Next read after write always misses</text>
  <text x="55" y="376" font-size="11" fill="#333">− Ping-pong between producers/consumers is costly</text>
  <text x="55" y="393" font-size="11" fill="#004065" font-weight="bold">→ Used by: Intel, AMD, ARM (all modern CPUs)</text>

  <!-- ═══ RIGHT PANEL: Write-Update ═══ -->
  <rect x="465" y="52" width="415" height="360" rx="8" fill="white" stroke="#555" stroke-width="2"/>
  <rect x="465" y="52" width="415" height="44" rx="8" fill="#444"/>
  <rect x="465" y="80" width="415" height="16" fill="#444"/>
  <text x="673" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Write-Update</text>

  <!-- CPU 0 right panel -->
  <rect x="485" y="110" width="100" height="52" rx="6" fill="#004065"/>
  <text x="535" y="131" text-anchor="middle" font-size="13" font-weight="bold" fill="white">CPU 0</text>
  <rect x="493" y="138" width="84" height="20" rx="4" fill="#FFD200"/>
  <text x="535" y="152" text-anchor="middle" font-size="11" fill="#004065">X = 5 (M)</text>
  <text x="535" y="180" text-anchor="middle" font-size="11" fill="#004065" font-weight="bold">writes X=5</text>

  <!-- Broadcast update arrows -->
  <path d="M 590 134 L 660 134" stroke="#1a7a1a" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <text x="625" y="126" text-anchor="middle" font-size="10" fill="#1a7a1a" font-weight="bold">UPDATE X=5</text>

  <!-- CPU1 right panel — updated -->
  <rect x="660" y="110" width="100" height="52" rx="6" fill="#1a5c1a"/>
  <text x="710" y="131" text-anchor="middle" font-size="13" font-weight="bold" fill="white">CPU 1</text>
  <rect x="668" y="138" width="84" height="20" rx="4" fill="#ccffcc"/>
  <text x="710" y="152" text-anchor="middle" font-size="11" fill="#1a5c1a">X = 5 (S)</text>

  <!-- second update arrow to CPU2 -->
  <path d="M 590 148 L 770 148" stroke="#1a7a1a" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>

  <!-- CPU2 right panel — updated -->
  <rect x="770" y="122" width="90" height="52" rx="6" fill="#1a5c1a"/>
  <text x="815" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="white">CPU 2</text>
  <rect x="778" y="150" width="74" height="20" rx="4" fill="#ccffcc"/>
  <text x="815" y="164" text-anchor="middle" font-size="11" fill="#1a5c1a">X = 5 (S)</text>

  <!-- Explanation box right -->
  <rect x="485" y="210" width="375" height="60" rx="6" fill="#e8ffe8" stroke="#1a7a1a" stroke-width="1.5"/>
  <text x="673" y="232" text-anchor="middle" font-size="12" fill="#1a5c1a" font-weight="bold">Other caches: receive new value</text>
  <text x="673" y="252" text-anchor="middle" font-size="11" fill="#555">All caches hold valid copy immediately</text>
  <text x="673" y="265" text-anchor="middle" font-size="11" fill="#555">— subsequent reads hit without stalling</text>

  <!-- Benefits / Cost right -->
  <rect x="485" y="284" width="375" height="114" rx="6" fill="#f0f4f8" stroke="#aaa" stroke-width="1"/>
  <text x="673" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#004065">Characteristics</text>
  <text x="500" y="322" font-size="11" fill="#333">+ Next read after a write always hits (no stall)</text>
  <text x="500" y="340" font-size="11" fill="#333">+ Ideal when consumers read immediately after each write</text>
  <text x="500" y="358" font-size="11" fill="#333">− Every write consumes bus bandwidth (even if no one reads)</text>
  <text x="500" y="376" font-size="11" fill="#333">− Bus saturates quickly under write-heavy workloads</text>
  <text x="500" y="393" font-size="11" fill="#555">→ Largely abandoned; no modern general-purpose CPU uses it</text>

  <!-- Dividing line -->
  <line x1="450" y1="52" x2="450" y2="412" stroke="#999" stroke-width="2"/>

  <!-- Bottom note -->
  <rect x="20" y="426" width="860" height="52" rx="8" fill="#004065"/>
  <text x="450" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFD200">Modern CPUs use Write-Invalidate</text>
  <text x="450" y="468" text-anchor="middle" font-size="12" fill="white">Lower bandwidth overhead for write-heavy workloads; reads after writes incur a cache miss (acceptable)</text>
</svg>
