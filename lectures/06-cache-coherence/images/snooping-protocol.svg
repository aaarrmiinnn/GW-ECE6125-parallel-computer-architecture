<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#004065"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc2200"/>
    </marker>
    <marker id="arr-down" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#004065">Snooping Protocol — Broadcast Bus</text>

  <!-- ══════ BUS bar (center horizontal) ══════ -->
  <rect x="30" y="248" width="840" height="22" rx="4" fill="#004065"/>
  <text x="450" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFD200">Shared Broadcast Bus</text>

  <!-- Broadcast signal labels -->
  <rect x="290" y="232" width="320" height="18" rx="4" fill="#FFD200"/>
  <text x="450" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#004065">BusRdX(X)  — broadcast to ALL caches simultaneously</text>

  <!-- ══════ CPU/Cache blocks above bus ══════ -->

  <!-- Helper macro: draw a CPU+cache block at x -->
  <!-- CPU 0 (initiator, blue) -->
  <rect x="40" y="80" width="140" height="56" rx="8" fill="#004065"/>
  <text x="110" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="white">CPU 0</text>
  <text x="110" y="124" text-anchor="middle" font-size="11" fill="#FFD200">Initiator</text>

  <rect x="40" y="148" width="140" height="48" rx="6" fill="#004065" opacity="0.7"/>
  <text x="110" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Cache 0</text>
  <rect x="52" y="177" width="116" height="16" rx="4" fill="#FFD200"/>
  <text x="110" y="189" text-anchor="middle" font-size="11" fill="#004065">X=5 (M)</text>

  <!-- CPU 0 vertical to bus (down) -->
  <line x1="110" y1="196" x2="110" y2="248" stroke="#004065" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- CPU 1 (invalidated) -->
  <rect x="230" y="80" width="140" height="56" rx="8" fill="#004065"/>
  <text x="300" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="white">CPU 1</text>
  <text x="300" y="124" text-anchor="middle" font-size="11" fill="white">Snooper</text>

  <rect x="230" y="148" width="140" height="48" rx="6" fill="#7a1a1a" opacity="0.85"/>
  <text x="300" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Cache 1</text>
  <rect x="242" y="177" width="116" height="16" rx="4" fill="#ffcccc"/>
  <text x="300" y="189" text-anchor="middle" font-size="11" fill="#8b0000">X → ✗ (I)</text>

  <!-- Invalidate badge CPU1 -->
  <rect x="248" y="68" width="104" height="18" rx="4" fill="#cc2200"/>
  <text x="300" y="81" text-anchor="middle" font-size="10" font-weight="bold" fill="white">INVALIDATE</text>

  <!-- CPU 1 vertical to bus (up from bus) -->
  <line x1="300" y1="248" x2="300" y2="196" stroke="#cc2200" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>

  <!-- CPU 2 (invalidated) -->
  <rect x="420" y="80" width="140" height="56" rx="8" fill="#004065"/>
  <text x="490" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="white">CPU 2</text>
  <text x="490" y="124" text-anchor="middle" font-size="11" fill="white">Snooper</text>

  <rect x="420" y="148" width="140" height="48" rx="6" fill="#7a1a1a" opacity="0.85"/>
  <text x="490" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Cache 2</text>
  <rect x="432" y="177" width="116" height="16" rx="4" fill="#ffcccc"/>
  <text x="490" y="189" text-anchor="middle" font-size="11" fill="#8b0000">X → ✗ (I)</text>

  <!-- Invalidate badge CPU2 -->
  <rect x="438" y="68" width="104" height="18" rx="4" fill="#cc2200"/>
  <text x="490" y="81" text-anchor="middle" font-size="10" font-weight="bold" fill="white">INVALIDATE</text>

  <!-- CPU 2 vertical to bus -->
  <line x1="490" y1="248" x2="490" y2="196" stroke="#cc2200" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>

  <!-- CPU 3 (invalidated) -->
  <rect x="610" y="80" width="140" height="56" rx="8" fill="#004065"/>
  <text x="680" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="white">CPU 3</text>
  <text x="680" y="124" text-anchor="middle" font-size="11" fill="white">Snooper</text>

  <rect x="610" y="148" width="140" height="48" rx="6" fill="#7a1a1a" opacity="0.85"/>
  <text x="680" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Cache 3</text>
  <rect x="622" y="177" width="116" height="16" rx="4" fill="#ffcccc"/>
  <text x="680" y="189" text-anchor="middle" font-size="11" fill="#8b0000">X → ✗ (I)</text>

  <!-- Invalidate badge CPU3 -->
  <rect x="628" y="68" width="104" height="18" rx="4" fill="#cc2200"/>
  <text x="680" y="81" text-anchor="middle" font-size="10" font-weight="bold" fill="white">INVALIDATE</text>

  <!-- CPU 3 vertical to bus -->
  <line x1="680" y1="248" x2="680" y2="196" stroke="#cc2200" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>

  <!-- ══════ Memory block below bus ══════ -->
  <rect x="340" y="310" width="220" height="64" rx="8" fill="#004065"/>
  <text x="450" y="336" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Main Memory</text>
  <rect x="360" y="342" width="180" height="22" rx="4" fill="#FFD200"/>
  <text x="450" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#004065">X = 5 (backing store)</text>

  <!-- Memory to bus -->
  <line x1="450" y1="310" x2="450" y2="270" stroke="#555" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-down)"/>

  <!-- ══════ Broadcast indicators (fan-out lines from bus) ══════ -->
  <!-- horizontal dashed lines from CPU0 column to right across bus, indicating broadcast -->
  <line x1="130" y1="258" x2="790" y2="258" stroke="#FFD200" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- ══════ Labels and annotations ══════ -->
  <rect x="760" y="80" width="130" height="60" rx="7" fill="white" stroke="#004065" stroke-width="1.5"/>
  <text x="825" y="99" text-anchor="middle" font-size="10" font-weight="bold" fill="#004065">Bus Properties</text>
  <text x="775" y="115" font-size="9" fill="#333">Serialized (1 txn at a time)</text>
  <text x="775" y="129" font-size="9" fill="#333">All caches snoop every txn</text>
  <text x="775" y="141" font-size="9" fill="#333">O(1) invalidation latency</text>

  <!-- Legend below -->
  <rect x="30" y="400" width="860" height="82" rx="8" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="450" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#004065">All caches see all transactions simultaneously</text>
  <text x="450" y="440" text-anchor="middle" font-size="11" fill="#555">Snooping works by broadcasting every bus transaction — caches inspect (snoop) each transaction</text>
  <text x="450" y="458" text-anchor="middle" font-size="11" fill="#555">and update/invalidate their own copies as needed.  Simple and fast for small core counts.</text>
  <text x="450" y="475" text-anchor="middle" font-size="11" fill="#cc2200" font-weight="bold">Limitation: bus bandwidth becomes bottleneck beyond ~16 cores</text>
</svg>
