<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#004065"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc2200"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#004065">The Cache Coherence Problem</text>

  <!-- ── CPU 0 block (left) ── -->
  <rect x="60" y="70" width="200" height="80" rx="8" fill="#004065"/>
  <text x="160" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="white">CPU 0</text>
  <text x="160" y="122" text-anchor="middle" font-size="12" fill="#FFD200">Processor Core</text>

  <!-- CPU 0 Cache -->
  <rect x="60" y="170" width="200" height="90" rx="8" fill="#004065" opacity="0.85"/>
  <text x="160" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="white">L1 Cache</text>
  <rect x="80" y="200" width="160" height="48" rx="6" fill="#FFD200"/>
  <text x="160" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#004065">X = 1</text>
  <text x="160" y="238" text-anchor="middle" font-size="11" fill="#004065">State: Modified (M)</text>

  <!-- ── CPU 1 block (right) ── -->
  <rect x="640" y="70" width="200" height="80" rx="8" fill="#004065"/>
  <text x="740" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="white">CPU 1</text>
  <text x="740" y="122" text-anchor="middle" font-size="12" fill="#FFD200">Processor Core</text>

  <!-- CPU 1 Cache — stale -->
  <rect x="640" y="170" width="200" height="90" rx="8" fill="#8b1a1a" opacity="0.9"/>
  <text x="740" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="white">L1 Cache</text>
  <rect x="660" y="200" width="160" height="48" rx="6" fill="#ffcccc"/>
  <text x="740" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#8b0000">X = 0</text>
  <text x="740" y="238" text-anchor="middle" font-size="11" fill="#8b0000">State: Shared (S) — STALE</text>

  <!-- STALE badge -->
  <rect x="672" y="272" width="136" height="28" rx="6" fill="#cc2200"/>
  <text x="740" y="291" text-anchor="middle" font-size="13" font-weight="bold" fill="white">STALE</text>

  <!-- ── Memory block (center bottom) ── -->
  <rect x="330" y="360" width="240" height="80" rx="8" fill="#004065"/>
  <text x="450" y="388" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Main Memory</text>
  <rect x="355" y="396" width="190" height="32" rx="6" fill="#FFD200"/>
  <text x="450" y="417" text-anchor="middle" font-size="13" font-weight="bold" fill="#004065">X = 1  (stale copy on bus)</text>

  <!-- Arrow: CPU 0 → Memory (write) — solid blue -->
  <path d="M 160 260 Q 160 320 340 380" stroke="#004065" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="70" y="300" width="148" height="26" rx="5" fill="#004065"/>
  <text x="144" y="317" text-anchor="middle" font-size="12" fill="white">Write X=1</text>

  <!-- Arrow: CPU 1 stale cache → label (dashed red) -->
  <path d="M 740 310 Q 740 345 680 395" stroke="#cc2200" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-red)"/>
  <rect x="620" y="315" width="230" height="28" rx="5" fill="#cc2200"/>
  <text x="735" y="333" text-anchor="middle" font-size="12" fill="white">Read X → 0  (WRONG!)</text>

  <!-- Interconnect bus line -->
  <line x1="260" y1="220" x2="640" y2="220" stroke="#aaa" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="450" y="214" text-anchor="middle" font-size="11" fill="#555">Shared Bus / Interconnect</text>

  <!-- Caption -->
  <text x="450" y="472" text-anchor="middle" font-size="12" fill="#555">CPU 1 cached X=0 before CPU 0 wrote X=1 — no notification was sent</text>
</svg>
