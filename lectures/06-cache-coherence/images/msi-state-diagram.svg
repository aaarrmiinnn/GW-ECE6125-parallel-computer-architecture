<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#004065"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc2200"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#004065">MSI Protocol — State Machine</text>

  <!-- ── State circles ── -->

  <!-- M — top center, gold -->
  <circle cx="500" cy="145" r="65" fill="#FFD200" stroke="#004065" stroke-width="3"/>
  <text x="500" y="138" text-anchor="middle" font-size="30" font-weight="bold" fill="#004065">M</text>
  <text x="500" y="163" text-anchor="middle" font-size="13" fill="#004065">Modified</text>

  <!-- S — bottom-left, blue -->
  <circle cx="185" cy="430" r="65" fill="#004065" stroke="#002a42" stroke-width="3"/>
  <text x="185" y="423" text-anchor="middle" font-size="30" font-weight="bold" fill="white">S</text>
  <text x="185" y="448" text-anchor="middle" font-size="13" fill="white">Shared</text>

  <!-- I — bottom-right, light gray -->
  <circle cx="815" cy="430" r="65" fill="#d0d8e0" stroke="#004065" stroke-width="3"/>
  <text x="815" y="423" text-anchor="middle" font-size="30" font-weight="bold" fill="#004065">I</text>
  <text x="815" y="448" text-anchor="middle" font-size="13" fill="#555">Invalid</text>

  <!-- ══════════════════════════════════════
       LEFT SIDE: M ↔ S
       M→S curves far left (red/snoop)
       S→M curves center-left (blue/CPU)
  ══════════════════════════════════════ -->

  <!-- M→S  red  Snoop BusRd / supply data -->
  <path d="M 437 152 Q 72 288 216 382" stroke="#cc2200" stroke-width="2.5" fill="none" marker-end="url(#arr-red)"/>
  <rect x="8" y="252" width="182" height="38" rx="5" fill="white" stroke="#cc2200" stroke-width="1.5"/>
  <text x="99" y="267" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc2200">M → S</text>
  <text x="99" y="283" text-anchor="middle" font-size="10" fill="#555">Snoop BusRd / supply data</text>

  <!-- S→M  blue  CPU Write / BusUpgr -->
  <path d="M 220 368 Q 345 246 466 198" stroke="#004065" stroke-width="2.5" fill="none" marker-end="url(#arr-blue)"/>
  <rect x="215" y="258" width="182" height="38" rx="5" fill="white" stroke="#004065" stroke-width="1.5"/>
  <text x="306" y="273" text-anchor="middle" font-size="11" font-weight="bold" fill="#004065">S → M</text>
  <text x="306" y="289" text-anchor="middle" font-size="10" fill="#555">CPU Write / BusUpgr</text>

  <!-- ══════════════════════════════════════
       RIGHT SIDE: M ↔ I
       M→I curves far right (red/snoop)
       I→M curves center-right (blue/CPU)
  ══════════════════════════════════════ -->

  <!-- M→I  red  Snoop BusRdX / supply data -->
  <path d="M 563 152 Q 928 288 784 382" stroke="#cc2200" stroke-width="2.5" fill="none" marker-end="url(#arr-red)"/>
  <rect x="812" y="252" width="182" height="38" rx="5" fill="white" stroke="#cc2200" stroke-width="1.5"/>
  <text x="903" y="267" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc2200">M → I</text>
  <text x="903" y="283" text-anchor="middle" font-size="10" fill="#555">Snoop BusRdX / supply data</text>

  <!-- I→M  blue  CPU Write / BusRdX -->
  <path d="M 780 368 Q 655 246 534 198" stroke="#004065" stroke-width="2.5" fill="none" marker-end="url(#arr-blue)"/>
  <rect x="604" y="258" width="182" height="38" rx="5" fill="white" stroke="#004065" stroke-width="1.5"/>
  <text x="695" y="273" text-anchor="middle" font-size="11" font-weight="bold" fill="#004065">I → M</text>
  <text x="695" y="289" text-anchor="middle" font-size="10" fill="#555">CPU Write / BusRdX</text>

  <!-- ══════════════════════════════════════
       BOTTOM: S ↔ I
       S→I curves upward — center strip (red/snoop)
       I→S curves below both states (blue/CPU)
  ══════════════════════════════════════ -->

  <!-- S→I  red  Snoop BusRdX or BusUpgr -->
  <path d="M 250 414 Q 500 336 750 414" stroke="#cc2200" stroke-width="2.5" fill="none" marker-end="url(#arr-red)"/>
  <rect x="410" y="326" width="182" height="38" rx="5" fill="white" stroke="#cc2200" stroke-width="1.5"/>
  <text x="501" y="341" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc2200">S → I</text>
  <text x="501" y="357" text-anchor="middle" font-size="10" fill="#555">Snoop BusRdX or BusUpgr</text>

  <!-- I→S  blue  CPU Read / BusRd -->
  <path d="M 750 452 Q 500 548 250 452" stroke="#004065" stroke-width="2.5" fill="none" marker-end="url(#arr-blue)"/>
  <rect x="410" y="540" width="182" height="38" rx="5" fill="white" stroke="#004065" stroke-width="1.5"/>
  <text x="501" y="555" text-anchor="middle" font-size="11" font-weight="bold" fill="#004065">I → S</text>
  <text x="501" y="571" text-anchor="middle" font-size="10" fill="#555">CPU Read / BusRd</text>

  <!-- ══════════════════════════════════════
       SELF-LOOPS
  ══════════════════════════════════════ -->

  <!-- M self-loop: CPU Read or Write already M, no bus -->
  <path d="M 478 81 Q 445 28 522 81" stroke="#004065" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>
  <rect x="432" y="12" width="182" height="38" rx="5" fill="#fffbe6" stroke="#004065" stroke-width="1.5"/>
  <text x="523" y="27" text-anchor="middle" font-size="10" font-weight="bold" fill="#004065">CPU Read or Write</text>
  <text x="523" y="42" text-anchor="middle" font-size="10" fill="#555">already M — no bus traffic</text>

  <!-- S self-loop: CPU Read already S, no bus -->
  <path d="M 122 414 Q 55 384 124 450" stroke="#004065" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>
  <rect x="8" y="400" width="112" height="38" rx="5" fill="#e8f0f8" stroke="#004065" stroke-width="1.5"/>
  <text x="64" y="415" text-anchor="middle" font-size="10" font-weight="bold" fill="#004065">CPU Read</text>
  <text x="64" y="430" text-anchor="middle" font-size="10" fill="#555">no bus traffic</text>

  <!-- ══════════════════════════════════════
       LEGEND — top right, away from all arrows
  ══════════════════════════════════════ -->
  <rect x="692" y="42" width="298" height="118" rx="8" fill="white" stroke="#bbb" stroke-width="1.5"/>
  <text x="841" y="61" text-anchor="middle" font-size="12" font-weight="bold" fill="#004065">Legend</text>

  <!-- Blue sample arrow -->
  <line x1="706" y1="78" x2="746" y2="78" stroke="#004065" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="754" y="82" font-size="11" fill="#004065" font-weight="bold">Blue</text>
  <text x="795" y="82" font-size="11" fill="#555"> = THIS CPU acted (local read/write)</text>

  <!-- Red sample arrow -->
  <line x1="706" y1="100" x2="746" y2="100" stroke="#cc2200" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="754" y="104" font-size="11" fill="#cc2200" font-weight="bold">Red</text>
  <text x="789" y="104" font-size="11" fill="#555"> = ANOTHER CPU's bus message</text>

  <!-- Bus term definitions -->
  <text x="706" y="122" font-size="10" fill="#555">BusRd   — fetch a shared (read-only) copy</text>
  <text x="706" y="138" font-size="10" fill="#555">BusRdX  — fetch exclusive copy (for writing)</text>
  <text x="706" y="152" font-size="10" fill="#555">BusUpgr — upgrade S→M, no data needed</text>

</svg>
