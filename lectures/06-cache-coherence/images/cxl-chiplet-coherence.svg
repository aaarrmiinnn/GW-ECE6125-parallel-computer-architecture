<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#004065"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a5c1a"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6a1b9a"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc2200"/>
    </marker>
    <marker id="arr-both" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#004065"/>
    </marker>
    <marker id="arr-both-s" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto-start-reverse">
      <polygon points="10 0, 0 3.5, 10 7" fill="#004065"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#004065">CXL Coherence Fabric and Chiplet Topology</text>

  <!-- ═══════════════ Unified Coherence Domain dashed boundary ═══════════════ -->
  <rect x="14" y="46" width="650" height="380" rx="14" fill="none" stroke="#004065" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="24" y="68" font-size="11" fill="#004065" font-weight="bold">Unified Coherence Domain</text>

  <!-- ═══════════════ CXL Fabric / Switch (center) ═══════════════ -->
  <rect x="234" y="176" width="200" height="100" rx="10" fill="#004065"/>
  <text x="334" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="white">CXL Fabric</text>
  <text x="334" y="228" text-anchor="middle" font-size="12" fill="#FFD200">/ Switch</text>
  <text x="334" y="248" text-anchor="middle" font-size="10" fill="white">CXL 3.0 (68 GT/s)</text>

  <!-- ═══════════════ CPU Socket 0 (top-left) ═══════════════ -->
  <rect x="30" y="56" width="180" height="100" rx="8" fill="#004065" opacity="0.9"/>
  <text x="120" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="white">CPU Socket 0</text>
  <text x="120" y="98" text-anchor="middle" font-size="11" fill="#FFD200">Xeon / EPYC</text>
  <!-- L3 cache small boxes -->
  <rect x="44" y="108" width="76" height="26" rx="4" fill="#FFD200"/>
  <text x="82" y="125" text-anchor="middle" font-size="10" font-weight="bold" fill="#004065">L3: 96MB</text>
  <rect x="126" y="108" width="76" height="26" rx="4" fill="#FFD200" opacity="0.7"/>
  <text x="164" y="125" text-anchor="middle" font-size="10" fill="#004065">LLC tags</text>

  <!-- Arrow Socket 0 → Fabric -->
  <path d="M 150 156 L 260 220" stroke="#004065" stroke-width="2" fill="none" marker-end="url(#arr-blue)" marker-start="url(#arr-both-s)"/>
  <rect x="130" y="170" width="128" height="22" rx="4" fill="white" stroke="#004065" stroke-width="1"/>
  <text x="194" y="185" text-anchor="middle" font-size="9" font-weight="bold" fill="#004065">CXL.cache + CXL.mem</text>

  <!-- ═══════════════ CPU Socket 1 (top-right) ═══════════════ -->
  <rect x="460" y="56" width="180" height="100" rx="8" fill="#004065" opacity="0.9"/>
  <text x="550" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="white">CPU Socket 1</text>
  <text x="550" y="98" text-anchor="middle" font-size="11" fill="#FFD200">Xeon / EPYC</text>
  <rect x="474" y="108" width="76" height="26" rx="4" fill="#FFD200"/>
  <text x="512" y="125" text-anchor="middle" font-size="10" font-weight="bold" fill="#004065">L3: 96MB</text>
  <rect x="556" y="108" width="76" height="26" rx="4" fill="#FFD200" opacity="0.7"/>
  <text x="594" y="125" text-anchor="middle" font-size="10" fill="#004065">LLC tags</text>

  <!-- Arrow Socket 1 → Fabric -->
  <path d="M 520 156 L 410 220" stroke="#004065" stroke-width="2" fill="none" marker-end="url(#arr-blue)" marker-start="url(#arr-both-s)"/>
  <rect x="408" y="170" width="128" height="22" rx="4" fill="white" stroke="#004065" stroke-width="1"/>
  <text x="472" y="185" text-anchor="middle" font-size="9" font-weight="bold" fill="#004065">CXL.cache + CXL.mem</text>

  <!-- ═══════════════ CXL Memory Expander (bottom-left, green) ═══════════════ -->
  <rect x="30" y="330" width="180" height="80" rx="8" fill="#1a5c1a"/>
  <text x="120" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="white">CXL Memory</text>
  <text x="120" y="374" text-anchor="middle" font-size="11" fill="#ccffcc">Expander</text>
  <rect x="44" y="384" width="152" height="20" rx="4" fill="#ccffcc"/>
  <text x="120" y="397" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a5c1a">2 TB DDR5  (Type 3)</text>

  <!-- Arrow Memory → Fabric -->
  <path d="M 185 360 L 242 296" stroke="#1a5c1a" stroke-width="2" fill="none" marker-end="url(#arr-green)" marker-start="url(#arr-both-s)"/>
  <rect x="144" y="294" width="116" height="22" rx="4" fill="#e8f5e9" stroke="#1a5c1a" stroke-width="1"/>
  <text x="202" y="309" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a5c1a">CXL.mem</text>

  <!-- ═══════════════ AI Accelerator (bottom-right, purple) ═══════════════ -->
  <rect x="460" y="330" width="180" height="80" rx="8" fill="#6a1b9a"/>
  <text x="550" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="white">AI Accelerator</text>
  <text x="550" y="374" text-anchor="middle" font-size="11" fill="#e1bee7">CXL.cache capable</text>
  <rect x="474" y="384" width="152" height="20" rx="4" fill="#e1bee7"/>
  <text x="550" y="397" text-anchor="middle" font-size="10" font-weight="bold" fill="#6a1b9a">CXL Type 2 Device</text>

  <!-- Arrow Accelerator → Fabric -->
  <path d="M 480 356 L 428 296" stroke="#6a1b9a" stroke-width="2" fill="none" marker-end="url(#arr-purple)" marker-start="url(#arr-both-s)"/>
  <rect x="388" y="294" width="136" height="22" rx="4" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1"/>
  <text x="456" y="309" text-anchor="middle" font-size="9" font-weight="bold" fill="#6a1b9a">CXL.cache (host mem)</text>

  <!-- ═══════════════ Chiplet detail inset (bottom-right) ═══════════════ -->
  <rect x="672" y="46" width="216" height="384" rx="10" fill="white" stroke="#004065" stroke-width="2"/>
  <rect x="672" y="46" width="216" height="30" rx="10" fill="#555"/>
  <rect x="672" y="60" width="216" height="16" fill="#555"/>
  <text x="780" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Chiplet Detail</text>

  <!-- CCD 0 -->
  <rect x="692" y="90" width="80" height="100" rx="6" fill="#004065"/>
  <text x="732" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="white">CCD 0</text>
  <text x="732" y="128" text-anchor="middle" font-size="9" fill="#FFD200">8 cores</text>
  <rect x="700" y="136" width="64" height="18" rx="3" fill="#FFD200"/>
  <text x="732" y="149" text-anchor="middle" font-size="9" fill="#004065">L3: 32MB</text>
  <rect x="700" y="158" width="64" height="18" rx="3" fill="#002a42"/>
  <text x="732" y="171" text-anchor="middle" font-size="9" fill="white">IOD link</text>

  <!-- CCD 1 -->
  <rect x="792" y="90" width="80" height="100" rx="6" fill="#004065"/>
  <text x="832" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="white">CCD 1</text>
  <text x="832" y="128" text-anchor="middle" font-size="9" fill="#FFD200">8 cores</text>
  <rect x="800" y="136" width="64" height="18" rx="3" fill="#FFD200"/>
  <text x="832" y="149" text-anchor="middle" font-size="9" fill="#004065">L3: 32MB</text>
  <rect x="800" y="158" width="64" height="18" rx="3" fill="#002a42"/>
  <text x="832" y="171" text-anchor="middle" font-size="9" fill="white">IOD link</text>

  <!-- xGMI / die-to-die connection -->
  <line x1="772" y1="140" x2="792" y2="140" stroke="#555" stroke-width="2.5" marker-end="url(#arr-blue)" marker-start="url(#arr-both-s)"/>
  <rect x="754" y="196" width="56" height="16" rx="3" fill="#555"/>
  <text x="782" y="207" text-anchor="middle" font-size="9" fill="white">xGMI</text>

  <!-- Coherence traffic (red dashed) -->
  <path d="M 772 120 Q 782 108 792 120" stroke="#cc2200" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr-red)"/>
  <rect x="692" y="218" width="176" height="26" rx="4" fill="#ffeeee" stroke="#cc2200" stroke-width="1.5"/>
  <text x="780" y="231" text-anchor="middle" font-size="9" font-weight="bold" fill="#cc2200">coherence traffic (red)</text>
  <text x="780" y="244" text-anchor="middle" font-size="9" fill="#555">probe / snoop messages</text>

  <!-- Data traffic (blue) -->
  <rect x="692" y="252" width="176" height="26" rx="4" fill="#e8f0f8" stroke="#004065" stroke-width="1.5"/>
  <text x="780" y="265" text-anchor="middle" font-size="9" font-weight="bold" fill="#004065">data traffic (blue)</text>
  <text x="780" y="278" text-anchor="middle" font-size="9" fill="#555">cache line moves (large)</text>

  <!-- IOD box -->
  <rect x="692" y="296" width="176" height="52" rx="6" fill="#004065"/>
  <text x="780" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="white">IOD (I/O Die)</text>
  <text x="780" y="334" text-anchor="middle" font-size="9" fill="#FFD200">Coherence fabric hub</text>
  <text x="780" y="348" text-anchor="middle" font-size="9" fill="white">xGMI + CXL controller</text>

  <!-- Arrows CCD→IOD -->
  <path d="M 732 190 L 750 296" stroke="#004065" stroke-width="1.5" fill="none" marker-end="url(#arr-blue)"/>
  <path d="M 832 190 L 810 296" stroke="#004065" stroke-width="1.5" fill="none" marker-end="url(#arr-blue)"/>

  <!-- AMD label -->
  <rect x="692" y="364" width="176" height="56" rx="6" fill="#f5f5f5" stroke="#aaa" stroke-width="1"/>
  <text x="780" y="382" text-anchor="middle" font-size="10" font-weight="bold" fill="#c8001c">AMD Zen 5 Example</text>
  <text x="780" y="398" text-anchor="middle" font-size="9" fill="#555">2-16 CCDs per socket</text>
  <text x="780" y="412" text-anchor="middle" font-size="9" fill="#555">Coherence via IOD probe filter</text>

  <!-- Bottom note -->
  <rect x="14" y="440" width="652" height="46" rx="8" fill="#004065"/>
  <text x="340" y="458" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFD200">CXL enables coherent access across CPUs, memory expanders, and accelerators</text>
  <text x="340" y="476" text-anchor="middle" font-size="11" fill="white">CXL.cache: device caches host memory coherently  |  CXL.mem: host accesses device memory  |  CXL.io: PCIe-compatible I/O</text>
</svg>
