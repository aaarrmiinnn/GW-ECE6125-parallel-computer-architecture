<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 660" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#004065"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc2200"/>
    </marker>
    <marker id="arr-gold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b8860b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="660" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="550" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#004065">MESI Protocol — State Machine</text>

  <!-- ── State circles ── -->

  <!-- M — top center, gold -->
  <circle cx="550" cy="155" r="65" fill="#FFD200" stroke="#004065" stroke-width="3"/>
  <text x="550" y="148" text-anchor="middle" font-size="30" font-weight="bold" fill="#004065">M</text>
  <text x="550" y="173" text-anchor="middle" font-size="13" fill="#004065">Modified</text>

  <!-- E — right, green -->
  <circle cx="880" cy="380" r="65" fill="#2e7d32" stroke="#1b5e20" stroke-width="3"/>
  <text x="880" y="373" text-anchor="middle" font-size="30" font-weight="bold" fill="white">E</text>
  <text x="880" y="398" text-anchor="middle" font-size="13" fill="#ccffcc">Exclusive</text>

  <!-- S — bottom center, blue -->
  <circle cx="550" cy="540" r="65" fill="#004065" stroke="#002a42" stroke-width="3"/>
  <text x="550" y="533" text-anchor="middle" font-size="30" font-weight="bold" fill="white">S</text>
  <text x="550" y="558" text-anchor="middle" font-size="13" fill="white">Shared</text>

  <!-- I — left, light gray -->
  <circle cx="220" cy="380" r="65" fill="#d0d8e0" stroke="#004065" stroke-width="3"/>
  <text x="220" y="373" text-anchor="middle" font-size="30" font-weight="bold" fill="#004065">I</text>
  <text x="220" y="398" text-anchor="middle" font-size="13" fill="#555">Invalid</text>

  <!-- ══════════════════════════════════════
       I → E  (blue, CPU read — only copy)
       Arcs from I right-upper to E left-upper, sweeping above both M and E
  ══════════════════════════════════════ -->
  <path d="M 250 340 Q 550 60 848 340" stroke="#004065" stroke-width="2.5" fill="none" marker-end="url(#arr-blue)"/>
  <rect x="440" y="62" width="222" height="38" rx="5" fill="white" stroke="#004065" stroke-width="1.5"/>
  <text x="551" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#004065">I → E</text>
  <text x="551" y="93" text-anchor="middle" font-size="10" fill="#555">CPU Read / BusRd — only copy in system</text>

  <!-- ══════════════════════════════════════
       I → M  (blue, CPU write from invalid)
       Arcs up-left from I to M
  ══════════════════════════════════════ -->
  <path d="M 192 318 Q 180 200 488 165" stroke="#004065" stroke-width="2.5" fill="none" marker-end="url(#arr-blue)"/>
  <rect x="22" y="190" width="170" height="38" rx="5" fill="white" stroke="#004065" stroke-width="1.5"/>
  <text x="107" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#004065">I → M</text>
  <text x="107" y="221" text-anchor="middle" font-size="10" fill="#555">CPU Write / BusRdX</text>

  <!-- ══════════════════════════════════════
       I → S  (blue, CPU read — shared)
       Arcs from I bottom to S left
  ══════════════════════════════════════ -->
  <path d="M 248 430 Q 350 560 486 546" stroke="#004065" stroke-width="2.5" fill="none" marker-end="url(#arr-blue)"/>
  <rect x="270" y="532" width="170" height="38" rx="5" fill="white" stroke="#004065" stroke-width="1.5"/>
  <text x="355" y="547" text-anchor="middle" font-size="11" font-weight="bold" fill="#004065">I → S</text>
  <text x="355" y="563" text-anchor="middle" font-size="10" fill="#555">CPU Read / BusRd (others have copy)</text>

  <!-- ══════════════════════════════════════
       E → M  (gold/silent, CPU write — no bus)
       Arc from E upper-left to M right — THICK GOLD, labelled SILENT
  ══════════════════════════════════════ -->
  <path d="M 840 330 Q 760 210 620 168" stroke="#b8860b" stroke-width="4" fill="none" marker-end="url(#arr-gold)"/>
  <rect x="692" y="196" width="196" height="42" rx="5" fill="#FFF8D0" stroke="#b8860b" stroke-width="2"/>
  <text x="790" y="213" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b6a00">E → M  (SILENT)</text>
  <text x="790" y="229" text-anchor="middle" font-size="10" fill="#555">CPU Write — no bus transaction!</text>

  <!-- ══════════════════════════════════════
       E → S  (red, snoop BusRd)
       Arc from E lower-left curving to S right
  ══════════════════════════════════════ -->
  <path d="M 836 432 Q 740 560 618 548" stroke="#cc2200" stroke-width="2.5" fill="none" marker-end="url(#arr-red)"/>
  <rect x="686" y="538" width="170" height="38" rx="5" fill="white" stroke="#cc2200" stroke-width="1.5"/>
  <text x="771" y="553" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc2200">E → S</text>
  <text x="771" y="569" text-anchor="middle" font-size="10" fill="#555">Snoop BusRd / supply data</text>

  <!-- ══════════════════════════════════════
       E → I  (red, snoop BusRdX)
       Self-loop on right side of E
  ══════════════════════════════════════ -->
  <path d="M 940 346 Q 1040 310 942 416" stroke="#cc2200" stroke-width="2.5" fill="none" marker-end="url(#arr-red)"/>
  <rect x="944" y="346" width="142" height="42" rx="5" fill="white" stroke="#cc2200" stroke-width="1.5"/>
  <text x="1015" y="362" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc2200">E → I</text>
  <text x="1015" y="378" text-anchor="middle" font-size="10" fill="#555">Snoop BusRdX</text>
  <text x="1015" y="390" text-anchor="middle" font-size="9" fill="#888">(supply data)</text>

  <!-- ══════════════════════════════════════
       S → M  (blue, CPU write / BusUpgr)
       Arc from S left to M bottom-left, curves left of center
  ══════════════════════════════════════ -->
  <path d="M 498 482 Q 400 340 484 218" stroke="#004065" stroke-width="2.5" fill="none" marker-end="url(#arr-blue)"/>
  <rect x="310" y="326" width="170" height="38" rx="5" fill="white" stroke="#004065" stroke-width="1.5"/>
  <text x="395" y="341" text-anchor="middle" font-size="11" font-weight="bold" fill="#004065">S → M</text>
  <text x="395" y="357" text-anchor="middle" font-size="10" fill="#555">CPU Write / BusUpgr</text>

  <!-- ══════════════════════════════════════
       S → I  (red, snoop BusRdX or BusUpgr)
       Arc from S left curving down to I bottom
  ══════════════════════════════════════ -->
  <path d="M 490 576 Q 350 630 238 448" stroke="#cc2200" stroke-width="2.5" fill="none" marker-end="url(#arr-red)"/>
  <rect x="282" y="614" width="200" height="38" rx="5" fill="white" stroke="#cc2200" stroke-width="1.5"/>
  <text x="382" y="629" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc2200">S → I</text>
  <text x="382" y="645" text-anchor="middle" font-size="10" fill="#555">Snoop BusRdX or BusUpgr</text>

  <!-- ══════════════════════════════════════
       M → S  (red, snoop BusRd / supply data)
       Arc from M bottom-right to S top-right, curves right of center
  ══════════════════════════════════════ -->
  <path d="M 603 200 Q 700 360 618 476" stroke="#cc2200" stroke-width="2.5" fill="none" marker-end="url(#arr-red)"/>
  <rect x="640" y="320" width="180" height="38" rx="5" fill="white" stroke="#cc2200" stroke-width="1.5"/>
  <text x="730" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc2200">M → S</text>
  <text x="730" y="351" text-anchor="middle" font-size="10" fill="#555">Snoop BusRd / supply data</text>

  <!-- ══════════════════════════════════════
       M → I  (red, snoop BusRdX / supply data)
       Arc from M left to I top, curves far left
  ══════════════════════════════════════ -->
  <path d="M 489 168 Q 220 80 196 316" stroke="#cc2200" stroke-width="2.5" fill="none" marker-end="url(#arr-red)"/>
  <rect x="22" y="108" width="190" height="38" rx="5" fill="white" stroke="#cc2200" stroke-width="1.5"/>
  <text x="117" y="123" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc2200">M → I</text>
  <text x="117" y="139" text-anchor="middle" font-size="10" fill="#555">Snoop BusRdX / supply data</text>

  <!-- ══════════════════════════════════════
       SELF-LOOPS
  ══════════════════════════════════════ -->

  <!-- M self-loop: CPU Read/Write while M — no bus -->
  <path d="M 488 138 Q 430 88 490 172" stroke="#004065" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>
  <rect x="280" y="74" width="200" height="38" rx="5" fill="#fffbe6" stroke="#004065" stroke-width="1.5"/>
  <text x="380" y="89" text-anchor="middle" font-size="10" font-weight="bold" fill="#004065">CPU Read or Write</text>
  <text x="380" y="105" text-anchor="middle" font-size="10" fill="#555">already M — no bus traffic</text>

  <!-- S self-loop: CPU Read while S — no bus -->
  <path d="M 490 508 Q 440 462 506 510" stroke="#004065" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>
  <rect x="308" y="472" width="130" height="38" rx="5" fill="#e8f0f8" stroke="#004065" stroke-width="1.5"/>
  <text x="373" y="487" text-anchor="middle" font-size="10" font-weight="bold" fill="#004065">CPU Read</text>
  <text x="373" y="503" text-anchor="middle" font-size="10" fill="#555">no bus traffic</text>

  <!-- ══════════════════════════════════════
       LEGEND
  ══════════════════════════════════════ -->
  <rect x="22" y="440" width="172" height="148" rx="8" fill="white" stroke="#bbb" stroke-width="1.5"/>
  <text x="108" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#004065">Legend</text>

  <line x1="34" y1="477" x2="74" y2="477" stroke="#004065" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="82" y="481" font-size="11" fill="#004065" font-weight="bold">Blue</text>
  <text x="113" y="481" font-size="11" fill="#555"> = this CPU</text>

  <line x1="34" y1="499" x2="74" y2="499" stroke="#cc2200" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="82" y="503" font-size="11" fill="#cc2200" font-weight="bold">Red</text>
  <text x="109" y="503" font-size="11" fill="#555"> = snoop</text>

  <line x1="34" y1="521" x2="74" y2="521" stroke="#b8860b" stroke-width="4" marker-end="url(#arr-gold)"/>
  <text x="82" y="525" font-size="11" fill="#b8860b" font-weight="bold">Gold</text>
  <text x="114" y="525" font-size="11" fill="#555"> = silent</text>

  <text x="34" y="546" font-size="9.5" fill="#555">BusRd   — fetch shared (read) copy</text>
  <text x="34" y="560" font-size="9.5" fill="#555">BusRdX  — fetch exclusive (write) copy</text>
  <text x="34" y="574" font-size="9.5" fill="#555">BusUpgr — upgrade S→M, no data needed</text>

</svg>
