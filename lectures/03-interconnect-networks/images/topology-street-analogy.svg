<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <defs>
    <marker id="car-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c62828"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="#f8f9fa"/>

  <text x="450" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#004065">Street Analogy: Direct vs Indirect Networks</text>

  <!-- DIRECT NETWORK (Left side) -->
  <text x="225" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">Direct Network (City Grid)</text>
  <text x="225" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Every intersection has a house</text>

  <!-- Grid background -->
  <rect x="50" y="85" width="350" height="200" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>

  <!-- Horizontal streets -->
  <line x1="70" y1="135" x2="380" y2="135" stroke="#888" stroke-width="4"/>
  <line x1="70" y1="185" x2="380" y2="185" stroke="#888" stroke-width="4"/>
  <line x1="70" y1="235" x2="380" y2="235" stroke="#888" stroke-width="4"/>

  <!-- Vertical streets -->
  <line x1="120" y1="105" x2="120" y2="265" stroke="#888" stroke-width="4"/>
  <line x1="200" y1="105" x2="200" y2="265" stroke="#888" stroke-width="4"/>
  <line x1="280" y1="105" x2="280" y2="265" stroke="#888" stroke-width="4"/>
  <line x1="360" y1="105" x2="360" y2="265" stroke="#888" stroke-width="4"/>

  <!-- Houses at intersections (Direct = every intersection has a node) -->
  <!-- Row 1 -->
  <rect x="108" y="123" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="120" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>
  <rect x="188" y="123" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="200" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>
  <rect x="268" y="123" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="280" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>
  <rect x="348" y="123" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="360" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>

  <!-- Row 2 -->
  <rect x="108" y="173" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="120" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>
  <rect x="188" y="173" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="200" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>
  <rect x="268" y="173" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="280" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>
  <rect x="348" y="173" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="360" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>

  <!-- Row 3 -->
  <rect x="108" y="223" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="120" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>
  <rect x="188" y="223" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="200" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>
  <rect x="268" y="223" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="280" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>
  <rect x="348" y="223" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="360" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>

  <!-- Car path example (red arrow) -->
  <path d="M 132 185 L 200 185 L 200 235 L 268 235" fill="none" stroke="#c62828" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#car-arrow)"/>
  <text x="170" y="210" font-family="Arial, sans-serif" font-size="9" fill="#c62828">Car</text>

  <!-- INDIRECT NETWORK (Right side) -->
  <text x="675" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#388e3c">Indirect Network (Highway System)</text>
  <text x="675" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Houses connect via on-ramps to highways</text>

  <!-- Highway background -->
  <rect x="500" y="85" width="350" height="200" rx="5" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>

  <!-- Main Highway (thick line in middle) -->
  <line x1="520" y1="185" x2="830" y2="185" stroke="#2e7d32" stroke-width="12"/>
  <text x="675" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">HIGHWAY</text>

  <!-- Highway switches/interchanges -->
  <circle cx="580" cy="185" r="15" fill="#a5d6a7" stroke="#2e7d32" stroke-width="2"/>
  <text x="580" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#1b5e20">SW</text>
  <circle cx="675" cy="185" r="15" fill="#a5d6a7" stroke="#2e7d32" stroke-width="2"/>
  <text x="675" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#1b5e20">SW</text>
  <circle cx="770" cy="185" r="15" fill="#a5d6a7" stroke="#2e7d32" stroke-width="2"/>
  <text x="770" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#1b5e20">SW</text>

  <!-- Houses (top row - not directly on highway) -->
  <rect x="548" y="105" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="560" y="121" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>
  <rect x="608" y="105" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="620" y="121" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>
  <rect x="728" y="105" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="740" y="121" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>
  <rect x="788" y="105" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="800" y="121" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>

  <!-- Houses (bottom row) -->
  <rect x="548" y="245" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="560" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>
  <rect x="608" y="245" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="620" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>
  <rect x="728" y="245" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="740" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>
  <rect x="788" y="245" width="24" height="24" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="800" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">H</text>

  <!-- On-ramps (local roads to highway) -->
  <line x1="560" y1="129" x2="580" y2="170" stroke="#888" stroke-width="2"/>
  <line x1="620" y1="129" x2="580" y2="170" stroke="#888" stroke-width="2"/>
  <line x1="740" y1="129" x2="770" y2="170" stroke="#888" stroke-width="2"/>
  <line x1="800" y1="129" x2="770" y2="170" stroke="#888" stroke-width="2"/>
  <line x1="560" y1="245" x2="580" y2="200" stroke="#888" stroke-width="2"/>
  <line x1="620" y1="245" x2="675" y2="200" stroke="#888" stroke-width="2"/>
  <line x1="740" y1="245" x2="675" y2="200" stroke="#888" stroke-width="2"/>
  <line x1="800" y1="245" x2="770" y2="200" stroke="#888" stroke-width="2"/>

  <!-- Car path on highway -->
  <path d="M 560 245 L 580 200 L 770 185 L 770 170 L 740 129" fill="none" stroke="#c62828" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#car-arrow)"/>
  <text x="675" y="160" font-family="Arial, sans-serif" font-size="9" fill="#c62828">Car on Highway</text>

  <!-- Legend / Comparison -->
  <rect x="50" y="300" width="400" height="110" rx="5" fill="#fff" stroke="#1976d2" stroke-width="1"/>
  <text x="250" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2">Direct Network = City Grid</text>
  <text x="70" y="340" font-family="Arial, sans-serif" font-size="10" fill="#333">- Every intersection is both a crossing AND a house</text>
  <text x="70" y="355" font-family="Arial, sans-serif" font-size="10" fill="#333">- Short trips are fast (low latency for neighbors)</text>
  <text x="70" y="370" font-family="Arial, sans-serif" font-size="10" fill="#333">- Long trips require many turns (high hop count)</text>
  <text x="70" y="385" font-family="Arial, sans-serif" font-size="10" fill="#333">- Examples: Mesh, Torus, Hypercube</text>
  <text x="70" y="400" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1976d2">Diameter = max turns to reach any house</text>

  <rect x="500" y="300" width="350" height="110" rx="5" fill="#fff" stroke="#388e3c" stroke-width="1"/>
  <text x="675" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#388e3c">Indirect Network = Highway System</text>
  <text x="520" y="340" font-family="Arial, sans-serif" font-size="10" fill="#333">- Houses connect to switches (on-ramps)</text>
  <text x="520" y="355" font-family="Arial, sans-serif" font-size="10" fill="#333">- Switches route traffic (highway interchanges)</text>
  <text x="520" y="370" font-family="Arial, sans-serif" font-size="10" fill="#333">- Fast for distant destinations (highways)</text>
  <text x="520" y="385" font-family="Arial, sans-serif" font-size="10" fill="#333">- Examples: Fat-tree, Clos, Butterfly</text>
  <text x="520" y="400" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#388e3c">Diameter = max highway hops needed</text>
</svg>