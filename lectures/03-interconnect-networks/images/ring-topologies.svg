<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380">
  <rect width="900" height="380" fill="#f8f9fa"/>

  <text x="450" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#004065">Ring Topology Variations: Trading Degree for Diameter</text>

  <!-- SIMPLE RING -->
  <text x="150" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c62828">Simple Ring</text>

  <rect x="30" y="70" width="240" height="200" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>

  <!-- Ring nodes -->
  <circle cx="150" cy="100" r="18" fill="#ef9a9a" stroke="#c62828" stroke-width="2"/>
  <text x="150" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#b71c1c">0</text>

  <circle cx="220" cy="140" r="18" fill="#ef9a9a" stroke="#c62828" stroke-width="2"/>
  <text x="220" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#b71c1c">1</text>

  <circle cx="220" cy="210" r="18" fill="#ef9a9a" stroke="#c62828" stroke-width="2"/>
  <text x="220" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#b71c1c">2</text>

  <circle cx="150" cy="250" r="18" fill="#ef9a9a" stroke="#c62828" stroke-width="2"/>
  <text x="150" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#b71c1c">3</text>

  <circle cx="80" cy="210" r="18" fill="#ef9a9a" stroke="#c62828" stroke-width="2"/>
  <text x="80" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#b71c1c">4</text>

  <circle cx="80" cy="140" r="18" fill="#ef9a9a" stroke="#c62828" stroke-width="2"/>
  <text x="80" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#b71c1c">5</text>

  <!-- Ring connections -->
  <line x1="168" y1="100" x2="202" y2="130" stroke="#c62828" stroke-width="2"/>
  <line x1="220" y1="158" x2="220" y2="192" stroke="#c62828" stroke-width="2"/>
  <line x1="202" y1="220" x2="168" y2="250" stroke="#c62828" stroke-width="2"/>
  <line x1="132" y1="250" x2="98" y2="220" stroke="#c62828" stroke-width="2"/>
  <line x1="80" y1="192" x2="80" y2="158" stroke="#c62828" stroke-width="2"/>
  <line x1="98" y1="130" x2="132" y2="100" stroke="#c62828" stroke-width="2"/>

  <text x="150" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c62828">Degree = 2</text>
  <text x="150" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c62828">Diameter = N/2 = 3</text>

  <!-- CHORDAL RING -->
  <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1976d2">Chordal Ring</text>

  <rect x="330" y="70" width="240" height="200" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>

  <!-- Chordal ring nodes -->
  <circle cx="450" cy="100" r="18" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="450" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0d47a1">0</text>

  <circle cx="520" cy="140" r="18" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="520" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0d47a1">1</text>

  <circle cx="520" cy="210" r="18" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="520" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0d47a1">2</text>

  <circle cx="450" cy="250" r="18" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="450" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0d47a1">3</text>

  <circle cx="380" cy="210" r="18" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="380" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0d47a1">4</text>

  <circle cx="380" cy="140" r="18" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="380" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0d47a1">5</text>

  <!-- Ring connections -->
  <line x1="468" y1="100" x2="502" y2="130" stroke="#1976d2" stroke-width="2"/>
  <line x1="520" y1="158" x2="520" y2="192" stroke="#1976d2" stroke-width="2"/>
  <line x1="502" y1="220" x2="468" y2="250" stroke="#1976d2" stroke-width="2"/>
  <line x1="432" y1="250" x2="398" y2="220" stroke="#1976d2" stroke-width="2"/>
  <line x1="380" y1="192" x2="380" y2="158" stroke="#1976d2" stroke-width="2"/>
  <line x1="398" y1="130" x2="432" y2="100" stroke="#1976d2" stroke-width="2"/>

  <!-- Chords (shortcuts) -->
  <line x1="450" y1="118" x2="450" y2="232" stroke="#ff9800" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="398" y1="145" x2="502" y2="205" stroke="#ff9800" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="398" y1="205" x2="502" y2="145" stroke="#ff9800" stroke-width="2" stroke-dasharray="5,3"/>

  <text x="450" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1976d2">Degree = 4</text>
  <text x="450" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1976d2">Diameter = 2</text>

  <!-- FULLY CONNECTED -->
  <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#388e3c">Fully Connected</text>

  <rect x="630" y="70" width="240" height="200" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>

  <!-- Fully connected nodes -->
  <circle cx="750" cy="100" r="18" fill="#81c784" stroke="#388e3c" stroke-width="2"/>
  <text x="750" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1b5e20">0</text>

  <circle cx="820" cy="140" r="18" fill="#81c784" stroke="#388e3c" stroke-width="2"/>
  <text x="820" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1b5e20">1</text>

  <circle cx="820" cy="210" r="18" fill="#81c784" stroke="#388e3c" stroke-width="2"/>
  <text x="820" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1b5e20">2</text>

  <circle cx="750" cy="250" r="18" fill="#81c784" stroke="#388e3c" stroke-width="2"/>
  <text x="750" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1b5e20">3</text>

  <circle cx="680" cy="210" r="18" fill="#81c784" stroke="#388e3c" stroke-width="2"/>
  <text x="680" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1b5e20">4</text>

  <circle cx="680" cy="140" r="18" fill="#81c784" stroke="#388e3c" stroke-width="2"/>
  <text x="680" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1b5e20">5</text>

  <!-- All connections (fully connected) -->
  <line x1="768" y1="100" x2="802" y2="130" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="820" y1="158" x2="820" y2="192" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="802" y1="220" x2="768" y2="250" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="732" y1="250" x2="698" y2="220" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="680" y1="192" x2="680" y2="158" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="698" y1="130" x2="732" y2="100" stroke="#388e3c" stroke-width="1.5"/>
  <!-- Diagonals and cross connections -->
  <line x1="750" y1="118" x2="750" y2="232" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="698" y1="145" x2="802" y2="205" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="698" y1="205" x2="802" y2="145" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="750" y1="118" x2="802" y2="200" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="750" y1="118" x2="698" y2="200" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="698" y1="150" x2="802" y2="150" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="698" y1="200" x2="802" y2="200" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="750" y1="232" x2="698" y2="150" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="750" y1="232" x2="802" y2="150" stroke="#388e3c" stroke-width="1.5"/>

  <text x="750" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#388e3c">Degree = N-1 = 5</text>
  <text x="750" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#388e3c">Diameter = 1</text>

  <!-- Trade-off summary -->
  <rect x="100" y="320" width="700" height="50" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="450" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Key Trade-off: More connections (higher degree) = Shorter paths (lower diameter)</text>
  <text x="450" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">But higher degree means more wires, more ports, more cost!</text>
</svg>
