<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400">
  <rect width="850" height="400" fill="#f8f9fa"/>

  <text x="425" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#004065">Bus Interconnect Network</text>

  <!-- Main Bus Line -->
  <rect x="50" y="170" width="750" height="20" rx="3" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
  <text x="425" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">SHARED BUS</text>

  <!-- Processors/Nodes -->
  <rect x="80" y="60" width="100" height="80" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="130" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1976d2">CPU 0</text>
  <rect x="95" y="95" width="70" height="25" rx="3" fill="#bbdefb" stroke="#1976d2" stroke-width="1"/>
  <text x="130" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Cache</text>
  <line x1="130" y1="140" x2="130" y2="170" stroke="#1976d2" stroke-width="3"/>

  <rect x="230" y="60" width="100" height="80" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="280" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1976d2">CPU 1</text>
  <rect x="245" y="95" width="70" height="25" rx="3" fill="#bbdefb" stroke="#1976d2" stroke-width="1"/>
  <text x="280" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Cache</text>
  <line x1="280" y1="140" x2="280" y2="170" stroke="#1976d2" stroke-width="3"/>

  <rect x="380" y="60" width="100" height="80" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="430" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1976d2">CPU 2</text>
  <rect x="395" y="95" width="70" height="25" rx="3" fill="#bbdefb" stroke="#1976d2" stroke-width="1"/>
  <text x="430" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Cache</text>
  <line x1="430" y1="140" x2="430" y2="170" stroke="#1976d2" stroke-width="3"/>

  <rect x="530" y="60" width="100" height="80" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="580" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1976d2">CPU 3</text>
  <rect x="545" y="95" width="70" height="25" rx="3" fill="#bbdefb" stroke="#1976d2" stroke-width="1"/>
  <text x="580" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Cache</text>
  <line x1="580" y1="140" x2="580" y2="170" stroke="#1976d2" stroke-width="3"/>

  <!-- Memory/IO -->
  <rect x="680" y="60" width="100" height="80" rx="5" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="730" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#388e3c">Memory</text>
  <text x="730" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">+ I/O</text>
  <line x1="730" y1="140" x2="730" y2="170" stroke="#388e3c" stroke-width="3"/>

  <!-- Snooping illustration -->
  <text x="425" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">All caches snoop (monitor) bus transactions for coherence</text>

  <!-- Data transfer arrow (CPU1 to Memory) -->
  <path d="M 280 150 Q 280 145, 500 145 Q 720 145, 720 150" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#bus-arrow)"/>
  <defs>
    <marker id="bus-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c62828"/>
    </marker>
  </defs>
  <text x="500" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#c62828">Data Request</text>

  <!-- Characteristics boxes below -->
  <rect x="50" y="220" width="230" height="160" rx="8" fill="#c8e6c9" stroke="#388e3c" stroke-width="2"/>
  <text x="165" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Advantages</text>

  <text x="65" y="268" font-family="Arial, sans-serif" font-size="10" fill="#333">Simple design</text>
  <text x="65" y="288" font-family="Arial, sans-serif" font-size="10" fill="#333">Low cost for small systems</text>
  <text x="65" y="308" font-family="Arial, sans-serif" font-size="10" fill="#333">Easy cache coherence (snooping)</text>
  <text x="65" y="328" font-family="Arial, sans-serif" font-size="10" fill="#333">All nodes see same order</text>
  <text x="65" y="348" font-family="Arial, sans-serif" font-size="10" fill="#333">Broadcast is free</text>
  <text x="65" y="368" font-family="Arial, sans-serif" font-size="10" fill="#333">Fair arbitration possible</text>

  <rect x="310" y="220" width="230" height="160" rx="8" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="425" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c62828">Disadvantages</text>

  <text x="325" y="268" font-family="Arial, sans-serif" font-size="10" fill="#333">Shared bandwidth</text>
  <text x="325" y="288" font-family="Arial, sans-serif" font-size="10" fill="#333">High contention with many nodes</text>
  <text x="325" y="308" font-family="Arial, sans-serif" font-size="10" fill="#333">Limited scalability (8-16 nodes)</text>
  <text x="325" y="328" font-family="Arial, sans-serif" font-size="10" fill="#333">Electrical loading limits speed</text>
  <text x="325" y="348" font-family="Arial, sans-serif" font-size="10" fill="#333">Single point of failure</text>
  <text x="325" y="368" font-family="Arial, sans-serif" font-size="10" fill="#333">BW does not scale with N</text>

  <!-- Scalability box -->
  <rect x="570" y="220" width="230" height="160" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="685" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Scalability</text>

  <text x="585" y="268" font-family="Arial, sans-serif" font-size="10" fill="#333">Delay: O(1) - single hop</text>
  <text x="585" y="288" font-family="Arial, sans-serif" font-size="10" fill="#333">Cost: O(N) - linear wiring</text>
  <text x="585" y="308" font-family="Arial, sans-serif" font-size="10" fill="#333">Bandwidth: O(1) - shared</text>

  <text x="585" y="338" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#bf360c">Throughput saturates as:</text>
  <text x="585" y="358" font-family="Arial, sans-serif" font-size="10" fill="#333">N increases (more contention)</text>
  <text x="585" y="378" font-family="Arial, sans-serif" font-size="10" fill="#333">Traffic increases (requests)</text>
</svg>
