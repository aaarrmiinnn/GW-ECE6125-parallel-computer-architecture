<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <rect width="600" height="450" fill="#f8f9fa"/>

  <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#004065">Crossbar Switch (4x4)</text>
  <text x="300" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Every input has a dedicated crosspoint to every output</text>

  <!-- Main crossbar area -->
  <rect x="120" y="80" width="360" height="280" rx="5" fill="#fff8e1" stroke="#f57c00" stroke-width="2"/>

  <!-- Input labels (left side) -->
  <rect x="30" y="115" width="70" height="35" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="65" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2">Input 0</text>

  <rect x="30" y="175" width="70" height="35" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="65" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2">Input 1</text>

  <rect x="30" y="235" width="70" height="35" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="65" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2">Input 2</text>

  <rect x="30" y="295" width="70" height="35" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="65" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2">Input 3</text>

  <!-- Output labels (bottom) -->
  <rect x="155" y="385" width="60" height="35" rx="5" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="185" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#388e3c">Out 0</text>

  <rect x="235" y="385" width="60" height="35" rx="5" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="265" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#388e3c">Out 1</text>

  <rect x="315" y="385" width="60" height="35" rx="5" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="345" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#388e3c">Out 2</text>

  <rect x="395" y="385" width="60" height="35" rx="5" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="425" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#388e3c">Out 3</text>

  <!-- Horizontal lines (input buses) -->
  <line x1="100" y1="132" x2="480" y2="132" stroke="#1976d2" stroke-width="3"/>
  <line x1="100" y1="192" x2="480" y2="192" stroke="#1976d2" stroke-width="3"/>
  <line x1="100" y1="252" x2="480" y2="252" stroke="#1976d2" stroke-width="3"/>
  <line x1="100" y1="312" x2="480" y2="312" stroke="#1976d2" stroke-width="3"/>

  <!-- Vertical lines (output buses) -->
  <line x1="185" y1="95" x2="185" y2="385" stroke="#388e3c" stroke-width="3"/>
  <line x1="265" y1="95" x2="265" y2="385" stroke="#388e3c" stroke-width="3"/>
  <line x1="345" y1="95" x2="345" y2="385" stroke="#388e3c" stroke-width="3"/>
  <line x1="425" y1="95" x2="425" y2="385" stroke="#388e3c" stroke-width="3"/>

  <!-- Crosspoint switches (16 total = 4x4) -->
  <!-- Row 0 -->
  <circle cx="185" cy="132" r="12" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <circle cx="265" cy="132" r="12" fill="#4caf50" stroke="#2e7d32" stroke-width="3"/>
  <circle cx="345" cy="132" r="12" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <circle cx="425" cy="132" r="12" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>

  <!-- Row 1 -->
  <circle cx="185" cy="192" r="12" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <circle cx="265" cy="192" r="12" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <circle cx="345" cy="192" r="12" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <circle cx="425" cy="192" r="12" fill="#4caf50" stroke="#2e7d32" stroke-width="3"/>

  <!-- Row 2 -->
  <circle cx="185" cy="252" r="12" fill="#4caf50" stroke="#2e7d32" stroke-width="3"/>
  <circle cx="265" cy="252" r="12" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <circle cx="345" cy="252" r="12" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <circle cx="425" cy="252" r="12" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>

  <!-- Row 3 -->
  <circle cx="185" cy="312" r="12" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <circle cx="265" cy="312" r="12" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <circle cx="345" cy="312" r="12" fill="#4caf50" stroke="#2e7d32" stroke-width="3"/>
  <circle cx="425" cy="312" r="12" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>

  <!-- Legend -->
  <circle cx="520" y="120" r="10" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="540" y="125" font-family="Arial, sans-serif" font-size="11" fill="#333">Open</text>

  <circle cx="520" cy="150" r="10" fill="#4caf50" stroke="#2e7d32" stroke-width="3"/>
  <text x="540" y="155" font-family="Arial, sans-serif" font-size="11" fill="#333">Closed</text>

  <!-- Current connections annotation -->
  <text x="520" y="200" font-family="Arial, sans-serif" font-size="10" fill="#333">Active:</text>
  <text x="520" y="218" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">In0 to Out1</text>
  <text x="520" y="236" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">In1 to Out3</text>
  <text x="520" y="254" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">In2 to Out0</text>
  <text x="520" y="272" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">In3 to Out2</text>

  <!-- Key insight -->
  <rect x="120" y="430" width="360" height="15" fill="none"/>
  <text x="300" y="443" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">N inputs x N outputs = N² crosspoint switches</text>
</svg>
