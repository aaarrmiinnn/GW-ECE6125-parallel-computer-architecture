<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450">
  <rect width="850" height="450" fill="#f8f9fa"/>

  <text x="425" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#004065">Crossbar Interconnect Network</text>

  <!-- Crossbar Grid Area -->
  <rect x="150" y="80" width="280" height="280" rx="5" fill="#fff8e1" stroke="#f57c00" stroke-width="2"/>
  <text x="290" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e65100">4x4 Crossbar Switch</text>

  <!-- Input Labels -->
  <text x="50" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1976d2">Input 0</text>
  <text x="50" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1976d2">Input 1</text>
  <text x="50" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1976d2">Input 2</text>
  <text x="50" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1976d2">Input 3</text>

  <!-- Output Labels -->
  <text x="200" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#388e3c">Out 0</text>
  <text x="260" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#388e3c">Out 1</text>
  <text x="320" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#388e3c">Out 2</text>
  <text x="380" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#388e3c">Out 3</text>

  <!-- Horizontal lines (input buses) -->
  <line x1="90" y1="137" x2="430" y2="137" stroke="#1976d2" stroke-width="2"/>
  <line x1="90" y1="197" x2="430" y2="197" stroke="#1976d2" stroke-width="2"/>
  <line x1="90" y1="257" x2="430" y2="257" stroke="#1976d2" stroke-width="2"/>
  <line x1="90" y1="317" x2="430" y2="317" stroke="#1976d2" stroke-width="2"/>

  <!-- Vertical lines (output buses) -->
  <line x1="200" y1="95" x2="200" y2="365" stroke="#388e3c" stroke-width="2"/>
  <line x1="260" y1="95" x2="260" y2="365" stroke="#388e3c" stroke-width="2"/>
  <line x1="320" y1="95" x2="320" y2="365" stroke="#388e3c" stroke-width="2"/>
  <line x1="380" y1="95" x2="380" y2="365" stroke="#388e3c" stroke-width="2"/>

  <!-- Crosspoint switches (NxN = 16 switches) -->
  <!-- Row 0 -->
  <circle cx="200" cy="137" r="8" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <circle cx="260" cy="137" r="8" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="320" cy="137" r="8" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <circle cx="380" cy="137" r="8" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>

  <!-- Row 1 -->
  <circle cx="200" cy="197" r="8" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <circle cx="260" cy="197" r="8" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <circle cx="320" cy="197" r="8" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <circle cx="380" cy="197" r="8" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>

  <!-- Row 2 -->
  <circle cx="200" cy="257" r="8" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="260" cy="257" r="8" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <circle cx="320" cy="257" r="8" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <circle cx="380" cy="257" r="8" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>

  <!-- Row 3 -->
  <circle cx="200" cy="317" r="8" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <circle cx="260" cy="317" r="8" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <circle cx="320" cy="317" r="8" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="380" cy="317" r="8" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>

  <!-- Active connection indicators -->
  <text x="290" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2e7d32">Active connections shown in green</text>

  <!-- Characteristics -->
  <rect x="480" y="80" width="340" height="140" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="650" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Advantages</text>

  <text x="495" y="130" font-family="Arial, sans-serif" font-size="10" fill="#333">Any input to any output (full connectivity)</text>
  <text x="495" y="150" font-family="Arial, sans-serif" font-size="10" fill="#333">O(1) latency - single hop</text>
  <text x="495" y="170" font-family="Arial, sans-serif" font-size="10" fill="#333">Non-blocking: multiple transfers simultaneously</text>
  <text x="495" y="190" font-family="Arial, sans-serif" font-size="10" fill="#333">High throughput for concurrent transfers</text>
  <text x="495" y="210" font-family="Arial, sans-serif" font-size="10" fill="#333">No contention for different destinations</text>

  <rect x="480" y="235" width="340" height="125" rx="8" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="650" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c62828">Disadvantages</text>

  <text x="495" y="285" font-family="Arial, sans-serif" font-size="10" fill="#333">O(N squared) crosspoint switches</text>
  <text x="495" y="305" font-family="Arial, sans-serif" font-size="10" fill="#333">O(N squared) wiring complexity</text>
  <text x="495" y="325" font-family="Arial, sans-serif" font-size="10" fill="#333">Arbitration needed at each output</text>
  <text x="495" y="345" font-family="Arial, sans-serif" font-size="10" fill="#333">Cost prohibitive for large N</text>

  <!-- Scalability -->
  <rect x="480" y="375" width="340" height="60" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="495" y="400" font-family="Arial, sans-serif" font-size="10" fill="#333">For N=4: 16 crosspoints | For N=16: 256 crosspoints</text>
  <text x="495" y="420" font-family="Arial, sans-serif" font-size="10" fill="#333">For N=64: 4,096 crosspoints | For N=256: 65,536 crosspoints</text>

  <!-- Legend -->
  <rect x="150" y="395" width="280" height="45" rx="5" fill="white" stroke="#666" stroke-width="1"/>
  <circle cx="175" cy="417" r="8" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="190" y="421" font-family="Arial, sans-serif" font-size="10" fill="#333">Open switch</text>
  <circle cx="300" cy="417" r="8" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
  <text x="315" y="421" font-family="Arial, sans-serif" font-size="10" fill="#333">Closed (active) switch</text>
</svg>
