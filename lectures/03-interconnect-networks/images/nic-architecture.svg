<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#004065"/>
    </marker>
    <marker id="arrowhead-rev" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#004065"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>

  <!-- Host/CPU Box -->
  <rect x="50" y="120" width="150" height="160" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="125" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2">Host (CPU)</text>
  <text x="125" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Memory</text>
  <text x="125" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Application</text>
  <text x="125" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">OS/Driver</text>

  <!-- NIC Box (main) -->
  <rect x="280" y="80" width="240" height="240" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="3"/>
  <text x="400" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e65100">Network Interface Controller</text>

  <!-- NIC Internal Components -->
  <!-- Arbitration -->
  <rect x="300" y="130" width="90" height="50" rx="5" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="345" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Arbitration</text>

  <!-- Buffering -->
  <rect x="410" y="130" width="90" height="50" rx="5" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="455" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Buffering</text>

  <!-- TX (Transmitter) -->
  <rect x="300" y="200" width="90" height="50" rx="5" fill="#a5d6a7" stroke="#388e3c" stroke-width="1"/>
  <text x="345" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Transmitter</text>
  <text x="345" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">(TX)</text>

  <!-- RX (Receiver) -->
  <rect x="410" y="200" width="90" height="50" rx="5" fill="#ef9a9a" stroke="#c62828" stroke-width="1"/>
  <text x="455" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Receiver</text>
  <text x="455" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">(RX)</text>

  <!-- Routing Logic -->
  <rect x="355" y="265" width="90" height="40" rx="5" fill="#b39ddb" stroke="#512da8" stroke-width="1"/>
  <text x="400" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Routing</text>

  <!-- Network Cloud -->
  <ellipse cx="650" cy="200" rx="100" ry="80" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="650" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">Network</text>
  <text x="650" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">(Switches, Links)</text>

  <!-- Arrows: Host to NIC -->
  <line x1="200" y1="180" x2="275" y2="180" stroke="#004065" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="237" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#004065">Data Out</text>

  <!-- Arrows: NIC to Host -->
  <line x1="275" y1="220" x2="200" y2="220" stroke="#004065" stroke-width="2" marker-end="url(#arrowhead-rev)"/>
  <text x="237" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#004065">Data In</text>

  <!-- Arrows: NIC to Network -->
  <line x1="520" y1="180" x2="550" y2="180" stroke="#004065" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrows: Network to NIC -->
  <line x1="550" y1="220" x2="520" y2="220" stroke="#004065" stroke-width="2" marker-end="url(#arrowhead-rev)"/>

  <!-- Bidirectional label -->
  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666" font-style="italic">Bidirectional data flow between Host and Network</text>
</svg>