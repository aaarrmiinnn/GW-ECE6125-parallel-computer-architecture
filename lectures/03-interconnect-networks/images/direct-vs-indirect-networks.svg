<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#f8f9fa"/>

  <text x="450" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#004065">Direct vs Indirect Networks</text>

  <!-- DIRECT NETWORK (Left) -->
  <text x="225" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">Direct Network (Mesh)</text>
  <text x="225" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Every switch has a compute node attached</text>

  <rect x="30" y="85" width="390" height="200" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>

  <!-- Direct network nodes (combined switch+node) -->
  <!-- Row 1 -->
  <rect x="70" y="110" width="60" height="50" rx="5" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="100" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0d47a1">Switch</text>
  <text x="100" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0d47a1">+Node</text>

  <rect x="180" y="110" width="60" height="50" rx="5" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="210" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0d47a1">Switch</text>
  <text x="210" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0d47a1">+Node</text>

  <rect x="290" y="110" width="60" height="50" rx="5" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="320" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0d47a1">Switch</text>
  <text x="320" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0d47a1">+Node</text>

  <!-- Row 2 -->
  <rect x="70" y="200" width="60" height="50" rx="5" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="100" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0d47a1">Switch</text>
  <text x="100" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0d47a1">+Node</text>

  <rect x="180" y="200" width="60" height="50" rx="5" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="210" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0d47a1">Switch</text>
  <text x="210" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0d47a1">+Node</text>

  <rect x="290" y="200" width="60" height="50" rx="5" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="320" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0d47a1">Switch</text>
  <text x="320" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0d47a1">+Node</text>

  <!-- Connections for direct -->
  <line x1="130" y1="135" x2="180" y2="135" stroke="#1976d2" stroke-width="2"/>
  <line x1="240" y1="135" x2="290" y2="135" stroke="#1976d2" stroke-width="2"/>
  <line x1="130" y1="225" x2="180" y2="225" stroke="#1976d2" stroke-width="2"/>
  <line x1="240" y1="225" x2="290" y2="225" stroke="#1976d2" stroke-width="2"/>
  <line x1="100" y1="160" x2="100" y2="200" stroke="#1976d2" stroke-width="2"/>
  <line x1="210" y1="160" x2="210" y2="200" stroke="#1976d2" stroke-width="2"/>
  <line x1="320" y1="160" x2="320" y2="200" stroke="#1976d2" stroke-width="2"/>

  <text x="225" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1976d2">Examples: Mesh, Torus, Hypercube</text>

  <!-- INDIRECT NETWORK (Right) -->
  <text x="675" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#388e3c">Indirect Network (Fat Tree)</text>
  <text x="675" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Nodes only at edges, switches in middle</text>

  <rect x="480" y="85" width="390" height="200" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>

  <!-- Top level switches -->
  <rect x="620" y="100" width="50" height="30" rx="3" fill="#a5d6a7" stroke="#388e3c" stroke-width="2"/>
  <text x="645" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1b5e20">SW</text>

  <rect x="700" y="100" width="50" height="30" rx="3" fill="#a5d6a7" stroke="#388e3c" stroke-width="2"/>
  <text x="725" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1b5e20">SW</text>

  <!-- Middle level switches -->
  <rect x="540" y="160" width="50" height="30" rx="3" fill="#a5d6a7" stroke="#388e3c" stroke-width="2"/>
  <text x="565" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1b5e20">SW</text>

  <rect x="620" y="160" width="50" height="30" rx="3" fill="#a5d6a7" stroke="#388e3c" stroke-width="2"/>
  <text x="645" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1b5e20">SW</text>

  <rect x="700" y="160" width="50" height="30" rx="3" fill="#a5d6a7" stroke="#388e3c" stroke-width="2"/>
  <text x="725" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1b5e20">SW</text>

  <rect x="780" y="160" width="50" height="30" rx="3" fill="#a5d6a7" stroke="#388e3c" stroke-width="2"/>
  <text x="805" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1b5e20">SW</text>

  <!-- Compute nodes at bottom -->
  <circle cx="520" cy="240" r="15" fill="#81c784" stroke="#388e3c" stroke-width="2"/>
  <text x="520" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1b5e20">N0</text>

  <circle cx="565" cy="240" r="15" fill="#81c784" stroke="#388e3c" stroke-width="2"/>
  <text x="565" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1b5e20">N1</text>

  <circle cx="625" cy="240" r="15" fill="#81c784" stroke="#388e3c" stroke-width="2"/>
  <text x="625" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1b5e20">N2</text>

  <circle cx="670" cy="240" r="15" fill="#81c784" stroke="#388e3c" stroke-width="2"/>
  <text x="670" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1b5e20">N3</text>

  <circle cx="730" cy="240" r="15" fill="#81c784" stroke="#388e3c" stroke-width="2"/>
  <text x="730" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1b5e20">N4</text>

  <circle cx="775" cy="240" r="15" fill="#81c784" stroke="#388e3c" stroke-width="2"/>
  <text x="775" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1b5e20">N5</text>

  <circle cx="830" cy="240" r="15" fill="#81c784" stroke="#388e3c" stroke-width="2"/>
  <text x="830" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1b5e20">N6</text>

  <circle cx="860" cy="240" r="15" fill="#81c784" stroke="#388e3c" stroke-width="2"/>
  <text x="860" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1b5e20">N7</text>

  <!-- Connections for indirect -->
  <line x1="645" y1="130" x2="565" y2="160" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="645" y1="130" x2="645" y2="160" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="725" y1="130" x2="725" y2="160" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="725" y1="130" x2="805" y2="160" stroke="#388e3c" stroke-width="1.5"/>

  <line x1="565" y1="190" x2="520" y2="225" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="565" y1="190" x2="565" y2="225" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="645" y1="190" x2="625" y2="225" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="645" y1="190" x2="670" y2="225" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="725" y1="190" x2="730" y2="225" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="725" y1="190" x2="775" y2="225" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="805" y1="190" x2="830" y2="225" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="805" y1="190" x2="860" y2="225" stroke="#388e3c" stroke-width="1.5"/>

  <text x="675" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#388e3c">Examples: Fat Tree, Clos, Butterfly</text>

  <!-- Comparison Table -->
  <rect x="100" y="300" width="700" height="90" rx="5" fill="white" stroke="#666" stroke-width="1"/>

  <rect x="100" y="300" width="700" height="25" fill="#e0e0e0"/>
  <line x1="300" y1="300" x2="300" y2="390" stroke="#666" stroke-width="1"/>
  <line x1="500" y1="300" x2="500" y2="390" stroke="#666" stroke-width="1"/>
  <line x1="100" y1="325" x2="800" y2="325" stroke="#666" stroke-width="1"/>

  <text x="200" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Aspect</text>
  <text x="400" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1976d2">Direct</text>
  <text x="650" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#388e3c">Indirect</text>

  <line x1="100" y1="350" x2="800" y2="350" stroke="#eee" stroke-width="1"/>
  <text x="200" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Node Role</text>
  <text x="400" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Each node is also a router</text>
  <text x="650" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Nodes only compute, switches route</text>

  <line x1="100" y1="375" x2="800" y2="375" stroke="#eee" stroke-width="1"/>
  <text x="200" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Best For</text>
  <text x="400" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Local communication patterns</text>
  <text x="650" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">All-to-all communication</text>

  <text x="200" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Used In</text>
  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">GPUs, on-chip networks</text>
  <text x="650" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Datacenters, HPC clusters</text>
</svg>
