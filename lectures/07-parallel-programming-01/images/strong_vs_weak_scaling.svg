<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <style>
    text { font-family: 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- ========== LEFT CHART: Strong Scaling ========== -->
  <text x="200" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#004065">Strong Scaling</text>
  <text x="200" y="46" text-anchor="middle" font-size="12" fill="#777" font-style="italic">Fixed problem size</text>

  <!-- Axes -->
  <line x1="70" y1="300" x2="370" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="300" x2="70" y2="60" stroke="#333" stroke-width="2"/>

  <!-- X axis label -->
  <text x="220" y="340" text-anchor="middle" font-size="13" fill="#555">Processors (P)</text>

  <!-- X ticks: 1,2,4,8,16 at positions 70,145,220,295,370 -->
  <line x1="70" y1="300" x2="70" y2="307" stroke="#333" stroke-width="1"/>
  <text x="70" y="320" text-anchor="middle" font-size="12" fill="#555">1</text>
  <line x1="145" y1="300" x2="145" y2="307" stroke="#333" stroke-width="1"/>
  <text x="145" y="320" text-anchor="middle" font-size="12" fill="#555">2</text>
  <line x1="220" y1="300" x2="220" y2="307" stroke="#333" stroke-width="1"/>
  <text x="220" y="320" text-anchor="middle" font-size="12" fill="#555">4</text>
  <line x1="295" y1="300" x2="295" y2="307" stroke="#333" stroke-width="1"/>
  <text x="295" y="320" text-anchor="middle" font-size="12" fill="#555">8</text>
  <line x1="370" y1="300" x2="370" y2="307" stroke="#333" stroke-width="1"/>
  <text x="370" y="320" text-anchor="middle" font-size="12" fill="#555">16</text>

  <!-- Y axis label -->
  <text x="25" y="180" text-anchor="middle" font-size="13" fill="#555" transform="rotate(-90,25,180)">Speedup</text>

  <!-- Y ticks: 1,4,8,12,16 -->
  <!-- range: 300 (1x) to 60 (16x). 240px for 15 units = 16px/unit -->
  <line x1="63" y1="300" x2="70" y2="300" stroke="#333" stroke-width="1"/>
  <text x="58" y="304" text-anchor="end" font-size="12" fill="#555">1</text>
  <line x1="63" y1="252" x2="70" y2="252" stroke="#333" stroke-width="1"/>
  <text x="58" y="256" text-anchor="end" font-size="12" fill="#555">4</text>
  <line x1="63" y1="188" x2="70" y2="188" stroke="#333" stroke-width="1"/>
  <text x="58" y="192" text-anchor="end" font-size="12" fill="#555">8</text>
  <line x1="63" y1="124" x2="70" y2="124" stroke="#333" stroke-width="1"/>
  <text x="58" y="128" text-anchor="end" font-size="12" fill="#555">12</text>
  <line x1="63" y1="60" x2="70" y2="60" stroke="#333" stroke-width="1"/>
  <text x="58" y="64" text-anchor="end" font-size="12" fill="#555">16</text>

  <!-- Ideal line (dashed) - linear: 1x,2x,4x,8x,16x -->
  <!-- y: 300, 284, 252, 188, 60 -->
  <polyline points="70,300 145,284 220,252 295,188 370,60"
    fill="none" stroke="#6ba3c7" stroke-width="2" stroke-dasharray="8,5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="375" y="57" font-size="12" fill="#6ba3c7">Ideal</text>

  <!-- Realistic line - curves off: 1x,1.8x,3.2x,5.5x,8x -->
  <!-- y: 300, 287.2, 264.8, 228, 188 -->
  <polyline points="70,300 145,287 220,265 295,228 370,188"
    fill="none" stroke="#004065" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="375" y="185" font-size="12" fill="#004065" font-weight="bold">Realistic</text>

  <!-- ========== RIGHT CHART: Weak Scaling ========== -->
  <text x="600" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#004065">Weak Scaling</text>
  <text x="600" y="46" text-anchor="middle" font-size="12" fill="#777" font-style="italic">Problem grows with P</text>

  <!-- Axes -->
  <line x1="470" y1="300" x2="770" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="470" y1="300" x2="470" y2="60" stroke="#333" stroke-width="2"/>

  <!-- X axis label -->
  <text x="620" y="340" text-anchor="middle" font-size="13" fill="#555">Processors (P)</text>

  <!-- X ticks -->
  <line x1="470" y1="300" x2="470" y2="307" stroke="#333" stroke-width="1"/>
  <text x="470" y="320" text-anchor="middle" font-size="12" fill="#555">1</text>
  <line x1="545" y1="300" x2="545" y2="307" stroke="#333" stroke-width="1"/>
  <text x="545" y="320" text-anchor="middle" font-size="12" fill="#555">2</text>
  <line x1="620" y1="300" x2="620" y2="307" stroke="#333" stroke-width="1"/>
  <text x="620" y="320" text-anchor="middle" font-size="12" fill="#555">4</text>
  <line x1="695" y1="300" x2="695" y2="307" stroke="#333" stroke-width="1"/>
  <text x="695" y="320" text-anchor="middle" font-size="12" fill="#555">8</text>
  <line x1="770" y1="300" x2="770" y2="307" stroke="#333" stroke-width="1"/>
  <text x="770" y="320" text-anchor="middle" font-size="12" fill="#555">16</text>

  <!-- Y axis label -->
  <text x="425" y="180" text-anchor="middle" font-size="13" fill="#555" transform="rotate(-90,425,180)">Efficiency (%)</text>

  <!-- Y ticks: 0%, 25%, 50%, 75%, 100% -->
  <!-- range: 300 (0%) to 60 (100%). 240px for 100% = 2.4px/% -->
  <line x1="463" y1="300" x2="470" y2="300" stroke="#333" stroke-width="1"/>
  <text x="458" y="304" text-anchor="end" font-size="12" fill="#555">0</text>
  <line x1="463" y1="240" x2="470" y2="240" stroke="#333" stroke-width="1"/>
  <text x="458" y="244" text-anchor="end" font-size="12" fill="#555">25</text>
  <line x1="463" y1="180" x2="470" y2="180" stroke="#333" stroke-width="1"/>
  <text x="458" y="184" text-anchor="end" font-size="12" fill="#555">50</text>
  <line x1="463" y1="120" x2="470" y2="120" stroke="#333" stroke-width="1"/>
  <text x="458" y="124" text-anchor="end" font-size="12" fill="#555">75</text>
  <line x1="463" y1="60" x2="470" y2="60" stroke="#333" stroke-width="1"/>
  <text x="458" y="64" text-anchor="end" font-size="12" fill="#555">100</text>

  <!-- Ideal line (dashed) - flat at 100% -->
  <line x1="470" y1="60" x2="770" y2="60"
    stroke="#6ba3c7" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="775" y="57" font-size="12" fill="#6ba3c7">Ideal</text>

  <!-- Realistic line - gradually decreases: 100%, 92%, 82%, 70%, 58% -->
  <!-- y: 60, 79.2, 103.2, 132, 160.8 -->
  <polyline points="470,60 545,79 620,103 695,132 770,161"
    fill="none" stroke="#004065" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="775" y="158" font-size="12" fill="#004065" font-weight="bold">Realistic</text>

  <!-- Shared legend at bottom -->
  <rect x="280" y="352" width="240" height="24" rx="4" fill="white" stroke="#ddd" stroke-width="1"/>
  <line x1="292" y1="364" x2="322" y2="364" stroke="#6ba3c7" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="328" y="369" font-size="12" fill="#555">Ideal</text>
  <line x1="380" y1="364" x2="410" y2="364" stroke="#004065" stroke-width="2.5"/>
  <text x="416" y="369" font-size="12" fill="#555">Realistic</text>
</svg>