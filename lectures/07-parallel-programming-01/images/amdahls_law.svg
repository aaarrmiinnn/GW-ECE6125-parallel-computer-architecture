<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <style>
    text { font-family: 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#004065">Amdahl's Law: Speedup = 1 / (s + (1-s)/P)</text>

  <!-- Axes -->
  <line x1="90" y1="390" x2="730" y2="390" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="390" x2="90" y2="50" stroke="#333" stroke-width="2"/>

  <!-- X axis label -->
  <text x="410" y="435" text-anchor="middle" font-size="14" fill="#555">Number of Processors (P)</text>

  <!-- X axis ticks: 1, 2, 4, 8, 16, 32, 64 (log-spaced) -->
  <line x1="90" y1="390" x2="90" y2="397" stroke="#333" stroke-width="1.5"/>
  <text x="90" y="412" text-anchor="middle" font-size="12" fill="#555">1</text>

  <line x1="197" y1="390" x2="197" y2="397" stroke="#333" stroke-width="1.5"/>
  <text x="197" y="412" text-anchor="middle" font-size="12" fill="#555">2</text>

  <line x1="304" y1="390" x2="304" y2="397" stroke="#333" stroke-width="1.5"/>
  <text x="304" y="412" text-anchor="middle" font-size="12" fill="#555">4</text>

  <line x1="411" y1="390" x2="411" y2="397" stroke="#333" stroke-width="1.5"/>
  <text x="411" y="412" text-anchor="middle" font-size="12" fill="#555">8</text>

  <line x1="518" y1="390" x2="518" y2="397" stroke="#333" stroke-width="1.5"/>
  <text x="518" y="412" text-anchor="middle" font-size="12" fill="#555">16</text>

  <line x1="625" y1="390" x2="625" y2="397" stroke="#333" stroke-width="1.5"/>
  <text x="625" y="412" text-anchor="middle" font-size="12" fill="#555">32</text>

  <line x1="730" y1="390" x2="730" y2="397" stroke="#333" stroke-width="1.5"/>
  <text x="730" y="412" text-anchor="middle" font-size="12" fill="#555">64</text>

  <!-- Y axis label -->
  <text x="35" y="220" text-anchor="middle" font-size="14" fill="#555" transform="rotate(-90,35,220)">Speedup</text>

  <!-- Y axis ticks -->
  <!-- scale: y = 390 - (val-1) * (340/99) = 390 - (val-1)*3.434 -->
  <line x1="83" y1="390" x2="90" y2="390" stroke="#333" stroke-width="1"/>
  <text x="78" y="394" text-anchor="end" font-size="12" fill="#555">1</text>

  <line x1="83" y1="359" x2="90" y2="359" stroke="#333" stroke-width="1"/>
  <text x="78" y="363" text-anchor="end" font-size="12" fill="#555">10</text>

  <line x1="83" y1="325" x2="90" y2="325" stroke="#333" stroke-width="1"/>
  <text x="78" y="329" text-anchor="end" font-size="12" fill="#555">20</text>

  <line x1="83" y1="222" x2="90" y2="222" stroke="#333" stroke-width="1"/>
  <text x="78" y="226" text-anchor="end" font-size="12" fill="#555">50</text>

  <line x1="83" y1="50" x2="90" y2="50" stroke="#333" stroke-width="1"/>
  <text x="78" y="54" text-anchor="end" font-size="12" fill="#555">100</text>

  <!-- s=10% curve (blue) - max 10x -->
  <!-- S: 1, 1.818, 3.077, 4.706, 6.4, 7.805, 8.767 -->
  <!-- y: 390, 387.2, 382.9, 377.3, 371.5, 366.6, 363.3 -->
  <line x1="90" y1="359" x2="730" y2="359" stroke="#004065" stroke-width="1" stroke-dasharray="5,5" opacity="0.4"/>
  <polyline points="90,390 197,387 304,383 411,377 518,371 625,367 730,363"
    fill="none" stroke="#004065" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- s=5% curve (gold) - max 20x -->
  <!-- S: 1, 1.905, 3.478, 5.926, 9.143, 12.549, 15.422 -->
  <!-- y: 390, 386.9, 381.5, 373.1, 362.0, 350.3, 340.5 -->
  <line x1="90" y1="325" x2="730" y2="325" stroke="#b8960f" stroke-width="1" stroke-dasharray="5,5" opacity="0.4"/>
  <polyline points="90,390 197,387 304,381 411,373 518,362 625,350 730,340"
    fill="none" stroke="#b8960f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- s=1% curve (green) - max 100x -->
  <!-- S: 1, 1.980, 3.883, 7.477, 13.913, 24.433, 39.261 -->
  <!-- y: 390, 386.6, 380.1, 367.7, 345.6, 309.5, 258.6 -->
  <line x1="90" y1="50" x2="730" y2="50" stroke="#2a7d4f" stroke-width="1" stroke-dasharray="5,5" opacity="0.4"/>
  <polyline points="90,390 197,387 304,380 411,368 518,346 625,310 730,259"
    fill="none" stroke="#2a7d4f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Legend -->
  <rect x="105" y="55" width="195" height="85" rx="5" fill="white" stroke="#ddd" stroke-width="1"/>
  <line x1="115" y1="75" x2="145" y2="75" stroke="#004065" stroke-width="2.5"/>
  <text x="153" y="79" font-size="13" fill="#333">s = 10% (max 10x)</text>

  <line x1="115" y1="100" x2="145" y2="100" stroke="#b8960f" stroke-width="2.5"/>
  <text x="153" y="104" font-size="13" fill="#333">s = 5% (max 20x)</text>

  <line x1="115" y1="125" x2="145" y2="125" stroke="#2a7d4f" stroke-width="2.5"/>
  <text x="153" y="129" font-size="13" fill="#333">s = 1% (max 100x)</text>

  <!-- Asymptote labels on right side -->
  <text x="740" y="356" font-size="11" fill="#004065">10x</text>
  <text x="740" y="322" font-size="11" fill="#b8960f">20x</text>
  <text x="740" y="47" font-size="11" fill="#2a7d4f">100x</text>
</svg>