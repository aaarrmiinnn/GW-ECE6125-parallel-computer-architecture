<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#004065"/>
    </marker>
  </defs>

  <!-- ==================== LEFT: SHARED MEMORY ==================== -->
  <text x="200" y="35" text-anchor="middle" font-size="17" font-weight="bold" fill="#004065" font-family="Arial, sans-serif">Shared Memory</text>

  <!-- 4 CPU boxes -->
  <rect x="50" y="65" width="68" height="40" rx="6" fill="#004065"/>
  <text x="84" y="90" text-anchor="middle" font-size="13" fill="#fff" font-family="Arial, sans-serif">CPU 0</text>

  <rect x="128" y="65" width="68" height="40" rx="6" fill="#004065"/>
  <text x="162" y="90" text-anchor="middle" font-size="13" fill="#fff" font-family="Arial, sans-serif">CPU 1</text>

  <rect x="206" y="65" width="68" height="40" rx="6" fill="#004065"/>
  <text x="240" y="90" text-anchor="middle" font-size="13" fill="#fff" font-family="Arial, sans-serif">CPU 2</text>

  <rect x="284" y="65" width="68" height="40" rx="6" fill="#004065"/>
  <text x="318" y="90" text-anchor="middle" font-size="13" fill="#fff" font-family="Arial, sans-serif">CPU 3</text>

  <!-- Bus bar -->
  <rect x="50" y="130" width="302" height="12" rx="3" fill="#004065" opacity="0.4"/>
  <text x="200" y="140" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold" font-family="Arial, sans-serif">BUS</text>

  <!-- Lines from CPUs to bus -->
  <line x1="84" y1="105" x2="84" y2="130" stroke="#004065" stroke-width="2"/>
  <line x1="162" y1="105" x2="162" y2="130" stroke="#004065" stroke-width="2"/>
  <line x1="240" y1="105" x2="240" y2="130" stroke="#004065" stroke-width="2"/>
  <line x1="318" y1="105" x2="318" y2="130" stroke="#004065" stroke-width="2"/>

  <!-- Line from bus to memory -->
  <line x1="200" y1="142" x2="200" y2="180" stroke="#004065" stroke-width="2"/>

  <!-- Shared memory block -->
  <rect x="110" y="182" width="180" height="50" rx="8" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <text x="200" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#004065" font-family="Arial, sans-serif">Shared Memory</text>

  <!-- Label -->
  <text x="200" y="268" text-anchor="middle" font-size="13" fill="#666" font-style="italic" font-family="Arial, sans-serif">All CPUs see same address space</text>

  <!-- ==================== DIVIDER ==================== -->
  <line x1="400" y1="20" x2="400" y2="290" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ==================== RIGHT: DISTRIBUTED MEMORY ==================== -->
  <text x="600" y="35" text-anchor="middle" font-size="17" font-weight="bold" fill="#004065" font-family="Arial, sans-serif">Distributed Memory</text>

  <!-- Node 0 -->
  <g transform="translate(440, 60)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#f0f4f7" stroke="#004065" stroke-width="1.5"/>
    <rect x="15" y="10" width="90" height="28" rx="5" fill="#004065"/>
    <text x="60" y="29" text-anchor="middle" font-size="12" fill="#fff" font-family="Arial, sans-serif">CPU 0</text>
    <rect x="15" y="44" width="90" height="26" rx="5" fill="#FFD200"/>
    <text x="60" y="62" text-anchor="middle" font-size="11" fill="#004065" font-family="Arial, sans-serif">Local Mem</text>
  </g>

  <!-- Node 1 -->
  <g transform="translate(640, 60)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#f0f4f7" stroke="#004065" stroke-width="1.5"/>
    <rect x="15" y="10" width="90" height="28" rx="5" fill="#004065"/>
    <text x="60" y="29" text-anchor="middle" font-size="12" fill="#fff" font-family="Arial, sans-serif">CPU 1</text>
    <rect x="15" y="44" width="90" height="26" rx="5" fill="#FFD200"/>
    <text x="60" y="62" text-anchor="middle" font-size="11" fill="#004065" font-family="Arial, sans-serif">Local Mem</text>
  </g>

  <!-- Node 2 -->
  <g transform="translate(440, 160)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#f0f4f7" stroke="#004065" stroke-width="1.5"/>
    <rect x="15" y="10" width="90" height="28" rx="5" fill="#004065"/>
    <text x="60" y="29" text-anchor="middle" font-size="12" fill="#fff" font-family="Arial, sans-serif">CPU 2</text>
    <rect x="15" y="44" width="90" height="26" rx="5" fill="#FFD200"/>
    <text x="60" y="62" text-anchor="middle" font-size="11" fill="#004065" font-family="Arial, sans-serif">Local Mem</text>
  </g>

  <!-- Node 3 -->
  <g transform="translate(640, 160)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#f0f4f7" stroke="#004065" stroke-width="1.5"/>
    <rect x="15" y="10" width="90" height="28" rx="5" fill="#004065"/>
    <text x="60" y="29" text-anchor="middle" font-size="12" fill="#fff" font-family="Arial, sans-serif">CPU 3</text>
    <rect x="15" y="44" width="90" height="26" rx="5" fill="#FFD200"/>
    <text x="60" y="62" text-anchor="middle" font-size="11" fill="#004065" font-family="Arial, sans-serif">Local Mem</text>
  </g>

  <!-- Network connections between nodes -->
  <line x1="560" y1="100" x2="640" y2="100" stroke="#004065" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="560" y1="200" x2="640" y2="200" stroke="#004065" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="500" y1="140" x2="500" y2="160" stroke="#004065" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="700" y1="140" x2="700" y2="160" stroke="#004065" stroke-width="2" stroke-dasharray="4,3"/>
  <!-- Diagonals -->
  <line x1="560" y1="130" x2="640" y2="168" stroke="#004065" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="640" y1="130" x2="560" y2="168" stroke="#004065" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Network label -->
  <text x="600" y="155" text-anchor="middle" font-size="11" fill="#004065" font-weight="bold" font-family="Arial, sans-serif">Network</text>

  <!-- Label -->
  <text x="600" y="268" text-anchor="middle" font-size="13" fill="#666" font-style="italic" font-family="Arial, sans-serif">Each CPU has private memory</text>
</svg>
