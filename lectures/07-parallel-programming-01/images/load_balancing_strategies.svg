<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <marker id="stealArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c62828"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
  </style>

  <!-- ===== BLOCK ===== -->
  <text x="133" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#004065">Block</text>

  <!-- Column headers -->
  <text x="68" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#004065">P0</text>
  <text x="133" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#004065">P1</text>
  <text x="198" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#004065">P2</text>

  <!-- P0 tasks (green — first third) -->
  <rect x="43" y="65" width="50" height="40" rx="4" fill="#4caf50"/>
  <text x="68" y="89" text-anchor="middle" font-size="11" fill="#fff">T0</text>
  <rect x="43" y="110" width="50" height="40" rx="4" fill="#4caf50"/>
  <text x="68" y="134" text-anchor="middle" font-size="11" fill="#fff">T1</text>
  <rect x="43" y="155" width="50" height="40" rx="4" fill="#4caf50"/>
  <text x="68" y="179" text-anchor="middle" font-size="11" fill="#fff">T2</text>

  <!-- P1 tasks (gold — second third) -->
  <rect x="108" y="65" width="50" height="40" rx="4" fill="#FFD200"/>
  <text x="133" y="89" text-anchor="middle" font-size="11" fill="#004065">T3</text>
  <rect x="108" y="110" width="50" height="40" rx="4" fill="#FFD200"/>
  <text x="133" y="134" text-anchor="middle" font-size="11" fill="#004065">T4</text>
  <rect x="108" y="155" width="50" height="40" rx="4" fill="#FFD200"/>
  <text x="133" y="179" text-anchor="middle" font-size="11" fill="#004065">T5</text>

  <!-- P2 tasks (orange — last third) -->
  <rect x="173" y="65" width="50" height="40" rx="4" fill="#e65100"/>
  <text x="198" y="89" text-anchor="middle" font-size="11" fill="#fff">T6</text>
  <rect x="173" y="110" width="50" height="40" rx="4" fill="#e65100"/>
  <text x="198" y="134" text-anchor="middle" font-size="11" fill="#fff">T7</text>
  <rect x="173" y="155" width="50" height="40" rx="4" fill="#e65100"/>
  <text x="198" y="179" text-anchor="middle" font-size="11" fill="#fff">T8</text>

  <text x="133" y="230" text-anchor="middle" font-size="12" fill="#666" font-style="italic">Contiguous chunks</text>

  <!-- ===== CYCLIC ===== -->
  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#004065">Cyclic</text>

  <text x="335" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#004065">P0</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#004065">P1</text>
  <text x="465" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#004065">P2</text>

  <!-- P0: T0, T3, T6 (round-robin) -->
  <rect x="310" y="65" width="50" height="40" rx="4" fill="#4caf50"/>
  <text x="335" y="89" text-anchor="middle" font-size="11" fill="#fff">T0</text>
  <rect x="310" y="110" width="50" height="40" rx="4" fill="#FFD200"/>
  <text x="335" y="134" text-anchor="middle" font-size="11" fill="#004065">T3</text>
  <rect x="310" y="155" width="50" height="40" rx="4" fill="#e65100"/>
  <text x="335" y="179" text-anchor="middle" font-size="11" fill="#fff">T6</text>

  <!-- P1: T1, T4, T7 -->
  <rect x="375" y="65" width="50" height="40" rx="4" fill="#4caf50"/>
  <text x="400" y="89" text-anchor="middle" font-size="11" fill="#fff">T1</text>
  <rect x="375" y="110" width="50" height="40" rx="4" fill="#FFD200"/>
  <text x="400" y="134" text-anchor="middle" font-size="11" fill="#004065">T4</text>
  <rect x="375" y="155" width="50" height="40" rx="4" fill="#e65100"/>
  <text x="400" y="179" text-anchor="middle" font-size="11" fill="#fff">T7</text>

  <!-- P2: T2, T5, T8 -->
  <rect x="440" y="65" width="50" height="40" rx="4" fill="#4caf50"/>
  <text x="465" y="89" text-anchor="middle" font-size="11" fill="#fff">T2</text>
  <rect x="440" y="110" width="50" height="40" rx="4" fill="#FFD200"/>
  <text x="465" y="134" text-anchor="middle" font-size="11" fill="#004065">T5</text>
  <rect x="440" y="155" width="50" height="40" rx="4" fill="#e65100"/>
  <text x="465" y="179" text-anchor="middle" font-size="11" fill="#fff">T8</text>

  <text x="400" y="230" text-anchor="middle" font-size="12" fill="#666" font-style="italic">Round-robin assignment</text>

  <!-- ===== WORK STEALING ===== -->
  <text x="667" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#004065">Work Stealing</text>

  <text x="602" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#004065">P0</text>
  <text x="667" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#004065">P1</text>
  <text x="732" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#004065">P2</text>

  <!-- P0: overloaded (5 tasks) -->
  <rect x="577" y="65" width="50" height="28" rx="4" fill="#4caf50"/>
  <text x="602" y="83" text-anchor="middle" font-size="10" fill="#fff">T0</text>
  <rect x="577" y="97" width="50" height="28" rx="4" fill="#FFD200"/>
  <text x="602" y="115" text-anchor="middle" font-size="10" fill="#004065">T1</text>
  <rect x="577" y="129" width="50" height="28" rx="4" fill="#e65100"/>
  <text x="602" y="147" text-anchor="middle" font-size="10" fill="#fff">T2</text>
  <rect x="577" y="161" width="50" height="28" rx="4" fill="#4caf50"/>
  <text x="602" y="179" text-anchor="middle" font-size="10" fill="#fff">T3</text>
  <rect x="577" y="193" width="50" height="28" rx="4" fill="#FFD200"/>
  <text x="602" y="211" text-anchor="middle" font-size="10" fill="#004065">T4</text>

  <!-- P1: 1 task -->
  <rect x="642" y="65" width="50" height="28" rx="4" fill="#e65100"/>
  <text x="667" y="83" text-anchor="middle" font-size="10" fill="#fff">T5</text>

  <!-- P2: empty — idle -->
  <rect x="707" y="65" width="50" height="28" rx="4" fill="#e0e0e0" stroke="#bbb" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="732" y="83" text-anchor="middle" font-size="10" fill="#999">idle</text>

  <!-- Steal arrow from P0 to P2 -->
  <path d="M 620,210 C 650,280 700,280 725,100" fill="none" stroke="#c62828" stroke-width="2.5" marker-end="url(#stealArrow)"/>
  <text x="695" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">Steal!</text>

  <text x="667" y="320" text-anchor="middle" font-size="12" fill="#666" font-style="italic">Idle processors steal tasks</text>

  <!-- Separator lines -->
  <line x1="267" y1="15" x2="267" y2="340" stroke="#ddd" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="533" y1="15" x2="533" y2="340" stroke="#ddd" stroke-width="1" stroke-dasharray="5,4"/>
</svg>