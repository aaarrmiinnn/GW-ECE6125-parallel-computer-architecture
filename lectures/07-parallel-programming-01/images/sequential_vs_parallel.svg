<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <style>
    text { font-family: 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- LEFT SIDE: Sequential -->
  <text x="185" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#004065">Sequential</text>

  <!-- Time arrow -->
  <line x1="40" y1="50" x2="40" y2="290" stroke="#666" stroke-width="1.5"/>
  <polygon points="40,295 36,285 44,285" fill="#666"/>
  <text x="38" y="310" text-anchor="middle" font-size="12" fill="#666">Time</text>

  <!-- CPU 0 label -->
  <text x="185" y="55" text-anchor="middle" font-size="13" fill="#555">CPU 0</text>

  <!-- 4 tasks stacked vertically -->
  <rect x="120" y="65" width="130" height="50" rx="4" fill="#004065"/>
  <text x="185" y="95" text-anchor="middle" font-size="14" fill="white" font-weight="bold">T1</text>

  <rect x="120" y="120" width="130" height="50" rx="4" fill="#004065"/>
  <text x="185" y="150" text-anchor="middle" font-size="14" fill="white" font-weight="bold">T2</text>

  <rect x="120" y="175" width="130" height="50" rx="4" fill="#004065"/>
  <text x="185" y="205" text-anchor="middle" font-size="14" fill="white" font-weight="bold">T3</text>

  <rect x="120" y="230" width="130" height="50" rx="4" fill="#004065"/>
  <text x="185" y="260" text-anchor="middle" font-size="14" fill="white" font-weight="bold">T4</text>

  <!-- Time bracket -->
  <line x1="270" y1="65" x2="280" y2="65" stroke="#999" stroke-width="1"/>
  <line x1="280" y1="65" x2="280" y2="280" stroke="#999" stroke-width="1"/>
  <line x1="270" y1="280" x2="280" y2="280" stroke="#999" stroke-width="1"/>
  <text x="290" y="177" font-size="13" fill="#c00" font-weight="bold">4 units</text>

  <!-- Divider -->
  <line x1="380" y1="20" x2="380" y2="330" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- RIGHT SIDE: Parallel -->
  <text x="590" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#004065">Parallel</text>

  <!-- Time arrow -->
  <line x1="430" y1="50" x2="430" y2="290" stroke="#666" stroke-width="1.5"/>
  <polygon points="430,295 426,285 434,285" fill="#666"/>
  <text x="428" y="310" text-anchor="middle" font-size="12" fill="#666">Time</text>

  <!-- CPU labels -->
  <text x="490" y="55" text-anchor="middle" font-size="12" fill="#555">CPU 0</text>
  <text x="555" y="55" text-anchor="middle" font-size="12" fill="#555">CPU 1</text>
  <text x="620" y="55" text-anchor="middle" font-size="12" fill="#555">CPU 2</text>
  <text x="685" y="55" text-anchor="middle" font-size="12" fill="#555">CPU 3</text>

  <!-- 4 tasks side by side -->
  <rect x="455" y="65" width="70" height="50" rx="4" fill="#FFD200"/>
  <text x="490" y="95" text-anchor="middle" font-size="14" fill="#004065" font-weight="bold">T1</text>

  <rect x="520" y="65" width="70" height="50" rx="4" fill="#FFD200"/>
  <text x="555" y="95" text-anchor="middle" font-size="14" fill="#004065" font-weight="bold">T2</text>

  <rect x="585" y="65" width="70" height="50" rx="4" fill="#FFD200"/>
  <text x="620" y="95" text-anchor="middle" font-size="14" fill="#004065" font-weight="bold">T3</text>

  <rect x="650" y="65" width="70" height="50" rx="4" fill="#FFD200"/>
  <text x="685" y="95" text-anchor="middle" font-size="14" fill="#004065" font-weight="bold">T4</text>

  <!-- Time bracket -->
  <line x1="735" y1="65" x2="745" y2="65" stroke="#999" stroke-width="1"/>
  <line x1="745" y1="65" x2="745" y2="115" stroke="#999" stroke-width="1"/>
  <line x1="735" y1="115" x2="745" y2="115" stroke="#999" stroke-width="1"/>
  <text x="755" y="95" font-size="13" fill="#2a7d4f" font-weight="bold">1 unit</text>

  <!-- Speedup label -->
  <text x="590" y="340" text-anchor="middle" font-size="14" fill="#004065" font-weight="bold">Speedup = 4x</text>
</svg>