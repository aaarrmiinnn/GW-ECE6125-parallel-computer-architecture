<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#004065"/>
    </marker>
  </defs>

  <!-- ==================== CAS (Left) ==================== -->
  <text x="210" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#004065" text-anchor="middle">Compare-and-Swap (CAS)</text>
  <text x="210" y="50" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">CAS(addr, expected=5, new=6)</text>

  <!-- Memory cell -->
  <rect x="170" y="70" width="80" height="40" rx="5" fill="#FFD200" stroke="#004065" stroke-width="2"/>
  <text x="210" y="85" font-family="Arial, sans-serif" font-size="11" fill="#004065" text-anchor="middle">Memory</text>
  <text x="210" y="102" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#004065" text-anchor="middle">5</text>

  <!-- SUCCESS path (left) -->
  <text x="95" y="140" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">SUCCESS</text>
  <text x="95" y="158" font-family="Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">Value == expected (5)</text>

  <!-- Arrow down-left -->
  <line x1="190" y1="110" x2="130" y2="170" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Result memory cell -->
  <rect x="55" y="175" width="80" height="40" rx="5" fill="#27ae60" stroke="#004065" stroke-width="2"/>
  <text x="95" y="190" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Memory</text>
  <text x="95" y="207" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">6</text>

  <text x="95" y="235" font-family="Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">Swapped to 6</text>

  <!-- FAIL path (right) -->
  <text x="325" y="140" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e74c3c" text-anchor="middle">FAIL</text>
  <text x="325" y="158" font-family="Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">Another thread changed it!</text>

  <!-- Arrow down-right -->
  <line x1="230" y1="110" x2="290" y2="170" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Result memory cell (unchanged, shows 7) -->
  <rect x="285" y="175" width="80" height="40" rx="5" fill="#e74c3c" stroke="#004065" stroke-width="2"/>
  <text x="325" y="190" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Memory</text>
  <text x="325" y="207" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">7</text>

  <text x="325" y="235" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" text-anchor="middle">Not 5 -- no swap, retry</text>

  <!-- ==================== FETCH-AND-ADD (Right) ==================== -->
  <text x="610" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#004065" text-anchor="middle">Fetch-and-Add (FAA)</text>
  <text x="610" y="50" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">FAA(addr, +1)</text>

  <!-- Memory cell BEFORE -->
  <text x="520" y="78" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#004065" text-anchor="middle">Before</text>
  <rect x="480" y="88" width="80" height="40" rx="5" fill="#FFD200" stroke="#004065" stroke-width="2"/>
  <text x="520" y="103" font-family="Arial, sans-serif" font-size="11" fill="#004065" text-anchor="middle">Memory</text>
  <text x="520" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#004065" text-anchor="middle">10</text>

  <!-- Arrow -->
  <line x1="560" y1="108" x2="650" y2="108" stroke="#004065" stroke-width="2" marker-end="url(#arr3)"/>
  <text x="605" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#004065" text-anchor="middle">+1</text>

  <!-- Memory cell AFTER -->
  <text x="700" y="78" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#004065" text-anchor="middle">After</text>
  <rect x="660" y="88" width="80" height="40" rx="5" fill="#27ae60" stroke="#004065" stroke-width="2"/>
  <text x="700" y="103" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Memory</text>
  <text x="700" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">11</text>

  <!-- Return value -->
  <rect x="540" y="155" width="140" height="36" rx="5" fill="#004065"/>
  <text x="610" y="170" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">Returns old value: 10</text>
  <text x="610" y="183" font-family="Arial, sans-serif" font-size="11" fill="#FFD200" text-anchor="middle">Atomic -- no race possible</text>

  <!-- Key difference box -->
  <rect x="490" y="210" width="240" height="60" rx="6" fill="#f0f4f8" stroke="#004065" stroke-width="1.5"/>
  <text x="610" y="230" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#004065" text-anchor="middle">Key Difference</text>
  <text x="610" y="248" font-family="Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">CAS: retry loop on contention</text>
  <text x="610" y="263" font-family="Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">FAA: always succeeds in one shot</text>

  <!-- Divider -->
  <line x1="420" y1="20" x2="420" y2="300" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>
</svg>