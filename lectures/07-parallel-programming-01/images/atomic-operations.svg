<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#004065"/>
    </marker>
    <marker id="arrowhead-gold" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FFD200"/>
    </marker>
  </defs>

  <!-- ==================== ROW 1: Threads + Atomic Shield ==================== -->

  <!-- Thread 1 (left) -->
  <rect x="40" y="30" width="140" height="50" rx="5" fill="#004065"/>
  <text x="110" y="60" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">Thread 1</text>

  <!-- Thread 2 (right) -->
  <rect x="620" y="30" width="140" height="50" rx="5" fill="#8B0000"/>
  <text x="690" y="60" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">Thread 2</text>

  <!-- Atomic shield (center) -->
  <rect x="310" y="20" width="180" height="70" rx="8" fill="white" stroke="#004065" stroke-width="2"/>
  <!-- Lock icon -->
  <rect x="340" y="38" width="16" height="14" rx="2" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <path d="M343,38 V33 a5,5 0 0 1 10,0 V38" fill="none" stroke="#004065" stroke-width="1.5"/>
  <text x="365" y="50" font-family="Arial" font-size="16" font-weight="bold" fill="#004065">Atomic</text>
  <text x="400" y="72" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Hardware-supported indivisible operations</text>

  <!-- Dashed line: Thread 1 → Shared Memory -->
  <path d="M110,80 C110,110 200,130 250,140" fill="none" stroke="#004065" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="140" y="115" font-family="Arial" font-size="10" fill="#004065" transform="rotate(-15,140,115)">Protected Access</text>

  <!-- Dashed line: Thread 2 → Shared Memory -->
  <path d="M690,80 C690,110 600,130 550,140" fill="none" stroke="#8B0000" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="615" y="115" font-family="Arial" font-size="10" fill="#8B0000" transform="rotate(15,615,115)">Protected Access</text>

  <!-- ==================== ROW 2: Shared Memory Bar ==================== -->

  <rect x="50" y="135" width="700" height="45" rx="5" fill="#e8e8e8" stroke="#666" stroke-width="1.5"/>
  <text x="400" y="163" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#333">Shared Memory</text>

  <!-- ==================== ROW 3: Operation Examples ==================== -->

  <!-- Left box: Compare-and-Swap -->
  <rect x="50" y="210" width="340" height="185" rx="5" fill="white" stroke="#004065" stroke-width="1.5"/>
  <text x="220" y="235" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#004065">Compare-and-Swap (CAS)</text>

  <!-- CAS: Expected box -->
  <rect x="75" y="255" width="90" height="40" rx="4" fill="#004065"/>
  <text x="120" y="270" text-anchor="middle" font-family="Arial" font-size="11" fill="white">Expected</text>
  <text x="120" y="286" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#FFD200">10</text>

  <!-- CAS: == symbol -->
  <text x="178" y="280" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">==</text>

  <!-- CAS: Current box -->
  <rect x="195" y="255" width="90" height="40" rx="4" fill="#2a7a2a"/>
  <text x="240" y="270" text-anchor="middle" font-family="Arial" font-size="11" fill="white">Current</text>
  <text x="240" y="286" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#FFD200">10</text>

  <!-- CAS: Arrow to New -->
  <line x1="295" y1="275" x2="320" y2="275" stroke="#004065" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- CAS: New box -->
  <rect x="325" y="255" width="50" height="40" rx="4" fill="#FFD200"/>
  <text x="350" y="270" text-anchor="middle" font-family="Arial" font-size="11" fill="#004065">New</text>
  <text x="350" y="286" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#004065">20</text>

  <!-- CAS: Match indicator -->
  <text x="178" y="310" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2a7a2a">Match!</text>

  <!-- CAS: Caption -->
  <text x="220" y="345" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Update only if expected value matches</text>
  <text x="220" y="365" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">current memory value</text>
  <text x="220" y="385" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">CAS(addr, expected=10, new=20)</text>

  <!-- Right box: Fetch-and-Add -->
  <rect x="410" y="210" width="340" height="185" rx="5" fill="white" stroke="#004065" stroke-width="1.5"/>
  <text x="580" y="235" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#004065">Fetch-and-Add</text>

  <!-- FAA: Current box -->
  <rect x="430" y="255" width="90" height="40" rx="4" fill="#004065"/>
  <text x="475" y="270" text-anchor="middle" font-family="Arial" font-size="11" fill="white">Current</text>
  <text x="475" y="286" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#FFD200">10</text>

  <!-- FAA: + symbol -->
  <text x="535" y="280" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#333">+</text>

  <!-- FAA: Increment box -->
  <rect x="552" y="255" width="50" height="40" rx="4" fill="#FFD200"/>
  <text x="577" y="280" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#004065">5</text>

  <!-- FAA: Arrow to Result -->
  <line x1="612" y1="275" x2="640" y2="275" stroke="#004065" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- FAA: Result box -->
  <rect x="645" y="255" width="90" height="40" rx="4" fill="#2a7a2a"/>
  <text x="690" y="270" text-anchor="middle" font-family="Arial" font-size="11" fill="white">Result</text>
  <text x="690" y="286" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#FFD200">15</text>

  <!-- FAA: Returns indicator -->
  <text x="475" y="310" text-anchor="middle" font-family="Arial" font-size="12" fill="#2a7a2a">Returns old value: 10</text>

  <!-- FAA: Caption -->
  <text x="580" y="345" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Atomically increment and return old value</text>
  <text x="580" y="365" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">in a single indivisible step</text>
  <text x="580" y="385" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">fetch_add(addr, 5) → 10</text>
</svg>