<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#004065"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
  </style>

  <!-- Divider -->
  <line x1="400" y1="30" x2="400" y2="355" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ===== LEFT: Task Decomposition ===== -->
  <text x="200" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#004065">Task Decomposition</text>

  <!-- Dataset -->
  <rect x="110" y="48" width="180" height="38" rx="6" fill="#e8f0f5" stroke="#004065" stroke-width="2"/>
  <text x="200" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#004065">Dataset</text>

  <!-- Arrows down -->
  <line x1="145" y1="86" x2="105" y2="138" stroke="#004065" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="86" x2="200" y2="138" stroke="#004065" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="255" y1="86" x2="295" y2="138" stroke="#004065" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Function boxes -->
  <rect x="55" y="143" width="100" height="42" rx="6" fill="#2e7d32"/>
  <text x="105" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Physics()</text>

  <rect x="160" y="143" width="100" height="42" rx="6" fill="#1565c0"/>
  <text x="210" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Render()</text>

  <rect x="270" y="143" width="100" height="42" rx="6" fill="#c62828"/>
  <text x="320" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">AI()</text>

  <!-- Arrows to processors -->
  <line x1="105" y1="185" x2="105" y2="228" stroke="#004065" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="210" y1="185" x2="210" y2="228" stroke="#004065" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="185" x2="320" y2="228" stroke="#004065" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Processors -->
  <rect x="72" y="233" width="66" height="32" rx="5" fill="#004065"/>
  <text x="105" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">P0</text>
  <rect x="177" y="233" width="66" height="32" rx="5" fill="#004065"/>
  <text x="210" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">P1</text>
  <rect x="287" y="233" width="66" height="32" rx="5" fill="#004065"/>
  <text x="320" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">P2</text>

  <text x="200" y="300" text-anchor="middle" font-size="12" fill="#666" font-style="italic">Different functions on same/different data</text>

  <!-- ===== RIGHT: Data Decomposition ===== -->
  <text x="600" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#004065">Data Decomposition</text>

  <!-- Function box -->
  <rect x="530" y="48" width="140" height="38" rx="6" fill="#1565c0"/>
  <text x="600" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">process()</text>

  <!-- Arrows to data chunks -->
  <line x1="558" y1="86" x2="500" y2="138" stroke="#004065" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="86" x2="560" y2="138" stroke="#004065" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="86" x2="640" y2="138" stroke="#004065" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="642" y1="86" x2="700" y2="138" stroke="#004065" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Data chunks -->
  <rect x="472" y="143" width="56" height="42" rx="5" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <text x="500" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#004065">D0</text>
  <rect x="538" y="143" width="56" height="42" rx="5" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <text x="566" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#004065">D1</text>
  <rect x="604" y="143" width="56" height="42" rx="5" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <text x="632" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#004065">D2</text>
  <rect x="672" y="143" width="56" height="42" rx="5" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <text x="700" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#004065">D3</text>

  <!-- Arrows to processors -->
  <line x1="500" y1="185" x2="500" y2="228" stroke="#004065" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="566" y1="185" x2="566" y2="228" stroke="#004065" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="632" y1="185" x2="632" y2="228" stroke="#004065" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="185" x2="700" y2="228" stroke="#004065" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Processors -->
  <rect x="472" y="233" width="56" height="32" rx="5" fill="#004065"/>
  <text x="500" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">P0</text>
  <rect x="538" y="233" width="56" height="32" rx="5" fill="#004065"/>
  <text x="566" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">P1</text>
  <rect x="604" y="233" width="56" height="32" rx="5" fill="#004065"/>
  <text x="632" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">P2</text>
  <rect x="672" y="233" width="56" height="32" rx="5" fill="#004065"/>
  <text x="700" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">P3</text>

  <text x="600" y="300" text-anchor="middle" font-size="12" fill="#666" font-style="italic">Same function on different data chunks</text>
</svg>