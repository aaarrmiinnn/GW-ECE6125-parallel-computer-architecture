<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <style>
    text { font-family: 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#004065">Moore's Law and the Multi-Core Transition</text>

  <!-- Axes -->
  <line x1="100" y1="320" x2="720" y2="320" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="320" x2="100" y2="60" stroke="#333" stroke-width="2"/>

  <!-- X axis ticks and labels -->
  <line x1="100" y1="320" x2="100" y2="326" stroke="#333" stroke-width="1.5"/>
  <text x="100" y="342" text-anchor="middle" font-size="12" fill="#555">1990</text>

  <line x1="203" y1="320" x2="203" y2="326" stroke="#333" stroke-width="1.5"/>
  <text x="203" y="342" text-anchor="middle" font-size="12" fill="#555">1995</text>

  <line x1="306" y1="320" x2="306" y2="326" stroke="#333" stroke-width="1.5"/>
  <text x="306" y="342" text-anchor="middle" font-size="12" fill="#555">2000</text>

  <line x1="410" y1="320" x2="410" y2="326" stroke="#333" stroke-width="1.5"/>
  <text x="410" y="342" text-anchor="middle" font-size="12" fill="#555">2005</text>

  <line x1="513" y1="320" x2="513" y2="326" stroke="#333" stroke-width="1.5"/>
  <text x="513" y="342" text-anchor="middle" font-size="12" fill="#555">2010</text>

  <line x1="616" y1="320" x2="616" y2="326" stroke="#333" stroke-width="1.5"/>
  <text x="616" y="342" text-anchor="middle" font-size="12" fill="#555">2015</text>

  <line x1="720" y1="320" x2="720" y2="326" stroke="#333" stroke-width="1.5"/>
  <text x="720" y="342" text-anchor="middle" font-size="12" fill="#555">2020</text>

  <!-- Y axis label -->
  <text x="45" y="190" text-anchor="middle" font-size="13" fill="#555" transform="rotate(-90,45,190)">Relative Growth (log scale)</text>

  <!-- Y axis ticks -->
  <line x1="94" y1="280" x2="100" y2="280" stroke="#333" stroke-width="1"/>
  <line x1="94" y1="230" x2="100" y2="230" stroke="#333" stroke-width="1"/>
  <line x1="94" y1="170" x2="100" y2="170" stroke="#333" stroke-width="1"/>
  <line x1="94" y1="110" x2="100" y2="110" stroke="#333" stroke-width="1"/>

  <!-- Transistor count line (keeps going up) - BLUE -->
  <polyline points="100,300 203,260 306,210 410,160 513,115 616,80 720,55"
    fill="none" stroke="#004065" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Single-core performance line (flattens ~2005) - dark gold -->
  <polyline points="100,295 203,250 306,200 410,175 513,168 616,163 720,160"
    fill="none" stroke="#b8960f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Vertical dashed line at 2005 -->
  <line x1="410" y1="55" x2="410" y2="315" stroke="#cc0000" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="410" y="370" text-anchor="middle" font-size="13" fill="#cc0000" font-weight="bold">Multi-core era begins</text>

  <!-- Legend -->
  <rect x="520" y="85" width="190" height="62" rx="5" fill="white" stroke="#ddd" stroke-width="1"/>
  <line x1="530" y1="105" x2="560" y2="105" stroke="#004065" stroke-width="3"/>
  <text x="568" y="109" font-size="13" fill="#333">Transistor count</text>
  <line x1="530" y1="132" x2="560" y2="132" stroke="#b8960f" stroke-width="3"/>
  <text x="568" y="136" font-size="13" fill="#333">Single-core perf.</text>

  <!-- Annotation -->
  <text x="400" y="390" text-anchor="middle" font-size="13" fill="#004065" font-style="italic">Transistors &#x2192; more cores, not faster cores</text>
</svg>