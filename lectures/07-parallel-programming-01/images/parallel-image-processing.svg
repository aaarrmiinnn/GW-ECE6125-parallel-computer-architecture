<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#004065"/>
    </marker>
  </defs>

  <!-- ==================== LEFT: Original Image ==================== -->
  <text x="120" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#004065" font-family="Arial, sans-serif">Original Image</text>

  <!-- 8x8 grid -->
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="160" height="160" fill="#e8e8e8" stroke="#004065" stroke-width="1.5" rx="2"/>
    <!-- Grid lines -->
    <line x1="20" y1="0" x2="20" y2="160" stroke="#bbb" stroke-width="0.5"/>
    <line x1="40" y1="0" x2="40" y2="160" stroke="#bbb" stroke-width="0.5"/>
    <line x1="60" y1="0" x2="60" y2="160" stroke="#bbb" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="160" stroke="#bbb" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="160" stroke="#bbb" stroke-width="0.5"/>
    <line x1="120" y1="0" x2="120" y2="160" stroke="#bbb" stroke-width="0.5"/>
    <line x1="140" y1="0" x2="140" y2="160" stroke="#bbb" stroke-width="0.5"/>
    <line x1="0" y1="20" x2="160" y2="20" stroke="#bbb" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="160" y2="40" stroke="#bbb" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="160" y2="60" stroke="#bbb" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="160" y2="80" stroke="#bbb" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="160" y2="100" stroke="#bbb" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="160" y2="120" stroke="#bbb" stroke-width="0.5"/>
    <line x1="0" y1="140" x2="160" y2="140" stroke="#bbb" stroke-width="0.5"/>
  </g>
  <text x="120" y="230" text-anchor="middle" font-size="12" fill="#666" font-family="Arial, sans-serif">8 x 8 pixels</text>

  <!-- Arrow to center -->
  <line x1="210" y1="125" x2="260" y2="100" stroke="#004065" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="210" y1="125" x2="260" y2="230" stroke="#004065" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ==================== CENTER: Pixel-level ==================== -->
  <text x="400" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#004065" font-family="Arial, sans-serif">Pixel-Level</text>

  <!-- Individual highlighted pixels with different colors -->
  <g transform="translate(320, 50)">
    <rect x="0" y="0" width="160" height="120" fill="#f5f5f5" stroke="#004065" stroke-width="1" rx="2"/>
    <!-- Scattered highlighted pixels -->
    <rect x="10" y="10" width="16" height="16" rx="2" fill="#004065" opacity="0.9"/>
    <rect x="36" y="10" width="16" height="16" rx="2" fill="#FFD200"/>
    <rect x="62" y="10" width="16" height="16" rx="2" fill="#004065" opacity="0.7"/>
    <rect x="88" y="10" width="16" height="16" rx="2" fill="#FFD200" opacity="0.8"/>
    <rect x="114" y="10" width="16" height="16" rx="2" fill="#004065" opacity="0.5"/>
    <rect x="140" y="10" width="16" height="16" rx="2" fill="#FFD200" opacity="0.6"/>

    <rect x="10" y="36" width="16" height="16" rx="2" fill="#FFD200" opacity="0.7"/>
    <rect x="36" y="36" width="16" height="16" rx="2" fill="#004065" opacity="0.6"/>
    <rect x="62" y="36" width="16" height="16" rx="2" fill="#FFD200" opacity="0.9"/>
    <rect x="88" y="36" width="16" height="16" rx="2" fill="#004065" opacity="0.8"/>
    <rect x="114" y="36" width="16" height="16" rx="2" fill="#FFD200"/>
    <rect x="140" y="36" width="16" height="16" rx="2" fill="#004065" opacity="0.9"/>

    <rect x="10" y="62" width="16" height="16" rx="2" fill="#004065" opacity="0.8"/>
    <rect x="36" y="62" width="16" height="16" rx="2" fill="#FFD200" opacity="0.5"/>
    <rect x="62" y="62" width="16" height="16" rx="2" fill="#004065"/>
    <rect x="88" y="62" width="16" height="16" rx="2" fill="#FFD200" opacity="0.7"/>
    <rect x="114" y="62" width="16" height="16" rx="2" fill="#004065" opacity="0.6"/>
    <rect x="140" y="62" width="16" height="16" rx="2" fill="#FFD200" opacity="0.9"/>

    <rect x="10" y="88" width="16" height="16" rx="2" fill="#FFD200" opacity="0.8"/>
    <rect x="36" y="88" width="16" height="16" rx="2" fill="#004065" opacity="0.7"/>
    <rect x="62" y="88" width="16" height="16" rx="2" fill="#FFD200" opacity="0.6"/>
    <rect x="88" y="88" width="16" height="16" rx="2" fill="#004065" opacity="0.5"/>
    <rect x="114" y="88" width="16" height="16" rx="2" fill="#FFD200"/>
    <rect x="140" y="88" width="16" height="16" rx="2" fill="#004065"/>
  </g>

  <!-- Arrows from pixels to processor labels -->
  <text x="400" y="192" text-anchor="middle" font-size="12" fill="#004065" font-family="Arial, sans-serif">Each pixel --> 1 thread</text>

  <text x="400" y="250" text-anchor="middle" font-size="12" fill="#666" font-style="italic" font-family="Arial, sans-serif">Each pixel independent --</text>
  <text x="400" y="268" text-anchor="middle" font-size="12" fill="#666" font-style="italic" font-family="Arial, sans-serif">embarrassingly parallel</text>

  <!-- ==================== RIGHT: Block-level ==================== -->
  <text x="670" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#004065" font-family="Arial, sans-serif">Block-Level</text>

  <!-- 2x2 blocks -->
  <g transform="translate(590, 50)">
    <rect x="0" y="0" width="76" height="56" rx="4" fill="#004065" opacity="0.8" stroke="#004065" stroke-width="1.5"/>
    <text x="38" y="33" text-anchor="middle" font-size="12" fill="#fff" font-family="Arial, sans-serif">P0</text>

    <rect x="84" y="0" width="76" height="56" rx="4" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
    <text x="122" y="33" text-anchor="middle" font-size="12" fill="#004065" font-family="Arial, sans-serif">P1</text>

    <rect x="0" y="64" width="76" height="56" rx="4" fill="#FFD200" opacity="0.7" stroke="#004065" stroke-width="1.5"/>
    <text x="38" y="97" text-anchor="middle" font-size="12" fill="#004065" font-family="Arial, sans-serif">P2</text>

    <rect x="84" y="64" width="76" height="56" rx="4" fill="#004065" opacity="0.6" stroke="#004065" stroke-width="1.5"/>
    <text x="122" y="97" text-anchor="middle" font-size="12" fill="#fff" font-family="Arial, sans-serif">P3</text>
  </g>

  <text x="670" y="192" text-anchor="middle" font-size="12" fill="#004065" font-family="Arial, sans-serif">Each block --> 1 processor</text>

  <text x="670" y="250" text-anchor="middle" font-size="12" fill="#666" font-style="italic" font-family="Arial, sans-serif">Better cache behavior</text>
</svg>
