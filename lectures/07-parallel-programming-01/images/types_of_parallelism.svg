<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#004065"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#FFD200"/>
    </marker>
  </defs>

  <!-- ==================== DATA PARALLELISM ==================== -->
  <text x="133" y="35" text-anchor="middle" font-size="15" font-weight="bold" fill="#004065" font-family="Arial, sans-serif">DATA PARALLELISM</text>

  <!-- Single function box -->
  <rect x="83" y="55" width="100" height="38" rx="6" fill="#004065"/>
  <text x="133" y="80" text-anchor="middle" font-size="14" fill="#fff" font-family="Arial, sans-serif">f(x)</text>

  <!-- Arrows fanning out -->
  <line x1="96" y1="93" x2="56" y2="135" stroke="#004065" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="116" y1="93" x2="106" y2="135" stroke="#004065" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="150" y1="93" x2="160" y2="135" stroke="#004065" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="170" y1="93" x2="210" y2="135" stroke="#004065" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 4 data chunks -->
  <rect x="30" y="140" width="52" height="34" rx="5" fill="#FFD200"/>
  <text x="56" y="162" text-anchor="middle" font-size="13" fill="#004065" font-family="Arial, sans-serif">D1</text>
  <rect x="88" y="140" width="52" height="34" rx="5" fill="#FFD200"/>
  <text x="114" y="162" text-anchor="middle" font-size="13" fill="#004065" font-family="Arial, sans-serif">D2</text>
  <rect x="146" y="140" width="52" height="34" rx="5" fill="#FFD200"/>
  <text x="172" y="162" text-anchor="middle" font-size="13" fill="#004065" font-family="Arial, sans-serif">D3</text>
  <rect x="204" y="140" width="52" height="34" rx="5" fill="#FFD200"/>
  <text x="230" y="162" text-anchor="middle" font-size="13" fill="#004065" font-family="Arial, sans-serif">D4</text>

  <text x="133" y="205" text-anchor="middle" font-size="12" fill="#666" font-style="italic" font-family="Arial, sans-serif">Same operation, different data</text>

  <!-- Divider 1 -->
  <line x1="267" y1="20" x2="267" y2="215" stroke="#ddd" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ==================== TASK PARALLELISM ==================== -->
  <text x="400" y="35" text-anchor="middle" font-size="15" font-weight="bold" fill="#004065" font-family="Arial, sans-serif">TASK PARALLELISM</text>

  <!-- Three different function boxes -->
  <rect x="310" y="60" width="56" height="36" rx="6" fill="#004065"/>
  <text x="338" y="83" text-anchor="middle" font-size="12" fill="#fff" font-family="Arial, sans-serif">Physics</text>
  <rect x="372" y="60" width="56" height="36" rx="6" fill="#004065"/>
  <text x="400" y="83" text-anchor="middle" font-size="12" fill="#fff" font-family="Arial, sans-serif">Render</text>
  <rect x="434" y="60" width="56" height="36" rx="6" fill="#004065"/>
  <text x="462" y="83" text-anchor="middle" font-size="12" fill="#fff" font-family="Arial, sans-serif">AI</text>

  <!-- Arrows down to shared data -->
  <line x1="338" y1="96" x2="372" y2="140" stroke="#004065" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="96" x2="400" y2="140" stroke="#004065" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="462" y1="96" x2="428" y2="140" stroke="#004065" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Shared data block -->
  <rect x="352" y="143" width="96" height="32" rx="5" fill="#FFD200"/>
  <text x="400" y="164" text-anchor="middle" font-size="13" fill="#004065" font-family="Arial, sans-serif">Shared Data</text>

  <text x="400" y="205" text-anchor="middle" font-size="12" fill="#666" font-style="italic" font-family="Arial, sans-serif">Different operations, same time</text>

  <!-- Divider 2 -->
  <line x1="533" y1="20" x2="533" y2="215" stroke="#ddd" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ==================== PIPELINE PARALLELISM ==================== -->
  <text x="667" y="35" text-anchor="middle" font-size="15" font-weight="bold" fill="#004065" font-family="Arial, sans-serif">PIPELINE PARALLELISM</text>

  <!-- Three stage boxes -->
  <rect x="556" y="60" width="72" height="36" rx="6" fill="#004065"/>
  <text x="592" y="83" text-anchor="middle" font-size="12" fill="#fff" font-family="Arial, sans-serif">Decode</text>

  <rect x="648" y="60" width="72" height="36" rx="6" fill="#004065"/>
  <text x="684" y="83" text-anchor="middle" font-size="12" fill="#fff" font-family="Arial, sans-serif">Filter</text>

  <rect x="740" y="60" width="72" height="36" rx="6" fill="#004065"/>
  <text x="776" y="83" text-anchor="middle" font-size="12" fill="#fff" font-family="Arial, sans-serif">Encode</text>

  <!-- Arrows between stages -->
  <line x1="628" y1="78" x2="646" y2="78" stroke="#FFD200" stroke-width="2.5" marker-end="url(#arrG)"/>
  <line x1="720" y1="78" x2="738" y2="78" stroke="#FFD200" stroke-width="2.5" marker-end="url(#arrG)"/>

  <!-- Items at each stage -->
  <rect x="570" y="116" width="44" height="24" rx="4" fill="#FFD200" opacity="0.55"/>
  <text x="592" y="133" text-anchor="middle" font-size="11" fill="#004065" font-family="Arial, sans-serif">Item 3</text>
  <rect x="662" y="116" width="44" height="24" rx="4" fill="#FFD200" opacity="0.78"/>
  <text x="684" y="133" text-anchor="middle" font-size="11" fill="#004065" font-family="Arial, sans-serif">Item 2</text>
  <rect x="754" y="116" width="44" height="24" rx="4" fill="#FFD200"/>
  <text x="776" y="133" text-anchor="middle" font-size="11" fill="#004065" font-family="Arial, sans-serif">Item 1</text>

  <!-- Dashed lines linking items to stages -->
  <line x1="592" y1="114" x2="592" y2="98" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="684" y1="114" x2="684" y2="98" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="776" y1="114" x2="776" y2="98" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2"/>

  <text x="667" y="205" text-anchor="middle" font-size="12" fill="#666" font-style="italic" font-family="Arial, sans-serif">Stages overlap on different items</text>
</svg>
