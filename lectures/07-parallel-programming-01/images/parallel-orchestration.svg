<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <marker id="orchArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#004065"/>
    </marker>
    <marker id="msgArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e65100"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
  </style>

  <!-- Orchestrator box -->
  <rect x="300" y="20" width="200" height="44" rx="8" fill="#004065"/>
  <text x="400" y="47" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">Orchestrator</text>

  <!-- Arrows from orchestrator to tasks -->
  <line x1="340" y1="64" x2="145" y2="130" stroke="#004065" stroke-width="1.5" marker-end="url(#orchArrow)"/>
  <line x1="375" y1="64" x2="310" y2="130" stroke="#004065" stroke-width="1.5" marker-end="url(#orchArrow)"/>
  <line x1="425" y1="64" x2="490" y2="130" stroke="#004065" stroke-width="1.5" marker-end="url(#orchArrow)"/>
  <line x1="460" y1="64" x2="655" y2="130" stroke="#004065" stroke-width="1.5" marker-end="url(#orchArrow)"/>

  <!-- Task boxes -->
  <rect x="85" y="135" width="120" height="44" rx="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <text x="145" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#004065">Task 1</text>

  <rect x="250" y="135" width="120" height="44" rx="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <text x="310" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#004065">Task 2</text>

  <rect x="430" y="135" width="120" height="44" rx="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <text x="490" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#004065">Task 3</text>

  <rect x="595" y="135" width="120" height="44" rx="7" fill="#FFD200" stroke="#004065" stroke-width="1.5"/>
  <text x="655" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#004065">Task 4</text>

  <!-- ===== Mutex between Task 1 and Task 2 ===== -->
  <!-- Padlock icon -->
  <path d="M218,140 C218,132 222,128 227,128 C232,128 236,132 236,140" fill="none" stroke="#004065" stroke-width="2" stroke-linecap="round"/>
  <rect x="214" y="140" width="26" height="20" rx="3" fill="#004065"/>
  <circle cx="227" cy="151" r="3" fill="#FFD200"/>
  <text x="227" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#004065">Mutex</text>

  <!-- ===== Barrier across all tasks ===== -->
  <line x1="60" y1="220" x2="740" y2="220" stroke="#c62828" stroke-width="2.5" stroke-dasharray="8,4"/>
  <rect x="340" y="208" width="80" height="24" rx="4" fill="#c62828"/>
  <text x="380" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Barrier</text>

  <!-- Task boxes below barrier -->
  <rect x="85" y="260" width="120" height="44" rx="7" fill="#e8f0f5" stroke="#004065" stroke-width="1.5"/>
  <text x="145" y="287" text-anchor="middle" font-size="13" fill="#004065">Task 1</text>
  <rect x="250" y="260" width="120" height="44" rx="7" fill="#e8f0f5" stroke="#004065" stroke-width="1.5"/>
  <text x="310" y="287" text-anchor="middle" font-size="13" fill="#004065">Task 2</text>
  <rect x="430" y="260" width="120" height="44" rx="7" fill="#e8f0f5" stroke="#004065" stroke-width="1.5"/>
  <text x="490" y="287" text-anchor="middle" font-size="13" fill="#004065">Task 3</text>
  <rect x="595" y="260" width="120" height="44" rx="7" fill="#e8f0f5" stroke="#004065" stroke-width="1.5"/>
  <text x="655" y="287" text-anchor="middle" font-size="13" fill="#004065">Task 4</text>

  <!-- ===== Message arrow between Task 3 and Task 4 (below barrier) ===== -->
  <path d="M550,282 C570,310 620,310 595,290" fill="none" stroke="#e65100" stroke-width="2.5" marker-end="url(#msgArrow)"/>
  <text x="580" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">Message</text>

  <!-- Labels for phases -->
  <text x="400" y="370" text-anchor="middle" font-size="12" fill="#888">All tasks must reach the barrier before any can proceed</text>
</svg>