<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arrc1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#004065"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Helvetica Neue', Arial, sans-serif; fill: #222; }
    .title { font-size: 22px; font-weight: bold; fill: #004065; }
    .sub { font-size: 15px; font-weight: bold; fill: #004065; }
    .cap { font-size: 12px; fill: #666; font-style: italic; }
    .plab { font-size: 13px; font-weight: bold; fill: white; }
    .rootlab { font-size: 13px; font-weight: bold; fill: #004065; }
    .flow { stroke: #004065; stroke-width: 1.6; fill: none; }
  </style>

  <!-- Title -->
  <text x="400" y="34" class="title" text-anchor="middle">MPI Collectives: Broadcast, Scatter, Gather</text>

  <!-- Divider lines -->
  <line x1="267" y1="60" x2="267" y2="470" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="533" y1="60" x2="533" y2="470" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ================= BROADCAST ================= -->
  <text x="133" y="90" class="sub" text-anchor="middle">Broadcast</text>
  <text x="133" y="110" class="cap" text-anchor="middle">One -&gt; All  (same data)</text>

  <!-- Root P0 -->
  <circle cx="133" cy="170" r="26" fill="#FFD200" stroke="#004065" stroke-width="2"/>
  <text x="133" y="175" class="rootlab" text-anchor="middle">P0</text>
  <rect x="163" y="153" width="32" height="20" rx="3" fill="#004065"/>
  <text x="179" y="167" font-size="11" fill="white" text-anchor="middle">A</text>

  <!-- Arrows -->
  <line x1="112" y1="188" x2="55"  y2="275" class="flow" marker-end="url(#arrc1)"/>
  <line x1="133" y1="196" x2="133" y2="275" class="flow" marker-end="url(#arrc1)"/>
  <line x1="154" y1="188" x2="211" y2="275" class="flow" marker-end="url(#arrc1)"/>

  <!-- Data labels on arrows -->
  <rect x="66" y="225" width="24" height="16" rx="3" fill="#004065"/>
  <text x="78" y="237" font-size="10" fill="white" text-anchor="middle">A</text>
  <rect x="121" y="225" width="24" height="16" rx="3" fill="#004065"/>
  <text x="133" y="237" font-size="10" fill="white" text-anchor="middle">A</text>
  <rect x="176" y="225" width="24" height="16" rx="3" fill="#004065"/>
  <text x="188" y="237" font-size="10" fill="white" text-anchor="middle">A</text>

  <!-- P1, P2, P3 -->
  <circle cx="55"  cy="300" r="26" fill="#004065"/>
  <text x="55"  y="305" class="plab" text-anchor="middle">P1</text>
  <circle cx="133" cy="300" r="26" fill="#004065"/>
  <text x="133" y="305" class="plab" text-anchor="middle">P2</text>
  <circle cx="211" cy="300" r="26" fill="#004065"/>
  <text x="211" y="305" class="plab" text-anchor="middle">P3</text>

  <!-- Received data labels under each -->
  <rect x="43"  y="335" width="24" height="16" rx="3" fill="#cfe2f3" stroke="#004065" stroke-width="1"/>
  <text x="55"  y="347" font-size="10" fill="#004065" text-anchor="middle">A</text>
  <rect x="121" y="335" width="24" height="16" rx="3" fill="#cfe2f3" stroke="#004065" stroke-width="1"/>
  <text x="133" y="347" font-size="10" fill="#004065" text-anchor="middle">A</text>
  <rect x="199" y="335" width="24" height="16" rx="3" fill="#cfe2f3" stroke="#004065" stroke-width="1"/>
  <text x="211" y="347" font-size="10" fill="#004065" text-anchor="middle">A</text>

  <text x="133" y="410" class="cap" text-anchor="middle">All processes now hold A</text>

  <!-- ================= SCATTER ================= -->
  <text x="400" y="90" class="sub" text-anchor="middle">Scatter</text>
  <text x="400" y="110" class="cap" text-anchor="middle">One -&gt; All  (different pieces)</text>

  <!-- Root P0 with ABCD buffer -->
  <circle cx="400" cy="170" r="26" fill="#FFD200" stroke="#004065" stroke-width="2"/>
  <text x="400" y="175" class="rootlab" text-anchor="middle">P0</text>

  <rect x="430" y="153" width="22" height="20" rx="2" fill="#e74c3c"/>
  <text x="441" y="167" font-size="10" fill="white" text-anchor="middle">A</text>
  <rect x="452" y="153" width="22" height="20" rx="2" fill="#3498db"/>
  <text x="463" y="167" font-size="10" fill="white" text-anchor="middle">B</text>
  <rect x="474" y="153" width="22" height="20" rx="2" fill="#2ecc71"/>
  <text x="485" y="167" font-size="10" fill="white" text-anchor="middle">C</text>
  <rect x="496" y="153" width="22" height="20" rx="2" fill="#9b59b6"/>
  <text x="507" y="167" font-size="10" fill="white" text-anchor="middle">D</text>

  <!-- Arrows to P1,P2,P3 plus self piece -->
  <line x1="378" y1="188" x2="322" y2="275" class="flow" marker-end="url(#arrc1)"/>
  <line x1="400" y1="196" x2="400" y2="275" class="flow" marker-end="url(#arrc1)"/>
  <line x1="422" y1="188" x2="478" y2="275" class="flow" marker-end="url(#arrc1)"/>

  <!-- pieces on arrows: B -> P1, C -> P2, D -> P3 (A kept by P0) -->
  <rect x="332" y="225" width="22" height="16" rx="2" fill="#3498db"/>
  <text x="343" y="237" font-size="10" fill="white" text-anchor="middle">B</text>
  <rect x="389" y="225" width="22" height="16" rx="2" fill="#2ecc71"/>
  <text x="400" y="237" font-size="10" fill="white" text-anchor="middle">C</text>
  <rect x="446" y="225" width="22" height="16" rx="2" fill="#9b59b6"/>
  <text x="457" y="237" font-size="10" fill="white" text-anchor="middle">D</text>

  <!-- P1, P2, P3 -->
  <circle cx="322" cy="300" r="26" fill="#004065"/>
  <text x="322" y="305" class="plab" text-anchor="middle">P1</text>
  <circle cx="400" cy="300" r="26" fill="#004065"/>
  <text x="400" y="305" class="plab" text-anchor="middle">P2</text>
  <circle cx="478" cy="300" r="26" fill="#004065"/>
  <text x="478" y="305" class="plab" text-anchor="middle">P3</text>

  <!-- Received pieces -->
  <rect x="311" y="335" width="22" height="16" rx="2" fill="#3498db"/>
  <text x="322" y="347" font-size="10" fill="white" text-anchor="middle">B</text>
  <rect x="389" y="335" width="22" height="16" rx="2" fill="#2ecc71"/>
  <text x="400" y="347" font-size="10" fill="white" text-anchor="middle">C</text>
  <rect x="467" y="335" width="22" height="16" rx="2" fill="#9b59b6"/>
  <text x="478" y="347" font-size="10" fill="white" text-anchor="middle">D</text>

  <text x="400" y="410" class="cap" text-anchor="middle">Buffer ABCD split across ranks</text>

  <!-- ================= GATHER ================= -->
  <text x="667" y="90" class="sub" text-anchor="middle">Gather</text>
  <text x="667" y="110" class="cap" text-anchor="middle">All -&gt; One  (collect)</text>

  <!-- P1, P2, P3 at top -->
  <circle cx="589" cy="170" r="26" fill="#004065"/>
  <text x="589" y="175" class="plab" text-anchor="middle">P1</text>
  <circle cx="667" cy="170" r="26" fill="#004065"/>
  <text x="667" y="175" class="plab" text-anchor="middle">P2</text>
  <circle cx="745" cy="170" r="26" fill="#004065"/>
  <text x="745" y="175" class="plab" text-anchor="middle">P3</text>

  <!-- Data each holds -->
  <rect x="577" y="132" width="24" height="16" rx="2" fill="#e74c3c"/>
  <text x="589" y="144" font-size="10" fill="white" text-anchor="middle">X1</text>
  <rect x="655" y="132" width="24" height="16" rx="2" fill="#3498db"/>
  <text x="667" y="144" font-size="10" fill="white" text-anchor="middle">X2</text>
  <rect x="733" y="132" width="24" height="16" rx="2" fill="#2ecc71"/>
  <text x="745" y="144" font-size="10" fill="white" text-anchor="middle">X3</text>

  <!-- Arrows down to P0 -->
  <line x1="598" y1="192" x2="651" y2="275" class="flow" marker-end="url(#arrc1)"/>
  <line x1="667" y1="196" x2="667" y2="275" class="flow" marker-end="url(#arrc1)"/>
  <line x1="736" y1="192" x2="683" y2="275" class="flow" marker-end="url(#arrc1)"/>

  <rect x="608" y="225" width="24" height="16" rx="2" fill="#e74c3c"/>
  <text x="620" y="237" font-size="10" fill="white" text-anchor="middle">X1</text>
  <rect x="655" y="225" width="24" height="16" rx="2" fill="#3498db"/>
  <text x="667" y="237" font-size="10" fill="white" text-anchor="middle">X2</text>
  <rect x="702" y="225" width="24" height="16" rx="2" fill="#2ecc71"/>
  <text x="714" y="237" font-size="10" fill="white" text-anchor="middle">X3</text>

  <!-- P0 at bottom -->
  <circle cx="667" cy="300" r="26" fill="#FFD200" stroke="#004065" stroke-width="2"/>
  <text x="667" y="305" class="rootlab" text-anchor="middle">P0</text>

  <!-- Combined buffer -->
  <rect x="619" y="335" width="24" height="18" rx="2" fill="#e74c3c"/>
  <text x="631" y="348" font-size="10" fill="white" text-anchor="middle">X1</text>
  <rect x="643" y="335" width="24" height="18" rx="2" fill="#3498db"/>
  <text x="655" y="348" font-size="10" fill="white" text-anchor="middle">X2</text>
  <rect x="667" y="335" width="24" height="18" rx="2" fill="#2ecc71"/>
  <text x="679" y="348" font-size="10" fill="white" text-anchor="middle">X3</text>

  <text x="667" y="410" class="cap" text-anchor="middle">Root P0 collects all pieces</text>
</svg>
