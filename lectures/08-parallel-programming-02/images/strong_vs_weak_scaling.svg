<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #222; }
    .title { font-size: 18px; font-weight: bold; fill: #004065; }
    .subtitle { font-size: 15px; font-weight: bold; fill: #004065; }
    .axis-label { font-size: 12px; }
    .axis-title { font-size: 13px; font-weight: bold; }
    .legend-text { font-size: 12px; }
    .grid-line { stroke: #e0e0e0; stroke-width: 1; }
    .data-point { stroke-width: 2; fill: white; }
    .caption { font-size: 12px; font-style: italic; fill: #555; }
    .proc-label { font-size: 12px; fill: white; font-weight: bold; }
    .chunk-label { font-size: 11px; fill: #333; }
  </style>

  <!-- Title -->
  <text x="400" y="28" class="title" text-anchor="middle">Strong vs. Weak Scaling</text>

  <!-- Legend -->
  <line x1="280" y1="44" x2="300" y2="44" stroke="#004065" stroke-width="2"/>
  <circle cx="290" cy="44" r="3" fill="#004065"/>
  <text x="306" y="48" class="legend-text">Ideal</text>
  <line x1="360" y1="44" x2="380" y2="44" stroke="#c05000" stroke-width="2"/>
  <circle cx="370" cy="44" r="3" fill="#c05000"/>
  <text x="386" y="48" class="legend-text">Realistic</text>

  <!-- ═══ LEFT: Strong Scaling Chart ═══ -->
  <text x="190" y="72" class="subtitle" text-anchor="middle">Strong Scaling (Speedup)</text>

  <rect x="50" y="82" width="280" height="180" fill="#fafafa" stroke="#ccc" rx="4"/>

  <!-- Grid -->
  <line x1="50" y1="127" x2="330" y2="127" class="grid-line"/>
  <line x1="50" y1="172" x2="330" y2="172" class="grid-line"/>
  <line x1="50" y1="217" x2="330" y2="217" class="grid-line"/>
  <line x1="106" y1="82" x2="106" y2="262" class="grid-line"/>
  <line x1="162" y1="82" x2="162" y2="262" class="grid-line"/>
  <line x1="218" y1="82" x2="218" y2="262" class="grid-line"/>
  <line x1="274" y1="82" x2="274" y2="262" class="grid-line"/>

  <!-- Axes -->
  <line x1="50" y1="262" x2="330" y2="262" stroke="#333" stroke-width="2"/>
  <line x1="50" y1="82" x2="50" y2="262" stroke="#333" stroke-width="2"/>

  <!-- X labels -->
  <text x="190" y="280" class="axis-title" text-anchor="middle">Processors</text>
  <text x="50" y="275" class="axis-label" text-anchor="middle">1</text>
  <text x="106" y="275" class="axis-label" text-anchor="middle">2</text>
  <text x="162" y="275" class="axis-label" text-anchor="middle">4</text>
  <text x="218" y="275" class="axis-label" text-anchor="middle">8</text>
  <text x="274" y="275" class="axis-label" text-anchor="middle">16</text>
  <text x="330" y="275" class="axis-label" text-anchor="middle">32</text>

  <!-- Y labels -->
  <text x="25" y="172" class="axis-title" text-anchor="middle" transform="rotate(-90 25 172)">Speedup</text>
  <text x="43" y="265" class="axis-label" text-anchor="end">1×</text>
  <text x="43" y="220" class="axis-label" text-anchor="end">8×</text>
  <text x="43" y="175" class="axis-label" text-anchor="end">16×</text>
  <text x="43" y="130" class="axis-label" text-anchor="end">24×</text>
  <text x="43" y="88" class="axis-label" text-anchor="end">32×</text>

  <!-- Ideal line -->
  <polyline points="50,262 106,217 162,172 218,127 274,82 330,82" fill="none" stroke="#004065" stroke-width="2"/>
  <circle cx="50" cy="262" r="3" class="data-point" stroke="#004065"/>
  <circle cx="106" cy="217" r="3" class="data-point" stroke="#004065"/>
  <circle cx="162" cy="172" r="3" class="data-point" stroke="#004065"/>
  <circle cx="218" cy="127" r="3" class="data-point" stroke="#004065"/>
  <circle cx="274" cy="82" r="3" class="data-point" stroke="#004065"/>
  <circle cx="330" cy="82" r="3" class="data-point" stroke="#004065"/>

  <!-- Realistic line (plateaus) -->
  <polyline points="50,262 106,225 162,195 218,175 274,165 330,160" fill="none" stroke="#c05000" stroke-width="2"/>
  <circle cx="50" cy="262" r="3" class="data-point" stroke="#c05000"/>
  <circle cx="106" cy="225" r="3" class="data-point" stroke="#c05000"/>
  <circle cx="162" cy="195" r="3" class="data-point" stroke="#c05000"/>
  <circle cx="218" cy="175" r="3" class="data-point" stroke="#c05000"/>
  <circle cx="274" cy="165" r="3" class="data-point" stroke="#c05000"/>
  <circle cx="330" cy="160" r="3" class="data-point" stroke="#c05000"/>

  <!-- ═══ RIGHT: Weak Scaling Chart ═══ -->
  <text x="590" y="72" class="subtitle" text-anchor="middle">Weak Scaling (Efficiency)</text>

  <rect x="450" y="82" width="280" height="180" fill="#fafafa" stroke="#ccc" rx="4"/>

  <!-- Grid -->
  <line x1="450" y1="127" x2="730" y2="127" class="grid-line"/>
  <line x1="450" y1="172" x2="730" y2="172" class="grid-line"/>
  <line x1="450" y1="217" x2="730" y2="217" class="grid-line"/>
  <line x1="506" y1="82" x2="506" y2="262" class="grid-line"/>
  <line x1="562" y1="82" x2="562" y2="262" class="grid-line"/>
  <line x1="618" y1="82" x2="618" y2="262" class="grid-line"/>
  <line x1="674" y1="82" x2="674" y2="262" class="grid-line"/>

  <!-- Axes -->
  <line x1="450" y1="262" x2="730" y2="262" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="82" x2="450" y2="262" stroke="#333" stroke-width="2"/>

  <!-- X labels -->
  <text x="590" y="280" class="axis-title" text-anchor="middle">Processors</text>
  <text x="450" y="275" class="axis-label" text-anchor="middle">1</text>
  <text x="506" y="275" class="axis-label" text-anchor="middle">2</text>
  <text x="562" y="275" class="axis-label" text-anchor="middle">4</text>
  <text x="618" y="275" class="axis-label" text-anchor="middle">8</text>
  <text x="674" y="275" class="axis-label" text-anchor="middle">16</text>
  <text x="730" y="275" class="axis-label" text-anchor="middle">32</text>

  <!-- Y labels -->
  <text x="425" y="172" class="axis-title" text-anchor="middle" transform="rotate(-90 425 172)">Efficiency</text>
  <text x="443" y="265" class="axis-label" text-anchor="end">0%</text>
  <text x="443" y="220" class="axis-label" text-anchor="end">25%</text>
  <text x="443" y="175" class="axis-label" text-anchor="end">50%</text>
  <text x="443" y="130" class="axis-label" text-anchor="end">75%</text>
  <text x="443" y="88" class="axis-label" text-anchor="end">100%</text>

  <!-- Ideal line (flat at 100%) -->
  <polyline points="450,82 506,82 562,82 618,82 674,82 730,82" fill="none" stroke="#004065" stroke-width="2"/>
  <circle cx="450" cy="82" r="3" class="data-point" stroke="#004065"/>
  <circle cx="506" cy="82" r="3" class="data-point" stroke="#004065"/>
  <circle cx="562" cy="82" r="3" class="data-point" stroke="#004065"/>
  <circle cx="618" cy="82" r="3" class="data-point" stroke="#004065"/>
  <circle cx="674" cy="82" r="3" class="data-point" stroke="#004065"/>
  <circle cx="730" cy="82" r="3" class="data-point" stroke="#004065"/>

  <!-- Realistic line (gentle decline) -->
  <polyline points="450,82 506,87 562,96 618,110 674,125 730,140" fill="none" stroke="#c05000" stroke-width="2"/>
  <circle cx="450" cy="82" r="3" class="data-point" stroke="#c05000"/>
  <circle cx="506" cy="87" r="3" class="data-point" stroke="#c05000"/>
  <circle cx="562" cy="96" r="3" class="data-point" stroke="#c05000"/>
  <circle cx="618" cy="110" r="3" class="data-point" stroke="#c05000"/>
  <circle cx="674" cy="125" r="3" class="data-point" stroke="#c05000"/>
  <circle cx="730" cy="140" r="3" class="data-point" stroke="#c05000"/>

  <!-- ═══ BOTTOM: Visual Diagrams ═══ -->

  <!-- Strong scaling diagram -->
  <text x="190" y="308" class="subtitle" text-anchor="middle">Fixed Problem, More Processors</text>

  <!-- One big problem bar -->
  <rect x="60" y="320" width="260" height="28" rx="4" fill="#cfe2f3" stroke="#004065" stroke-width="1.5"/>
  <text x="190" y="339" text-anchor="middle" class="chunk-label" font-weight="bold">Total Work (fixed)</text>

  <!-- Arrow down -->
  <text x="190" y="364" text-anchor="middle" fill="#666" font-size="16">↓</text>

  <!-- Split into 4 smaller chunks on 4 processors -->
  <rect x="60" y="372" width="60" height="28" rx="4" fill="#004065"/>
  <text x="90" y="390" text-anchor="middle" class="proc-label">P0</text>
  <rect x="127" y="372" width="60" height="28" rx="4" fill="#004065"/>
  <text x="157" y="390" text-anchor="middle" class="proc-label">P1</text>
  <rect x="194" y="372" width="60" height="28" rx="4" fill="#004065"/>
  <text x="224" y="390" text-anchor="middle" class="proc-label">P2</text>
  <rect x="261" y="372" width="60" height="28" rx="4" fill="#004065"/>
  <text x="291" y="390" text-anchor="middle" class="proc-label">P3</text>

  <text x="190" y="418" text-anchor="middle" class="caption">Each processor gets less work</text>

  <!-- Weak scaling diagram -->
  <text x="590" y="308" class="subtitle" text-anchor="middle">Bigger Problem, More Processors</text>

  <!-- 4 equal chunks (bigger total) -->
  <rect x="460" y="320" width="65" height="28" rx="4" fill="#fff4cc" stroke="#004065" stroke-width="1.5"/>
  <text x="492" y="339" text-anchor="middle" class="chunk-label">W</text>
  <rect x="530" y="320" width="65" height="28" rx="4" fill="#fff4cc" stroke="#004065" stroke-width="1.5"/>
  <text x="562" y="339" text-anchor="middle" class="chunk-label">W</text>
  <rect x="600" y="320" width="65" height="28" rx="4" fill="#fff4cc" stroke="#004065" stroke-width="1.5"/>
  <text x="632" y="339" text-anchor="middle" class="chunk-label">W</text>
  <rect x="670" y="320" width="65" height="28" rx="4" fill="#fff4cc" stroke="#004065" stroke-width="1.5"/>
  <text x="702" y="339" text-anchor="middle" class="chunk-label">W</text>

  <!-- Arrow down -->
  <text x="590" y="364" text-anchor="middle" fill="#666" font-size="16">↓</text>

  <!-- 4 processors, each with same work -->
  <rect x="460" y="372" width="65" height="28" rx="4" fill="#004065"/>
  <text x="492" y="390" text-anchor="middle" class="proc-label">P0</text>
  <rect x="530" y="372" width="65" height="28" rx="4" fill="#004065"/>
  <text x="562" y="390" text-anchor="middle" class="proc-label">P1</text>
  <rect x="600" y="372" width="65" height="28" rx="4" fill="#004065"/>
  <text x="632" y="390" text-anchor="middle" class="proc-label">P2</text>
  <rect x="670" y="372" width="65" height="28" rx="4" fill="#004065"/>
  <text x="702" y="390" text-anchor="middle" class="proc-label">P3</text>

  <text x="590" y="418" text-anchor="middle" class="caption">Each processor gets the same work (W)</text>

  <!-- Bottom summary -->
  <text x="190" y="450" text-anchor="middle" font-size="13" fill="#004065" font-weight="bold">Same work, faster</text>
  <text x="590" y="450" text-anchor="middle" font-size="13" fill="#004065" font-weight="bold">More work, same time</text>

  <!-- Divider -->
  <line x1="400" y1="290" x2="400" y2="460" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
