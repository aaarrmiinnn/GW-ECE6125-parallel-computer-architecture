<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arr1d" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#004065"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Helvetica Neue', Arial, sans-serif; fill: #222; }
    .title { font-size: 22px; font-weight: bold; fill: #004065; }
    .sub { font-size: 13px; fill: #666; font-style: italic; }
    .mlab { font-size: 22px; font-weight: bold; fill: #004065; }
    .eq { font-size: 26px; font-weight: bold; fill: #004065; }
    .p0 { fill: #cfe2f3; stroke: #004065; stroke-width: 2; }
    .p1 { fill: #fff4cc; stroke: #004065; stroke-width: 2; }
    .p2 { fill: #d4edda; stroke: #004065; stroke-width: 2; }
    .p3 { fill: #f8d7da; stroke: #004065; stroke-width: 2; }
    .bfill { fill: #FFD200; stroke: #004065; stroke-width: 2; }
    .plab { font-size: 13px; font-weight: bold; fill: #004065; }
    .bcast { stroke: #004065; stroke-width: 1.8; fill: none; stroke-dasharray: 6,4; }
    .note { font-size: 12px; fill: #666; font-style: italic; }
  </style>

  <!-- Title -->
  <text x="400" y="34" class="title" text-anchor="middle">1D Row Decomposition: Broadcast B to All Processes</text>
  <text x="400" y="54" class="sub" text-anchor="middle">C = A x B     each process owns a row-block of A and computes the matching row-block of C</text>

  <!-- Geometry:
       Matrix box 160x200.
       C at x=70..230, y=150..350
       A at x=320..480, y=150..350
       B at x=570..730, y=150..350
  -->

  <!-- ===== Matrix C ===== -->
  <text x="150" y="138" class="mlab" text-anchor="middle">C</text>
  <rect x="70" y="150" width="160" height="50" class="p0"/>
  <text x="150" y="180" class="plab" text-anchor="middle">P0 row-block</text>
  <rect x="70" y="200" width="160" height="50" class="p1"/>
  <text x="150" y="230" class="plab" text-anchor="middle">P1 row-block</text>
  <rect x="70" y="250" width="160" height="50" class="p2"/>
  <text x="150" y="280" class="plab" text-anchor="middle">P2 row-block</text>
  <rect x="70" y="300" width="160" height="50" class="p3"/>
  <text x="150" y="330" class="plab" text-anchor="middle">P3 row-block</text>

  <!-- Equals sign -->
  <text x="275" y="260" class="eq" text-anchor="middle">=</text>

  <!-- ===== Matrix A ===== -->
  <text x="400" y="138" class="mlab" text-anchor="middle">A</text>
  <rect x="320" y="150" width="160" height="50" class="p0"/>
  <text x="400" y="180" class="plab" text-anchor="middle">P0 rows</text>
  <rect x="320" y="200" width="160" height="50" class="p1"/>
  <text x="400" y="230" class="plab" text-anchor="middle">P1 rows</text>
  <rect x="320" y="250" width="160" height="50" class="p2"/>
  <text x="400" y="280" class="plab" text-anchor="middle">P2 rows</text>
  <rect x="320" y="300" width="160" height="50" class="p3"/>
  <text x="400" y="330" class="plab" text-anchor="middle">P3 rows</text>

  <!-- Times sign -->
  <text x="525" y="260" class="eq" text-anchor="middle">&#215;</text>

  <!-- ===== Matrix B (single block) ===== -->
  <text x="650" y="138" class="mlab" text-anchor="middle">B</text>
  <rect x="570" y="150" width="160" height="200" class="bfill"/>
  <text x="650" y="245" font-size="18" font-weight="bold" fill="#004065" text-anchor="middle">B (full)</text>
  <text x="650" y="268" font-size="12" fill="#004065" text-anchor="middle">replicated on all procs</text>

  <!-- Broadcast arrows from B to each row-block of A -->
  <line x1="570" y1="175" x2="485" y2="175" class="bcast" marker-end="url(#arr1d)"/>
  <line x1="570" y1="225" x2="485" y2="225" class="bcast" marker-end="url(#arr1d)"/>
  <line x1="570" y1="275" x2="485" y2="275" class="bcast" marker-end="url(#arr1d)"/>
  <line x1="570" y1="325" x2="485" y2="325" class="bcast" marker-end="url(#arr1d)"/>

  <!-- Bcast label -->
  <text x="530" y="375" font-size="12" font-weight="bold" fill="#004065" text-anchor="middle">MPI_Bcast(B)</text>

  <!-- Bottom annotation -->
  <rect x="120" y="410" width="560" height="60" rx="6" fill="#f0f4f8" stroke="#004065" stroke-width="1.5"/>
  <text x="400" y="432" font-size="13" font-weight="bold" fill="#004065" text-anchor="middle">Each process computes: C[my_rows, :] = A[my_rows, :] &#215; B</text>
  <text x="400" y="452" font-size="12" fill="#555" text-anchor="middle">Communication cost: broadcast full B  (O(n^2) bytes to every rank)</text>
</svg>
