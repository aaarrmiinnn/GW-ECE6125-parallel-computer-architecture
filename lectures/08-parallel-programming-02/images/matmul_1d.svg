<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #222; }
    .label { font-size: 12px; font-weight: bold; fill: #004065; }
    .small { font-size: 10px; fill: #555; }
    .proc { font-size: 9px; fill: white; font-weight: bold; }
    .mat-border { fill: none; stroke: #004065; stroke-width: 1.5; }
  </style>

  <!-- ═══ A (split by rows) ═══ -->
  <text x="55" y="16" class="label" text-anchor="middle">A (rows split)</text>
  <rect x="15" y="24" width="80" height="28" fill="#004065" stroke="white" stroke-width="1" rx="2"/>
  <text x="55" y="42" class="proc" text-anchor="middle">P0: n/P rows</text>
  <rect x="15" y="52" width="80" height="28" fill="#2a7ab5" stroke="white" stroke-width="1" rx="2"/>
  <text x="55" y="70" class="proc" text-anchor="middle">P1: n/P rows</text>
  <rect x="15" y="80" width="80" height="28" fill="#5ba3d9" stroke="white" stroke-width="1" rx="2"/>
  <text x="55" y="98" class="proc" text-anchor="middle">P2: n/P rows</text>
  <rect x="15" y="108" width="80" height="28" fill="#c05000" stroke="white" stroke-width="1" rx="2"/>
  <text x="55" y="126" class="proc" text-anchor="middle">P3: n/P rows</text>
  <rect x="15" y="24" width="80" height="112" class="mat-border" rx="2"/>

  <!-- × -->
  <text x="113" y="85" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">×</text>

  <!-- ═══ B (full, broadcast to all) ═══ -->
  <text x="170" y="16" class="label" text-anchor="middle">B (full copy)</text>
  <rect x="130" y="24" width="80" height="112" fill="#fff4cc" stroke="#004065" stroke-width="1.5" rx="2"/>
  <text x="170" y="76" class="small" text-anchor="middle">n × n</text>
  <text x="170" y="90" class="small" text-anchor="middle">broadcast</text>
  <text x="170" y="104" class="small" text-anchor="middle">to every P</text>

  <!-- = -->
  <text x="228" y="85" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">=</text>

  <!-- ═══ C (result, right side, same split as A) ═══ -->
  <text x="295" y="16" class="label" text-anchor="middle">C (result)</text>
  <rect x="255" y="24" width="80" height="28" fill="#004065" stroke="white" stroke-width="1" rx="2"/>
  <text x="295" y="42" class="proc" text-anchor="middle">P0 computes</text>
  <rect x="255" y="52" width="80" height="28" fill="#2a7ab5" stroke="white" stroke-width="1" rx="2"/>
  <text x="295" y="70" class="proc" text-anchor="middle">P1 computes</text>
  <rect x="255" y="80" width="80" height="28" fill="#5ba3d9" stroke="white" stroke-width="1" rx="2"/>
  <text x="295" y="98" class="proc" text-anchor="middle">P2 computes</text>
  <rect x="255" y="108" width="80" height="28" fill="#c05000" stroke="white" stroke-width="1" rx="2"/>
  <text x="295" y="126" class="proc" text-anchor="middle">P3 computes</text>
  <rect x="255" y="24" width="80" height="112" class="mat-border" rx="2"/>

  <!-- ═══ Mapping annotation ═══ -->
  <!-- Arrow from A P0 row to C P0 row -->
  <path d="M 95,38 C 140,20 220,20 255,38" fill="none" stroke="#004065" stroke-width="0.8" stroke-dasharray="3,2"/>
  <path d="M 95,122 C 140,145 220,145 255,122" fill="none" stroke="#c05000" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- Bottom: derivations -->
  <rect x="15" y="148" width="430" height="46" rx="5" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="230" y="164" class="small" text-anchor="middle" font-weight="bold" fill="#004065">Why these costs?</text>
  <text x="230" y="178" class="small" text-anchor="middle">Each P computes (n/P) rows × n cols × n mults = 2n³/P FLOPs</text>
  <text x="230" y="190" class="small" text-anchor="middle">Broadcast B (n² elements) via tree = O(n² log P).  Each P stores full B = O(n²) memory.</text>
</svg>
