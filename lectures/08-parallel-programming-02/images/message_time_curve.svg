<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #222; }
    .axis { stroke: #222; stroke-width: 2; fill: none; }
    .grid { stroke: #ddd; stroke-width: 1; }
    .curve { stroke: #004065; stroke-width: 3; fill: none; }
    .latency-line { stroke: #999; stroke-width: 1.5; stroke-dasharray: 8,4; }
    .region-label { font-size: 14px; font-weight: bold; }
    .axis-label { font-size: 15px; }
    .tick-label { font-size: 12px; }
    .title { font-size: 18px; font-weight: bold; fill: #004065; }
    .annotation { font-size: 13px; fill: #555; }
  </style>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Message Time vs. Message Size</text>

  <!-- Chart area: x=100..720, y=50..340 -->
  <!-- Grid lines -->
  <line x1="100" y1="100" x2="720" y2="100" class="grid"/>
  <line x1="100" y1="150" x2="720" y2="150" class="grid"/>
  <line x1="100" y1="200" x2="720" y2="200" class="grid"/>
  <line x1="100" y1="250" x2="720" y2="250" class="grid"/>
  <line x1="100" y1="300" x2="720" y2="300" class="grid"/>

  <!-- Axes -->
  <line x1="100" y1="340" x2="720" y2="340" class="axis"/>
  <line x1="100" y1="50" x2="100" y2="340" class="axis"/>

  <!-- X-axis label -->
  <text x="410" y="380" text-anchor="middle" class="axis-label">Message Size (bytes)</text>
  <!-- X ticks -->
  <text x="100" y="358" text-anchor="middle" class="tick-label">0</text>
  <text x="255" y="358" text-anchor="middle" class="tick-label">1 KB</text>
  <text x="410" y="358" text-anchor="middle" class="tick-label">10 KB</text>
  <text x="565" y="358" text-anchor="middle" class="tick-label">100 KB</text>
  <text x="720" y="358" text-anchor="middle" class="tick-label">1 MB</text>

  <!-- Y-axis label -->
  <text x="30" y="195" text-anchor="middle" class="axis-label" transform="rotate(-90 30 195)">Message Time</text>
  <!-- Y ticks -->
  <text x="90" y="344" text-anchor="end" class="tick-label">0</text>
  <text x="90" y="254" text-anchor="end" class="tick-label">T</text>

  <!-- Latency floor (dashed) -->
  <line x1="100" y1="290" x2="720" y2="290" class="latency-line"/>
  <text x="730" y="294" class="annotation" font-style="italic">α (latency)</text>

  <!-- The curve: starts at latency floor, stays flat for small messages, then rises linearly -->
  <!-- Modeled as T = alpha + n/beta; flat region then slope -->
  <path d="M 100,290 C 200,290 250,288 310,275 Q 380,255 450,220 L 720,90" class="curve"/>

  <!-- Crossover region annotation -->
  <line x1="310" y1="275" x2="310" y2="340" stroke="#FFD200" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="310" y="52" text-anchor="middle" font-size="12" fill="#004065" font-weight="bold">crossover</text>
  <text x="310" y="66" text-anchor="middle" font-size="11" fill="#666">(~few KB)</text>
  <path d="M 310,70 L 310,275" stroke="#FFD200" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Latency-dominated region -->
  <rect x="120" y="72" width="160" height="50" rx="6" fill="#fff4cc" fill-opacity="0.8" stroke="#FFD200" stroke-width="1.5"/>
  <text x="200" y="92" text-anchor="middle" class="region-label" fill="#004065">Latency-Dominated</text>
  <text x="200" y="112" text-anchor="middle" class="annotation">Small messages: T ≈ α</text>

  <!-- Bandwidth-dominated region -->
  <rect x="430" y="72" width="180" height="50" rx="6" fill="#cfe2f3" fill-opacity="0.8" stroke="#004065" stroke-width="1.5"/>
  <text x="520" y="92" text-anchor="middle" class="region-label" fill="#004065">Bandwidth-Dominated</text>
  <text x="520" y="112" text-anchor="middle" class="annotation">Large messages: T ≈ n / β</text>

  <!-- Slope annotation -->
  <line x1="540" y1="180" x2="600" y2="150" stroke="#004065" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="615" y="152" font-size="13" fill="#004065" font-weight="bold">slope = 1/β</text>
</svg>
