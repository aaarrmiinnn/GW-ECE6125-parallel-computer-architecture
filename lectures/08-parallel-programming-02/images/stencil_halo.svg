<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arrh" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#004065"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Helvetica Neue', Arial, sans-serif; fill: #222; }
    .title { font-size: 22px; font-weight: bold; fill: #004065; }
    .sub { font-size: 13px; fill: #666; font-style: italic; }
    .own { font-size: 14px; font-weight: bold; fill: #004065; }
    .cell { fill: #cfe2f3; stroke: #004065; stroke-width: 1; }
    .halo { fill: #fff4cc; stroke: #d4a40b; stroke-width: 1; }
    .border { fill: none; stroke: #004065; stroke-width: 2; }
    .exc { stroke: #004065; stroke-width: 2; fill: none; }
  </style>

  <!-- Title -->
  <text x="400" y="34" class="title" text-anchor="middle">Halo Exchange for 2D Stencil</text>
  <text x="400" y="54" class="sub" text-anchor="middle">Each process owns a sub-domain and exchanges ghost cells with neighbors</text>

  <!-- Layout: 2x2 grid of 6x6 cell subdomains, each cell ~24px, plus 1-cell halo around each block -->
  <!-- Block A (P0) top-left: cells at x=180..324, y=100..244 (6 cells x 24 = 144) -->
  <!-- Halo ring around: x=156..348, y=76..268 -->

  <!-- ============ P0 block (top-left) ============ -->
  <!-- Halo -->
  <rect x="156" y="76"  width="192" height="192" class="halo" rx="2"/>
  <!-- Inner owned region -->
  <rect x="180" y="100" width="144" height="144" class="cell"/>
  <!-- Grid lines -->
  <g stroke="#004065" stroke-width="0.6" opacity="0.5">
    <line x1="204" y1="100" x2="204" y2="244"/>
    <line x1="228" y1="100" x2="228" y2="244"/>
    <line x1="252" y1="100" x2="252" y2="244"/>
    <line x1="276" y1="100" x2="276" y2="244"/>
    <line x1="300" y1="100" x2="300" y2="244"/>
    <line x1="180" y1="124" x2="324" y2="124"/>
    <line x1="180" y1="148" x2="324" y2="148"/>
    <line x1="180" y1="172" x2="324" y2="172"/>
    <line x1="180" y1="196" x2="324" y2="196"/>
    <line x1="180" y1="220" x2="324" y2="220"/>
  </g>
  <rect x="180" y="100" width="144" height="144" class="border"/>
  <text x="252" y="92" class="own" text-anchor="middle">P0</text>

  <!-- ============ P1 block (top-right) ============ -->
  <rect x="452" y="76"  width="192" height="192" class="halo" rx="2"/>
  <rect x="476" y="100" width="144" height="144" class="cell"/>
  <g stroke="#004065" stroke-width="0.6" opacity="0.5">
    <line x1="500" y1="100" x2="500" y2="244"/>
    <line x1="524" y1="100" x2="524" y2="244"/>
    <line x1="548" y1="100" x2="548" y2="244"/>
    <line x1="572" y1="100" x2="572" y2="244"/>
    <line x1="596" y1="100" x2="596" y2="244"/>
    <line x1="476" y1="124" x2="620" y2="124"/>
    <line x1="476" y1="148" x2="620" y2="148"/>
    <line x1="476" y1="172" x2="620" y2="172"/>
    <line x1="476" y1="196" x2="620" y2="196"/>
    <line x1="476" y1="220" x2="620" y2="220"/>
  </g>
  <rect x="476" y="100" width="144" height="144" class="border"/>
  <text x="548" y="92" class="own" text-anchor="middle">P1</text>

  <!-- ============ P2 block (bottom-left) ============ -->
  <rect x="156" y="276" width="192" height="192" class="halo" rx="2"/>
  <rect x="180" y="300" width="144" height="144" class="cell"/>
  <g stroke="#004065" stroke-width="0.6" opacity="0.5">
    <line x1="204" y1="300" x2="204" y2="444"/>
    <line x1="228" y1="300" x2="228" y2="444"/>
    <line x1="252" y1="300" x2="252" y2="444"/>
    <line x1="276" y1="300" x2="276" y2="444"/>
    <line x1="300" y1="300" x2="300" y2="444"/>
    <line x1="180" y1="324" x2="324" y2="324"/>
    <line x1="180" y1="348" x2="324" y2="348"/>
    <line x1="180" y1="372" x2="324" y2="372"/>
    <line x1="180" y1="396" x2="324" y2="396"/>
    <line x1="180" y1="420" x2="324" y2="420"/>
  </g>
  <rect x="180" y="300" width="144" height="144" class="border"/>
  <text x="252" y="487" class="own" text-anchor="middle">P2</text>

  <!-- ============ P3 block (bottom-right) ============ -->
  <rect x="452" y="276" width="192" height="192" class="halo" rx="2"/>
  <rect x="476" y="300" width="144" height="144" class="cell"/>
  <g stroke="#004065" stroke-width="0.6" opacity="0.5">
    <line x1="500" y1="300" x2="500" y2="444"/>
    <line x1="524" y1="300" x2="524" y2="444"/>
    <line x1="548" y1="300" x2="548" y2="444"/>
    <line x1="572" y1="300" x2="572" y2="444"/>
    <line x1="596" y1="300" x2="596" y2="444"/>
    <line x1="476" y1="324" x2="620" y2="324"/>
    <line x1="476" y1="348" x2="620" y2="348"/>
    <line x1="476" y1="372" x2="620" y2="372"/>
    <line x1="476" y1="396" x2="620" y2="396"/>
    <line x1="476" y1="420" x2="620" y2="420"/>
  </g>
  <rect x="476" y="300" width="144" height="144" class="border"/>
  <text x="548" y="487" class="own" text-anchor="middle">P3</text>

  <!-- ============ Exchange arrows ============ -->
  <!-- Horizontal (P0 <-> P1) -->
  <line x1="350" y1="160" x2="448" y2="160" class="exc" marker-end="url(#arrh)"/>
  <line x1="448" y1="184" x2="350" y2="184" class="exc" marker-end="url(#arrh)"/>
  <!-- Horizontal (P2 <-> P3) -->
  <line x1="350" y1="360" x2="448" y2="360" class="exc" marker-end="url(#arrh)"/>
  <line x1="448" y1="384" x2="350" y2="384" class="exc" marker-end="url(#arrh)"/>
  <!-- Vertical (P0 <-> P2) -->
  <line x1="232" y1="270" x2="232" y2="272" class="exc"/>
  <line x1="232" y1="252" x2="232" y2="290" class="exc" marker-end="url(#arrh)"/>
  <line x1="272" y1="290" x2="272" y2="252" class="exc" marker-end="url(#arrh)"/>
  <!-- Vertical (P1 <-> P3) -->
  <line x1="528" y1="252" x2="528" y2="290" class="exc" marker-end="url(#arrh)"/>
  <line x1="568" y1="290" x2="568" y2="252" class="exc" marker-end="url(#arrh)"/>

  <!-- Legend -->
  <rect x="670" y="120" width="110" height="90" rx="6" fill="white" stroke="#ccc"/>
  <text x="725" y="140" font-size="12" font-weight="bold" fill="#004065" text-anchor="middle">Legend</text>
  <rect x="682" y="150" width="16" height="12" class="cell"/>
  <text x="703" y="161" font-size="11" fill="#222">owned</text>
  <rect x="682" y="170" width="16" height="12" class="halo"/>
  <text x="703" y="181" font-size="11" fill="#222">halo / ghost</text>
  <line x1="682" y1="197" x2="702" y2="197" class="exc" marker-end="url(#arrh)"/>
  <text x="706" y="201" font-size="11" fill="#222">exchange</text>
</svg>
