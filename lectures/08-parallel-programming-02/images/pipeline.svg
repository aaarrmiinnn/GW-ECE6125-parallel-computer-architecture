<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #222; }
    .title { font-size: 16px; font-weight: bold; fill: #004065; }
    .hdr { font-size: 12px; font-weight: bold; fill: #004065; }
    .stage { font-size: 12px; font-weight: bold; fill: #004065; }
    .fr { font-size: 12px; font-weight: bold; fill: #004065; }
    .empty { fill: #f5f5f5; stroke: #ccc; stroke-width: 1; }
    .busy { fill: #cfe2f3; stroke: #004065; stroke-width: 1.5; }
    .steady { fill: #FFD200; stroke: #004065; stroke-width: 1.5; }
  </style>

  <!-- Title -->
  <text x="350" y="20" class="title" text-anchor="middle">Pipeline Parallelism: 4-Stage Video Transcoding</text>

  <!-- Column headers -->
  <text x="95" y="46" class="hdr" text-anchor="middle">Stage \ t</text>
  <text x="170" y="46" class="hdr" text-anchor="middle">t=1</text>
  <text x="245" y="46" class="hdr" text-anchor="middle">t=2</text>
  <text x="320" y="46" class="hdr" text-anchor="middle">t=3</text>
  <text x="395" y="46" class="hdr" text-anchor="middle">t=4</text>
  <text x="470" y="46" class="hdr" text-anchor="middle">t=5</text>
  <text x="545" y="46" class="hdr" text-anchor="middle">t=6</text>

  <!-- Row labels -->
  <text x="95" y="78" class="stage" text-anchor="middle">Decode</text>
  <text x="95" y="118" class="stage" text-anchor="middle">Filter</text>
  <text x="95" y="158" class="stage" text-anchor="middle">Encode</text>
  <text x="95" y="198" class="stage" text-anchor="middle">Write</text>

  <!-- Row 1: Decode -->
  <rect x="135" y="56" width="68" height="32" rx="4" class="busy"/><text x="170" y="77" class="fr" text-anchor="middle">F1</text>
  <rect x="210" y="56" width="68" height="32" rx="4" class="busy"/><text x="245" y="77" class="fr" text-anchor="middle">F2</text>
  <rect x="285" y="56" width="68" height="32" rx="4" class="steady"/><text x="320" y="77" class="fr" text-anchor="middle">F3</text>
  <rect x="360" y="56" width="68" height="32" rx="4" class="steady"/><text x="395" y="77" class="fr" text-anchor="middle">F4</text>
  <rect x="435" y="56" width="68" height="32" rx="4" class="steady"/><text x="470" y="77" class="fr" text-anchor="middle">F5</text>
  <rect x="510" y="56" width="68" height="32" rx="4" class="steady"/><text x="545" y="77" class="fr" text-anchor="middle">F6</text>

  <!-- Row 2: Filter -->
  <rect x="135" y="96" width="68" height="32" rx="4" class="empty"/>
  <rect x="210" y="96" width="68" height="32" rx="4" class="busy"/><text x="245" y="117" class="fr" text-anchor="middle">F1</text>
  <rect x="285" y="96" width="68" height="32" rx="4" class="steady"/><text x="320" y="117" class="fr" text-anchor="middle">F2</text>
  <rect x="360" y="96" width="68" height="32" rx="4" class="steady"/><text x="395" y="117" class="fr" text-anchor="middle">F3</text>
  <rect x="435" y="96" width="68" height="32" rx="4" class="steady"/><text x="470" y="117" class="fr" text-anchor="middle">F4</text>
  <rect x="510" y="96" width="68" height="32" rx="4" class="steady"/><text x="545" y="117" class="fr" text-anchor="middle">F5</text>

  <!-- Row 3: Encode -->
  <rect x="135" y="136" width="68" height="32" rx="4" class="empty"/>
  <rect x="210" y="136" width="68" height="32" rx="4" class="empty"/>
  <rect x="285" y="136" width="68" height="32" rx="4" class="steady"/><text x="320" y="157" class="fr" text-anchor="middle">F1</text>
  <rect x="360" y="136" width="68" height="32" rx="4" class="steady"/><text x="395" y="157" class="fr" text-anchor="middle">F2</text>
  <rect x="435" y="136" width="68" height="32" rx="4" class="steady"/><text x="470" y="157" class="fr" text-anchor="middle">F3</text>
  <rect x="510" y="136" width="68" height="32" rx="4" class="steady"/><text x="545" y="157" class="fr" text-anchor="middle">F4</text>

  <!-- Row 4: Write -->
  <rect x="135" y="176" width="68" height="32" rx="4" class="empty"/>
  <rect x="210" y="176" width="68" height="32" rx="4" class="empty"/>
  <rect x="285" y="176" width="68" height="32" rx="4" class="empty"/>
  <rect x="360" y="176" width="68" height="32" rx="4" class="steady"/><text x="395" y="197" class="fr" text-anchor="middle">F1</text>
  <rect x="435" y="176" width="68" height="32" rx="4" class="steady"/><text x="470" y="197" class="fr" text-anchor="middle">F2</text>
  <rect x="510" y="176" width="68" height="32" rx="4" class="steady"/><text x="545" y="197" class="fr" text-anchor="middle">F3</text>

  <!-- Steady-state bracket -->
  <line x1="285" y1="222" x2="578" y2="222" stroke="#004065" stroke-width="1.5"/>
  <line x1="285" y1="218" x2="285" y2="226" stroke="#004065" stroke-width="1.5"/>
  <line x1="578" y1="218" x2="578" y2="226" stroke="#004065" stroke-width="1.5"/>
  <text x="432" y="238" font-size="11" font-weight="bold" fill="#004065" text-anchor="middle">Steady state: all 4 stages busy</text>

  <!-- Legend -->
  <rect x="135" y="256" width="440" height="26" rx="4" fill="white" stroke="#ddd"/>
  <rect x="148" y="263" width="14" height="12" rx="2" class="empty"/>
  <text x="167" y="274" font-size="11" fill="#222">idle</text>
  <rect x="210" y="263" width="14" height="12" rx="2" class="busy"/>
  <text x="229" y="274" font-size="11" fill="#222">fill phase</text>
  <rect x="310" y="263" width="14" height="12" rx="2" class="steady"/>
  <text x="329" y="274" font-size="11" fill="#222">steady state (gold)</text>
</svg>
