<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <style>
    text { font-family: 'Helvetica Neue', Arial, sans-serif; fill: #222; }
    .title { font-size: 22px; font-weight: bold; fill: #004065; }
    .sub { font-size: 13px; fill: #666; font-style: italic; }
    .hdr { font-size: 14px; font-weight: bold; fill: #004065; }
    .stage { font-size: 13px; font-weight: bold; fill: #004065; }
    .fr { font-size: 14px; font-weight: bold; fill: #004065; }
    .empty { fill: #f5f5f5; stroke: #ccc; stroke-width: 1; }
    .busy { fill: #cfe2f3; stroke: #004065; stroke-width: 1.5; }
    .steady { fill: #FFD200; stroke: #004065; stroke-width: 2; }
  </style>

  <!-- Title -->
  <text x="400" y="34" class="title" text-anchor="middle">Pipeline Parallelism: 4-Stage Video Transcoding</text>
  <text x="400" y="54" class="sub" text-anchor="middle">Each stage runs on a different worker; steady state uses all 4 in parallel</text>

  <!-- Grid dimensions: 4 rows (stages) x 6 cols (time steps). Cell 90x60.
       Stage column labels at x=100; first data column starts at x=160, step 90; rows start y=100 step 60
       Columns centers: 205, 295, 385, 475, 565, 655
  -->

  <!-- Column headers (time steps) -->
  <text x="130" y="92" class="hdr" text-anchor="middle">Stage \ t</text>
  <text x="205" y="92" class="hdr" text-anchor="middle">t=1</text>
  <text x="295" y="92" class="hdr" text-anchor="middle">t=2</text>
  <text x="385" y="92" class="hdr" text-anchor="middle">t=3</text>
  <text x="475" y="92" class="hdr" text-anchor="middle">t=4</text>
  <text x="565" y="92" class="hdr" text-anchor="middle">t=5</text>
  <text x="655" y="92" class="hdr" text-anchor="middle">t=6</text>

  <!-- Row labels -->
  <text x="130" y="138" class="stage" text-anchor="middle">Decode</text>
  <text x="130" y="198" class="stage" text-anchor="middle">Filter</text>
  <text x="130" y="258" class="stage" text-anchor="middle">Encode</text>
  <text x="130" y="318" class="stage" text-anchor="middle">Write</text>

  <!-- Helper: draw all cells as empty first, then fill busy ones.
       Row y tops: 110, 170, 230, 290. Cell width 82, height 50, x start 164 with step 90.
  -->

  <!-- Row 1: Decode -> frames 1..6 always busy -->
  <rect x="164" y="110" width="82" height="50" rx="6" class="busy"/><text x="205" y="140" class="fr" text-anchor="middle">F1</text>
  <rect x="254" y="110" width="82" height="50" rx="6" class="busy"/><text x="295" y="140" class="fr" text-anchor="middle">F2</text>
  <rect x="344" y="110" width="82" height="50" rx="6" class="steady"/><text x="385" y="140" class="fr" text-anchor="middle">F3</text>
  <rect x="434" y="110" width="82" height="50" rx="6" class="steady"/><text x="475" y="140" class="fr" text-anchor="middle">F4</text>
  <rect x="524" y="110" width="82" height="50" rx="6" class="steady"/><text x="565" y="140" class="fr" text-anchor="middle">F5</text>
  <rect x="614" y="110" width="82" height="50" rx="6" class="steady"/><text x="655" y="140" class="fr" text-anchor="middle">F6</text>

  <!-- Row 2: Filter -> empty t=1, F1 t=2, F2 t=3, F3 t=4, F4 t=5, F5 t=6 -->
  <rect x="164" y="170" width="82" height="50" rx="6" class="empty"/>
  <rect x="254" y="170" width="82" height="50" rx="6" class="busy"/><text x="295" y="200" class="fr" text-anchor="middle">F1</text>
  <rect x="344" y="170" width="82" height="50" rx="6" class="steady"/><text x="385" y="200" class="fr" text-anchor="middle">F2</text>
  <rect x="434" y="170" width="82" height="50" rx="6" class="steady"/><text x="475" y="200" class="fr" text-anchor="middle">F3</text>
  <rect x="524" y="170" width="82" height="50" rx="6" class="steady"/><text x="565" y="200" class="fr" text-anchor="middle">F4</text>
  <rect x="614" y="170" width="82" height="50" rx="6" class="steady"/><text x="655" y="200" class="fr" text-anchor="middle">F5</text>

  <!-- Row 3: Encode -> empty t=1,2, F1 t=3, F2 t=4, F3 t=5, F4 t=6 -->
  <rect x="164" y="230" width="82" height="50" rx="6" class="empty"/>
  <rect x="254" y="230" width="82" height="50" rx="6" class="empty"/>
  <rect x="344" y="230" width="82" height="50" rx="6" class="steady"/><text x="385" y="260" class="fr" text-anchor="middle">F1</text>
  <rect x="434" y="230" width="82" height="50" rx="6" class="steady"/><text x="475" y="260" class="fr" text-anchor="middle">F2</text>
  <rect x="524" y="230" width="82" height="50" rx="6" class="steady"/><text x="565" y="260" class="fr" text-anchor="middle">F3</text>
  <rect x="614" y="230" width="82" height="50" rx="6" class="steady"/><text x="655" y="260" class="fr" text-anchor="middle">F4</text>

  <!-- Row 4: Write -> empty t=1..3, F1 t=4, F2 t=5, F3 t=6 -->
  <rect x="164" y="290" width="82" height="50" rx="6" class="empty"/>
  <rect x="254" y="290" width="82" height="50" rx="6" class="empty"/>
  <rect x="344" y="290" width="82" height="50" rx="6" class="empty"/>
  <rect x="434" y="290" width="82" height="50" rx="6" class="steady"/><text x="475" y="320" class="fr" text-anchor="middle">F1</text>
  <rect x="524" y="290" width="82" height="50" rx="6" class="steady"/><text x="565" y="320" class="fr" text-anchor="middle">F2</text>
  <rect x="614" y="290" width="82" height="50" rx="6" class="steady"/><text x="655" y="320" class="fr" text-anchor="middle">F3</text>

  <!-- Steady-state highlight bracket -->
  <line x1="344" y1="360" x2="696" y2="360" stroke="#004065" stroke-width="2"/>
  <line x1="344" y1="356" x2="344" y2="364" stroke="#004065" stroke-width="2"/>
  <line x1="696" y1="356" x2="696" y2="364" stroke="#004065" stroke-width="2"/>
  <text x="520" y="382" font-size="13" font-weight="bold" fill="#004065" text-anchor="middle">Steady state: all 4 stages busy (gold)</text>
  <text x="520" y="400" font-size="12" fill="#666" font-style="italic" text-anchor="middle">Throughput = 1 frame per time step after fill</text>

  <!-- Fill/drain annotations -->
  <text x="205" y="405" font-size="11" fill="#666" text-anchor="middle">(fill)</text>

  <!-- Legend -->
  <rect x="160" y="430" width="500" height="34" rx="4" fill="white" stroke="#ddd"/>
  <rect x="174" y="440" width="18" height="14" rx="3" class="empty"/>
  <text x="198" y="452" font-size="12" fill="#222">idle</text>
  <rect x="240" y="440" width="18" height="14" rx="3" class="busy"/>
  <text x="264" y="452" font-size="12" fill="#222">fill phase</text>
  <rect x="340" y="440" width="18" height="14" rx="3" class="steady"/>
  <text x="364" y="452" font-size="12" fill="#222">steady state (all stages in parallel)</text>
</svg>
